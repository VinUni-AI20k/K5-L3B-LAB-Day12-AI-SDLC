name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # chạy tay từ tab Actions (bằng chứng clone sạch, P4-05)

jobs:
  # CI là TÙY CHỌN: nhóm dùng, sửa hay xóa file này đều được.
  test:
    name: ci / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Nhắc điền TEAM.md (cảnh báo, không chặn). Bỏ qua ở repo gốc của giảng viên (TEAM.md ở đó là bản mẫu).
      - name: Kiểm danh sách thành viên (cảnh báo)
        continue-on-error: true
        if: github.repository != 'VinUni-AI20k/K5-L3B-LAB-Day12-AI-SDLC'
        run: python3 tools/check_team.py
      # Nhóm đổi ngôn ngữ: sửa `build_cmd` trong game.contract.json và cài runtime ở bước riêng (xem README).
      - name: Build (build_cmd trong game.contract.json)
        run: bash -c "$(python3 -c 'import json;print(json.load(open("game.contract.json"))["build_cmd"])')"
      - name: Test (hộp đen qua headless_cmd + unit của nhóm)
        run: PYTHONPATH=tests:. python3 -m unittest discover -s tests -v
      # P4-05: clone sạch rồi chạy đúng các lệnh "Chạy nhanh" của README (lệnh 1 là clone bản đang kiểm).
      - name: Clone sạch theo README (3 lệnh)
        run: |
          git clone --quiet "file://$GITHUB_WORKSPACE" "$RUNNER_TEMP/clean"
          cd "$RUNNER_TEMP/clean"
          timeout 5 python3 -m chonoi.live --port 0 > live.log 2>&1 || true
          cat live.log
          grep -q "Mở trình duyệt tại http://127.0.0.1:" live.log
          python3 -m chonoi.headless --mode day --days 1 --seed 1 --ticks 600 --out out.jsonl
          tail -1 out.jsonl
      # P4-07: hồi quy Phase 1-3 và hai lệnh của contract 1.3 trên Ubuntu (bằng chứng ngoài máy Windows).
      - name: Hồi quy Phase 1-3 (smoke, tất định, hard-code)
        run: |
          python3 tools/smoke_phase1.py
          python3 tools/smoke_phase2.py
          python3 tools/smoke_phase3.py
          python3 tools/check_determinism.py
          python3 tools/check_no_hardcode.py
      - name: Lệnh bench_cmd và soak_cmd của contract 1.3 (bản ngắn)
        run: |
          python3 -m chonoi.bench --seed 42 --duration 1 --warmup 0 --out "$RUNNER_TEMP/bench.json"
          python3 -m chonoi.soak --seed 7 --days 2 --out "$RUNNER_TEMP/soak.json"
          cat "$RUNNER_TEMP/bench.json" "$RUNNER_TEMP/soak.json" | head -40
