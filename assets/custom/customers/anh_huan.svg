      <path d="M0 0 L6 0 L6 6 L12 6 L12 12 L6 12 L6 6 L0 6 Z" fill="#1F242B"/>
      <path d="M2 2 L4 2 L4 4" fill="none" stroke="#D4C29A" stroke-width="1.2"/>
    </pattern>
  </defs>
  <!-- Ground shadow -->
  <ellipse cx="64" cy="117" rx="24" ry="6" fill="#000" opacity="0.16"/>
