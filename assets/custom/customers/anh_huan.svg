  <path d="M42 54 Q64 49 86 54 L94 69 L84 73 L83 89 Q64 92 45 89 L44 73 L34 69 Z" fill="url(#geoShirt)" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
