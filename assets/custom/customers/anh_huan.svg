  <path d="M44 33 C43 22 48 16 56 15 L60 9 L66 13 L72 10 L76 15 C83 17 85 24 84 33 L80 26 C72 22 56 22 48 26 Z" fill="#181C22" stroke="#1E242B" stroke-width="2.8" stroke-linejoin="round"/>
