  <path d="M40 59 C27 63 24 76 28 87 C31 92 38 90 39 84 C40 76 42 70 45 67 Z" fill="#F2B98A" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M88 59 C101 63 104 76 100 87 C97 92 90 90 89 84 C88 76 86 70 83 67 Z" fill="#F2B98A" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
