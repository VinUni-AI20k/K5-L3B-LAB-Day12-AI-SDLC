<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" class="char dir-down state-idle">
  <defs>
    <pattern id="polka" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#1F2437"/>
      <circle cx="3" cy="3" r="1.4" fill="#F8FAFC"/>
      <circle cx="7" cy="7" r="1.4" fill="#F8FAFC"/>
    </pattern>
  </defs>
  <style>
    .dir-wrap { transform-origin: 64px 64px; }
    .body-root { transform-origin: 64px 96px; }
    .head { transform-origin: 64px 50px; }
    .arm-l { transform-origin: 41px 60px; }
    .arm-r { transform-origin: 87px 60px; }
    .leg-l { transform-origin: 53px 86px; }
    .leg-r { transform-origin: 75px 86px; }
    .s-arm-b, .s-arm-f { transform-origin: 64px 61px; }
    .s-leg-b, .s-leg-f { transform-origin: 64px 86px; }
    .shadow { transform-origin: 64px 117px; }
    .view-side, .head-back, .fx-angry { display: none; }

    .dir-up .face-front { display: none; }
    .dir-up .head-back { display: block; }
    .dir-right .view-front, .dir-left .view-front { display: none; }
    .dir-right .view-side, .dir-left .view-side { display: block; }
    .dir-left .dir-wrap { transform: scaleX(-1); }

    .state-idle .body-root { animation: idle-bob 1.8s ease-in-out infinite; }
    .state-idle .arm-r, .state-idle .s-arm-f { animation: fan-wave 1.2s ease-in-out infinite; }

    .state-walk .body-root { animation: walk-bob 0.44s ease-in-out infinite; }
    .state-walk .leg-l { animation: walk-limb-a 0.44s ease-in-out infinite; }
    .state-walk .leg-r { animation: walk-limb-b 0.44s ease-in-out infinite; }
    .state-walk .arm-l { animation: walk-limb-b 0.44s ease-in-out infinite; }
    .state-walk .arm-r { animation: walk-limb-a 0.44s ease-in-out infinite; }
    .state-walk .s-leg-f { animation: side-stride-a 0.44s ease-in-out infinite; }
    .state-walk .s-leg-b { animation: side-stride-b 0.44s ease-in-out infinite; }
    .state-walk .s-arm-f { animation: side-stride-b 0.44s ease-in-out infinite; }
    .state-walk .s-arm-b { animation: side-stride-a 0.44s ease-in-out infinite; }
    .state-walk .shadow { animation: walk-shadow 0.44s ease-in-out infinite; }

    .state-sit .body-root { transform: translateY(7px); animation: sit-bob 2.1s ease-in-out infinite; }
    .state-sit .leg-l, .state-sit .leg-r { transform: translateY(-6px) scaleY(0.55); }
    .state-sit .s-leg-f, .state-sit .s-leg-b { transform: translate(6px, -4px) rotate(-52deg); }
    .state-sit .arm-r, .state-sit .s-arm-f { animation: fan-wave 1.1s ease-in-out infinite; }

    .state-eat .body-root { transform: translateY(7px); }
    .state-eat .leg-l, .state-eat .leg-r { transform: translateY(-6px) scaleY(0.55); }
    .state-eat .s-leg-f, .state-eat .s-leg-b { transform: translate(6px, -4px) rotate(-52deg); }
    .state-eat .head { animation: eat-nod 0.52s ease-in-out infinite; }
    .state-eat .arm-r { animation: eat-arm 0.52s ease-in-out infinite; }
    .state-eat .s-arm-f { animation: side-eat-arm 0.52s ease-in-out infinite; }

    .state-angry .body-root, .state-impatient .body-root { animation: angry-shake 0.2s linear infinite; }
    .state-angry .leg-l, .state-angry .leg-r, .state-impatient .leg-l, .state-impatient .leg-r { transform: translateY(-6px) scaleY(0.55); }
    .state-angry .s-leg-f, .state-angry .s-leg-b, .state-impatient .s-leg-f, .state-impatient .s-leg-b { transform: translate(6px, -4px) rotate(-52deg); }
    .state-angry .arm-r, .state-impatient .arm-r, .state-angry .s-arm-f, .state-impatient .s-arm-f { animation: fan-wave 0.25s ease-in-out infinite; }
    .state-angry .fx-angry, .state-impatient .fx-angry { display: block; }

    @keyframes idle-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    @keyframes fan-wave { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(18deg); } }
    @keyframes walk-bob { 0%,100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-4px) rotate(-2deg); } 75% { transform: translateY(-4px) rotate(2deg); } }
    @keyframes walk-limb-a { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
    @keyframes walk-limb-b { 0%,100% { transform: rotate(18deg); } 50% { transform: rotate(-18deg); } }
    @keyframes side-stride-a { 0%,100% { transform: translateX(-3px) rotate(32deg); } 50% { transform: translateX(3px) rotate(-32deg); } }
    @keyframes side-stride-b { 0%,100% { transform: translateX(3px) rotate(-32deg); } 50% { transform: translateX(-3px) rotate(32deg); } }
    @keyframes walk-shadow { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.84); } }
    @keyframes sit-bob { 0%,100% { transform: translateY(7px); } 50% { transform: translateY(5.5px); } }
    @keyframes eat-nod { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(2.5px) rotate(5deg); } }
    @keyframes eat-arm { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(40deg); } }
    @keyframes side-eat-arm { 0%,100% { transform: rotate(-30deg); } 50% { transform: rotate(-72deg); } }
    @keyframes angry-shake { 0%,100% { transform: translate(-2.5px, 7px); } 50% { transform: translate(2.5px, 7px); } }
  </style>
  <ellipse class="shadow" cx="64" cy="117" rx="22" ry="6" fill="#000" opacity="0.16"/>
  <g class="dir-wrap">
    <g class="body-root">
      <!-- FRONT / BACK VIEW -->
      <g class="view-front">
        <g class="leg-l">
          <rect x="46" y="84" width="14" height="24" rx="6" fill="#181C29" stroke="#1E242B" stroke-width="3"/>
          <ellipse cx="53" cy="111" rx="8.5" ry="5" fill="#7C2D12" stroke="#1E242B" stroke-width="2.8"/>
        </g>
        <g class="leg-r">
          <rect x="68" y="84" width="14" height="24" rx="6" fill="#181C29" stroke="#1E242B" stroke-width="3"/>
          <ellipse cx="75" cy="111" rx="8.5" ry="5" fill="#7C2D12" stroke="#1E242B" stroke-width="2.8"/>
        </g>
        <g class="arm-l">
          <path d="M40 59 C28 63 26 76 30 86 C33 91 39 89 40 83 C41 76 43 70 45 67 Z" fill="#F2B98A" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <g class="arm-r">
          <path d="M88 59 C99 63 102 74 98 84 C95 89 89 87 88 81 C87 75 85 70 83 67 Z" fill="#F2B98A" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
          <path d="M97 80 L114 68 A18 18 0 0 1 116 86 Z" fill="#FDE68A" stroke="#1E242B" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
        <g class="torso">
          <path d="M42 55 Q64 50 86 55 L93 69 L84 72 L83 90 Q64 93 45 90 L44 72 L35 69 Z" fill="url(#polka)" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <g class="head">
          <circle cx="64" cy="14" r="9.5" fill="#1F242B" stroke="#1E242B" stroke-width="2.8"/>
          <rect x="57" y="19" width="14" height="3.5" rx="1.5" fill="#EF4444" stroke="#1E242B" stroke-width="1.5"/>
          <rect x="57" y="48" width="14" height="9" rx="4" fill="#E3A372" stroke="#1E242B" stroke-width="2.5"/>
          <circle cx="43" cy="39" r="4.5" fill="#F2B98A" stroke="#1E242B" stroke-width="2.5"/>
          <circle cx="85" cy="39" r="4.5" fill="#F2B98A" stroke="#1E242B" stroke-width="2.5"/>
          <ellipse cx="64" cy="38" rx="20.5" ry="19" fill="#F7C59F" stroke="#1E242B" stroke-width="3"/>
          <path d="M44 36 C43 22 52 17 64 17 C76 17 85 22 84 36 C81 28 74 25 64 25 C54 25 47 28 44 36 Z" fill="#1F242B" stroke="#1E242B" stroke-width="2.5"/>
          <g class="face-front">
            <circle cx="55" cy="39.5" r="2.6" fill="#1E242B"/>
            <circle cx="73" cy="39.5" r="2.6" fill="#1E242B"/>
            <path d="M59 48.5 Q64 47 69 48.5" fill="none" stroke="#8C5332" stroke-width="2.2" stroke-linecap="round"/>
          </g>
          <g class="head-back">
            <ellipse cx="64" cy="37" rx="20.5" ry="19.5" fill="#1F242B" stroke="#1E242B" stroke-width="3"/>
            <circle cx="64" cy="36" r="10" fill="#1F242B" stroke="#111827" stroke-width="2.5"/>
            <circle cx="64" cy="36" r="11" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="6 4"/>
          </g>
          <g class="fx-angry">
            <ellipse cx="64" cy="41" rx="18" ry="12" fill="#EF4444" opacity="0.22"/>
            <path d="M84 14 Q88 18 84 22 M92 14 Q88 18 92 22 M84 22 Q88 18 92 22 M84 14 Q88 18 92 14" fill="none" stroke="#EF4444" stroke-width="2.6" stroke-linecap="round"/>
          </g>
        </g>
      </g>

      <!-- TRUE SIDE PROFILE VIEW -->
      <g class="view-side">
        <g class="s-leg-b">
          <rect x="57" y="84" width="13" height="24" rx="6" fill="#111420" stroke="#1E242B" stroke-width="3"/>
          <ellipse cx="66" cy="111" rx="10" ry="5" fill="#5A1E0C" stroke="#1E242B" stroke-width="2.8"/>
        </g>
        <g class="s-arm-b">
          <rect x="58" y="58" width="11" height="28" rx="5.5" fill="#DDA172" stroke="#1E242B" stroke-width="3"/>
        </g>
        <g class="s-leg-f">
          <rect x="57" y="84" width="13" height="24" rx="6" fill="#181C29" stroke="#1E242B" stroke-width="3"/>
          <ellipse cx="67" cy="111" rx="10.5" ry="5" fill="#7C2D12" stroke="#1E242B" stroke-width="2.8"/>
        </g>
        <g class="torso">
          <path d="M50 55 Q64 51 77 56 L78 90 Q64 93 50 90 Z" fill="url(#polka)" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <g class="s-arm-f">
          <rect x="57" y="57" width="12" height="30" rx="6" fill="#F2B98A" stroke="#1E242B" stroke-width="3"/>
          <path d="M57 57 L69 57 L70 69 L56 69 Z" fill="url(#polka)" stroke="#1E242B" stroke-width="2.8"/>
          <!-- Bamboo fan held forward -->
          <path d="M67 82 L88 70 A18 18 0 0 1 88 88 Z" fill="#FDE68A" stroke="#1E242B" stroke-width="2.5" stroke-linejoin="round"/>
          <line x1="67" y1="82" x2="87" y2="77" stroke="#B45309" stroke-width="1.3"/>
          <line x1="67" y1="82" x2="87" y2="83" stroke="#B45309" stroke-width="1.3"/>
        </g>
        <g class="head">
          <!-- Big bun at back of head! -->
          <circle cx="40" cy="33" r="9.5" fill="#1F242B" stroke="#1E242B" stroke-width="2.8"/>
          <rect x="44" y="27" width="4" height="12" rx="2" fill="#EF4444" stroke="#1E242B" stroke-width="1.5"/>
          <rect x="58" y="48" width="12" height="9" rx="4" fill="#E3A372" stroke="#1E242B" stroke-width="2.5"/>
          <ellipse cx="64" cy="37" rx="19" ry="18.5" fill="#F7C59F" stroke="#1E242B" stroke-width="3"/>
          <path d="M82 38 L87 42 L82 44" fill="#F7C59F" stroke="#1E242B" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M45 36 C45 20 55 16 67 17 C75 18 81 22 82 28 C73 24 63 26 57 35 L55 50 C48 48 45 43 45 36 Z" fill="#1F242B" stroke="#1E242B" stroke-width="2.5"/>
          <circle cx="57" cy="39" r="4.5" fill="#F2B98A" stroke="#1E242B" stroke-width="2.5"/>
          <circle cx="75" cy="39" r="2.6" fill="#1E242B"/>
          <circle cx="76" cy="38.2" r="0.9" fill="#FFF"/>
          <path d="M74 48.5 L80 48" fill="none" stroke="#8C5332" stroke-width="2.2" stroke-linecap="round"/>
          <g class="fx-angry">
            <ellipse cx="72" cy="40" rx="12" ry="10" fill="#EF4444" opacity="0.22"/>
            <path d="M84 12 Q88 16 84 20 M92 12 Q88 16 92 20 M84 20 Q88 16 92 20 M84 12 Q88 16 92 12" fill="none" stroke="#EF4444" stroke-width="2.6" stroke-linecap="round"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
