<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" class="char dir-down state-idle">
  <style>
    .dir-wrap { transform-origin: 64px 64px; }
    .body-root { transform-origin: 64px 96px; }
    .head { transform-origin: 64px 50px; }
    .arm-l { transform-origin: 41px 60px; }
    .arm-r { transform-origin: 87px 60px; }
    .leg-l { transform-origin: 53px 86px; }
    .leg-r { transform-origin: 75px 86px; }
    .s-arm-b, .s-arm-f { transform-origin: 64px 61px; }
    .s-leg-b, .s-leg-f { transform-origin: 64px 86px; }
    .shadow { transform-origin: 64px 117px; }
    .view-side, .head-back, .fx-angry { display: none; }

    .dir-up .face-front, .dir-up .torso-front { display: none; }
    .dir-up .head-back { display: block; }
    .dir-right .view-front, .dir-left .view-front { display: none; }
    .dir-right .view-side, .dir-left .view-side { display: block; }
    .dir-left .dir-wrap { transform: scaleX(-1); }

    .state-idle .body-root { animation: idle-bob 1.8s ease-in-out infinite; }
    .state-idle .arm-l { animation: idle-arm 1.8s ease-in-out infinite; }
    .state-idle .arm-r { animation: idle-arm 1.8s ease-in-out infinite reverse; }
    .state-idle .s-arm-f { animation: idle-arm 1.8s ease-in-out infinite; }

    .state-walk .body-root { animation: walk-bob 0.44s ease-in-out infinite; }
    .state-walk .leg-l { animation: walk-limb-a 0.44s ease-in-out infinite; }
    .state-walk .leg-r { animation: walk-limb-b 0.44s ease-in-out infinite; }
    .state-walk .arm-l { animation: walk-limb-b 0.44s ease-in-out infinite; }
    .state-walk .arm-r { animation: walk-limb-a 0.44s ease-in-out infinite; }
    .state-walk .s-leg-f { animation: side-stride-a 0.44s ease-in-out infinite; }
    .state-walk .s-leg-b { animation: side-stride-b 0.44s ease-in-out infinite; }
    .state-walk .s-arm-f { animation: side-stride-b 0.44s ease-in-out infinite; }
    .state-walk .s-arm-b { animation: side-stride-a 0.44s ease-in-out infinite; }
    .state-walk .shadow { animation: walk-shadow 0.44s ease-in-out infinite; }

    .state-sit .body-root { transform: translateY(7px); animation: sit-bob 2.1s ease-in-out infinite; }
    .state-sit .leg-l, .state-sit .leg-r { transform: translateY(-6px) scaleY(0.55); }
    .state-sit .s-leg-f, .state-sit .s-leg-b { transform: translate(6px, -4px) rotate(-52deg); }
    .state-sit .arm-l { transform: rotate(-10deg); }
    .state-sit .arm-r { transform: rotate(10deg); }
    .state-sit .s-arm-f { transform: rotate(-28deg); }

    .state-eat .body-root { transform: translateY(7px); }
    .state-eat .leg-l, .state-eat .leg-r { transform: translateY(-6px) scaleY(0.55); }
    .state-eat .s-leg-f, .state-eat .s-leg-b { transform: translate(6px, -4px) rotate(-52deg); }
    .state-eat .head { animation: eat-nod 0.52s ease-in-out infinite; }
    .state-eat .arm-r { animation: eat-arm 0.52s ease-in-out infinite; }
    .state-eat .s-arm-f { animation: side-eat-arm 0.52s ease-in-out infinite; }
    .state-eat .arm-l { transform: rotate(-12deg); }

    .state-angry .body-root, .state-impatient .body-root { animation: angry-shake 0.2s linear infinite; }
    .state-angry .leg-l, .state-angry .leg-r, .state-impatient .leg-l, .state-impatient .leg-r { transform: translateY(-6px) scaleY(0.55); }
    .state-angry .s-leg-f, .state-angry .s-leg-b, .state-impatient .s-leg-f, .state-impatient .s-leg-b { transform: translate(6px, -4px) rotate(-52deg); }
    .state-angry .arm-l, .state-impatient .arm-l { animation: angry-arm-l 0.25s ease-in-out infinite; }
    .state-angry .arm-r, .state-impatient .arm-r { animation: angry-arm-r 0.25s ease-in-out infinite; }
    .state-angry .s-arm-f, .state-impatient .s-arm-f { animation: side-angry-arm 0.25s ease-in-out infinite; }
    .state-angry .fx-angry, .state-impatient .fx-angry { display: block; }

    @keyframes idle-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    @keyframes idle-arm { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
    @keyframes walk-bob { 0%,100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-4px) rotate(-2deg); } 75% { transform: translateY(-4px) rotate(2deg); } }
    @keyframes walk-limb-a { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
    @keyframes walk-limb-b { 0%,100% { transform: rotate(18deg); } 50% { transform: rotate(-18deg); } }
    @keyframes side-stride-a { 0%,100% { transform: translateX(-3px) rotate(32deg); } 50% { transform: translateX(3px) rotate(-32deg); } }
    @keyframes side-stride-b { 0%,100% { transform: translateX(3px) rotate(-32deg); } 50% { transform: translateX(-3px) rotate(32deg); } }
    @keyframes walk-shadow { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.84); } }
    @keyframes sit-bob { 0%,100% { transform: translateY(7px); } 50% { transform: translateY(5.5px); } }
    @keyframes eat-nod { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(2.5px) rotate(5deg); } }
    @keyframes eat-arm { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(42deg); } }
    @keyframes side-eat-arm { 0%,100% { transform: rotate(-30deg); } 50% { transform: rotate(-72deg); } }
    @keyframes angry-shake { 0%,100% { transform: translate(-2.5px, 7px); } 50% { transform: translate(2.5px, 7px); } }
    @keyframes angry-arm-l { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(-28deg); } }
    @keyframes angry-arm-r { 0%,100% { transform: rotate(14deg); } 50% { transform: rotate(28deg); } }
    @keyframes side-angry-arm { 0%,100% { transform: rotate(-20deg); } 50% { transform: rotate(-50deg); } }
  </style>
  <ellipse class="shadow" cx="64" cy="117" rx="22" ry="6" fill="#000" opacity="0.16"/>
  <g class="dir-wrap">
    <g class="body-root">
      <!-- FRONT / BACK VIEW -->
      <g class="view-front">
        <g class="leg-l">
          <rect x="46" y="84" width="14" height="24" rx="6" fill="#1F2937" stroke="#1E242B" stroke-width="3"/>
          <ellipse cx="53" cy="111" rx="9" ry="5.5" fill="#E5E7EB" stroke="#1E242B" stroke-width="3"/>
        </g>
        <g class="leg-r">
          <rect x="68" y="84" width="14" height="24" rx="6" fill="#1F2937" stroke="#1E242B" stroke-width="3"/>
          <ellipse cx="75" cy="111" rx="9" ry="5.5" fill="#E5E7EB" stroke="#1E242B" stroke-width="3"/>
        </g>
        <g class="arm-l">
          <path d="M40 58 C27 62 24 76 28 87 C31 92 38 90 39 84 C40 76 42 70 45 67 Z" fill="#F2B98A" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <g class="arm-r">
          <path d="M88 58 C101 62 104 76 100 87 C97 92 90 90 89 84 C88 76 86 70 83 67 Z" fill="#F2B98A" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <g class="torso">
          <path d="M42 54 Q64 49 86 54 L94 68 L84 72 L83 89 Q64 92 45 89 L44 72 L34 68 Z" fill="#FFFFFF" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
          <g class="torso-front">
            <path d="M55 74 L64 81 L73 74" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M52 55 Q64 68 76 55" fill="none" stroke="#F5C542" stroke-width="4.5" stroke-linecap="round"/>
          </g>
        </g>
        <g class="head">
          <rect x="57" y="48" width="14" height="9" rx="4" fill="#E3A372" stroke="#1E242B" stroke-width="2.5"/>
          <path d="M40 34 C36 42 36 49 41 53 L47 48 Z" fill="#8B5E3C" stroke="#1E242B" stroke-width="2.5"/>
          <path d="M88 34 C92 42 92 49 87 53 L81 48 Z" fill="#8B5E3C" stroke="#1E242B" stroke-width="2.5"/>
          <circle cx="42" cy="39" r="4.5" fill="#F2B98A" stroke="#1E242B" stroke-width="2.5"/>
          <circle cx="86" cy="39" r="4.5" fill="#F2B98A" stroke="#1E242B" stroke-width="2.5"/>
          <ellipse cx="64" cy="37" rx="20.5" ry="19.5" fill="#F7C59F" stroke="#1E242B" stroke-width="3"/>
          <path d="M43 30 C41 20 49 12 58 13 L62 9 L68 13 L75 11 C83 14 87 22 85 30 L80 28 L76 32 L71 27 L64 32 L58 27 L52 32 L48 28 Z" fill="#9C6B43" stroke="#1E242B" stroke-width="2.8" stroke-linejoin="round"/>
          <g class="face-front">
            <path d="M47 37 Q54 34 61 37 Q61 46 54 46 Q47 46 47 37 Z" fill="#2D3748" stroke="#1E242B" stroke-width="2.5"/>
            <path d="M67 37 Q74 34 81 37 Q81 46 74 46 Q67 46 67 37 Z" fill="#2D3748" stroke="#1E242B" stroke-width="2.5"/>
            <line x1="60" y1="37" x2="68" y2="37" stroke="#D4AF37" stroke-width="2.5"/>
            <path d="M59 50 Q64 52 69 50" fill="none" stroke="#8C5332" stroke-width="2" stroke-linecap="round"/>
          </g>
          <g class="head-back">
            <path d="M42 26 C40 42 42 54 48 58 L56 54 L64 59 L72 54 L80 58 C86 54 88 42 86 26 C82 14 73 11 64 11 C55 11 46 14 42 26 Z" fill="#9C6B43" stroke="#1E242B" stroke-width="2.8" stroke-linejoin="round"/>
          </g>
          <g class="fx-angry">
            <ellipse cx="64" cy="40" rx="18" ry="12" fill="#EF4444" opacity="0.22"/>
            <path d="M84 14 Q88 18 84 22 M92 14 Q88 18 92 22 M84 22 Q88 18 92 22 M84 14 Q88 18 92 14" fill="none" stroke="#EF4444" stroke-width="2.6" stroke-linecap="round"/>
          </g>
        </g>
      </g>

      <!-- TRUE SIDE PROFILE VIEW -->
      <g class="view-side">
        <g class="s-leg-b">
          <rect x="57" y="84" width="13" height="24" rx="6" fill="#111827" stroke="#1E242B" stroke-width="3"/>
          <ellipse cx="66" cy="111" rx="10.5" ry="5" fill="#CBD5E1" stroke="#1E242B" stroke-width="3"/>
        </g>
        <g class="s-arm-b">
          <rect x="58" y="58" width="11" height="29" rx="5.5" fill="#DDA172" stroke="#1E242B" stroke-width="3"/>
        </g>
        <g class="s-leg-f">
          <rect x="57" y="84" width="13" height="24" rx="6" fill="#1F2937" stroke="#1E242B" stroke-width="3"/>
          <ellipse cx="67" cy="111" rx="11" ry="5.5" fill="#E5E7EB" stroke="#1E242B" stroke-width="3"/>
        </g>
        <g class="torso">
          <path d="M50 54 Q64 50 77 55 L78 89 Q64 92 50 89 Z" fill="#FFFFFF" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
          <path d="M68 55 Q77 64 73 70" fill="none" stroke="#F5C542" stroke-width="4.2" stroke-linecap="round"/>
        </g>
        <g class="s-arm-f">
          <rect x="57" y="57" width="12" height="31" rx="6" fill="#F2B98A" stroke="#1E242B" stroke-width="3"/>
          <path d="M57 57 L69 57 L70 69 L56 69 Z" fill="#FFFFFF" stroke="#1E242B" stroke-width="2.8" stroke-linejoin="round"/>
          <path d="M61 73 Q64 77 61 81" fill="none" stroke="#4A5568" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <g class="head">
          <rect x="58" y="48" width="12" height="9" rx="4" fill="#E3A372" stroke="#1E242B" stroke-width="2.5"/>
          <ellipse cx="64" cy="37" rx="19" ry="19" fill="#F7C59F" stroke="#1E242B" stroke-width="3"/>
          <path d="M82 38 L87 42 L82 44" fill="#F7C59F" stroke="#1E242B" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- Iconic mullet back tail + spiky front bangs -->
          <path d="M45 30 C39 39 38 52 44 59 L52 55 L55 44 C56 36 58 29 64 28 L87 31 L84 22 C80 13 70 10 61 12 L55 9 L50 14 C44 17 42 23 45 30 Z" fill="#9C6B43" stroke="#1E242B" stroke-width="2.8" stroke-linejoin="round"/>
          <circle cx="57" cy="39" r="4.5" fill="#F2B98A" stroke="#1E242B" stroke-width="2.5"/>
          <path d="M69 35 Q78 34 83 37 Q83 45 75 45 Q68 45 69 35 Z" fill="#2D3748" stroke="#1E242B" stroke-width="2.5"/>
          <line x1="59" y1="37" x2="70" y2="37" stroke="#D4AF37" stroke-width="2.5"/>
          <path d="M75 50 L81 50" fill="none" stroke="#8C5332" stroke-width="2" stroke-linecap="round"/>
          <g class="fx-angry">
            <ellipse cx="72" cy="40" rx="12" ry="10" fill="#EF4444" opacity="0.22"/>
            <path d="M84 12 Q88 16 84 20 M92 12 Q88 16 92 20 M84 20 Q88 16 92 20 M84 12 Q88 16 92 12" fill="none" stroke="#EF4444" stroke-width="2.6" stroke-linecap="round"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
