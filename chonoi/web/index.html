<!doctype html>
<html lang="vi" data-type="software">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#162b26">
<meta name="page-type" content="software">
<meta name="site-kind" content="gaming">
<meta name="description" content="Cùng Út Sen lặn hái buổi sáng và mở quán trên bè buổi tối.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23203b35'/%3E%3Cpath d='M5 20h22l-5 6H10zM15 5l-6 12h6zM18 8v9h6z' fill='%23e7ba56'/%3E%3C/svg%3E">
<title>Quán Ăn Chợ Nổi</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1c3026; --panel: #f5e4bb; --inset: #e8d09a;
    --ink: #38271c; --cream: #fff0cc; --muted: #664b35; --gold: #f1c46a;
    --edge: #bd9862; --wood: #61422a; --warning: #962e27;
    font: 16px/1.45 system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: radial-gradient(ellipse at top, #304737, var(--bg) 55%); color: var(--cream); }
  .shell { width: min(1280px, calc(100% - 64px)); margin: 0 auto; padding: 20px 0; }
  .top, .hud, .metrics, .brand, .supplies, .keys, .stock, .orders, .slots {
    display: flex; align-items: center; flex-wrap: wrap;
  }
  .top { justify-content: space-between; gap: 12px; margin: 0 0 14px; }
  .brand { flex-wrap: nowrap; gap: 12px; }
  .brand svg { flex: none; width: 44px; height: 44px; }
  h1, h2, p { margin: 0; }
  h1 { font: bold clamp(23px, 3vw, 34px)/1.05 Cambria, "Times New Roman", serif; text-shadow: 0 2px #182319; }
  button {
    color: var(--ink); background: #eccb87; border: 2px solid #865634;
    border-radius: 4px; box-shadow: inset 0 2px #ffe8aa, 0 3px #3c2b20;
    font: 700 15px system-ui, sans-serif;
    padding: 8px 14px; min-height: 44px; cursor: pointer;
    transition: background-color 120ms, transform 120ms;
  }
  button:hover { background: #f8dc9a; }
  button:active { transform: translateY(2px); box-shadow: inset 0 2px #ffe8aa, 0 1px #3c2b20; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  button:disabled { cursor: wait; opacity: .65; }
  .game {
    color: var(--ink); background: var(--panel); border: 4px solid var(--wood);
    border-radius: 5px; box-shadow: 0 0 0 2px #2c2119, 0 5px #2c2119;
  }
  .hud {
    gap: 10px 24px; justify-content: space-between; padding: 10px 16px;
    background: linear-gradient(#faebc9, #efdbad); box-shadow: inset 0 2px #fff3d1;
  }
  .season { display: flex; align-items: center; gap: 11px; }
  .season-mark {
    width: 32px; height: 32px; display: grid; place-items: center; flex: none;
    background: #f1d398; color: #63411f; border: 2px solid #bc9055; border-radius: 4px; font-size: 22px;
  }
  [data-mode="quan"] .season-mark { background: #374c54; color: #ffe1a4; border-color: #686754; }
  .season h2 { font: bold 21px/1.2 Cambria, "Times New Roman", serif; }
  .season p { color: var(--muted); font-size: 14px; }
  .metrics { gap: 10px 22px; }
  .metric { min-width: 67px; padding-left: 12px; border-left: 1px solid #c9a673; font-variant-numeric: tabular-nums; }
  .metric span { display: block; font-size: 14px; color: var(--muted); }
  .metric strong { font-size: 18px; }
  .meter-line { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  progress {
    display: block; width: 92px; height: 8px; appearance: none;
    border: 0; border-radius: 2px; background: #655545; --fill: #71a56e;
  }
  progress::-webkit-progress-bar { border-radius: 2px; background: #655545; }
  progress::-webkit-progress-value { border-radius: 2px; background: var(--fill); }
  progress::-moz-progress-bar { border-radius: 2px; background: var(--fill); }
  .danger, .metric .danger { color: var(--warning); }
  .danger progress { --fill: #d75849; }
  .scene { position: relative; background: #243b32; border-block: 3px solid var(--wood); }
  canvas { display: block; width: 100%; height: clamp(320px, calc(100svh - 290px), 620px); }
  [data-mode="quan"] canvas { height: clamp(310px, calc(100svh - 322px), 585px); }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 14px; background: #101e19b3;
  }
  .result {
    width: min(100%, 400px); padding: 19px; text-align: center;
    background: var(--panel); border: 3px solid var(--wood); border-radius: 5px;
    box-shadow: 0 4px #241914;
  }
  .result h2 { font: bold 27px Cambria, "Times New Roman", serif; color: var(--ink); }
  .result p { margin: 8px 0; }
  .result button { margin-top: 7px; }
  .status {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 4px 20px; min-height: 35px; padding: 6px 16px;
    background: #344436; border-bottom: 2px solid var(--wood); font-size: 15px;
  }
  .status #hint { color: var(--gold); }
  .status #notice { color: var(--cream); }
  .tray { padding: 10px 16px 12px; }
  .supplies { justify-content: space-between; gap: 8px 24px; }
  .supplies h2, .orders h2 { font-size: 16px; }
  .basket { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
  .slots { gap: 4px; min-width: 0; max-width: 100%; }
  .slot {
    display: grid; place-items: center; width: 22px; height: 22px; border-radius: 2px;
    border: 1px solid #a98451; background: #e1c692; color: var(--ink);
    box-shadow: inset 0 1px #b99863;
    font: bold 10px system-ui, sans-serif;
  }
  .slot.filled { background: #fff0ca; }
  .slot img { display: block; width: 18px; height: 18px; object-fit: contain; image-rendering: pixelated; }
  #hold-summary { margin-top: 4px; font-size: 14px; color: var(--muted); }
  .keys { gap: 6px 13px; color: var(--muted); font-size: 14px; }
  .keys span { white-space: nowrap; }
  kbd {
    display: inline-block; margin-right: 3px; padding: 1px 5px; border: 1px solid #a68154;
    border-radius: 2px; font: 700 13px system-ui, sans-serif; color: var(--ink); background: var(--inset);
  }
  .stock { gap: 5px 16px; color: var(--muted); font-size: 15px; }
  .stock b { color: var(--ink); padding-left: 4px; }
  .stock i {
    display: inline-block; width: 8px; height: 8px; border: 1px solid #84654e; margin-right: 6px;
    background: var(--item); vertical-align: 2px;
  }
  .stock span { white-space: nowrap; }
  .orders {
    align-items: start; gap: 8px 24px; border-top: 1px solid var(--edge);
    padding-top: 8px; margin-top: 8px; font-size: 15px;
  }
  #tickets, #kitchen { flex: 1 1 230px; min-width: 0; }
  .ticket, .stove { color: var(--muted); }
  .ticket b, .stove b { color: var(--ink); }
  .ticket .meter-line { display: inline-flex; margin-left: 6px; }
  #hand { color: #784320; }
  @media (741px <= width <= 1100px) {
    [data-mode="quan"] canvas { height: clamp(310px, calc(100svh - 364px), 585px); }
  }
  @media (max-width: 740px) {
    .shell { width: calc(100% - 24px); padding: 12px 0; }
    .hud, .tray, .status { padding-inline: 12px; }
    .metrics { gap: 9px 12px; }
    .metric { min-width: 55px; padding-left: 0; border-left: 0; }
    .brand { gap: 8px; }
    .brand svg { width: 33px; height: 33px; }
    canvas, [data-mode="quan"] canvas { height: clamp(230px, 54vw, 360px); }
  }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 22 22" shape-rendering="crispEdges" aria-hidden="true">
        <path d="M2 0h18v2h2v18h-2v2H2v-2H0V2h2z" fill="#17281e"/>
        <path d="M2 2h18v18H2z" fill="#4a6449"/>
        <path d="M15 4h3v3h-3z" fill="#ecc46b"/>
        <path d="M10 4h1v9H6v-2h1V9h1V7h1V5h1zM12 8h1v2h1v1h1v2h-3z" fill="#ffe2a0"/>
        <path d="M4 14h15v1h-1v1h-2v1H7v-1H5v-1H4z" fill="#de9a56"/>
        <path d="M4 18h5v1H4zM12 18h6v1h-6z" fill="#b0bf79"/>
      </svg>
      <h1>Quán Ăn Chợ Nổi</h1>
    </div>
    <button id="restart" type="button">Chơi lại</button>
  </header>
  <div class="game" id="game">
    <header class="hud">
      <div class="season">
        <span class="season-mark" id="season-mark" aria-hidden="true">·</span>
        <div><h2 id="season">Chợ Nổi</h2><p id="activity">Đang kết nối</p></div>
      </div>
      <div class="metrics" id="metrics"></div>
    </header>
    <div class="scene">
      <canvas id="world" aria-label="Cảnh chơi của Út Sen">Cảnh chơi cần trình duyệt hỗ trợ Canvas.</canvas>
      <div class="overlay" id="overlay">
        <div class="result">
          <h2 id="result-title" role="status">Đang tải…</h2>
          <p id="result-text">Đang lấy trạng thái buổi chơi.</p>
          <button id="result-restart" type="button" hidden>Chơi lại</button>
        </div>
      </div>
    </div>
    <div class="status">
      <span id="hint"></span><span id="notice" role="status"></span>
    </div>
    <div class="tray">
      <div class="supplies">
        <div class="basket" id="basket" hidden>
          <h2 id="hold-title">Giỏ</h2><div class="slots" id="slots" aria-hidden="true"></div>
        </div>
        <div class="stock" id="stock" aria-label="Kho khả dụng" hidden></div>
        <div class="keys" aria-label="Điều khiển">
          <span><kbd>WASD</kbd><kbd>↑↓←→</kbd> Di chuyển</span>
          <span><kbd>E</kbd> <span id="interact-key">Tương tác</span></span>
          <span id="catch-key" hidden><kbd>Space</kbd> Bắt cá</span>
          <span><kbd>R</kbd> Chơi lại</span>
        </div>
      </div>
      <p id="hold-summary" hidden></p>
      <div class="orders" id="orders" hidden>
        <div id="tickets"></div><div id="kitchen"></div><p id="hand"></p>
      </div>
    </div>
  </div>
</main>
<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("world");
const screen = canvas.getContext("2d", { alpha: false });
const art = document.createElement("canvas");
const ctx = art.getContext("2d", { alpha: false });
const labels = [];
const itemNames = {
  ca_loc: "cá lóc", ca_linh: "cá linh", bong_sung: "bông súng", bong_dien_dien: "bông điên điển"
};
const itemColors = {
  ca_loc: "#a9be86", ca_linh: "#d8dfce", bong_sung: "#eda0aa", bong_dien_dien: "#f4cf62"
};
const dishes = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh bông điên điển"
};
const reasons = { docked: "Đã cập bến", time: "Hết giờ", fainted: "Út Sen bị ngất" };
const known = (map, key) => Object.hasOwn(map, key) ? map[key] : undefined;
const itemName = key => known(itemNames, key) ?? key;
const dishName = value => {
  const id = typeof value === "string" ? value : value?.dish_id;
  return known(dishes, id) ?? (typeof id === "string" ? id : "Chưa rõ món");
};
const num = Number.isFinite;
const position = p => Array.isArray(p) && p.length === 2 && p.every(num);
const list = value => Array.isArray(value) ? value : [];
const record = value => value && typeof value === "object" && !Array.isArray(value);
const escapeHTML = value => String(value).replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));
const number = value => num(value) ? value.toLocaleString("vi-VN") : "—";
// LiveGame advances at 60 Hz. meta only contains the current mode's tuning.
const TICK_HZ = 60;
const seconds = ticks => num(ticks) ? Math.ceil(Math.max(0, ticks) / TICK_HZ) : null;
const duration = ticks => {
  const s = seconds(ticks);
  return s === null ? "—" : [Math.floor(s / 60), s % 60].map(v => String(v).padStart(2, "0")).join(":");
};
const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);
const countdown = ticks => seconds(ticks) === null ? "—" : seconds(ticks) + "s";
const metric = (label, value) => `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
function meter(value, max, label) {
  if (!(num(value) && num(max) && max > 0)) return "";
  return `<progress aria-label="${label}" value="${Math.min(max, Math.max(0, value))}" max="${max}"></progress>`;
}
function setText(id, value) {
  const el = $(id);
  if (el.textContent !== value) el.textContent = value;
}
const htmlCache = new Map();
function setHTML(id, value) {
  if (htmlCache.get(id) === value) return;
  $(id).innerHTML = value;
  htmlCache.set(id, value);
}

let snap = null, problem = "", restartPending = false, epoch = 0;
let eventWindow = [], messages = [], messageTimer = 0;
const held = new Set();
const movement = {
  w: "up", arrowup: "up", s: "down", arrowdown: "down",
  a: "left", arrowleft: "left", d: "right", arrowright: "right"
};
let writes = Promise.resolve(), lastInput = "", needsRelease = false, releasePending = false;
const canPlay = () => snap && !snap.finished && !snap.error && !problem && !restartPending && !needsRelease;
const neutral = { move: [0, 0], interact: false, catch: false };

async function request(path, body) {
  const options = { signal: AbortSignal.timeout(2500), cache: "no-store" };
  if (body !== undefined) {
    Object.assign(options, { method: "POST", body, headers: { "Content-Type": "application/json" } });
  }
  const response = await fetch(path, options);
  if (!response.ok) throw new Error("HTTP " + response.status);
  return response.json();
}
function reportFailure(error, operation) {
  const networkError = ["TypeError", "TimeoutError", "AbortError"].includes(error.name);
  problem = networkError ? "Mất kết nối tới máy chủ." :
    `Không thể ${operation} (${error.message.startsWith("HTTP") ? error.message : "dữ liệu phản hồi không hợp lệ"}).`;
  held.clear();
  lastInput = "";
  needsRelease = true;
  render();
}
function sendInput(force = false) {
  if (force ? releasePending : !canPlay()) return;
  const keys = Array.from(held, key => known(movement, key));
  const dx = Number(keys.includes("right")) - Number(keys.includes("left"));
  const dy = Number(keys.includes("down")) - Number(keys.includes("up"));
  const body = JSON.stringify(force ? neutral : {
    move: [dx, snap?.mode === "quan" ? -dy : dy], interact: held.has("e"), catch: held.has(" ")
  });
  if (body === lastInput && !force) return;
  lastInput = body;
  if (force) releasePending = true;
  const generation = epoch;
  writes = writes.then(async () => {
    try {
      if (generation !== epoch || (needsRelease && !force)) return;
      await request("/input", body);
      if (force) needsRelease = false;
    } catch (error) {
      reportFailure(error, "gửi điều khiển");
    } finally {
      if (force) releasePending = false;
    }
  });
}
function release() {
  if (!held.size) return;
  held.clear();
  if (canPlay()) sendInput();
}
function isGameKey(k) {
  return known(movement, k) || k === "e" || k === " ";
}
addEventListener("keydown", event => {
  if (event.defaultPrevented || event.ctrlKey || event.altKey || event.metaKey) return;
  const key = event.key.toLowerCase();
  if (key === " " && event.target.closest?.("button")) return;
  if (key === "r") {
    if (!event.repeat) restart();
  } else if (isGameKey(key) && canPlay()) {
    event.preventDefault();
    if (!event.repeat && !held.has(key)) {
      held.add(key);
      sendInput();
    }
  }
});
addEventListener("keyup", event => {
  if (held.delete(event.key.toLowerCase())) sendInput();
});
addEventListener("blur", release);
document.addEventListener("visibilitychange", () => { if (document.hidden) release(); });
document.addEventListener("focusin", event => { if (event.target.closest("button")) release(); });
for (const id of ["restart", "result-restart"]) $(id).addEventListener("click", restart);

function resetMessages() {
  clearTimeout(messageTimer);
  messageTimer = 0;
  eventWindow = [];
  messages = [];
  setText("notice", "");
}
async function restart() {
  if (restartPending) return;
  restartPending = true;
  epoch += 1;
  held.clear();
  lastInput = "";
  render();
  await writes;
  try {
    await request("/restart", "{}");
    snap = null;
    problem = "";
    needsRelease = false;
    resetMessages();
  } catch (error) {
    reportFailure(error, "chơi lại");
  } finally {
    restartPending = false;
    render();
  }
}

function eventMessage({ name, data }) {
  const d = data ?? {};
  const source = list(snap.nodes).concat(list(snap.fish)).find(e => e.id === (d.node_id ?? d.fish_id));
  const kind = d.kind ?? source?.kind;
  const count = d.count ?? d.qty ?? d.amount;
  switch (name) {
    case "gather": return kind ? `Đã hái ${itemName(kind)}` : "Đã hái nguyên liệu";
    case "fish_caught": return `Đã bắt ${kind ? itemName(kind) : "cá"}${num(count) ? " ×" + count : ""}`;
    case "hold_full": return "Giỏ không đủ chỗ";
    case "oxygen_empty": return "Hết oxy — nổi lên ngay!";
    case "choke": return num(d.damage) ? `Bị ngạt — mất ${d.damage} Máu` : "Bị ngạt — mất 1 Máu";
    case "dish_ready": return "Món đã xong";
    case "served": return "Đã phục vụ khách";
    case "paid": {
      const paid = d.total ?? d.amount ?? d.money_delta ?? (num(d.price) ? d.price + (num(d.tip) ? d.tip : 0) : null);
      return num(paid) ? `Khách thanh toán +${number(paid)} nghìn` : "Khách đã thanh toán";
    }
    case "customer_left": return known({
      patience: "Khách đã hết kiên nhẫn và rời quán",
      timeout: "Khách đã hết kiên nhẫn và rời quán",
      no_dish: "Khách rời quán vì chưa có món phù hợp",
      time: "Khách rời quán khi hết buổi"
    }, d.reason) ?? "Khách đã rời quán";
    default: return "";
  }
}
function nextMessage() {
  messageTimer = 0;
  setText("notice", messages.shift() ?? "");
  if ($("notice").textContent) messageTimer = setTimeout(nextMessage, 2800);
}
function consumeEvents(events) {
  const keys = events.map(event => JSON.stringify(event));
  // The server sends a rolling window. Match its overlap, including repeated events in one tick.
  let overlap = Math.min(keys.length, eventWindow.length);
  while (overlap && !keys.slice(0, overlap).every((key, i) => key === eventWindow[eventWindow.length - overlap + i])) {
    overlap -= 1;
  }
  for (const event of events.slice(overlap)) {
    const message = eventMessage(event);
    if (message) messages.push(message);
  }
  eventWindow = keys;
  if (messages.length && !messageTimer) nextMessage();
}

async function poll() {
  const generation = epoch;
  if (!restartPending) {
    try {
      const state = await request("/state");
      if (generation === epoch && !restartPending) {
        if (!["gather", "quan"].includes(state?.mode)) throw new Error("Snapshot không hợp lệ");
        const rewound = num(snap?.tick) && state.tick < snap.tick;
        if (rewound) resetMessages();
        if (!snap || rewound) needsRelease = true;
        snap = state;
        if (state.error || state.finished) {
          held.clear();
          lastInput = "";
        }
        problem = "";
        consumeEvents(list(state.events));
        if (needsRelease && !state.finished && !state.error) sendInput(true);
        render();
      }
    } catch (error) {
      if (generation === epoch) {
        const releaseNow = canPlay();
        reportFailure(error, "tải buổi chơi");
        if (releaseNow) sendInput(true);
      }
    }
  }
  setTimeout(poll, 50);
}

function near(a, b, radius) {
  return position(a) && position(b) && num(radius) && Math.hypot(a[0] - b[0], a[1] - b[1]) <= radius;
}
function gatherHint(s) {
  const p = s.player;
  const m = s.meta ?? {};
  if (!position(p?.pos)) return "";
  const cooldown = p.catch_cd_ticks > 0 ?
    `Hồi bắt · ${number(Math.ceil(p.catch_cd_ticks * 10 / TICK_HZ) / 10)}s` : "";
  const withCooldown = hint => cooldown ? hint + "  |  " + cooldown : hint;
  const free = Array.isArray(s.hold) && num(s.hold_capacity) ? s.hold_capacity - s.hold.length : null;
  const surface = typeof p.at_surface === "boolean" ? p.at_surface :
    num(m.surface_depth) ? p.pos[1] <= m.surface_depth : null;
  if (near(p.pos, m.dock_pos, m.dock_radius)) return withCooldown("E · Cập bến");
  if (surface === true) {
    const plants = list(s.nodes).filter(n => n.ready === true && near(p.pos, n.pos, m.interact_radius));
    plants.sort((a, b) => Math.hypot(a.pos[0] - p.pos[0], a.pos[1] - p.pos[1]) -
      Math.hypot(b.pos[0] - p.pos[0], b.pos[1] - p.pos[1]));
    const plant = plants[0];
    if (plant && num(m.node_yield) && free !== null) {
      return withCooldown(free < m.node_yield ? "Giỏ không đủ chỗ" : `E · Hái ${itemName(plant.kind)}`);
    }
  }
  if (surface === false) {
    if (cooldown) return cooldown;
    const fish = list(s.fish).filter(f => near(p.pos, f.pos, m.catch_radius));

  if (fish.kind === "ca_linh") {
    const a = Math.cos(angle), b = Math.sin(angle);
    for (const offset of [-1, 1]) {
      stamp(tiles.fry, x + (-19 * a - offset * 10 * b) * size, y + (-19 * b + offset * 10 * a) * size, angle);
    }
  }
  const bitmap = known(tiles, fish.kind) ?? tiles.ca_linh;
  stamp(bitmap, x, y, angle);
}
function drawGather(w, h, map) {
  const { at, top, height } = map;
  const m = snap.meta;
  const size = unitSize(w);
  const surface = at([m.bounds.x[0], 0])[1];
  const horizon = Math.min(h - 12, Math.max(1, surface));
  gatherLandscape(w, h, horizon, top + height);
  if (position(m.dock_pos)) {
    const pt = at(m.dock_pos);
    dock(pt, size);
    label("Bến", pt[0], pt[1] - 29 * size);
  }
  for (const n of list(snap.nodes)) {
    if (!position(n.pos)) continue;
    const pt = at(n.pos);
    plant(pt, size, n);
    if (n.ready === false && num(n.regrow_ticks)) label(countdown(n.regrow_ticks), pt[0], pt[1] + 14 * size);
  }
  for (const f of list(snap.fish)) {
    if (!position(f.pos)) continue;
    const [x, y] = at(f.pos);
    paintFish(f, x, y, size);
  }
  const p = snap.player;
  if (position(p?.pos)) {
    const pt = at(p.pos);
    const heading = num(p.heading_deg) ? p.heading_deg * Math.PI / 180 : 0;
    const facing = Math.cos(heading) < -.1 ? -1 : 1;
    const tilt = p.at_surface ? 0 : Math.sin(heading) * facing * .38;
    stamp(tiles.diver, pt[0], pt[1], tilt, facing);
    label("Út Sen", pt[0], pt[1] + 31 * size);
  }
}
function lanternLine(a, b, count) {
  const sag = 10;
  ctx.beginPath();
  ctx.moveTo(...a);
  ctx.quadraticCurveTo((a[0] + b[0]) / 2, a[1] + sag * 2, ...b);
  ctx.strokeStyle = "#3e382c";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  for (let i = 1; i <= count; i++) {
    const t = i / (count + 1);
    const x = a[0] + (b[0] - a[0]) * t, y = a[1] + sag * 4 * t * (1 - t);
    ellipse(x, y + 4, 13, 10, "#facf6b28");
    rect(x - 5, y + 1, 10, 9, "#b37e4f");
    rect(x - 3, y + 1, 6, 7, "#ffd17c");
    rect(x - 1.5, y + 2, 3, 4, "#ffefb6");
  }
}
function nightRiver(w, h, map) {
  const shore = map.top - 19;
  const sky = "#182a41";
  rect(0, 0, w, shore, sky);
  rect(0, shore * .57, w, shore * .43, "#1d3548");
  const moonX = (map.left + map.width + w) / 2;
  const moonY = shore * .31;
  const moon = Math.min(20, shore * .24);
  ellipse(moonX, moonY, moon, moon, "#f1deb0");
  ellipse(moonX + moon * .48, moonY - moon * .23, moon * .83, moon * .83, sky);
  for (let i = 0; i < 34; i++) {
    const x = w * scatter(i, 41);
    const y = shore * (.09 + .47 * scatter(i, 42));
    if (Math.hypot(x - moonX, y - moonY) < moon * 2) continue;
    rect(x, y, 2 + i % 2, 2 + i % 2, i % 4 ? "#7d9b9e" : "#eddfb5");
    if (i % 11 === 0) {
      rect(x - 3, y + 1, 9, 1, "#a0b3aa");
      rect(x + 1, y - 3, 1, 9, "#a0b3aa");
    }
  }
  path([[0, shore], [0, shore * .69], [w * .14, shore * .56], [w * .28, shore * .78],
    [w * .43, shore * .74], [w * .54, shore * .92], [w * .71, shore * .67],
    [w * .82, shore * .68], [w, shore * .58], [w, shore]], "#293e4b");
  const scenerySize = Math.min(.93, Math.max(.38, shore / 106));
  const village = [[.116, .85], [.23, .57], [.72, .62], [.84, .88]];
  for (let i = 0; i < 32; i++) {
    const x = w * i / 31;
    if (x > w * .33 && x < w * .66) continue;
    ellipse(x, shore - 5, w / 34, (8 + 14 * scatter(i, 36)) * scenerySize, i % 3 ? "#1a3038" : "#233a3b");
  }
  for (const [x, scale] of village) house(w * x, shore - 3, scenerySize * scale, true);
  for (const [x, scale, mirror] of [[.034, .8, 1], [.18, .55, -1], [.31, .56, -1], [.65, .48, 1], [.92, .7, 1], [.988, 1, -1]]) {
    palm(w * x, shore - 2, scenerySize * scale, mirror, "#182e35");
  }

  bands(w, shore, h, ["#28535b", "#234954", "#1e414e", "#1c3948", "#182f41"]);
  rect(0, shore, w, 3, "#547271");
  ripples(w, shore + 5, h, 112, "#91a9a633", 4);
  for (let i = 0; i < 28; i++) {
    const t = scatter(i, 56);
    const width = (8 + 37 * t) * scenerySize;
    const x = moonX - width / 2 + (scatter(i, 57) - .5) * (16 + 46 * t) * scenerySize;
    const y = shore + t * (h - shore) * .8;
    rect(x, y, width, 2 + 2 * t, i % 4 ? "#a0b2a54d" : "#ceb9818c");
  }
  for (const [x] of village) for (let i = 0; i < 4; i++) {
    const twinkle = 4 + 8 * scatter(i, 66);
    rect(w * x - twinkle / 2, shore + 5 + i * 6, twinkle, 2, i < 2 ? "#c39a6290" : "#c39a6240");
  }
  if (map.left > 65) {
    sprite([map.left * .47, h * .64], scenerySize, () => {
      path([[-33, 1], [-21, 9], [21, 8], [35, -2], [24, 2], [-24, 3]], "#152633");
      path([[-29, 1], [-16, 4], [21, 4], [32, -1]], "#947454", 2);
      rect(-15, -1, 8, 5, "#7a674f");
      rect(11, -6, 6, 8, "#a98157");
      rect(12, -5, 4, 4, "#f1cd88");
      rect(8, 12, 15, 2, "#a78d5d6e");
    });
    reeds(map.left * .23, h * .94, scenerySize * .9, true);
    reeds(w - map.left * .21, h * .81, scenerySize * .85, true);
  }
}
function raft(map) {
  const { left: x, top: y, width, height } = map;
  rect(x - 12, y - 8, width + 24, height + 25, "#101f1dbb", 9);
  for (const a of [x - 7, x + width + 7]) {
    for (const offset of [-2, 3]) path([[a + offset, y - 3], [a + offset, y + height + 7]], offset < 0 ? "#6e5336" : "#aa7e4b", 4);
  }
  rect(x - 3, y - 3, width + 6, height + 6, "#66432e", 3);
  const planks = ["#a57448", "#b38153", "#9a6747", "#ba8658", "#976744", "#aa794a"];
  const plankCount = Math.max(14, Math.round(height / 14));
  for (let i = 0; i < plankCount; i++) {
    const dy = y + i * height / plankCount, rh = height / plankCount;
    const k = x + width * (.16 + scatter(i, 21) * .68);
    rect(x, dy, k - x, rh - 1, planks[i % planks.length]);
    rect(k, dy, x + width - k, rh - 1, planks[(i + 3) % planks.length]);
    rect(k, dy, 2, rh - 1, "#745136");
    rect(x, dy, width, 2, "#f6c78c27");
    for (const ax of [x + 6, k - 3, k + 3, x + width - 6]) ellipse(ax, dy + rh / 2, 1, 1, "#62412e");
    const gx = x + width * scatter(i, 23) * .68;
    path([[gx, dy + rh * .64], [gx + width * .12, dy + rh * .64]], "#e5a87737", 1);
  }
  rect(x, y, width, height, gradient(y, y + height, [[0, "#ffd48a39"], [.44, "#ffd48a05"], [1, "#432f2329"]]));
  for (const ax of [x - 5, x + width + 5]) for (const ay of [y - 3, y + height + 1]) {
    ellipse(ax, ay, 5, 6, "#5c422f");
    ellipse(ax, ay - 2, 4, 4, "#bc8f59");
  }
  lanternLine([x - 4, y - 11], [x + width + 4, y - 11], Math.max(6, Math.floor(width / 45)));
}
function bowl(x, y, filled) {
  ellipse(x, y + 2, 12, 8, "#47372878");
  ellipse(x, y, 11, 7, "#eee3bf");
  ellipse(x, y, 8, 5, filled ? "#b0844d" : "#719291");
  if (filled) {
    path([[x - 5, y + 1], [x, y - 2], [x + 4, y]], "#ecd293", 2.4);
    ellipse(x + 4, y + 2, 2.8, 1.5, "#728651");
  }
}
function stovePaint(stove) {
  rect(-24, -19, 48, 39, "#583c2c", 5);
  rect(-24, -21, 48, 34, "#c2a078", 4);
  rect(-21, -18, 42, 27, "#7d6550", 3);
  ellipse(0, -5, 15, 11, stove.state === "cooking" ? "#cf793e" : "#4a4339");
  if (stove.state === "cooking" || stove.state === "ready") {
    bowl(0, -6, true);
    if (stove.state === "cooking") {
      path([[-6, -14], [-9, -19], [-6, -25]], "#f7ddad", 1.5);
      path([[2, -15], [0, -20], [4, -25]], "#f7ddad", 1.5);
    }
  }
}
function drawQuan(w, h, map) {
  nightRiver(w, h, map);
  raft(map);
  const size = unitSize(w);
  const { at } = map;
  const customers = list(snap.customers);
  for (const stove of list(snap.stoves)) {
    if (!position(stove.pos)) continue;
    const [x, y] = at(stove.pos);
    sprite([x, y], size, () => stovePaint(stove));
    label(stove.id ?? "Bếp", x, y + 30 * size);
  }
  for (const table of list(snap.tables)) {
    if (!position(table.pos)) continue;
    const [x, y] = at(table.pos);
    const customer = customers.find(c => c.table_id === table.id);
    sprite([x, y], size, () => {
      for (const px of [-30, 30]) {
        ellipse(px, 1, 9, 8, "#684832");
        ellipse(px, -1, 8, 6, "#c49560");
      }
      ellipse(0, 4, 26, 20, "#60412b");
      ellipse(0, 0, 26, 19, "#d2a472");
      ellipse(0, 0, 21, 15, "#ae7c51");
      bowl(-10, -4, customer?.state === "eating");
      path([[1, -6], [12, -3]], "#6d5038", 1.5);
      path([[1, -3], [12, 0]], "#6d5038", 1.5);
    });
    if (customer) {
      const seat = x + (x > map.left + map.width - 32 * size ? -30 : 30) * size;
      stamp(tiles.guest, seat, y - 9 * size);
    }
    label(table.id ?? "Bàn", x, y + 30 * size);
  }
  if (position(snap.player?.pos)) {
    const [x, y] = at(snap.player.pos);
    ellipse(x, y + 18 * size, 17 * size, 6 * size, "#49342e66");
    stamp(tiles.sen, x, y);
    if (snap.hand) sprite([x + 20 * size, y + 8 * size], .8 * size, () => bowl(0, 0, true));
    label("Út Sen", x, y - Math.max(30, 34 * size));
  }
}
function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  const pixelWidth = Math.round(w * dpr), pixelHeight = Math.round(h * dpr);
  if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
  if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
  // Art uses whole display-pixel blocks; the HUD and scene labels stay at full resolution.
  const block = Math.max(1, Math.round(dpr * (w < 741 ? 2 : 3)));
  const artWidth = Math.ceil(pixelWidth / block), artHeight = Math.ceil(pixelHeight / block);
  if (art.width !== artWidth) art.width = artWidth;
  if (art.height !== artHeight) art.height = artHeight;
  ctx.setTransform(pixelWidth / w / block, 0, 0, pixelHeight / h / block, 0, 0);
  labels.length = 0;
  const gather = snap?.mode === "gather";
  const above = gather ? h * .28 : Math.max(62, h * .205);
  const map = project(snap?.meta?.bounds, gather ? "d" : "z", w, h, above, 26);
  if (!map) rect(0, 0, w, h, "#243b32");
  else if (gather) drawGather(w, h, map);
  else drawQuan(w, h, map);
  screen.setTransform(1, 0, 0, 1, 0, 0);
  screen.imageSmoothingEnabled = false;
  screen.drawImage(art, 0, 0, artWidth * block, artHeight * block);
  screen.setTransform(pixelWidth / w, 0, 0, pixelHeight / h, 0, 0);
  drawLabels(w, h);
}

new ResizeObserver(draw).observe(canvas);
addEventListener("resize", draw);
poll();
</script>
