<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 18px/1.35 "Segoe UI", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: default; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client Phase 2: đọc snapshot GET /state, gửi POST /input.
 * Menu / DayIntro / EveningIntro / DayResult / Shop / Summary + pause Esc|P.
 * Trường thiếu → ẩn hoặc "—". Demo màn day: ?demo=menu|dayIntro|eveningIntro|dayResult|shop|summary|pause
 * Phím: WASD · E · Space · R · Esc/P pause · Enter bỏ qua intro.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const FONT = '"Segoe UI","Helvetica Neue",Arial,sans-serif';
const HUD_MIN = 18;

const params = new URLSearchParams(location.search);
const DEMO = params.get("demo"); // null | menu|dayIntro|...

let snap = null, offline = false;
let uiScreen = DEMO || "menu"; // menu|dayIntro|eveningIntro|dayResult|shop|summary|play
let paused = DEMO === "pause";
let introSince = performance.now();
let pauseSupported = null; // null unknown, true/false after probe
let buttons = []; // {x,y,w,h,id,label}
let lastFrame = performance.now(), fpsEMA = 60;

const DEMO_DATA = {
  day: 1,
  day_plan: {
    dishes: [{ id: "ca_loc_nuong_trui", count: 3 }, { id: "goi_bong_sung", count: 3 }],
    need: { ca_loc: 3, bong_sung: 6 },
    speech: ["Hôm nay Má Tư cần: cá lóc nướng trui ×3,", "gỏi bông súng ×3. Lấy đủ rồi về bến nhé!"],
  },
  inventory_in: { ca_loc: 3, bong_sung: 6, ca_linh: 0 },
  cookable: ["ca_loc_nuong_trui", "goi_bong_sung"],
  day_result: { served: 5, left: 1, money: 420, tip: 40, rep_delta: 0.2, reputation: 3.2 },
  shop: {
    money: 420,
    upgrades: { oxygen: 0, hp: 0 },
    catalog: [
      { id: "oxygen", name: "Bình oxy", levels: [{ level: 1, price: 200, desc: "45 s" }, { level: 2, price: 400, desc: "60 s" }] },
      { id: "hp", name: "Áo phao", levels: [{ level: 1, price: 250, desc: "4 Máu" }, { level: 2, price: 500, desc: "5 Máu" }] },
    ],
  },
  summary: { money: 1800, score: 2100, reputation: 4.2, top_dish: "lau_ca_linh_dien_dien", days: 5 },
};

const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function playingLive() { return uiScreen === "play" && !paused && !DEMO; }

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (mode === "quan") dy = -dy;
  const body = { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
  if (paused) body.pause = true;
  return body;
}
function pushInput() {
  if (!playingLive() && !(uiScreen === "play" && paused)) return;
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try {
      await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } });
      // live.py hiện bỏ qua field lạ (pause) nhưng vẫn 200 — chỉ coi là hỗ trợ khi snapshot có `paused`
      if (body.indexOf('"pause"') >= 0) pauseSupported = !!(snap && snap.paused !== undefined);
    } catch (e) { /* poll báo */ }
  }
  inflight = false;
}

function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }

function setScreen(s) {
  uiScreen = s;
  introSince = performance.now();
  if (s !== "play") paused = false;
  buttons = [];
}

function togglePause() {
  if (uiScreen === "menu" || DEMO && DEMO !== "pause" && uiScreen !== "play") {
    if (DEMO === "pause" || uiScreen === "play") { /* ok */ }
    else return;
  }
  if (uiScreen !== "play" && DEMO !== "pause") return;
  paused = !paused;
  lastSent = "";
  pushInput();
}

function goPlay() {
  setScreen("play");
  paused = false;
  lastSent = "";
  down.clear();
  pushInput();
}

function skipIntroOrAdvance() {
  if (uiScreen === "dayIntro") goPlay();
  else if (uiScreen === "eveningIntro") setScreen("play");
  else if (uiScreen === "dayResult") setScreen("shop");
  else if (uiScreen === "summary") setScreen("menu");
}

addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (k === "escape" || k === "p") {
    if (uiScreen === "play" || DEMO === "pause") { e.preventDefault(); togglePause(); return; }
  }
  if (paused) {
    if (k === "enter" || k === " ") { e.preventDefault(); togglePause(); }
    return;
  }
  if (uiScreen === "dayIntro" || uiScreen === "eveningIntro" || uiScreen === "dayResult") {
    if (k === "enter" || k === " " || k === "e") { e.preventDefault(); skipIntroOrAdvance(); return; }
  }
  if (uiScreen === "shop" && (k === "enter" || k === "e")) { setScreen(DEMO ? "summary" : "menu"); return; }
  if (uiScreen !== "play") return;
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  if (uiScreen !== "play" || paused) return;
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

cv.addEventListener("click", (e) => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (cv.width / r.width) / (window.devicePixelRatio || 1);
  const y = (e.clientY - r.top) * (cv.height / r.height) / (window.devicePixelRatio || 1);
  // fit() uses CSS pixels via setTransform — click in CSS px
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h) { onButton(b.id); return; }
  }
});

function onButton(id) {
  if (id === "play") goPlay();
  else if (id === "quit") { /* trình duyệt: về menu trống */ setScreen("menu"); }
  else if (id === "resume") { paused = false; lastSent = ""; pushInput(); }
  else if (id === "toMenu") { paused = false; setScreen("menu"); down.clear(); }
  else if (id === "skipIntro") skipIntroOrAdvance();
  else if (id === "shopDone") setScreen(DEMO ? "summary" : "dayIntro");
  else if (id === "summaryOk") setScreen("menu");
  else if (id === "buy_oxygen" || id === "buy_hp") { /* demo only — không gửi luật */ }
  else if (id === "demoDay") setScreen("dayIntro");
  else if (id === "demoEve") setScreen("eveningIntro");
  else if (id === "demoRes") setScreen("dayResult");
  else if (id === "demoShop") setScreen("shop");
  else if (id === "demoSum") setScreen("summary");
}

async function poll() {
  if (DEMO && DEMO !== "pause") { setTimeout(poll, 200); return; }
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    syncPhaseFromSnap();
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
function syncPhaseFromSnap() {
  if (!snap || DEMO) return;
  const ph = snap.ui_phase || snap.phase_ui || snap.screen || snap.day_phase;
  // Chỉ tự nhảy khi sim day lộ phase rõ; mode gather/quan → play
  if (ph === "day_intro" || ph === "DayIntro") setScreen("dayIntro");
  else if (ph === "evening_intro" || ph === "EveningIntro") setScreen("eveningIntro");
  else if (ph === "day_result" || ph === "DayResult") setScreen("dayResult");
  else if (ph === "shop" || ph === "Shop") setScreen("shop");
  else if (ph === "summary" || ph === "Summary") setScreen("summary");
  else if (uiScreen === "menu") { /* chờ Chơi */ }
  else if (snap.mode === "gather" || snap.mode === "quan") {
    if (uiScreen !== "play" && uiScreen !== "dayIntro" && uiScreen !== "eveningIntro") {
      /* giữ màn intro nếu đang xem */
    }
  }
  if (snap.paused === true) paused = true;
  else if (snap.paused === false && pauseSupported) paused = false;
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const DISH_NAME = {
  ca_loc_nuong_trui: "cá lóc nướng trui", goi_bong_sung: "gỏi bông súng", lau_ca_linh_dien_dien: "lẩu cá linh điên điển",
  canh_chua_ca_loc: "canh chua cá lóc", ca_keo_nuong: "cá kèo nướng", lau_mam: "lẩu mắm",
};
const dn = (d) => DISH_NAME[d] || d;
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  const size = Math.max(o.size || HUD_MIN, o.allowSmall ? (o.size || HUD_MIN) : HUD_MIN);
  ctx.font = (o.bold ? "600 " : "") + size + "px " + FONT;
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(String(s), x, y);
}
function textLoose(s, x, y, o = {}) {
  // cho nhãn phụ cảnh (id nút…) — vẫn ≥ 14, HUD chính dùng text()
  ctx.font = (o.size || 14) + "px " + FONT;
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(String(s), x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) textLoose(label, x + w / 2, y + h - 2, { size: 12, align: "center" });
}
function fmtTime(ticks) {
  if (ticks === undefined || ticks === null) return "—";
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function dash(v) { return v === undefined || v === null ? "—" : v; }
function dishOf(obj) {
  if (!obj) return null;
  if (typeof obj === "string") return obj;
  return obj.dish_id || obj.dish || null;
}
function patienceLeft(c) {
  if (!c) return undefined;
  if (c.patience_ticks_left !== undefined) return c.patience_ticks_left;
  if (c.patience_ticks !== undefined) return c.patience_ticks;
  return undefined;
}
function patienceMax(c, meta) {
  if (c && c.patience_max_ticks !== undefined) return c.patience_max_ticks;
  return ((meta && meta.patience_s) || 60) * 60;
}
function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "rgba(255,255,255,.2)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}
function btn(id, label, x, y, w, h, opt) {
  const o = opt || {};
  ctx.fillStyle = o.fill || "#2a4a5c";
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = o.stroke || "#8ecae6";
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  text(label, x + w / 2, y + h / 2 + 7, { size: o.size || 20, align: "center", color: o.color || "#e8f4f8", bold: true });
  buttons.push({ id, label, x, y, w, h });
}
function dist2(a, b) {
  const dx = a[0] - b[0], dy = a[1] - b[1];
  return Math.sqrt(dx * dx + dy * dy);
}
function dayPlan() {
  return (snap && (snap.day_plan || (snap.day && snap.day.day_plan))) || (DEMO ? DEMO_DATA.day_plan : null);
}
function dayNum() {
  const d = snap && (snap.day_number ?? snap.day ?? (snap.day && snap.day.number));
  if (d !== undefined && d !== null && typeof d !== "object") return d;
  return DEMO ? DEMO_DATA.day : "—";
}
function holdCounts() {
  const h = (snap && snap.hold) || [];
  const o = {};
  h.forEach((k) => { o[k] = (o[k] || 0) + 1; });
  return o;
}
function monsters() {
  if (snap && Array.isArray(snap.monsters)) return snap.monsters;
  if (snap && snap.gather && Array.isArray(snap.gather.monsters)) return snap.gather.monsters;
  return [];
}

const GATHER_HUD_EVENTS = new Set([
  "dive", "surface", "oxygen_empty", "choke", "faint", "hold_full", "gather_end",
  "gather", "fish_caught", "node_regrown",
]);
const QUAN_HUD_EVENTS = new Set([
  "customer_arrived", "customer_left", "cook_started", "dish_ready", "dish_picked",
  "served", "paid", "quan_end", "no_dish",
]);
const EVENT_VI = {
  dive: "Lặn xuống", surface: "Lên mặt nước", oxygen_empty: "Hết oxy", choke: "Ngạt (−1 Máu)", faint: "Ngất",
  hold_full: "Giỏ đầy", gather_end: "Kết thúc buổi sáng", gather: "Hái nút", fish_caught: "Bắt cá", node_regrown: "Nút mọc lại",
  customer_arrived: "Khách đến", customer_left: "Khách bỏ đi", cook_started: "Bắt nấu", dish_ready: "Món chín",
  dish_picked: "Nhặt món", served: "Phục vụ", paid: "Thanh toán + boa", quan_end: "Hết ca", no_dish: "Thiếu món",
};
function lastHudEvent(allowed) {
  const ev = (snap && snap.events) || [];
  for (let i = ev.length - 1; i >= 0; i--) if (allowed.has(ev[i].name)) return ev[i];
  return null;
}
function hudEventLine(e) {
  if (!e) return "";
  let s = EVENT_VI[e.name] || e.name;
  const d = e.data || {};
  if (d.reason) s += " · " + d.reason;
  else if (d.dish || d.dish_id) s += " · " + dn(d.dish || d.dish_id);
  else if (d.kind) s += " · " + (KIND_NAME[d.kind] || d.kind) + (d.count ? "×" + d.count : "");
  else if (d.node_id) s += " · " + d.node_id;
  else if (d.fish_id) s += " · " + d.fish_id;
  return "t" + e.tick + " " + s;
}
function eventLog(w, h) {
  if (!snap) return;
  const ev = (snap.events || []).slice(-5);
  ev.forEach((e, i) => textLoose(hudEventLine(e), w - 12, h - 72 - (ev.length - 1 - i) * 16, { size: 14, align: "right", color: "rgba(232,238,242,.7)" }));
}

// ----- màn hình UI -----
function drawMenu(w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#1a3040"); g.addColorStop(1, "#0c141a");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  text("QUÁN ĂN CHỢ NỔI", w / 2, h * 0.28, { size: 42, align: "center", bold: true, color: "#ffe082" });
  text("Út Sen · một ngày ở chợ", w / 2, h * 0.28 + 40, { size: 20, align: "center", color: "#b0bec5" });
  btn("play", "Chơi", w / 2 - 120, h * 0.48, 240, 52);
  btn("quit", "Thoát", w / 2 - 120, h * 0.48 + 70, 240, 52, { fill: "#3a2a2a", stroke: "#ef9a9a" });
  text("Demo màn day: ?demo=dayIntro|eveningIntro|dayResult|shop|summary|pause", w / 2, h - 36, { size: 16, align: "center", color: "#78909c" });
  if (!DEMO) {
    btn("demoDay", "Xem DayIntro", 24, h - 100, 140, 36, { size: 16 });
    btn("demoShop", "Xem Shop", 180, h - 100, 120, 36, { size: 16 });
  }
}

function drawDayIntro(w, h) {
  panel(w * 0.15, h * 0.12, w * 0.7, h * 0.7);
  text("Ngày " + dayNum(), w / 2, h * 0.22, { size: 36, align: "center", bold: true, color: "#ffe082" });
  text("Má Tư dặn:", w / 2, h * 0.30, { size: 22, align: "center", color: "#90caf9" });
  const plan = dayPlan();
  let y = h * 0.38;
  if (plan && plan.speech) {
    plan.speech.forEach((line) => { text(line, w / 2, y, { size: 20, align: "center" }); y += 32; });
  } else if (plan && plan.dishes) {
    plan.dishes.forEach((d) => { text(dn(d.id) + " ×" + d.count, w / 2, y, { size: 20, align: "center" }); y += 30; });
  } else text("Kế hoạch: — (chờ snapshot day_plan)", w / 2, y, { size: 20, align: "center", color: "#78909c" });
  if (plan && plan.need) {
    y += 16;
    text("Cần lấy: " + Object.keys(plan.need).map((k) => (KIND_NAME[k] || k) + "×" + plan.need[k]).join(", "), w / 2, y, { size: 18, align: "center", color: "#cfd8dc" });
  }
  const left = Math.max(0, 4 - (performance.now() - introSince) / 1000);
  text(left > 0 ? ("Tự vào sau " + left.toFixed(1) + "s · Enter/Space bỏ qua") : "Đang vào…", w / 2, h * 0.78, { size: 18, align: "center", color: "#9fb3c0" });
  btn("skipIntro", "Vào buổi sáng", w / 2 - 110, h * 0.82, 220, 44);
  if (!DEMO && left <= 0) goPlay();
  if (DEMO && left <= 0) introSince = performance.now(); // loop demo
}

function drawEveningIntro(w, h) {
  panel(w * 0.15, h * 0.12, w * 0.7, h * 0.7);
  text("Buổi tối · Nhập kho", w / 2, h * 0.22, { size: 34, align: "center", bold: true, color: "#ffe082" });
  const inv = (snap && (snap.inventory || snap.stock || (snap.gather_end && snap.gather_end.inventory))) || (DEMO ? DEMO_DATA.inventory_in : null);
  let y = h * 0.34;
  text("Nguyên liệu mang về:", w / 2, y, { size: 20, align: "center" }); y += 36;
  if (inv && typeof inv === "object") {
    const items = inv.items || inv;
    const keys = Object.keys(items).filter((k) => items[k] > 0);
    if (!keys.length) text("(trống)", w / 2, y, { size: 18, align: "center", color: "#78909c" });
    else keys.forEach((k) => { text((KIND_NAME[k] || k) + " ×" + items[k], w / 2, y, { size: 20, align: "center" }); y += 28; });
  } else text("Kho: —", w / 2, y, { size: 20, align: "center", color: "#78909c" });
  y += 20;
  text("Món nấu được:", w / 2, y, { size: 20, align: "center", color: "#90caf9" }); y += 32;
  const cook = (snap && snap.cookable) || (DEMO ? DEMO_DATA.cookable : null);
  if (cook && cook.length) cook.forEach((d) => { text(dn(d), w / 2, y, { size: 18, align: "center" }); y += 26; });
  else text("—", w / 2, y, { size: 18, align: "center", color: "#78909c" });
  btn("skipIntro", "Mở quán", w / 2 - 100, h * 0.82, 200, 44);
}

function drawDayResult(w, h) {
  panel(w * 0.18, h * 0.14, w * 0.64, h * 0.66);
  text("Kết quả Ngày " + dayNum(), w / 2, h * 0.24, { size: 34, align: "center", bold: true, color: "#ffe082" });
  const r = (snap && (snap.day_result || snap.result)) || (DEMO ? DEMO_DATA.day_result : {});
  const rows = [
    ["Khách phục vụ", dash(r.served)],
    ["Khách bỏ đi", dash(r.left)],
    ["Tiền ca", r.money !== undefined ? r.money + "k" : "—"],
    ["Boa", r.tip !== undefined ? r.tip + "k" : "—"],
    ["Δ uy tín", dash(r.rep_delta)],
    ["Uy tín", dash(r.reputation)],
  ];
  let y = h * 0.34;
  rows.forEach(([a, b]) => { text(a + ":  " + b, w / 2, y, { size: 22, align: "center" }); y += 36; });
  btn("skipIntro", "Vào Shop", w / 2 - 100, h * 0.78, 200, 44);
}

function drawShop(w, h) {
  panel(40, 40, w - 80, h - 80);
  const sh = (snap && snap.shop) || (DEMO ? DEMO_DATA.shop : {});
  const money = snap && snap.money !== undefined ? snap.money : sh.money;
  const ups = (snap && (snap.upgrades || snap.active_upgrades)) || sh.upgrades || {};
  text("Shop nâng cấp", w / 2, 90, { size: 34, align: "center", bold: true, color: "#ffe082" });

// ----- GATHER -----
function drawGather(w, h) {
  const meta = (snap && snap.meta) || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 96, bottom = 64;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();

  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "rgba(255,213,79,.12)"; ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.85)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  textLoose("Bến (E)", sx(dp[0]), sy(-2.8), { size: 14, align: "center", color: "#5a3a22" });

  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false && !(n.regrow_ticks > 0);
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
    ctx.globalAlpha = ready ? 1 : 0.4;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(nx, ny - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (ready) { ctx.strokeStyle = "#fff59d"; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(nx, ny - 0.1 * s, 0.95 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1; }
    else textLoose("mọc " + (n.regrow_ticks !== undefined ? Math.ceil(n.regrow_ticks / 60) + "s" : "—"), nx, ny + 1.1 * s, { size: 12, align: "center", color: "#ffcc80" });
  });
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
  });
  // quái
  const mons = monsters();
  mons.forEach((m) => {
    if (!m.pos) return;
    const mx = sx(m.pos[0]), my = sy(m.pos[1]);
    ctx.fillStyle = "#7b1fa2"; ctx.beginPath(); ctx.ellipse(mx, my, 1.2 * s, 0.55 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ce93d8"; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
    textLoose(m.id || "M", mx, my - 0.9 * s, { size: 12, align: "center", color: "#e1bee7" });
  });

  const p = snap.player;
  let nearMonster = false, nearDock = false, nearNode = false;
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
    }
    nearDock = dist2(p.pos, dp) <= dr + 0.05;
    const ir = meta.interact_radius || 2;
    (snap.nodes || []).forEach((n) => { if (n.ready !== false && dist2(p.pos, n.pos) <= ir) nearNode = true; });
    mons.forEach((m) => { if (m.pos && dist2(p.pos, m.pos) <= (m.warn_radius || 10)) nearMonster = true; });
  }

  // viền tím thủy quái
  if (nearMonster) {
    ctx.strokeStyle = "rgba(156,39,176,.85)"; ctx.lineWidth = 8; ctx.strokeRect(4, 4, w - 8, h - 8); ctx.lineWidth = 1;
    text("Thủy quái!", w / 2, h * 0.42, { size: 36, align: "center", bold: true, color: "#e1bee7" });
  }

  // HUD
  const tLeft = snap.time_left_ticks;
  const tUrgent = tLeft !== undefined && tLeft <= 30 * 60;
  text("⏱ " + fmtTime(tLeft), 14, 28, { size: 22, bold: true, color: tUrgent ? "#ff5252" : "#e8eef2" });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    const blink = low && Math.floor(performance.now() / 200) % 2;
    if (!blink || !low) bar(120, 12, 200, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7");
    text("Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s", 120, 48, { size: 18, color: low ? "#ff8a80" : "#b3e5fc" });
    if (p.oxygen_ticks === 0) text("Hết hơi!", w / 2, 88, { size: 28, align: "center", bold: true, color: "#ff5252" });
  } else text("Oxy —", 120, 48, { size: 18, color: "#78909c" });
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = ""; for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text("Máu " + hs, 340, 28, { size: 22, color: "#ff6b81" });
  } else text("Máu —", 340, 28, { size: 18, color: "#78909c" });
  const depth = p && p.pos ? p.pos[1].toFixed(1) + " m" : "—";
  text("Độ sâu " + depth, 500, 28, { size: 18, color: "#81d4fa" });
  let surf = "—";
  if (p && p.at_surface !== undefined) surf = p.at_surface ? "Mặt nước" : "Dưới nước";
  text(surf, w - 20, 28, { size: 18, align: "right", color: "#cfd8dc" });

  if (p && p.catch_cd_ticks !== undefined) {
    if (p.catch_cd_ticks > 0) text("Hồi bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 14, 72, { size: 18, color: "#90caf9" });
    else text("Hồi bắt: sẵn", 14, 72, { size: 18, color: "#a5d6a7" });
  } else text("Hồi bắt: —", 14, 72, { size: 18, color: "#78909c" });

  const counts = holdCounts();
  const holdLine = Object.keys(counts).length
    ? Object.keys(counts).map((k) => (KIND_NAME[k] || k) + "×" + counts[k]).join("  ")
    : "(trống)";
  text("Giỏ " + ((snap.hold && snap.hold_capacity) ? snap.hold.length + "/" + snap.hold_capacity : "—") + "  " + holdLine, 200, 72, { size: 18 });

  // day_plan đã/cần
  const plan = dayPlan();
  if (plan && plan.need) {
    const parts = Object.keys(plan.need).map((k) => {
      const have = counts[k] || 0, need = plan.need[k];
      return (KIND_NAME[k] || k) + " " + have + "/" + need;
    });
    text("Cần lấy: " + parts.join(" · "), 14, 96, { size: 18, color: "#ffe082" });
  } else text("Cần lấy: —", 14, 96, { size: 18, color: "#78909c" });

  if (nearDock) text("Gợi ý: E cập bến", w / 2, h - 80, { size: 22, align: "center", color: "#ffe082" });
  else if (nearNode && p && (p.at_surface !== false)) text("Gợi ý: E hái nút", w / 2, h - 80, { size: 22, align: "center", color: "#fff59d" });

  // giỏ ô
  const cap = snap.hold_capacity;
  if (snap.hold && cap) {
    const sz = Math.min(28, (w - 260) / cap - 4), y0 = h - bottom + 10;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      if (snap.hold[i]) { ctx.fillStyle = kc(snap.hold[i]); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6); }
      if (i === snap.hold.length - 1 && snap.hold.length) { ctx.strokeStyle = "#ffd54f"; ctx.lineWidth = 2; ctx.strokeRect(x0 + 1, y0 + 1, sz - 2, sz - 2); ctx.lineWidth = 1; }
    }
    if (snap.hold.length >= cap) text("GIỎ ĐẦY", 14 + cap * (sz + 4) + 6, y0 + sz * 0.7, { size: 18, color: "#ffd54f" });
  }
  text("WASD · E · Space · Esc/P pause · R", w - 12, h - 14, { size: 16, align: "right", color: "#9fb3c0" });
  const gev = lastHudEvent(GATHER_HUD_EVENTS);
  if (gev) text(hudEventLine(gev), w - 12, 96, { size: 16, align: "right", color: "#ffe082" });
}

// ----- QUAN -----
function drawQuan(w, h) {
  const meta = (snap && snap.meta) || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 100, bottom = 48;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    const sx0 = sx(st.pos[0]), sy0 = sy(st.pos[1]);
    ctx.fillStyle = col; ctx.fillRect(sx0 - 0.8 * s, sy0 - 0.8 * s, 1.6 * s, 1.6 * s);
    textLoose(st.id, sx0, sy0 + 4, { size: 14, align: "center", color: "#111" });
    const sd = dishOf(st);
    if (sd) textLoose(dn(sd), sx0, sy0 - 0.95 * s, { size: 12, align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined)
      textLoose("còn " + Math.ceil(st.cook_ticks_left / 60) + "s", sx0, sy0 + 1.25 * s, { size: 14, align: "center", color: "#2a1a0a" });
    else if (st.state === "ready") textLoose("chín", sx0, sy0 + 1.25 * s, { size: 14, align: "center", color: "#1b5e20" });
  });

  const byTable = {};
  (snap.customers || []).forEach((c) => { byTable[c.table_id] = c; });
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    textLoose(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 14, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2";
      ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      const cd = dishOf(c);
      textLoose(cd ? dn(cd) : "?", cx, cy - 0.75 * s, { size: 12, align: "center", color: "#2a1a0a" });
      const pl = patienceLeft(c), pm = patienceMax(c, meta);
      if (pl !== undefined && pm > 0 && c.state !== "eating") {
        const low = pl / pm < 0.25;
        bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 6, pl / pm, low ? "#ff1744" : "#e57373");
      }
    }
  });

  const p = snap.player;
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    const handD = dishOf(snap.hand);
    if (handD) text("🍲 " + dn(handD), px, py - 0.9 * s, { size: 18, align: "center", color: "#2a1a0a" });
  }

  // HUD quán
  const tLeft = snap.time_left_ticks;
  const tUrgent = tLeft !== undefined && tLeft <= 30 * 60;
  text("Ca " + fmtTime(tLeft), 14, 28, { size: 22, bold: true, color: tUrgent ? "#ff5252" : "#e8eef2" });
  const se = snap.shift_earned !== undefined ? snap.shift_earned : snap.earned;
  text("Tiền ca " + dash(se !== undefined && se !== null ? se + "k" : null) + " · Tổng " + dash(snap.money !== undefined ? snap.money + "k" : null), 160, 28, { size: 18 });
  const rep = snap.reputation;
  text("Uy tín " + (rep !== undefined && rep !== null ? Number(rep).toFixed(1) : "—") + "/5", 520, 28, { size: 18, color: "#ffd54f" });

  // T1–T4 panel
  const tableIds = ["T1", "T2", "T3", "T4"];
  const tables = snap.tables || [];
  tableIds.forEach((tid, i) => {
    const tb = tables.find((t) => t.id === tid) || { id: tid };
    const c = byTable[tid] || (tb.customer_id && (snap.customers || []).find((x) => x.id === tb.customer_id));
    const x0 = 14 + i * 200;
    panel(x0, 44, 190, 70);
    text(tid, x0 + 8, 66, { size: 18, bold: true, color: "#90caf9" });
    if (!c) text("trống", x0 + 8, 92, { size: 18, color: "#78909c" });
    else {
      const cd = dishOf(c);
      text(cd ? dn(cd) : "—", x0 + 8, 88, { size: 16 });
      const pl = patienceLeft(c), pm = patienceMax(c, meta);
      if (c.state === "eating") text("đang ăn", x0 + 8, 108, { size: 16, color: "#a5d6a7" });
      else if (pl !== undefined && pm > 0) {
        const low = pl / pm < 0.25;
        bar(x0 + 8, 98, 170, 10, pl / pm, low ? "#ff1744" : "#e57373");
      } else text("kiên nhẫn —", x0 + 8, 108, { size: 16, color: "#78909c" });
    }
  });

  // 2 bếp tiến độ
  const stoves = snap.stoves || [];
  text("Bếp:", 14, 140, { size: 18 });
  ["B1", "B2"].forEach((sid, i) => {
    const st = stoves.find((x) => x.id === sid) || stoves[i];
    const label = !st ? sid + " —" : sid + " " + (st.state || "—") + (st.cook_ticks_left !== undefined && st.state === "cooking" ? " " + Math.ceil(st.cook_ticks_left / 60) + "s" : "") + (dishOf(st) ? " · " + dn(dishOf(st)) : "");
    text(label, 70 + i * 320, 140, { size: 18, color: st && st.state === "ready" ? "#a5d6a7" : "#e8eef2" });
  });

  const handLbl = dishOf(snap.hand);
  text("Đang cầm: " + (handLbl ? dn(handLbl) : "—"), w - 14, 28, { size: 18, align: "right" });

  let stockLine = "—";
  if (snap.stock && typeof snap.stock === "object") {
    const parts = Object.keys(snap.stock).filter((k) => snap.stock[k] > 0).map((k) => (KIND_NAME[k] || k) + "×" + snap.stock[k]);
    stockLine = parts.length ? parts.join(", ") : "(trống)";
  }
  text("Kho: " + stockLine, 14, 168, { size: 18, color: "#cfd8dc" });

  const qev = lastHudEvent(QUAN_HUD_EVENTS);
  if (qev) text(hudEventLine(qev), w - 14, 168, { size: 16, align: "right", color: "#ffe082" });
  text("WASD · E · Esc/P pause · R", w - 12, h - 14, { size: 16, align: "right", color: "#9fb3c0" });
}

function overlay(w, h) {
  if (offline && !DEMO) text("Mất kết nối máy chủ", w / 2, 30, { align: "center", color: "#ff8a80", size: 18 });
  if (snap && snap.error) text("Luật báo lỗi — xem terminal. R chơi lại.", w / 2, 54, { align: "center", color: "#ff8a80", size: 18 });
  if (snap && snap.finished && uiScreen === "play" && !paused) {
    panel(w / 2 - 200, h / 2 - 60, 400, 120);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 10, { align: "center", size: 22 });
    text("R chơi lại · Esc pause/menu", w / 2, h / 2 + 28, { align: "center", size: 18, color: "#cfd8dc" });
  }
}

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  const dt = now - lastFrame; lastFrame = now;
  if (dt > 0 && dt < 1000) fpsEMA = fpsEMA * 0.9 + (1000 / dt) * 0.1;

  buttons = [];
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);

  if (uiScreen === "menu") drawMenu(w, h);
  else if (uiScreen === "dayIntro") drawDayIntro(w, h);
  else if (uiScreen === "eveningIntro") drawEveningIntro(w, h);
  else if (uiScreen === "dayResult") drawDayResult(w, h);
  else if (uiScreen === "shop") drawShop(w, h);
  else if (uiScreen === "summary") drawSummary(w, h);
  else if (uiScreen === "play" || DEMO === "pause") {
    if (DEMO === "pause" && !snap) {
      // nền giả khi demo pause không có server
      ctx.fillStyle = "#1a3040"; ctx.fillRect(0, 0, w, h);
      text("(demo pause — mở kèm live để thấy nền game)", w / 2, h / 2 - 160, { align: "center", size: 18, color: "#78909c" });
    } else if (!snap) {
      text(offline ? "Không kết nối…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 22 });
    } else {
      if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
      eventLog(w, h);
      overlay(w, h);
    }
    if (paused || DEMO === "pause") drawPause(w, h);
  }

  textLoose(Math.round(fpsEMA) + " FPS", 8, h - 8, { size: 12, color: "rgba(255,255,255,.35)" });
}
requestAnimationFrame(frame);

// Nếu ?demo=pause mà không có live: vẫn hiện pause
if (DEMO === "pause") { uiScreen = "play"; paused = true; }
if (DEMO && DEMO !== "pause") setScreen(DEMO);
</script>
</body>
