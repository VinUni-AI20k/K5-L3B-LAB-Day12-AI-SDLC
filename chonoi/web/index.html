<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp. CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (luật tới đâu, hình hiện tới đó).
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · Esc/P = tạm dừng · R = chơi lại.
 * Shop: 1 = bình oxy · 2 = áo phao · Enter = xong. C = chế độ tương phản cao (hoặc ?contrast). Thêm ?debug vào địa chỉ để hiện nhãn id.
 * Benchmark: ?bench=<làm nóng s>,<đo s> (dùng bởi chonoi/bench.py): đo thời gian từng khung hình và gửi về /bench/result.
 *
 * Phase 2 (Phase2.md mục 2): menu chính, tạm dừng, HUD sáng/tối đủ mục, màn Ngày/Tối/Kết quả/Shop/Tổng kết.
 * Các lệnh pause / buy / shop_done được xử lý bởi backend qua /input.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const MIN_FONT = 18;                          // Phase2.md: chữ không chân ≥ 18 px ở 1280×720
const DEBUG = /[?&]debug/.test(location.search);
const BENCH = (location.search.match(/[?&]bench=([\d.]+),([\d.]+)/) || null);
let snap = null, offline = false;
const SPOILED_BELOW = 30;                     // Phase3.md: fresh < 30 là ươn (ưu tiên snap.freshness.spoiled_below nếu backend gửi)
function loadHc() {
  const q = /[?&]contrast/.test(location.search);
  try { return q || localStorage.getItem("chonoi.hc") === "1"; } catch (e) { return q; }
}

// ---------- trạng thái giao diện (không đi vào luật) ----------
const ui = {
  screen: (/[?&]play/.test(location.search) || BENCH) ? "play" : "menu",   // "menu" | "play"; ?play bỏ qua menu (dùng khi demo/chụp thử)
  paused: false, pausedAt: 0,
  intro: null,               // {kind: "day"|"evening", until}
  plan: null,                // day_plan của Ngày hiện tại (từ event)
  result: null,              // kết quả buổi tối chờ đóng
  stats: null, repStart: null, earnedStart: null,
  seen: new Set(), toast: null, quitNote: false, totalSold: {}, hc: loadHc(),
};
function resetUi() {
  ui.paused = false; ui.intro = null; ui.plan = null; ui.result = null;
  ui.stats = newStats(); ui.repStart = null; ui.earnedStart = null; ui.seen = new Set(); ui.toast = null; ui.totalSold = {};
  cookMax = {};
}
function newStats() { return { served: 0, left: 0, tips: 0, income: 0 }; }
ui.stats = newStats();
let cookMax = {};
const now = () => performance.now();

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";
let pauseHeld = false, shopDoneHeld = false, pendingBuy = null;

const curPhase = () => (snap ? snap.phase || snap.mode : "gather");

function currentInput() {
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (curPhase() === "quan") dy = -dy;                          // quan: lên (bắc) = z dương
  const o = { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"),
              pause: pauseHeld, shop_done: shopDoneHeld };
  if (pendingBuy) o.buy = pendingBuy;
  return o;
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
// Nút chỉ tác động ở cạnh lên: giữ true rồi nhả ngay.
function pulse(setter) { setter(true); pushInput(); setTimeout(() => { setter(false); pushInput(); }, 60); }
function togglePause() {
  ui.paused = !ui.paused; ui.pausedAt = now();
  pulse((v) => { pauseHeld = v; });
}
function buy(id) { pendingBuy = id; pushInput(); pendingBuy = null; pushInput(); }
function shopDone() { pulse((v) => { shopDoneHeld = v; }); }
function play() {
  fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); resetUi(); ui.screen = "play";
}
function toggleHc() { ui.hc = !ui.hc; try { localStorage.setItem("chonoi.hc", ui.hc ? "1" : "0"); } catch (e) { /* không lưu được */ } }
function toMenu() { ui.screen = "menu"; ui.paused = false; down.clear(); pushInput(); }
function quit() { ui.quitNote = true; try { window.close(); } catch (e) { /* không đóng được */ } }

function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (k === "c" && !e.repeat) { toggleHc(); return; }
  if (ui.screen === "menu") {
    if (!e.repeat && (k === "enter" || k === " ")) { e.preventDefault(); play(); }
    return;
  }
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (k === "escape" || k === "p") { e.preventDefault(); togglePause(); return; }
  if (ui.paused) { if (k === "m") toMenu(); return; }
  if (ui.intro) ui.intro = null;                       // nhấn phím để bỏ qua màn giới thiệu
  if (ui.result && k === "enter") { ui.result = null; return; }
  if (curPhase() === "shop") {
    if (k === "1") buy("oxygen"); else if (k === "2") buy("hp"); else if (k === "enter") shopDone();
    return;
  }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { play(); return; }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });
let hits = [];
cv.addEventListener("click", (e) => {
  for (let i = hits.length - 1; i >= 0; i--) {
    const b = hits[i];
    if (e.clientX >= b.x && e.clientX <= b.x + b.w && e.clientY >= b.y && e.clientY <= b.y + b.h) { b.fn(); return; }
  }
});

// ---------- ra: poll snapshot + gom sự kiện ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    try { ingest(); } catch (e) { /* giao diện không được làm vỡ vòng poll */ }
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

const TOAST_MSG = { funds: "Không đủ tiền", max_level: "Đã tối đa cấp", out_of_stock: "Hết hàng", unknown: "Không có mặt hàng này" };
function ingest() {
  if (ui.screen !== "play") return;
  if (ui.earnedStart === null && snap.mode !== undefined) ui.earnedStart = snap.earned || 0;
  for (const e of snap.events || []) {
    const key = (e.day || 0) + "|" + e.tick + "|" + e.name + "|" + JSON.stringify(e.data);
    if (ui.seen.has(key)) continue;
    ui.seen.add(key);
    const d = e.data || {};
    switch (e.name) {
      case "day_start": ui.stats = newStats(); ui.result = null; ui.intro = { kind: "day", until: now() + 4000 }; break;
      case "day_plan": ui.plan = d; break;
      case "phase_start":
        if (e.phase === "quan") { ui.intro = { kind: "evening", until: now() + 4000 }; ui.repStart = snap.reputation; ui.earnedStart = snap.earned || 0; ui.stats = newStats(); }
        break;
      case "served": ui.stats.served++; ui.totalSold[d.dish_id] = (ui.totalSold[d.dish_id] || 0) + 1; break;
      case "customer_left": if (d.reason === "patience") ui.stats.left++; break;
      case "paid": ui.stats.tips += d.tip || 0; ui.stats.income += d.amount || 0; break;
      case "quan_end": ui.result = { repDelta: (snap.reputation ?? 0) - (ui.repStart ?? snap.reputation ?? 0) }; break;
      case "bought": ui.toast = { text: "Đã mua " + (d.upgrade === "oxygen" ? "bình oxy" : d.upgrade === "hp" ? "áo phao" : d.upgrade) + " cấp " + d.level, until: now() + 2500, ok: true }; break;
      case "buy_failed": ui.toast = { text: TOAST_MSG[d.reason] || "Mua không được", until: now() + 2500, ok: false }; break;
      default: break;
    }
  }
}

// ---------- dữ liệu hiển thị ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
// Tên món và công thức chỉ để HUD dễ đọc (Phase2.md mục 1.3); luật thật nằm ở contract/sim.
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
                    canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng muối ớt", lau_mam: "Lẩu mắm miền Tây" };
const DISH_RECIPE = { ca_loc_nuong_trui: { ca_loc: 1 }, goi_bong_sung: { bong_sung: 2 }, lau_ca_linh_dien_dien: { ca_linh: 3, bong_dien_dien: 1 },
                      canh_chua_ca_loc: { ca_loc: 1, bong_dien_dien: 1 }, ca_keo_nuong: { ca_keo: 2 },
                      lau_mam: { ca_linh: 2, ca_keo: 1, keo_neo: 1, bong_dien_dien: 1 } };
const STOVE_LABEL = { idle: "rảnh", cooking: "đang nấu", ready: "món chín" };
const ORDER_LABEL = { reserved: "chờ nấu", assigned: "đang làm", unfulfillable: "thiếu món", served: "đã phục vụ" };
const SHOP_FALLBACK = { oxygen: [{ level: 1, price: 200, oxygen_max_s: 45 }, { level: 2, price: 400, oxygen_max_s: 60 }],
                        hp: [{ level: 1, price: 250, hp_max: 4 }, { level: 2, price: 500, hp_max: 5 }] };
const dishName = (id) => DISH_NAME[id] || id || "?";
const fmtItems = (m) => Object.keys(m).map((k) => (KIND_NAME[k] || k) + "×" + m[k]).join(", ");
// Kho cá thể (v1.2): mảng {id, kind, fresh}. Bản cũ: giỏ là mảng kind, kho là {kind: số lượng}. Cả hai đều dùng được.
const itemKind = (x) => (typeof x === "string" ? x : x && x.kind);
const itemFresh = (x) => (x && typeof x === "object" && typeof x.fresh === "number" ? x.fresh : null);
const spoiledBelow = () => (snap && snap.freshness && snap.freshness.spoiled_below) || SPOILED_BELOW;
const isSpoiled = (x) => itemFresh(x) !== null && itemFresh(x) < spoiledBelow();
function countsOf(x) {                          // mảng (kind hoặc cá thể) hoặc map -> {kind: số lượng}
  if (!x) return {};
  if (!Array.isArray(x)) return Object.assign({}, x);
  const c = {}; x.forEach((it) => { const k = itemKind(it); c[k] = (c[k] || 0) + 1; }); return c;
}
function freshSummary(items) {                  // {n, spoiled, avg, min} cho mảng cá thể; null nếu không có độ tươi
  const f = (items || []).filter((x) => itemFresh(x) !== null);
  if (!f.length) return null;
  const ok = f.filter((x) => !isSpoiled(x));
  return { n: f.length, spoiled: f.length - ok.length,
           avg: ok.length ? ok.reduce((a, x) => a + x.fresh, 0) / ok.length : 0, min: ok.length ? Math.min(...ok.map((x) => x.fresh)) : 0 };
}
const freshColor = (v) => (v < spoiledBelow() ? "#ef5350" : v < 60 ? "#ffca28" : "#66bb6a");
const shopCfg = () => (snap.meta && snap.meta.shop && snap.meta.shop.upgrades) || SHOP_FALLBACK;
function stockCounts(stock) {
  if (!Array.isArray(stock)) return Object.assign({}, stock || {});
  const counts = {};
  stock.forEach((item) => { counts[item.kind] = (counts[item.kind] || 0) + 1; });
  return counts;
}
function fmtFresh(items) {
  const threshold = snap.meta && snap.meta.freshness ? snap.meta.freshness.spoiled_below : 0;
  return (items || []).map((it) => {
    const stale = Number(it.fresh) < threshold;
    return (KIND_NAME[it.kind] || it.kind) + " " + Number(it.fresh).toFixed(1) + "%" + (stale ? " (ươn)" : "");
  }).join(" · ");
}
function availableStock() {
  let avail;
  if (Array.isArray(snap.stock)) {
    const held = new Set();
    (snap.customers || []).forEach((c) => {
      if (Array.isArray(c.reserved)) c.reserved.forEach((id) => held.add(id));
    });
    avail = stockCounts(snap.stock.filter((item) => !held.has(item.id) && !isSpoiled(item)));
  } else {
    avail = stockCounts(snap.stock);
    (snap.customers || []).forEach((c) => {
      if (!Array.isArray(c.reserved)) Object.keys(c.reserved || {}).forEach((k) => { avail[k] = (avail[k] || 0) - c.reserved[k]; });
    });
  }
  Object.keys(avail).forEach((k) => { if (avail[k] <= 0) delete avail[k]; });
  return avail;
}
function curPlan() {
  if (ui.plan) return ui.plan;
  const p = snap.day_plan;
  if (Array.isArray(p)) return p.find((x) => x.day === snap.day) || null;
  return p || null;
}
function countHold() { const c = {}; (snap.hold || []).forEach((item) => { const k = item.kind || item; c[k] = (c[k] || 0) + 1; }); return c; }

// ---------- vẽ: tiện ích ----------
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  if (o.world && !DEBUG) return;                    // nhãn id trong thế giới chỉ hiện khi ?debug
  ctx.font = Math.max(o.size || 14, MIN_FONT) + "px system-ui, sans-serif";
  ctx.fillStyle = ui.hc ? (o.hcColor || "#ffffff") : (o.color || "#e8eef2");
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function pill(s, x, y, o = {}) {                 // chữ có nền tối bo góc, đọc được trên mọi nền
  const size = Math.max(o.size || 18, MIN_FONT);
  ctx.font = size + "px system-ui, sans-serif";
  const tw = ctx.measureText(s).width, pad = 8;
  const left = (o.align === "center") ? x - tw / 2 : (o.align === "right") ? x - tw : x;
  if (ui.hc) {
    ctx.fillStyle = "#000"; ctx.fillRect(left - pad, y - size, tw + pad * 2, size + 10);
    ctx.strokeStyle = o.hcBorder || "#ffeb3b"; ctx.lineWidth = 3; ctx.strokeRect(left - pad, y - size, tw + pad * 2, size + 10);
  } else { ctx.fillStyle = "rgba(10,16,24,.78)"; ctx.fillRect(left - pad, y - size, tw + pad * 2, size + 10); }
  text(s, x, y, o);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = ui.hc ? "#fff" : "rgba(255,255,255,.5)"; ctx.lineWidth = ui.hc ? 3 : 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1); ctx.lineWidth = 1;
  if (label) text(label, x + w / 2, y + h - 4, { size: 18, align: "center" });
}
function button(x, y, w, h, label, fn, o = {}) {
  ctx.fillStyle = ui.hc ? (o.disabled ? "#333" : "#000") : (o.disabled ? "rgba(90,100,110,.6)" : "rgba(40,120,90,.9)"); ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = ui.hc ? "#ffeb3b" : "rgba(255,255,255,.7)"; ctx.lineWidth = ui.hc ? 4 : 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  text(label, x + w / 2, y + h / 2 + 7, { size: 20, align: "center", color: o.disabled ? "#aab" : "#fff" });
  if (fn && !o.disabled) hits.push({ x, y, w, h, fn });
}
function panel(w, h, pw, ph) {
  const x = (w - pw) / 2, y = (h - ph) / 2;
  ctx.fillStyle = "rgba(0,0,0,.62)"; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = ui.hc ? "#000" : "rgba(24,34,44,.96)"; ctx.fillRect(x, y, pw, ph);
  ctx.strokeStyle = ui.hc ? "#fff" : "rgba(255,255,255,.4)"; ctx.lineWidth = ui.hc ? 4 : 2; ctx.strokeRect(x, y, pw, ph);
  return [x, y];
}
function fmtTime(ticks) { const s = Math.ceil(ticks / 60); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
const timeColor = () => (snap.time_left_ticks <= 1800 ? (ui.hc ? "#ffff00" : "#ff8a80") : "#e8eef2");   // còn ≤ 30 s
function brief(d) { try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; } }
function eventLog(w, h) {
  if (!DEBUG) return;
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 100 - (ev.length - 1 - i) * 22, { size: 18, align: "right", color: "rgba(232,238,242,.75)" }));
}
const dist2 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
// Cảnh báo dễ nhận biết (Phase4.md): luôn có biểu tượng + chữ, không chỉ dựa vào màu. Tương phản cao: nền đen, viền vàng, nhấp nháy.
function drawAlerts(w, y0, list) {
  const blink = Math.floor(now() / 350) % 2 === 0;
  list.forEach((a, i) => {
    const hcBorder = ui.hc ? (blink ? "#ffeb3b" : "#ff1744") : undefined;
    pill(a.icon + " " + a.text, w / 2, y0 + i * 46, { size: 30, align: "center", color: a.color, hcColor: "#ffff00", hcBorder });
  });
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 106, bottom = 84;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  ctx.fillStyle = ui.hc ? "#000" : "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, ui.hc ? "#003a75" : "#49b0dc"); g.addColorStop(1, ui.hc ? "#00101f" : "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = ui.hc ? "#fff" : "#e9f7ff"; ctx.lineWidth = ui.hc ? 4 : 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)", world: true });
  }
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22", world: true });
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;

    const dishes = (plan && plan.dishes) || {};
    Object.keys(dishes).forEach((d, i) => text(`${dishName(d)} ×${dishes[d]}`, w / 2, y + 140 + i * 28, { size: 20, align: "center", color: "#e8eef2" }));
    if (plan && plan.ingredients) text("Cần lấy: " + fmtItems(plan.ingredients), w / 2, y + 140 + Math.max(1, Object.keys(dishes).length) * 28 + 24, { size: 18, align: "center", color: "#ffe082" });
  } else {
    text("Buổi tối", w / 2, y + 56, { size: 36, align: "center", color: "#ffe0a3" });
    const physicalStock = snap.stock;
    const stock = stockCounts(physicalStock);
    text("Nhập kho: " + (Object.keys(stock).length ? fmtItems(stock) : "(trống)"), w / 2, y + 110, { size: 22, align: "center" });
    if (Array.isArray(physicalStock) && physicalStock.length) {
      text("Độ tươi: " + fmtFresh(physicalStock), w / 2, y + 142, { size: 17, align: "center", color: "#ffe082" });
    }
    const available = availableStock();
    const pool = plan && plan.dishes ? Object.keys(plan.dishes) : Object.keys(DISH_RECIPE);
    const ok = pool.filter((d) => DISH_RECIPE[d] && recipeOk(DISH_RECIPE[d], available));
    text("Nấu được: " + (ok.length ? ok.map(dishName).join(", ") : "chưa món nào"), w / 2, y + 184, { size: 22, align: "center", color: ok.length ? "#a5d6a7" : "#ff8a80" });
  }
  text("Nhấn phím bất kỳ để tiếp tục", w / 2, y + 330, { size: 18, align: "center", color: "#9fb3c0" });
}
function drawResult(w, h) {
  const r = ui.result;
  if (!r || ui.screen !== "play") return;
  const st = ui.stats;
  const [x, y] = panel(w, h, 640, 380);
  text("Kết quả buổi tối", w / 2, y + 56, { size: 34, align: "center", color: "#ffe0a3" });
  const sign = r.repDelta >= 0 ? "+" : "";
  [`Khách đã phục vụ: ${st.served}`, `Khách bỏ đi: ${st.left}`, `Tiền thu: ${st.income}k (trong đó boa ${st.tips}k)`,
   `Uy tín: ${sign}${r.repDelta.toFixed(1)} (hiện ${(snap.reputation ?? 0).toFixed(1)})`].forEach((l, i) => text(l, w / 2, y + 120 + i * 40, { size: 22, align: "center" }));
  button(w / 2 - 100, y + 300, 200, 48, "Tiếp (Enter)", () => { ui.result = null; });
}
function drawSummary(w, h) {
  const [x, y] = panel(w, h, 680, 400);
  text("Tổng kết " + (snap.days_completed || snap.day || "") + " ngày", w / 2, y + 56, { size: 34, align: "center", color: "#ffe0a3" });
  const sold = ui.totalSold, best = Object.keys(sold).sort((a, b) => sold[b] - sold[a])[0];
  [`Tổng tiền thu: ${snap.earned ?? 0}k`, `Tổng điểm: ${snap.score ?? 0}`, `Uy tín: ${(snap.reputation ?? 0).toFixed(1)}`,
   `Món bán chạy: ${best ? dishName(best) + " ×" + sold[best] : "(chưa có)"}`].forEach((l, i) => text(l, w / 2, y + 120 + i * 42, { size: 24, align: "center" }));
  button(w / 2 - 110, y + 320, 220, 50, "Về menu", toMenu);
}
function drawPause(w, h) {
  const [x, y] = panel(w, h, 460, 340);
  text("Tạm dừng", w / 2, y + 64, { size: 36, align: "center", color: "#ffe0a3" });
  button(w / 2 - 110, y + 110, 220, 52, "Tiếp tục (Esc)", togglePause);
  button(w / 2 - 110, y + 180, 220, 52, "Về menu (M)", toMenu);
  button(w / 2 - 150, y + 240, 300, 44, "Tương phản cao: " + (ui.hc ? "BẬT" : "tắt") + " (C)", toggleHc);
  // backend chưa hỗ trợ pause thì mô phỏng vẫn chạy: báo thật cho người chơi
  if (snap.state !== "paused" && now() - ui.pausedAt > 600) text("(máy chủ chưa hỗ trợ tạm dừng: trò chơi vẫn chạy nền)", w / 2, y + 308, { size: 18, align: "center", color: "#ffcc80" });
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 130, { align: "center", color: "#ff8a80", size: 20 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 156, { align: "center", color: "#ff8a80", size: 20 });
  if (snap.finished) {
    if (snap.reason === "days_complete") drawSummary(w, h);
    else {
      ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 230, h / 2 - 60, 460, 120);
      text("Buổi " + (curPhase() === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 10, { align: "center", size: 24 });
      text("Nhấn R để chơi lại", w / 2, h / 2 + 30, { align: "center", color: "#cfd8dc", size: 20 });
    }
    return;
  }
  if (ui.result) drawResult(w, h); else drawIntro(w, h);
  if (ui.paused || snap.state === "paused") drawPause(w, h);
}

// Benchmark: sau khi cảnh đầu tiên vẽ xong, làm nóng rồi ghi thời gian từng khung hình, gửi về máy chủ khi đủ thời lượng.
const bench = BENCH ? { warm: parseFloat(BENCH[1]) * 1000, dur: parseFloat(BENCH[2]) * 1000, t0: null, last: null, mstart: null, d: [], done: false } : null;
function benchTick(ts) {
  if (bench.done || !snap) return;
  if (bench.t0 === null) { bench.t0 = ts; bench.last = ts; fetch("/bench/start", { method: "POST" }); return; }
  if (ts - bench.t0 < bench.warm) { bench.last = ts; return; }
  if (bench.mstart === null) bench.mstart = bench.last;       // khoảng đo bắt đầu từ khung ngay trước khung đầu tiên sau làm nóng
  bench.d.push(ts - bench.last); bench.last = ts;
  if (ts - bench.mstart >= bench.dur) {
    bench.done = true;
    fetch("/bench/result", { method: "POST", body: JSON.stringify({ durations_ms: bench.d }), headers: { "Content-Type": "application/json" } });
  }
}
function frame(ts) {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  if (bench) benchTick(ts);
  const [w, h] = fit();
  hits = [];
  ctx.fillStyle = ui.hc ? "#000" : "#10161c"; ctx.fillRect(0, 0, w, h);
  if (ui.screen === "menu") { drawMenu(w, h); return; }
  if (snap) {
    const ph = curPhase();
    if (ph === "quan") drawQuan(w, h); else if (ph === "shop") drawShop(w, h); else drawGather(w, h);
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 20 });
  }
}
requestAnimationFrame(frame);
</script>
