<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — Út Sen & Nhà Bè Má Tư</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0d151d;
    color: #f0f4f8;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  body.hc { background: #000 !important; color: #fff !important; }
  canvas { display: block; width: 100vw; height: 100vh; }

  .screen-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    background-size: cover;
    background-position: center;
  }
  .screen-overlay.active { display: flex; }

  /* UI #1: MAIN MENU */
  #menu-screen {
    background-color: #102536;
    background-image:
      linear-gradient(180deg, rgba(10, 22, 36, 0.38) 0%, rgba(10, 22, 36, 0.82) 100%),
      url("/assets/menu_bg.png");
  }
  .card {
    width: min(560px, 92vw);
    padding: 28px 30px;
    border-radius: 18px;
    background: rgba(11, 22, 34, 0.9);
    border: 2px solid rgba(250, 204, 21, 0.6);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(8px);
    text-align: center;
  }
  body.hc .card, body.hc .shop-card, body.hc .modal-card {
    background: #000 !important;
    border: 3px solid #fff !important;
    color: #fff !important;
  }
  .menu-title {
    margin: 0 0 6px;
    font-size: clamp(28px, 4.5vw, 40px);
    font-weight: 800;
    color: #fde047;
  }
  .menu-sub { margin: 0 0 20px; color: #cbd5e1; font-size: 15px; }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #f59e0b, #ea580c);
    color: #fff;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .btn-secondary {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(148, 163, 184, 0.4);
    background: rgba(30, 41, 59, 0.88);
    color: #f1f5f9;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-secondary:hover { border-color: #fde047; color: #fde047; }
  .controls-strip {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    font-size: 12px;
    color: #cbd5e1;
  }
  .kbd {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 5px;
    background: #1e293b;
    border: 1px solid #475569;
    color: #fde047;
    font-weight: 700;
  }

  /* INTRO TRANSITION SCREENS (DayIntro / EveningIntro) */
  #intro-screen {
    background: rgba(6, 14, 24, 0.86);
    z-index: 25;
  }
  .intro-list {
    margin: 14px 0 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .intro-chip {
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(250, 204, 21, 0.45);
    color: #fef08a;
    font-weight: 700;
    font-size: 13px;
  }

  /* UI #4: DAY RESULT + SHOP */
  #shop-screen {
    background-color: #091521;
    background-image:
      linear-gradient(180deg, rgba(8, 18, 30, 0.52) 0%, rgba(8, 18, 30, 0.88) 100%),
      url("/assets/shop_bg.png");
  }
  .shop-card {
    width: min(740px, 94vw);
    padding: 24px 26px;
    border-radius: 16px;
    background: rgba(11, 22, 34, 0.93);
    border: 2px solid rgba(250, 204, 21, 0.55);
  }
  .shop-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.22);
  }
  .shop-title { margin: 0; font-size: 22px; font-weight: 800; color: #fde047; }
  .shop-stats { display: flex; gap: 14px; font-size: 15px; font-weight: 800; }
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    margin: 16px 0;
  }
  .upgrade-card {
    padding: 16px;
    border-radius: 12px;
    background: rgba(30, 41, 59, 0.88);
    border: 1px solid rgba(148, 163, 184, 0.3);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .upgrade-card h3 { margin: 0; font-size: 16px; color: #f8fafc; }
  .upgrade-next { font-size: 14px; color: #7dd3fc; font-weight: 700; }
  .btn-buy {
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    background: #16a34a;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-buy:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
  .shop-footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid rgba(148, 163, 184, 0.22);
  }

  /* QUICK HUD CONTROLS */
  #hud-quick-bar {
    position: fixed;
    top: 14px;
    right: 18px;
    display: none;
    gap: 6px;
    z-index: 15;
  }
  #hud-quick-bar.active { display: flex; }
  .hud-mini-btn {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(148, 163, 184, 0.4);
    background: rgba(15, 23, 42, 0.9);
    color: #e2e8f0;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .hud-mini-btn:hover, .hud-mini-btn.on { border-color: #fde047; color: #fde047; }

  /* PAUSE / SUMMARY MODAL */
  #modal-screen { background: rgba(5, 10, 18, 0.76); z-index: 30; }
  .modal-card {
    width: min(440px, 92vw);
    padding: 26px 28px;
    border-radius: 14px;
    background: rgba(11, 22, 34, 0.96);
    border: 2px solid rgba(56, 189, 248, 0.65);
    text-align: center;
  }
  .modal-card h2 { margin: 0 0 10px; color: #fde047; font-size: 22px; }
  .modal-card p { margin: 6px 0; color: #e2e8f0; font-size: 14px; }
  .modal-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }

  /* SFX SUBTITLES (Phase 4 Extension) */
  #sfx-caption {
    position: fixed;
    left: 50%;
    bottom: 72px;
    transform: translateX(-50%);
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.85);
    border: 1.5px solid #fde047;
    color: #fef08a;
    font-size: 14px;
    font-weight: 700;
    z-index: 26;
    display: none;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- QUICK HUD CONTROLS -->
<div id="hud-quick-bar">
  <button class="hud-mini-btn on" id="btn-hud-skip" title="Kết thúc ca sớm (F)">⏭ Xong ca [F]</button>
  <button class="hud-mini-btn" id="btn-hud-hc" title="Tương phản cao (H)">◐ [H]</button>
  <button class="hud-mini-btn on" id="btn-hud-cc" title="Phụ đề SFX (C)">CC</button>
  <button class="hud-mini-btn" id="btn-hud-pause" title="Tạm dừng (P / Esc)">⏸ [P]</button>
  <button class="hud-mini-btn" id="btn-hud-audio" title="Nhạc (M)">🔇</button>
  <button class="hud-mini-btn" id="btn-hud-menu" title="Menu">🏠</button>
</div>

<!-- SFX SUBTITLES -->
<div id="sfx-caption"></div>

<!-- UI #1: MAIN MENU -->
<div id="menu-screen" class="screen-overlay active">
  <div class="card">
    <h1 class="menu-title">QUÁN ĂN CHỢ NỔI</h1>
    <p class="menu-sub">Út Sen & Nhà Bè Má Tư · Sông Chín Khúc</p>
    <button class="btn-primary" id="btn-start-day">▶ BẮT ĐẦU CHƠI (5 NGÀY)</button>
    <div class="btn-row">
      <button class="btn-secondary" id="btn-start-gather">🤿 Lặn Sông</button>
      <button class="btn-secondary" id="btn-start-quan">🏮 Mở Quán (2 Bếp)</button>
    </div>
    <div class="btn-row">
      <button class="btn-secondary" id="btn-menu-hc">◐ Tương phản cao: Tắt</button>
      <button class="btn-secondary" id="btn-menu-cc">💬 Phụ đề SFX: Bật</button>
    </div>
    <div class="controls-strip">
      <span><span class="kbd">WASD</span> Bơi/Đi</span>
      <span><span class="kbd">E</span> Hái/Bến/Bếp/Bàn</span>
      <span><span class="kbd">Space</span> Bắt cá</span>
      <span><span class="kbd">F</span> Xong ca</span>
      <span><span class="kbd">P</span> Tạm dừng</span>
    </div>
  </div>
</div>

<!-- INTRO SCREEN (DayIntro / EveningIntro — auto 4s or click/key) -->
<div id="intro-screen" class="screen-overlay">
  <div class="card">
    <h2 class="menu-title" id="intro-title" style="font-size:28px;">🌅 NGÀY 1 — LẶN & HÁI</h2>
    <p class="menu-sub" id="intro-sub"></p>
    <div class="intro-list" id="intro-chips"></div>
    <button class="btn-primary" id="btn-intro-go">▶ Tiếp tục</button>
  </div>
</div>

<!-- UI #4: DAY RESULT + SHOP -->
<div id="shop-screen" class="screen-overlay">
  <div class="shop-card">
    <div class="shop-header">
      <h2 class="shop-title" id="shop-title">🛒 CỬA HÀNG NÂNG CẤP</h2>
      <div class="shop-stats">
        <span style="color:#f8fafc" id="shop-timer">⏱ 0:10</span>
        <span style="color:#4ade80" id="shop-money">💰 0k</span>
        <span style="color:#facc15" id="shop-rep">★ 3.0</span>
        <span style="color:#7dd3fc" id="shop-score">🏆 0</span>
      </div>
    </div>
    <div class="shop-grid" id="shop-upgrades-grid"></div>
    <div class="shop-footer">
      <div style="display:flex; gap:8px;">
        <button class="btn-secondary" id="btn-shop-pause">⏸ [P]</button>
        <button class="btn-secondary" id="btn-shop-menu">🏠 Menu</button>
      </div>
      <button class="btn-primary" id="btn-shop-done" style="width:auto; padding:11px 22px; font-size:15px;">
        ✓ Sang Ngày Tiếp Theo [F / Enter]
      </button>
    </div>
  </div>
</div>

<!-- PAUSE / SUMMARY MODAL -->
<div id="modal-screen" class="screen-overlay">
  <div class="modal-card">
    <h2 id="modal-title">⏸ TẠM DỪNG</h2>
    <p id="modal-desc"></p>
    <p id="modal-stats" style="color:#7dd3fc; font-weight:800; font-size:16px;"></p>
    <div class="modal-actions">
      <button class="btn-primary" id="btn-modal-resume">▶ Tiếp tục [P]</button>
      <button class="btn-secondary" id="btn-modal-hc">◐ Chế độ tương phản cao [H]</button>
      <button class="btn-secondary" id="btn-modal-restart">↻ Chơi lại [R]</button>
      <button class="btn-secondary" id="btn-modal-menu">🏠 Menu chính</button>
    </div>
  </div>
</div>

<script>
"use strict";
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

const menuScreen = document.getElementById("menu-screen");
const introScreen = document.getElementById("intro-screen");
const shopScreen = document.getElementById("shop-screen");
const modalScreen = document.getElementById("modal-screen");
const hudQuickBar = document.getElementById("hud-quick-bar");
const sfxCaption = document.getElementById("sfx-caption");
const btnHudAudio = document.getElementById("btn-hud-audio");
const btnHudHc = document.getElementById("btn-hud-hc");
const btnHudCc = document.getElementById("btn-hud-cc");

let snap = null;
let offline = false;
let highContrast = false;
let sfxSubtitles = true;
let uiState = "menu"; // "menu" | "playing"
let lastShopRenderKey = "";
let toast = { text: "", until: 0, color: "#4ade80" };
let sfxTimer = null;
let lastEventTickSeen = -1;

// Phase transition Intro state (DayIntro / EveningIntro)
let introUntil = 0;
let lastIntroKey = "";

// Camera mượt tập trung & phóng to theo Út Sen khi bơi (gather)
const cam = { x: 10, y: 2, zoom: 1.25, ready: false };
const bubbles = [];
const smokeParticles = [];
let smoothHeading = 0;
let lastQuanPos = [8, 5];
let quanWalkPhase = 0;
let quanFacing = 1;

// ---------- 1. ASSET LOADER (CHỈ DÙNG NỀN ĐÃ CÓ, NHÂN VẬT & THỰC THỂ VẼ ANIMATED SHAPES) ----------
const ASSET_MANIFEST = {
  images: {
    menuBg: "/assets/menu_bg.png",
    gatherBg: "/assets/gather_bg.png",
    quanBg: "/assets/quan_bg.png",
    shopBg: "/assets/shop_bg.png"
  },
  audio: {
    bgmGather: "/assets/bgm_gather.mp3",
    bgmQuan: "/assets/bgm_quan.mp3"
  }
};
const loadedImages = {};
const loadedAudio = {};
let audioMuted = true;
let activeBgmKey = null;

Object.entries(ASSET_MANIFEST.images).forEach(([k, url]) => {
  const img = new Image();
  img.onload = () => { loadedImages[k] = img; };
  img.onerror = () => { loadedImages[k] = null; };
  img.src = url;
});
Object.entries(ASSET_MANIFEST.audio).forEach(([k, url]) => {
  const aud = new Audio();
  aud.loop = true; aud.volume = 0.45; aud.preload = "none"; aud.src = url;
  aud.onerror = () => { loadedAudio[k] = null; };
  loadedAudio[k] = aud;
});

function syncBgm() {
  if (!snap || uiState === "menu") return;
  const phase = snap.phase || snap.mode;
  const wantKey = phase === "quan" || phase === "shop" ? "bgmQuan" : "bgmGather";
  if (audioMuted) {
    Object.values(loadedAudio).forEach((a) => { if (a && !a.paused) a.pause(); });
    return;
  }
  if (activeBgmKey && activeBgmKey !== wantKey && loadedAudio[activeBgmKey]) loadedAudio[activeBgmKey].pause();
  activeBgmKey = wantKey;
  const aud = loadedAudio[wantKey];
  if (aud && aud.paused) aud.play().catch(() => {});
}

function toggleAudio() {
  audioMuted = !audioMuted;
  btnHudAudio.textContent = audioMuted ? "🔇" : "🔊";
  syncBgm();
}

function toggleHighContrast() {
  highContrast = !highContrast;
  document.body.classList.toggle("hc", highContrast);
  btnHudHc.classList.toggle("on", highContrast);
  document.getElementById("btn-menu-hc").textContent = `◐ Tương phản cao: ${highContrast ? "Bật" : "Tắt"}`;
}

function toggleSfxSubtitles() {
  sfxSubtitles = !sfxSubtitles;
  btnHudCc.classList.toggle("on", sfxSubtitles);
  document.getElementById("btn-menu-cc").textContent = `💬 Phụ đề SFX: ${sfxSubtitles ? "Bật" : "Tắt"}`;
  if (!sfxSubtitles) sfxCaption.style.display = "none";
}

function showSfx(caption) {
  if (!sfxSubtitles) return;
  sfxCaption.textContent = `[SFX] ${caption}`;
  sfxCaption.style.display = "block";
  clearTimeout(sfxTimer);
  sfxTimer = setTimeout(() => { sfxCaption.style.display = "none"; }, 1800);
}

function showToast(msg, color = "#4ade80", ms = 1600) {
  toast = { text: msg, until: performance.now() + ms, color };
}

// ---------- 2. DUAL-SCHEMA ADAPTER (V1.0/V1.1 COUNTING + V1.2 FRESHNESS ITEMS) ----------
function normalizeHold(rawHold) {
  if (!Array.isArray(rawHold)) return [];
  return rawHold.map((item, idx) => {
    if (typeof item === "string") return { id: `#${idx + 1}`, kind: item, fresh: null };
    return { id: item.id || `#${idx + 1}`, kind: item.kind, fresh: item.fresh ?? null };
  });
}

function normalizeStock(rawStock, customers) {
  // Trả về map {kind: {total, reserved, available, minFresh, spoiledCount}}
  const resIds = new Set();
  const resCounts = {};
  (customers || []).forEach((c) => {
    if (Array.isArray(c.reserved)) {
      c.reserved.forEach((id) => resIds.add(id));
    } else if (c.reserved && typeof c.reserved === "object") {
      Object.entries(c.reserved).forEach(([k, q]) => { resCounts[k] = (resCounts[k] || 0) + q; });
    }
  });

  const out = {};
  const ensure = (k) => {
    if (!out[k]) out[k] = { total: 0, reserved: 0, available: 0, minFresh: null, spoiledCount: 0 };
    return out[k];
  };
  ["ca_loc", "ca_linh", "bong_dien_dien", "bong_sung"].forEach(ensure);

  if (Array.isArray(rawStock)) {
    // v1.2 individual items [{id, kind, fresh}]
    rawStock.forEach((it) => {
      const e = ensure(it.kind);
      e.total += 1;
      const isSpoiled = typeof it.fresh === "number" && it.fresh < 30;
      if (isSpoiled) {
        e.spoiledCount += 1;
      } else {
        if (resIds.has(it.id)) e.reserved += 1;
        else e.available += 1;
        if (typeof it.fresh === "number") {
          e.minFresh = e.minFresh === null ? it.fresh : Math.min(e.minFresh, it.fresh);
        }
      }
    });
  } else if (rawStock && typeof rawStock === "object") {
    // v1.0 / v1.1 count map {kind: qty}
    Object.entries(rawStock).forEach(([k, qty]) => {
      const e = ensure(k);
      e.total = qty || 0;
      e.reserved = resCounts[k] || 0;
      e.available = Math.max(0, e.total - e.reserved);
    });
  }
  return out;
}

// ---------- 3. ĐIỀU KHIỂN & API MÁY CHỦ ----------
const down = new Set();
const CODE_TO_MOVE = { KeyW: "u", ArrowUp: "u", KeyS: "d", ArrowDown: "d", KeyA: "l", ArrowLeft: "l", KeyD: "r", ArrowRight: "r" };
const KEY_TO_MOVE = { w: "u", "ư": "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", "ă": "l", "â": "l", arrowleft: "l", d: "r", "đ": "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function activePhase() { return snap ? (snap.phase || snap.mode || "gather") : "gather"; }

function currentInput(overrides = {}) {
  const phase = activePhase();
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (phase === "quan") dy = -dy;
  const payload = {
    move: [dx, dy],
    interact: overrides.interact !== undefined ? overrides.interact : down.has("interact"),
    catch: overrides.catch !== undefined ? overrides.catch : down.has("catch"),
    pause: overrides.pause !== undefined ? overrides.pause : false,
    shop_done: overrides.shop_done !== undefined ? overrides.shop_done : false
  };
  if (overrides.buy) payload.buy = overrides.buy;
  return payload;
}

function enqueuePayload(obj, force = false) {
  const s = JSON.stringify(obj);
  if (!force && s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
function pushInput() { enqueuePayload(currentInput()); }

async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) {}
  }
  inflight = false;
}

function triggerPulseButton(btnName) {
  enqueuePayload(currentInput({ [btnName]: false }), true);
  enqueuePayload(currentInput({ [btnName]: true }), true);
  enqueuePayload(currentInput({ [btnName]: false }), true);
}
function sendBuyUpgrade(upgradeKey) { enqueuePayload(currentInput({ buy: upgradeKey }), true); }

async function skipCurrentPhase() {
  try {
    await fetch("/skip_phase", { method: "POST" });
    showToast("⏭ Kết thúc ca sớm!", "#fde047", 1400);
  } catch (e) {}
}

function dismissIntro() {
  introUntil = 0;
  introScreen.classList.remove("active");
}

function maybeShowIntro() {
  if (!snap || uiState !== "playing" || snap.finished) return;
  const phase = activePhase();
  const key = `${snap.mode}:${snap.day || 1}:${phase}`;
  if (key === lastIntroKey) return;
  lastIntroKey = key;
  if (phase === "gather" && snap.mode === "day") {
    document.getElementById("intro-title").textContent = `🌅 NGÀY ${snap.day || 1} — BUỔI SÁNG`;
    document.getElementById("intro-sub").textContent = "Má Tư dặn tìm nguyên liệu cho thực đơn tối nay:";
    const chips = document.getElementById("intro-chips");
    chips.innerHTML = "";
    const ing = (snap.day_plan && snap.day_plan.ingredients) || {};
    const entries = Object.entries(ing);
    if (entries.length) {
      entries.forEach(([k, q]) => {
        const sp = document.createElement("span");
        sp.className = "intro-chip";
        sp.textContent = `${KIND_ICON[k] || "•"} ${kName(k)} ×${q}`;
        chips.appendChild(sp);
      });
    } else {
      chips.innerHTML = `<span class="intro-chip">🐟 Lặn bắt cá & hái bông</span>`;
    }
    introUntil = performance.now() + 4000;
    introScreen.classList.add("active");
  } else if (phase === "quan" && snap.mode === "day") {
    document.getElementById("intro-title").textContent = `🏮 NGÀY ${snap.day || 1} — MỞ QUÁN TỐI`;
    document.getElementById("intro-sub").textContent = "Nguyên liệu đã nhập kho Nhà Bè Má Tư:";
    const chips = document.getElementById("intro-chips");
    chips.innerHTML = "";
    const stMap = normalizeStock(snap.stock, snap.customers);

function resolveAction(e) {
  const code = e.code || "";
  if (CODE_TO_MOVE[code]) return { type: "move", dir: CODE_TO_MOVE[code] };
  if (code === "KeyE") return { type: "button", btn: "interact" };
  if (code === "Space") return { type: "button", btn: "catch" };
  if (code === "KeyF") return { type: "skip" };
  if (code === "KeyP" || code === "Escape") return { type: "pause" };
  if (code === "Enter") return { type: "enter" };
  if (code === "Digit1") return { type: "digit", idx: 0 };
  if (code === "Digit2") return { type: "digit", idx: 1 };
  if (code === "KeyR") return { type: "restart" };
  if (code === "KeyM") return { type: "mute" };
  if (code === "KeyH") return { type: "contrast" };
  if (code === "KeyC") return { type: "cc" };

  const k = (e.key || "").toLowerCase();
  if (KEY_TO_MOVE[k]) return { type: "move", dir: KEY_TO_MOVE[k] };
  if (k === "e" || k === "ê") return { type: "button", btn: "interact" };
  if (k === " ") return { type: "button", btn: "catch" };
  if (k === "f") return { type: "skip" };
  if (k === "p") return { type: "pause" };
  if (k === "r") return { type: "restart" };
  if (k === "m") return { type: "mute" };
  if (k === "h") return { type: "contrast" };
  if (k === "c") return { type: "cc" };
  return null;
}

addEventListener("keydown", (e) => {
  if (introUntil > 0 && performance.now() < introUntil) {
    dismissIntro();
    return;
  }
  const act = resolveAction(e);
  if (!act) return;
  if (uiState === "menu") {
    if (act.type === "enter") startMode("day", { days: 5 });
    return;
  }
  if (act.type === "move" || act.type === "button" || act.type === "pause") e.preventDefault();
  if (e.repeat) return;

  const phase = activePhase();
  if (act.type === "pause") { if (snap && !snap.finished) triggerPulseButton("pause"); return; }
  if (act.type === "skip") { if (snap && !snap.finished) skipCurrentPhase(); return; }
  if (act.type === "contrast") { toggleHighContrast(); return; }
  if (act.type === "cc") { toggleSfxSubtitles(); return; }
  if (act.type === "mute") { toggleAudio(); return; }

  if (phase === "shop" && snap && !snap.finished && snap.state !== "paused") {
    if (act.type === "enter" || (act.type === "button" && act.btn === "interact")) { triggerPulseButton("shop_done"); return; }
    if (act.type === "digit") {
      const keys = Object.keys((snap.meta && snap.meta.shop && snap.meta.shop.upgrades) || {});
      if (keys[act.idx]) sendBuyUpgrade(keys[act.idx]);
      return;
    }
  }

  if (act.type === "move") {
    down.add(act.dir); pushInput();
  } else if (act.type === "button") {
    if (down.has(act.btn)) { down.delete(act.btn); enqueuePayload(currentInput({ [act.btn]: false }), true); }
    down.add(act.btn); enqueuePayload(currentInput({ [act.btn]: true }), true);
  } else if (act.type === "restart") {
    fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); cam.ready = false; lastIntroKey = "";
  }
});

addEventListener("keyup", (e) => {
  const act = resolveAction(e);
  if (!act) return;
  if (act.type === "move") { down.delete(act.dir); pushInput(); }
  else if (act.type === "button") { down.delete(act.btn); enqueuePayload(currentInput({ [act.btn]: false })); }
});

  if (!evs.length) return;

// ---------- 5. TIỆN ÍCH ID & MỤC TIÊU KHỚP SIM ----------
function idKey(idStr) {
  const s = String(idStr || "");
  let i = s.length;
  while (i > 0 && s.charCodeAt(i - 1) >= 48 && s.charCodeAt(i - 1) <= 57) i--;
  return { prefix: s.slice(0, i), num: i < s.length ? parseInt(s.slice(i), 10) : -1, raw: s };
}
function cmpIdKey(a, b) {
  const ka = idKey(a), kb = idKey(b);
  if (ka.prefix !== kb.prefix) return ka.prefix < kb.prefix ? -1 : 1;
  if (ka.num !== kb.num) return ka.num - kb.num;
  return ka.raw < kb.raw ? -1 : (ka.raw > kb.raw ? 1 : 0);
}

function findGatherInteractTarget(p, nodes, meta) {
  if (!p || !p.pos) return null;
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  if (Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= dr) return { kind: "dock" };
  const surfDepth = meta.surface_depth ?? 0.5;
  const atSurface = p.at_surface !== undefined ? p.at_surface : (p.pos[1] <= surfDepth);
  if (!atSurface) return null;
  const radius = meta.interact_radius || 2.0;
  const ready = [];
  (nodes || []).forEach((n) => {
    if (n.ready !== false && (n.regrow_ticks ?? 0) === 0) {
      const d = Math.hypot(p.pos[0] - n.pos[0], p.pos[1] - n.pos[1]);
      if (d <= radius) ready.push({ d, node: n });
    }
  });
  if (!ready.length) return null;
  ready.sort((a, b) => (a.d !== b.d ? a.d - b.d : cmpIdKey(a.node.id, b.node.id)));
  return { kind: "node", node: ready[0].node };
}

function findGatherCatchTarget(p, fishList, meta) {
  if (!p || !p.pos) return null;
  const surfDepth = meta.surface_depth ?? 0.5;
  const atSurface = p.at_surface !== undefined ? p.at_surface : (p.pos[1] <= surfDepth);
  if (atSurface) return null;
  const radius = meta.catch_radius || 2.0;
  const inRadius = [];
  (fishList || []).forEach((f) => {
    const d = Math.hypot(p.pos[0] - f.pos[0], p.pos[1] - f.pos[1]);
    if (d <= radius) inRadius.push({ d, fish: f });
  });
  if (!inRadius.length) return null;
  inRadius.sort((a, b) => (a.d !== b.d ? a.d - b.d : cmpIdKey(a.fish.id, b.fish.id)));
  return { kind: "fish", fish: inRadius[0].fish };
}

function findQuanInteractTarget(p, stoves, tables, meta) {
  if (!p || !p.pos) return null;
  const radius = meta.interact_radius || 1.5;
  const cands = [];
  (stoves || []).forEach((s) => {
    const d = Math.hypot(p.pos[0] - s.pos[0], p.pos[1] - s.pos[1]);
    if (d <= radius) cands.push({ d, prio: 0, id: s.id, kind: "stove", target: s });
  });
  (tables || []).forEach((tb) => {
    const d = Math.hypot(p.pos[0] - tb.pos[0], p.pos[1] - tb.pos[1]);
    if (d <= radius) cands.push({ d, prio: 1, id: tb.id, kind: "table", target: tb });
  });
  if (!cands.length) return null;
  cands.sort((a, b) => (a.d !== b.d ? a.d - b.d : (a.prio !== b.prio ? a.prio - b.prio : cmpIdKey(a.id, b.id))));
  return cands[0];
}

function findOldestReservedCustomer(customers) {
  const res = (customers || []).filter((c) => c.state === "waiting" && c.order_status === "reserved");
  if (!res.length) return null;
  res.sort((a, b) => ((a.order_tick ?? 0) !== (b.order_tick ?? 0) ? (a.order_tick ?? 0) - (b.order_tick ?? 0) : cmpIdKey(a.table_id, b.table_id)));
  return res[0];
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.weight ? o.weight + " " : "") + (o.size || 14) + "px system-ui, -apple-system, sans-serif";
  ctx.fillStyle = o.color || "#f0f4f8";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function roundRect(x, y, w, h, r = 8) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}
function panel(x, y, w, h, bg = "rgba(11, 22, 33, 0.88)", border = "rgba(255,255,255,0.22)", r = 10) {
  roundRect(x, y, w, h, r);
  ctx.fillStyle = highContrast ? "#000000" : bg;
  ctx.fill();
  if (border) { ctx.strokeStyle = highContrast ? "#ffffff" : border; ctx.lineWidth = highContrast ? 2.5 : 1; ctx.stroke(); }
}
function bar(x, y, w, h, frac, color, label, opts = {}) {
  const f = Math.max(0, Math.min(1, Number.isFinite(frac) ? frac : 0));
  roundRect(x, y, w, h, opts.radius ?? 5);
  ctx.fillStyle = highContrast ? "#000" : "rgba(0,0,0,0.58)";
  ctx.fill();
  if (f > 0) { roundRect(x, y, Math.max(4, w * f), h, opts.radius ?? 5); ctx.fillStyle = color; ctx.fill(); }
  if (opts.marker > 0 && opts.marker < 1) {
    const mx = x + w * opts.marker;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mx, y); ctx.lineTo(mx, y + h); ctx.stroke();
  }
  roundRect(x, y, w, h, opts.radius ?? 5);
  ctx.strokeStyle = highContrast ? "#fff" : "rgba(255,255,255,0.38)"; ctx.lineWidth = highContrast ? 2 : 1; ctx.stroke();
  if (label) text(label, x + w / 2, y + h / 2 + 4, { size: opts.fontSize || 12, weight: "700", align: "center", color: "#fff" });
}
function badge(x, y, label, bg, fg = "#fff", size = 13) {
  ctx.font = `800 ${size}px system-ui, sans-serif`;
  const tw = ctx.measureText(label).width + 18;
  const th = size + 10;
  roundRect(x - tw / 2, y, tw, th, th / 2);
  ctx.fillStyle = highContrast ? "#000" : bg;
  ctx.fill();
  ctx.strokeStyle = highContrast ? fg : "rgba(255,255,255,0.35)";
  ctx.lineWidth = highContrast ? 2 : 1;
  ctx.stroke();
  text(label, x, y + th - 6, { size, weight: "800", align: "center", color: fg });
}
function fmtTime(ticks) {
  const s = Math.max(0, Math.ceil((ticks ?? 0) / 60));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function freshColor(f) {
  if (f === null || f === undefined) return "#38bdf8";
  if (f < 30) return "#ef4444";
  if (f < 60) return "#f59e0b";
  return "#22c55e";
}

// ---------- 7. ANIMATED CANVAS SHAPES: ÚT SEN (THỢ LẶN & PHỤ BẾP), CÁ, BỤI, BẾP, QUÁI ----------
function drawUtSenDiver(px, py, r, headingDeg, speed, t) {
  // Chuyển hướng mượt theo headingDeg (không bị lộn ngược khi bơi sang trái!)
  let rad = (headingDeg * Math.PI) / 180;
  const facingLeft = Math.cos(rad) < 0;
  const pitch = facingLeft ? Math.atan2(Math.sin(rad), -Math.cos(rad)) : rad;
  const kick = Math.sin(t * (speed > 0.3 ? 0.018 : 0.006)) * (speed > 0.3 ? 0.45 : 0.12);

  ctx.save();
  ctx.translate(px, py);
  if (facingLeft) ctx.scale(-1, 1);
  ctx.rotate(pitch);

  // Chân vịt vẫy nhịp nhàng
  ctx.strokeStyle = "#0ea5e9";
  ctx.lineWidth = Math.max(3, r * 0.28);
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-r * 0.7, 0); ctx.lineTo(-r * 1.45, -r * 0.35 + kick * r); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r * 0.7, 0); ctx.lineTo(-r * 1.45, r * 0.35 - kick * r); ctx.stroke();

  // Giỏ lưới sau lưng
  ctx.fillStyle = "#ca8a04";
  ctx.beginPath(); ctx.ellipse(-r * 0.25, -r * 0.55, r * 0.45, r * 0.28, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#713f12"; ctx.lineWidth = 1.5; ctx.stroke();

  // Thân áo bà ba cam đất
  ctx.fillStyle = "#ea580c";
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.85, r * 0.48, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#fff7ed"; ctx.lineWidth = 1.5; ctx.stroke();

  // Tay quạt nước
  ctx.strokeStyle = "#fed7aa";
  ctx.lineWidth = Math.max(3, r * 0.24);
  ctx.beginPath(); ctx.moveTo(r * 0.2, r * 0.2); ctx.lineTo(r * 0.7, r * 0.55 - kick * r * 0.8); ctx.stroke();

  // Đầu & khăn rằn Nam Bộ
  ctx.fillStyle = "#fed7aa";
  ctx.beginPath(); ctx.arc(r * 0.85, -r * 0.05, r * 0.48, 0, Math.PI * 2); ctx.fill();
  // Tóc & khăn rằn
  ctx.fillStyle = "#1e293b";
  ctx.beginPath(); ctx.arc(r * 0.78, -r * 0.18, r * 0.46, Math.PI * 0.8, Math.PI * 2.1); ctx.fill();
  ctx.strokeStyle = "#f8fafc"; ctx.lineWidth = Math.max(1.5, r * 0.14); ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.arc(r * 0.78, -r * 0.18, r * 0.46, Math.PI * 1.0, Math.PI * 1.9); ctx.stroke();
  ctx.setLineDash([]);

  // Kính lặn xanh bóng
  ctx.fillStyle = "#38bdf8";
  ctx.beginPath(); ctx.ellipse(r * 1.15, -r * 0.02, r * 0.22, r * 0.28, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.restore();
}

function drawUtSenChef(px, py, r, t, opts = {}) {
  // Hoạt ảnh Út Sen phụ bếp: nhún chân khi đi, đảo chảo khi đứng cạnh bếp nấu, bưng khay nghi ngút khói khi cầm món
  const moving = !!opts.moving;
  const cookingNear = !!opts.cookingNear;
  const hasHand = !!opts.hasHand;
  const bob = moving ? Math.abs(Math.sin(t * 0.018)) * r * 0.28 : Math.sin(t * 0.005) * r * 0.08;
  const stir = cookingNear ? Math.sin(t * 0.025) * r * 0.35 : 0;

  ctx.save();
  ctx.translate(px, py - bob);

  // Bóng chân
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath(); ctx.ellipse(0, r * 0.95 + bob, r * 0.75, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();

  // Thân áo bà ba + tạp dề phụ bếp trắng
  ctx.fillStyle = "#ea580c";
  roundRect(-r * 0.62, -r * 0.15, r * 1.24, r * 1.05, r * 0.35);
  ctx.fill();
  ctx.fillStyle = "#f8fafc"; // tạp dề phụ bếp
  roundRect(-r * 0.42, r * 0.05, r * 0.84, r * 0.82, r * 0.18);
  ctx.fill();
  ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1.2; ctx.stroke();

  // Hai tay (đảo chảo nếu đang phụ bếp, hoặc giơ khay nếu đang bưng món)
  ctx.strokeStyle = "#fed7aa";
  ctx.lineWidth = Math.max(3, r * 0.25);
  ctx.lineCap = "round";
  if (hasHand) {
    ctx.beginPath(); ctx.moveTo(-r * 0.5, r * 0.15); ctx.lineTo(-r * 0.7, -r * 0.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r * 0.5, r * 0.15); ctx.lineTo(r * 0.7, -r * 0.35); ctx.stroke();
    // Khay bưng món + hơi nóng bốc lên
    ctx.fillStyle = "#78350f";
    roundRect(-r * 0.95, -r * 0.55, r * 1.9, r * 0.26, 4); ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(0, -r * 0.62, r * 0.36, Math.PI, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(-r * 0.55, r * 0.15); ctx.lineTo(-r * 0.85, r * 0.45 - stir * 0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r * 0.55, r * 0.15); ctx.lineTo(r * 0.95 + stir, r * 0.25); ctx.stroke();
    if (cookingNear) {
      // Vá/sạn đảo thức ăn khi đứng cạnh bếp đang nấu
      ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(r * 0.95 + stir, r * 0.25); ctx.lineTo(r * 1.45 + stir, -r * 0.1); ctx.stroke();
    }
  }

  // Đầu + khăn rằn buộc đầu phụ bếp
  ctx.fillStyle = "#fed7aa";
  ctx.beginPath(); ctx.arc(0, -r * 0.55, r * 0.54, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#1e293b";
  ctx.beginPath(); ctx.arc(0, -r * 0.65, r * 0.52, Math.PI, Math.PI * 2); ctx.fill();
  // Dải khăn rằn ngang trán
  ctx.strokeStyle = "#f8fafc"; ctx.lineWidth = Math.max(2, r * 0.16); ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.68); ctx.lineTo(r * 0.5, -r * 0.68); ctx.stroke();
  ctx.setLineDash([]);
  // Mắt cười
  ctx.fillStyle = "#0f172a";
  ctx.beginPath(); ctx.arc(-r * 0.18, -r * 0.52, r * 0.08, 0, Math.PI * 2); ctx.arc(r * 0.18, -r * 0.52, r * 0.08, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function drawAnimatedFish(fx, fy, s, f, t) {
  const rad = ((f.heading_deg || 0) * Math.PI) / 180;
  const facingLeft = Math.cos(rad) < 0;
  const pitch = facingLeft ? Math.atan2(Math.sin(rad), -Math.cos(rad)) : rad;
  const wag = Math.sin(t * 0.015 + (f.pos[0] || 0)) * 0.35;
  const isBig = f.kind === "ca_loc";
  const count = f.kind === "ca_linh" ? 3 : (f.kind === "ca_keo" ? 2 : 1);
  const offsets = count === 3 ? [[0, -0.32 * s], [0.42 * s, 0.16 * s], [-0.36 * s, 0.24 * s]]
                : count === 2 ? [[0.25 * s, -0.2 * s], [-0.25 * s, 0.2 * s]] : [[0, 0]];
  const sc = isBig ? 1.1 : (count === 3 ? 0.62 : 0.8);

  ctx.save();
  ctx.translate(fx, fy);
  if (facingLeft) ctx.scale(-1, 1);
  ctx.rotate(pitch * 0.6);

  offsets.forEach(([ox, oy], idx) => {
    const w = Math.sin(t * 0.016 + idx * 1.4) * 0.35 * s * sc;
    ctx.save();
    ctx.translate(ox, oy);
    // Đuôi vẫy
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath();
    ctx.moveTo(-0.75 * s * sc, 0);
    ctx.lineTo(-1.35 * s * sc, -0.45 * s * sc + w);
    ctx.lineTo(-1.35 * s * sc, 0.45 * s * sc + w);
    ctx.closePath();
    ctx.fill();
    // Thân cá
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.9 * s * sc, 0.46 * s * sc, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(15, 23, 42, 0.7)"; ctx.lineWidth = 1.2; ctx.stroke();
    // Mắt cá
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(0.48 * s * sc, -0.1 * s * sc, 0.14 * s * sc, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0f172a";
    ctx.beginPath(); ctx.arc(0.52 * s * sc, -0.1 * s * sc, 0.07 * s * sc, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
  ctx.restore();
}

function drawAnimatedBush(nx, ny, s, kind, ready, t) {
  const bob = Math.sin(t * 0.004 + nx * 0.05) * 0.12 * s;
  ctx.save();
  ctx.translate(nx, ny + bob);
  ctx.globalAlpha = ready ? 1 : 0.32;
  // Lá nổi
  ctx.fillStyle = "#15803d";
  ctx.beginPath(); ctx.ellipse(-0.45 * s, 0.12 * s, 0.65 * s, 0.28 * s, -0.15, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0.45 * s, 0.12 * s, 0.65 * s, 0.28 * s, 0.15, 0, Math.PI * 2); ctx.fill();
  // Bông hoa nở rung rinh
  const sway = Math.sin(t * 0.005 + nx) * 0.1 * s;
  ctx.fillStyle = kc(kind);
  for (let a = 0; a < 5; a++) {
    const ang = (a / 5) * Math.PI * 2 + t * 0.0005;
    ctx.beginPath();
    ctx.arc(sway + Math.cos(ang) * 0.34 * s, -0.35 * s + Math.sin(ang) * 0.22 * s, 0.28 * s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "#fef08a";
  ctx.beginPath(); ctx.arc(sway, -0.35 * s, 0.2 * s, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawAnimatedMonster(mx, my, s, m, t) {
  const isChase = m.state === "chase";
  const snapJaw = Math.abs(Math.sin(t * (isChase ? 0.02 : 0.007))) * 0.25;
  ctx.save();
  ctx.translate(mx, my);
  ctx.fillStyle = isChase ? "#dc2626" : (m.state === "recoil" ? "#9333ea" : "#3f6212");
  // Thân Cá Sấu / Rắn
  ctx.beginPath(); ctx.ellipse(0, 0, 1.55 * s, 0.58 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = isChase ? "#fde047" : "#1a2e05"; ctx.lineWidth = 2; ctx.stroke();
  // Hàm răng mở/đóng
  ctx.fillStyle = "#fef2f2";
  ctx.beginPath(); ctx.moveTo(1.2 * s, -0.1 * s); ctx.lineTo(1.85 * s, (-0.25 - snapJaw) * s); ctx.lineTo(1.85 * s, (0.25 + snapJaw) * s); ctx.closePath(); ctx.fill();
  // Mắt đỏ rực
  ctx.fillStyle = "#fef08a";
  ctx.beginPath(); ctx.arc(0.95 * s, -0.25 * s, 0.16 * s, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ============================================================================
// UI #2: RIVER — DIVING (CAMERA PHÓNG TO + CHUYỂN HƯỚNG + CÁ BƠI + ĐỘ TƯƠI)
// ============================================================================
function drawGather(w, h, now) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 7.0;
  const top = 62, bottom = 68;
  const viewH = Math.max(200, h - top - bottom);

  const p = snap.player;
  const surfDepth = meta.surface_depth ?? 0.5;
  const atSurface = p ? (p.at_surface !== undefined ? p.at_surface : p.pos[1] <= surfDepth) : true;
  const speed = p && p.vel ? Math.hypot(p.vel[0], p.vel[1]) : 0;

  // Hiệu ứng phóng to & bám mượt nhân vật khi đang bơi
  const baseScale = Math.max(12, Math.min(w / 46, viewH / 20));
  const targetZoom = !atSurface ? (speed > 0.3 ? 1.58 : 1.38) : (speed > 0.3 ? 1.28 : 1.15);
  if (!cam.ready && p && p.pos) { cam.x = p.pos[0]; cam.y = p.pos[1]; cam.zoom = targetZoom; cam.ready = true; }
  if (p && p.pos) { cam.x += (p.pos[0] - cam.x) * 0.12; cam.y += (p.pos[1] - cam.y) * 0.12; }
  cam.zoom += (targetZoom - cam.zoom) * 0.06;

  const s = baseScale * cam.zoom;
  const halfVisX = (w / 2) / s, halfVisY = (viewH / 2) / s;
  const cx = Math.max(Math.min(X / 2, halfVisX - 2), Math.min(Math.max(X / 2, X - halfVisX + 2), cam.x));
  const cy = Math.max(Math.min((D - SKY) / 2, -SKY + halfVisY), Math.min(Math.max((D - SKY) / 2, D - halfVisY + 1), cam.y));
  const sx = (x) => w / 2 + (x - cx) * s;
  const sy = (d) => top + viewH / 2 + (d - cy) * s;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, top, w, viewH); ctx.clip();

  const worldLeft = sx(-2), worldW = (X + 4) * s;
  const skyTop = sy(-SKY), waterLine = sy(0), waterBot = sy(D + 2);
  if (loadedImages.gatherBg) {
    const img = loadedImages.gatherBg;
    const horizonY = Math.round(img.height * 0.50);
    ctx.drawImage(img, 0, 0, img.width, horizonY, worldLeft, skyTop, worldW, Math.max(1, waterLine - skyTop));
    ctx.drawImage(img, 0, horizonY, img.width, img.height - horizonY, worldLeft, waterLine, worldW, Math.max(1, waterBot - waterLine));
  } else {
    ctx.fillStyle = "#f9c5b8"; ctx.fillRect(worldLeft, skyTop, worldW, waterLine - skyTop);
    ctx.fillStyle = "#13455c"; ctx.fillRect(worldLeft, waterLine, worldW, waterBot - waterLine);
  }

  // Sóng mặt nước chuyển động nhẹ
  ctx.strokeStyle = "rgba(224, 247, 250, 0.85)";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let x = 0; x <= X; x += 2) {
    const wy = waterLine + Math.sin(now * 0.004 + x * 0.4) * 2.5;
    if (x === 0) ctx.moveTo(sx(x), wy); else ctx.lineTo(sx(x), wy);
  }
  ctx.stroke();

  // Hiệu ứng dòng nước lũ (Phase 3 current)
  if (snap.current && snap.current.direction) {
    const dir = snap.current.direction;
    ctx.strokeStyle = "rgba(125, 211, 252, 0.45)";
    ctx.lineWidth = 2;
    for (let i = 0; i < 16; i++) {
      const lx = ((i * 7 + (now * 0.03 * dir)) % X + X) % X;
      const ld = 11 + (i % 6) * 3;
      ctx.beginPath(); ctx.moveTo(sx(lx), sy(ld)); ctx.lineTo(sx(lx + dir * 2.5), sy(ld)); ctx.stroke();
    }
  }

  const holdItems = normalizeHold(snap.hold);
  const cap = snap.hold_capacity || meta.hold_capacity || 12;
  const freeSpace = Math.max(0, cap - holdItems.length);
  const interactTarget = findGatherInteractTarget(p, snap.nodes, meta);
  const catchTarget = findGatherCatchTarget(p, snap.fish, meta);

  // Bến nhà sàn
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  const dockTargeted = interactTarget && interactTarget.kind === "dock";
  ctx.fillStyle = "#5c3d24";
  ctx.fillRect(sx(dp[0] - 1.2), sy(-0.4), 0.28 * s, 2.0 * s);
  ctx.fillRect(sx(dp[0] + 0.9), sy(-0.4), 0.28 * s, 2.0 * s);
  ctx.fillStyle = "#8d6e4b";
  ctx.fillRect(sx(dp[0] - 1.6), sy(-0.7), 3.2 * s, 0.7 * s);
  ctx.fillStyle = "#b45309";
  ctx.beginPath(); ctx.moveTo(sx(dp[0] - 2.0), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.5)); ctx.lineTo(sx(dp[0] + 2.0), sy(-0.7)); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = dockTargeted ? "#4ade80" : "rgba(253, 224, 71, 0.75)";
  ctx.lineWidth = dockTargeted ? 3 : 1.5;
  ctx.setLineDash(dockTargeted ? [] : [6, 5]);
  ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // Bụi bông (animated shapes)
  const regrowMax = (meta.regrow_s || 20) * 60;
  const nodeYield = meta.node_yield || 1;
  (snap.nodes || []).forEach((n) => {
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
    const ready = n.ready !== false && (n.regrow_ticks ?? 0) === 0;
    const isTarget = interactTarget && interactTarget.kind === "node" && interactTarget.node.id === n.id;
    if (isTarget) {
      ctx.strokeStyle = freeSpace >= nodeYield ? "#4ade80" : "#ef4444"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(nx, ny, 1.3 * s, 0, Math.PI * 2); ctx.stroke();
    }
    drawAnimatedBush(nx, ny, s, n.kind, ready, now);
    if (!ready && n.regrow_ticks > 0) bar(nx - 0.9 * s, ny + 0.55 * s, 1.8 * s, 7, 1 - n.regrow_ticks / regrowMax, "#84cc16");
    else if (isTarget) badge(nx, ny - 1.9 * s, freeSpace >= nodeYield ? "[E] Hái" : "Giỏ đầy", freeSpace >= nodeYield ? "#15803d" : "#991b1b");
  });

  // Đàn cá bơi (animated shapes)
  const fishYieldMap = meta.fish_yield || { ca_linh: 3, ca_loc: 1, ca_keo: 2 };
  (snap.fish || []).forEach((f) => {
    const fx = sx(f.pos[0]), fy = sy(f.pos[1]);
    const yld = fishYieldMap[f.kind] || 1;
    const isTarget = catchTarget && catchTarget.kind === "fish" && catchTarget.fish.id === f.id;
    if (isTarget) {
      const canCatch = ((p && p.catch_cd_ticks) || 0) === 0 && freeSpace >= yld;
      ctx.strokeStyle = canCatch ? "#38bdf8" : "#ef4444"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(fx, fy, 1.4 * s, 0, Math.PI * 2); ctx.stroke();
    }
    drawAnimatedFish(fx, fy, s, f, now);
    if (isTarget) {
      const cd = (p && p.catch_cd_ticks) || 0;
      badge(fx, fy - 1.7 * s, cd > 0 ? "⏳ Hồi" : (freeSpace < yld ? "Giỏ đầy" : `[Space] Bắt ×${yld}`), cd > 0 ? "#b45309" : (freeSpace < yld ? "#991b1b" : "#0284c7"));
    }
  });

  // Thủy quái (animated shapes)
  let monsterNear = false;
  (snap.monsters || []).forEach((m) => {
    if (p && p.pos && p.pos[1] >= 10 && Math.hypot(p.pos[0] - m.pos[0], p.pos[1] - m.pos[1]) <= 10) monsterNear = true;
    drawAnimatedMonster(sx(m.pos[0]), sy(m.pos[1]), s, m, now);
  });

  // Bọt khí bơi dưới nước
  if (p && p.pos && !atSurface && speed > 0.3 && Math.random() < 0.4) {
    bubbles.push({ x: p.pos[0], y: p.pos[1], r: 2 + Math.random() * 4, life: 1.0 });
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const bb = bubbles[i];
    bb.y -= 0.035; bb.life -= 0.025;
    if (bb.life <= 0) { bubbles.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(224, 247, 250, ${bb.life * 0.75})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sx(bb.x), sy(bb.y), bb.r, 0, Math.PI * 2); ctx.stroke();
  }

  // Út Sen thợ lặn (chuyển hướng mượt theo heading_deg)
  if (p && p.pos) {
    const targetH = p.heading_deg || 0;
    let diff = ((targetH - smoothHeading + 540) % 360) - 180;
    smoothHeading = (smoothHeading + diff * 0.25 + 360) % 360;
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (!atSurface && meta.catch_radius) {
      ctx.strokeStyle = "rgba(56, 189, 248, 0.35)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (!((p.invuln_ticks || 0) > 0 && Math.floor(snap.tick / 5) % 2)) {
      drawUtSenDiver(px, py, Math.max(10, 0.85 * s), smoothHeading, speed, now);
    }
    if (dockTargeted) badge(px, py - 2.0 * s, "[E] Cập bến", "#ca8a04");

    if (!atSurface && !highContrast) {
      const depthAlpha = Math.min(0.45, (p.pos[1] / D) * 0.52);
      const vg = ctx.createRadialGradient(px, py, 2.5 * s, px, py, Math.max(w, viewH) * 0.62);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, `rgba(2, 12, 24, ${depthAlpha})`);
      ctx.fillStyle = vg; ctx.fillRect(0, top, w, viewH);
    }
  }

  // Cảnh báo #1: Thủy quái gần (viền tím + chữ/biểu tượng)
  if (monsterNear) {
    ctx.strokeStyle = "#a855f7"; ctx.lineWidth = 8;
    ctx.strokeRect(4, top + 4, w - 8, viewH - 8);
    badge(w / 2, top + 12, "🐊 CẢNH BÁO: THỦY QUÁI!", "#7e22ce", "#fff", 15);
  }
  ctx.restore();

  // --- HUD TRÊN GỌN ---
  panel(10, 8, w - 20, 48, "rgba(11, 22, 33, 0.92)", "rgba(148, 163, 184, 0.25)", 10);
  const lowTime = (snap.time_left_ticks ?? 0) <= 30 * 60;
  let curX = 22;
  if (snap.day) { text(`N${snap.day}`, curX, 38, { size: 16, weight: "800", color: "#fde047" }); curX += 42; }
  text("⏱ " + fmtTime(snap.time_left_ticks), curX, 39, { size: 20, weight: "800", color: lowTime ? "#f87171" : "#f8fafc" });
  curX += 105;

  if (p) {
    const oxyMax = p.oxygen_max_ticks || ((meta.oxygen_max_s || 30) * 60);
    const oxy = p.oxygen_ticks ?? oxyMax;
    const oxyFrac = oxy / oxyMax;
    const oxyBlink = oxyFrac <= 0.25 && Math.floor(now / 250) % 2 === 0;
    bar(curX, 20, 170, 24, oxyFrac, oxyFrac <= 0.25 ? (oxyBlink ? "#ef4444" : "#f97316") : "#38bdf8", `Oxy ${Math.ceil(oxy / 60)}s`, { fontSize: 13 });
    // Cảnh báo #2: Oxy sắp hết / Hết hơi
    if (oxy === 0) badge(w / 2, top + 48, "⚠ HẾT HƠI! NỔI LÊN NGAY!", "#dc2626", "#fff", 15);
    else if (oxyFrac <= 0.25) badge(w / 2, top + 48, "⚠ OXY SẮP HẾT!", "#ea580c", "#fff", 14);
    curX += 186;

    const hpMax = p.hp_max || meta.hp_max || 3;
    const hp = p.hp ?? hpMax;
    let hearts = "";
    for (let i = 0; i < hpMax; i++) hearts += i < hp ? "♥ " : "♡ ";
    text(hearts.trim(), curX, 40, { size: 22, color: hp <= 1 ? "#ef4444" : "#fb7185" });
    curX += hpMax * 24 + 18;
    text(`🏆 ${snap.score ?? 0}`, curX, 39, { size: 17, weight: "800", color: "#fde047" });
  }

  if (toast.text && now < toast.until) badge(w / 2, top + 14, toast.text, "rgba(15, 23, 42, 0.92)", toast.color, 14);

  // --- HUD DƯỚI: GIỎ LIFO (HỖ TRỢ ĐỘ TƯƠI V1.2) + MINI-MAP ---
  const barY = h - bottom + 6;
  panel(10, barY, w - 20, bottom - 12, "rgba(11, 22, 33, 0.92)", "rgba(148, 163, 184, 0.25)", 10);
  text(`🧺 ${holdItems.length}/${cap}`, 22, barY + 34, { size: 16, weight: "800", color: holdItems.length >= cap ? "#f87171" : "#f8fafc" });

  const slotW = 36, slotH = 38;
  for (let i = 0; i < cap; i++) {
    const sx0 = 102 + i * (slotW + 5);
    const it = holdItems[i];
    roundRect(sx0, barY + 9, slotW, slotH, 6);
    const spoiled = it && typeof it.fresh === "number" && it.fresh < 30;
    ctx.fillStyle = it ? (spoiled ? "#7f1d1d" : kc(it.kind)) : "rgba(255,255,255,0.08)";
    ctx.fill();
    if (it) {
      text(spoiled ? "☠" : (KIND_ICON[it.kind] || "•"), sx0 + slotW / 2, barY + 30, { size: 16, align: "center" });
      if (typeof it.fresh === "number") {
        bar(sx0 + 3, barY + 39, slotW - 6, 5, it.fresh / 100, freshColor(it.fresh));
      }
    }
  }

  // Mini-map
  const mmW = 160, mmH = 40, mmX = w - mmW - 20, mmY = barY + 8;
  roundRect(mmX, mmY, mmW, mmH, 6);
  ctx.fillStyle = "rgba(8, 28, 42, 0.92)"; ctx.fill();
  ctx.strokeStyle = "rgba(148, 163, 184, 0.4)"; ctx.stroke();
  const mx = (x) => mmX + 4 + (x / X) * (mmW - 8);
  const my = (d) => mmY + 5 + (d / D) * (mmH - 10);
  ctx.fillStyle = "#fde047"; ctx.fillRect(mx(dp[0]) - 2, my(0) - 2, 4, 4);
  (snap.nodes || []).forEach((n) => { ctx.fillStyle = n.ready !== false ? "#84cc16" : "#475569"; ctx.fillRect(mx(n.pos[0]) - 1.5, my(0) - 1.5, 3, 3); });
  (snap.fish || []).forEach((f) => { ctx.fillStyle = "#38bdf8"; ctx.beginPath(); ctx.arc(mx(f.pos[0]), my(f.pos[1]), 2, 0, Math.PI * 2); ctx.fill(); });
  if (p && p.pos) { ctx.fillStyle = "#fb923c"; ctx.beginPath(); ctx.arc(mx(p.pos[0]), my(p.pos[1]), 3.5, 0, Math.PI * 2); ctx.fill(); }
}

// ============================================================================
// UI #3: RESTAURANT (NHIỀU BẾP + UI HIỂN THỊ ĐƠN RÕ RÀNG + ÚT SEN PHỤ BẾP)
// ============================================================================
function canCookRecipe(recipe, stockMap) {
  return Object.entries(recipe || {}).every(([k, q]) => ((stockMap[k] ? stockMap[k].available : 0) >= q));
}

function drawQuan(w, h, now) {
  const meta = snap.meta || {};
  const menuCat = getMenuCatalog();
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1];
  const top = 62, bottom = 60;
  const leftW = 225, rightW = 265;
  const centerW = Math.max(260, w - leftW - rightW - 36);
  const centerH = Math.max(200, h - top - bottom - 16);

  const s = Math.max(1, Math.min((centerW - 24) / X, (centerH - 24) / Z));
  const ox = leftW + 18 + (centerW - s * X) / 2;
  const oy = top + 8 + (centerH - s * Z) / 2;
  const sx = (x) => ox + x * s;
  const sy = (z) => oy + (Z - z) * s;

  ctx.fillStyle = highContrast ? "#000" : "#081c29";
  ctx.fillRect(0, top, w, h - top - bottom);

  if (loadedImages.quanBg && !highContrast) {
    ctx.drawImage(loadedImages.quanBg, sx(0) - 0.6 * s, sy(Z) - 0.6 * s, (X + 1.2) * s, (Z + 1.2) * s);
  } else {
    ctx.fillStyle = highContrast ? "#111" : "#b5854b";
    ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
    ctx.strokeStyle = highContrast ? "#fff" : "#5c3d24"; ctx.lineWidth = 4;
    ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  }

  // Đèn dây vàng lung linh theo nhịp
  if (!highContrast) {
    for (let x = 1; x < X; x += 2) {
      const glow = 0.25 + 0.15 * Math.sin(now * 0.004 + x);
      ctx.fillStyle = `rgba(253, 224, 71, ${glow})`;
      ctx.beginPath(); ctx.arc(sx(x), sy(Z) + 4, 0.4 * s, 0, Math.PI * 2); ctx.fill();
    }
  }

  const p = snap.player;
  const quanTarget = findQuanInteractTarget(p, snap.stoves, snap.tables, meta);
  const oldestReserved = findOldestReservedCustomer(snap.customers);
  let nearCookingStove = false;

  // Vẽ NHIỀU BẾP (B1, B2, ...) có hiệu ứng lửa & khói
  (snap.stoves || []).forEach((st) => {
    const bx = sx(st.pos[0]), by = sy(st.pos[1]);
    const stState = st.state || "idle";
    const dishObj = st.dish && typeof st.dish === "object" ? st.dish : null;
    const dishId = dishObj ? dishObj.dish_id : st.dish;
    const isSelected = quanTarget && quanTarget.kind === "stove" && quanTarget.id === st.id;
    if (stState === "cooking" && p && p.pos && Math.hypot(p.pos[0] - st.pos[0], p.pos[1] - st.pos[1]) <= 2.2) {
      nearCookingStove = true;
    }

    if (isSelected) {
      ctx.strokeStyle = "#fde047"; ctx.lineWidth = 3;
      roundRect(bx - 1.15 * s, by - 1.15 * s, 2.3 * s, 2.3 * s, 10); ctx.stroke();
    }
    roundRect(bx - 0.9 * s, by - 0.9 * s, 1.8 * s, 1.8 * s, 8);
    ctx.fillStyle = stState === "cooking" ? "#c2410c" : stState === "ready" ? "#15803d" : "#475569";
    ctx.fill();
    ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 2; ctx.stroke();

    // Hiệu ứng ngọn lửa bập bùng & khói bếp
    if (stState === "cooking") {
      const fl = 0.35 + Math.abs(Math.sin(now * 0.02 + bx)) * 0.2;
      ctx.fillStyle = "#fde047";
      ctx.beginPath(); ctx.arc(bx, by, fl * s, 0, Math.PI * 2); ctx.fill();
      if (Math.random() < 0.25) smokeParticles.push({ x: bx + (Math.random() - 0.5) * 14, y: by - 10, life: 1 });
    } else if (stState === "ready") {
      const pulse = 0.5 + 0.15 * Math.sin(now * 0.01);
      ctx.fillStyle = "#86efac";
      ctx.beginPath(); ctx.arc(bx, by, pulse * s, 0, Math.PI * 2); ctx.fill();
    }
    text(st.id, bx, by + 5, { size: 13, weight: "800", align: "center", color: "#fff" });

    if (stState === "cooking" && st.cook_ticks_left !== undefined) {
      const cookMax = ((menuCat[dishId] && menuCat[dishId].cook_s) || 6) * 60;
      bar(bx - 0.95 * s, by + 1.0 * s, 1.9 * s, 12, 1 - st.cook_ticks_left / Math.max(1, cookMax), "#f97316", `${(st.cook_ticks_left / 60).toFixed(1)}s`, { fontSize: 10 });
    } else if (stState === "ready") {
      badge(bx, by + 1.0 * s, "[E] Bưng", "#15803d", "#fff", 12);
    } else if (isSelected && oldestReserved) {
      badge(bx, by + 1.0 * s, `[E] Nấu ${oldestReserved.table_id}`, "#0284c7", "#fff", 12);
    }
  });

  // Cập nhật hạt khói bếp
  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    const sp = smokeParticles[i];
    sp.y -= 0.7; sp.life -= 0.025;
    if (sp.life <= 0) { smokeParticles.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(255,255,255,${sp.life * 0.45})`;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, 4 + (1 - sp.life) * 8, 0, Math.PI * 2); ctx.fill();
  }

  // Vẽ Bàn & Khách (animated)
  const patMax = (meta.patience_s || 60) * 60;
  const eatMax = (meta.eat_s || 10) * 60;
  const tipRatio = meta.tip_min_patience_ratio ?? 0.5;
  const byTable = {};
  let angryCustomer = false;
  (snap.customers || []).forEach((c) => {
    byTable[c.table_id] = c;
    if (c.state === "waiting" && (c.patience_ticks_left ?? patMax) / Math.max(1, patMax) < 0.25) angryCustomer = true;
  });

  (snap.tables || []).forEach((tb) => {
    const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
    const isSelected = quanTarget && quanTarget.kind === "table" && quanTarget.id === tb.id;
    if (isSelected) {
      ctx.strokeStyle = "#fde047"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(tx, ty, 1.25 * s, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = "#7c4a1e";
    ctx.beginPath(); ctx.arc(tx, ty, 0.9 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#451a03"; ctx.lineWidth = 2; ctx.stroke();
    text(tb.id, tx, ty + 5, { size: 13, weight: "800", align: "center", color: "#fef3c7" });

    const c = byTable[tb.id];
    if (c) {
      const isEating = c.state === "eating" || c.order_status === "served";
      const pFrac = (c.patience_ticks_left ?? patMax) / Math.max(1, patMax);
      const shake = !isEating && pFrac < 0.25 ? Math.sin(now * 0.04) * 3 : 0;
      const cx = tx + shake, cy = ty - 1.4 * s + (isEating ? Math.sin(now * 0.015) * 2 : 0);
      ctx.fillStyle = isEating ? "#22c55e" : (pFrac < 0.25 ? "#ef4444" : "#f472b6");
      ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
      badge(cx, cy - 1.45 * s, dShort(c.dish_id), "rgba(15, 23, 42, 0.92)", "#fde047", 11);

      if (isEating && c.eat_ticks_left !== undefined) {
        bar(tx - 1.0 * s, ty + 1.05 * s, 2.0 * s, 10, 1 - c.eat_ticks_left / Math.max(1, eatMax), "#22c55e");
      } else if (c.patience_ticks_left !== undefined) {
        bar(tx - 1.0 * s, ty + 1.05 * s, 2.0 * s, 10, pFrac, pFrac < 0.25 ? "#dc2626" : (pFrac >= tipRatio ? "#38bdf8" : "#f59e0b"), "", { marker: tipRatio });
      }
      if (isSelected && !isEating && snap.hand && snap.hand.order_id === c.id) {
        badge(tx, ty + 1.45 * s, "[E] Phục vụ", "#15803d", "#fff", 12);
      }
    }
  });

  // Cảnh báo #3: Khách sắp giận (kiên nhẫn < 25%)
  if (angryCustomer) {
    badge(w / 2, top + 12, "😠 CẢNH BÁO: KHÁCH SẮP GIẬN!", "#dc2626", "#fff", 14);
  }

  // Út Sen phụ bếp (hoạt ảnh đi bộ + đảo chảo khi cạnh bếp + bưng khay khi cầm món)
  if (p && p.pos) {
    const moved = Math.hypot(p.pos[0] - lastQuanPos[0], p.pos[1] - lastQuanPos[1]) > 0.005;
    lastQuanPos = [p.pos[0], p.pos[1]];
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    drawUtSenChef(px, py, Math.max(10, 0.72 * s), now, { moving: moved, cookingNear: nearCookingStove, hasHand: !!snap.hand });
    if (snap.hand) {
      const hDish = typeof snap.hand === "string" ? snap.hand : snap.hand.dish_id;
      badge(px, py - 1.6 * s, `🍲 ${dShort(hDish)}`, "#b45309", "#fef3c7", 12);
    }
  }

  // --- HUD TRÊN ---
  panel(10, 8, w - 20, 48, "rgba(11, 22, 33, 0.92)", "rgba(246, 201, 69, 0.3)", 10);
  const lowTime = (snap.time_left_ticks ?? 0) <= 30 * 60;
  let curX = 22;
  if (snap.day) { text(`N${snap.day}`, curX, 38, { size: 16, weight: "800", color: "#fde047" }); curX += 42; }
  text("⏱ " + fmtTime(snap.time_left_ticks), curX, 39, { size: 20, weight: "800", color: lowTime ? "#f87171" : "#f8fafc" });
  curX += 110;
  text(`💰 ${snap.money ?? 0}k`, curX, 39, { size: 19, weight: "800", color: "#4ade80" });
  curX += 110;
  const rep = snap.reputation ?? meta.reputation_initial ?? 3.0;
  text(`★ ${rep.toFixed(1)}`, curX, 39, { size: 18, weight: "800", color: "#facc15" });
  curX += 85;
  text(`🏆 ${snap.score ?? 0}`, curX, 39, { size: 18, weight: "800", color: "#7dd3fc" });

  if (toast.text && now < toast.until) badge(w / 2, top + 46, toast.text, "rgba(15, 23, 42, 0.92)", toast.color, 14);

  // --- PANEL TRÁI: KHO KHẢ DỤNG (+ ĐỘ TƯƠI V1.2) + MENU ---
  const stockMap = normalizeStock(snap.stock, snap.customers);
  panel(10, top + 6, leftW, centerH, "rgba(11, 22, 33, 0.9)", "rgba(148, 163, 184, 0.25)", 10);
  text("📦 KHO", 22, top + 28, { size: 14, weight: "800", color: "#38bdf8" });
  const kinds = Object.keys(stockMap);
  kinds.forEach((k, idx) => {
    const ky = top + 52 + idx * 28;
    const st = stockMap[k];
    text(`${KIND_ICON[k] || "•"} ${kName(k)}`, 22, ky, { size: 13, weight: "600" });
    const freshTag = st.minFresh !== null ? ` (${Math.round(st.minFresh)}%)` : "";
    const spoilTag = st.spoiledCount > 0 ? ` ☠${st.spoiledCount}` : "";
    text(`${st.available}${freshTag}${spoilTag}`, leftW - 6, ky, {
      size: 13, weight: "800", align: "right",
      color: st.spoiledCount > 0 ? "#f97316" : (st.available > 0 ? "#4ade80" : "#64748b")
    });
  });

  const menuY = top + 64 + kinds.length * 28;
  text("📜 MENU", 22, menuY, { size: 14, weight: "800", color: "#fde047" });
  Object.entries(menuCat).forEach(([id, d], idx) => {
    const dy = menuY + 24 + idx * 30;
    if (dy > top + centerH - 8) return;
    const ok = canCookRecipe(d.recipe, stockMap);
    text(d.name, 22, dy, { size: 12, weight: "700", color: ok ? "#f8fafc" : "#64748b" });
    text(`${d.price}k`, leftW - 6, dy, { size: 12, weight: "800", align: "right", color: ok ? "#4ade80" : "#ef4444" });
  });

  // --- PANEL PHẢI: UI HIỂN THỊ ĐƠN RÕ RÀNG (TỪNG BÀN + TRẠNG THÁI + KIÊN NHẪN) ---
  const rx = w - rightW - 10;
  panel(rx, top + 6, rightW, centerH, "rgba(11, 22, 33, 0.92)", "rgba(244, 114, 182, 0.35)", 10);
  const custs = snap.customers || [];
  text(`🧾 ĐƠN HÀNG (${custs.length})`, rx + 14, top + 28, { size: 15, weight: "800", color: "#f472b6" });

  if (!custs.length) {
    text("Chưa có đơn mới", rx + rightW / 2, top + 84, { size: 13, align: "center", color: "#64748b" });
  } else {
    custs.forEach((c, idx) => {
      const cy = top + 42 + idx * 78;
      if (cy + 70 > top + centerH) return;
      const isNext = oldestReserved && oldestReserved.id === c.id;
      roundRect(rx + 10, cy, rightW - 20, 70, 8);
      ctx.fillStyle = highContrast ? "#111" : "rgba(30, 41, 59, 0.92)";
      ctx.fill();
      ctx.strokeStyle = isNext ? "#38bdf8" : "rgba(255,255,255,0.18)";
      ctx.lineWidth = isNext ? 2 : 1;
      ctx.stroke();

      const ob = ORDER_BADGE[c.order_status] || ORDER_BADGE.reserved;
      text(`${c.table_id} · ${c.id}`, rx + 18, cy + 20, { size: 13, weight: "800", color: "#fff" });
      badge(rx + rightW - 56, cy + 5, ob.label, ob.bg, "#fff", 10);
      const price = c.base_price ?? (menuCat[c.dish_id]?.price || 0);
      text(`${dShort(c.dish_id)} (${price}k)`, rx + 18, cy + 38, { size: 13, weight: "700", color: "#fde047" });

      const isEating = c.state === "eating" || c.order_status === "served";
      if (isEating) {
        bar(rx + 18, cy + 46, rightW - 36, 16, 1 - (c.eat_ticks_left ?? 0) / Math.max(1, eatMax), "#22c55e", `Ăn ${Math.ceil((c.eat_ticks_left ?? 0) / 60)}s`, { fontSize: 11 });
      } else {
        const pLeft = c.patience_ticks_left ?? patMax;
        const pFrac = pLeft / Math.max(1, patMax);
        bar(rx + 18, cy + 46, rightW - 36, 16, pFrac, pFrac < 0.25 ? "#dc2626" : (pFrac >= tipRatio ? "#38bdf8" : "#f59e0b"), `${Math.ceil(pLeft / 60)}s${pFrac >= tipRatio ? " ★Boa" : ""}`, { marker: tipRatio, fontSize: 11 });
      }
    });
  }

  // --- HUD DƯỚI: TAY + TẤT CẢ BẾP (B1, B2...) ---
  const barY = h - bottom + 6;
  panel(10, barY, w - 20, bottom - 12, "rgba(11, 22, 33, 0.92)", "rgba(148, 163, 184, 0.25)", 10);
  const handTxt = snap.hand ? `🍲 ${dShort(typeof snap.hand === "string" ? snap.hand : snap.hand.dish_id)}` : "Trống";
  text(`🤲 Tay: ${handTxt}`, 24, barY + 30, { size: 15, weight: "800", color: snap.hand ? "#4ade80" : "#cbd5e1" });
  const stSummary = (snap.stoves || []).map((st) => {
    if (st.state === "cooking") return `🔥 ${st.id}: ${(st.cook_ticks_left / 60).toFixed(1)}s`;
    if (st.state === "ready") return `✓ ${st.id}: Chín!`;
    return `🔥 ${st.id}: Rỗi`;
  }).join("   |   ");
  text(stSummary, w - 24, barY + 30, { size: 15, weight: "800", align: "right", color: "#fde047" });
}

// ---------- 8. VÒNG LẶP RENDER CHÍNH ----------
function frame(now) {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = highContrast ? "#000" : "#0d151d";
  ctx.fillRect(0, 0, w, h);
  if (uiState === "menu") return;
  if (snap) {
    const phase = activePhase();
    if (phase === "quan") drawQuan(w, h, now);
    else if (phase === "gather") drawGather(w, h, now);
  }
}
requestAnimationFrame(frame);
</script>
</body>
