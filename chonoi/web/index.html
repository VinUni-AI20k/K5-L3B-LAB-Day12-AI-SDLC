<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const DISH_NAME = { ca_loc_nuong_trui: "cá lóc nướng trui", goi_bong_sung: "gỏi bông súng", lau_ca_linh_dien_dien: "lẩu cá linh điên điển" };
const dn = (d) => DISH_NAME[d] || d;
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  if (ticks === undefined || ticks === null) return "—";
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function dash(v) { return v === undefined || v === null ? "—" : v; }
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
const GATHER_HUD_EVENTS = new Set([
  "dive", "surface", "oxygen_empty", "choke", "faint", "hold_full", "gather_end",
  "gather", "fish_caught", "node_regrown",
]);
const QUAN_HUD_EVENTS = new Set([
  "customer_arrived", "customer_left", "cook_started", "dish_ready", "dish_picked",
  "served", "paid", "quan_end", "no_dish",
]);
const EVENT_VI = {
  dive: "Lặn xuống", surface: "Lên mặt nước", oxygen_empty: "Hết oxy", choke: "Ngạt (−1 Máu)", faint: "Ngất",
  hold_full: "Giỏ đầy", gather_end: "Kết thúc buổi sáng",
  gather: "Hái nút", fish_caught: "Bắt cá", node_regrown: "Nút mọc lại",
  customer_arrived: "Khách đến", customer_left: "Khách bỏ đi", cook_started: "Bắt nấu", dish_ready: "Món chín",
  dish_picked: "Nhặt món", served: "Phục vụ", paid: "Thanh toán + boa", quan_end: "Hết ca", no_dish: "Thiếu món",
};
function lastHudEvent(allowed) {
  const ev = (snap && snap.events) || [];
  for (let i = ev.length - 1; i >= 0; i--) if (allowed.has(ev[i].name)) return ev[i];
  return null;
}
function dishOf(obj) {
  if (!obj) return null;
  if (typeof obj === "string") return obj;
  return obj.dish_id || obj.dish || null;
}
function custDish(c) { return dishOf(c); }
function patienceLeft(c) {
  if (!c) return undefined;
  if (c.patience_ticks_left !== undefined) return c.patience_ticks_left;
  if (c.patience_ticks !== undefined) return c.patience_ticks;
  return undefined;
}
function patienceMax(c, meta) {
  if (c && c.patience_max_ticks !== undefined) return c.patience_max_ticks;
  return ((meta && meta.patience_s) || 60) * 60;
}
function hudEventLine(e) {
  if (!e) return "";
  let s = EVENT_VI[e.name] || e.name;
  const d = e.data || {};
  if (d.reason) s += " · " + d.reason;
  else if (d.dish || d.dish_id) s += " · " + dn(d.dish || d.dish_id);
  else if (d.kind) s += " · " + (KIND_NAME[d.kind] || d.kind) + (d.count ? "×" + d.count : "");
  else if (d.node_id) s += " · " + d.node_id;
  else if (d.fish_id) s += " · " + d.fish_id;
  else if (d.customer_id) s += " · " + d.customer_id;
  else if (d.stove_id) s += " · " + d.stove_id;
  return "t" + e.tick + " " + s;
}
function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(0,0,0,.52)"; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}
function repBar(x, y, w, h, rep, meta) {
  const lo = (meta && meta.reputation_min) ?? 0, hi = (meta && meta.reputation_max) ?? 5;
  const frac = rep === undefined || rep === null ? 0 : Math.max(0, Math.min(1, (rep - lo) / (hi - lo || 1)));
  bar(x, y, w, h, frac, "#ffd54f", rep === undefined || rep === null ? "Uy tín —" : "Uy tín " + Number(rep).toFixed(1) + "/" + hi);
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => {
    const line = hudEventLine(e) || (`t${e.tick} ${e.name} ${brief(e.data)}`);
    text(line, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" });
  });
}
function gatherTopItem() {
  if (!snap || !snap.hold || !snap.hold.length) return "—";
  const k = snap.hold[snap.hold.length - 1];
  return KIND_NAME[k] || k;
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 72, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến + vùng tương tác
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "rgba(255, 213, 79, 0.12)"; ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.85)"; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
  text("Bến (E) r=" + dr, sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái: sẵn (đậm + viền) / đang mọc (mờ + đếm ngược)
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false && !(n.regrow_ticks > 0);
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
    ctx.globalAlpha = ready ? 1 : 0.4;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(nx, ny - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (ready) {
      ctx.strokeStyle = "#fff59d"; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(nx, ny - 0.1 * s, 0.95 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1;
      text("sẵn", nx, ny + 1.0 * s, { size: 10, align: "center", color: "#fff59d" });
    } else {
      const left = n.regrow_ticks !== undefined ? Math.ceil(n.regrow_ticks / 60) + "s" : "—";
      text("mọc " + left, nx, ny + 1.1 * s, { size: 10, align: "center", color: "#ffcc80" });
    }
    text(n.id + " " + (KIND_NAME[n.kind] || n.kind || ""), nx, ny - 0.75 * s, { size: 10, align: "center", color: "#234" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(0, 0, 1.0 * s, 0.55 * s, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    text(f.id + " " + (KIND_NAME[f.kind] || f.kind || ""), sx(f.pos[0]), sy(f.pos[1]) - 0.75 * s, { size: 10, align: "center", color: "rgba(255,255,255,.85)" });
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
  // HUD trên (chỉ trường snapshot có sẵn)
  const cap = snap.hold_capacity;
  const chokeIv = meta.choke_interval_ticks || 60;
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 26, { size: 19 });
  const oxyS = p && p.oxygen_ticks !== undefined ? Math.ceil(p.oxygen_ticks / 60) + "s" : "—";
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(108, 10, 200, 16, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7");
    text("Oxy " + oxyS, 108, 24, { size: 11, color: low ? "#ffab91" : "#b3e5fc" });
  } else text("Oxy " + oxyS, 108, 24, { size: 12, color: "#78909c" });
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text("Máu " + hs, 322, 26, { size: 18, color: "#ff6b81" });
  } else text("Máu —", 322, 26, { size: 14, color: "#78909c" });
  let surf = "—", surfCol = "#cfd8dc";
  if (p && p.at_surface !== undefined) { surf = p.at_surface ? "Mặt nước" : "Dưới nước"; surfCol = p.at_surface ? "#a5d6a7" : "#81d4fa"; }
  text(surf, w - 120, 26, { size: 14, color: surfCol });
  // cảnh báo ngạt từ zero_oxy_ticks
  let chokeLine = "Ngạt: —", chokeCol = "#78909c";
  if (p && p.zero_oxy_ticks !== undefined) {
    if (p.oxygen_ticks === 0 && p.zero_oxy_ticks > 0) {
      const left = Math.max(0, chokeIv - p.zero_oxy_ticks);
      chokeLine = "⚠ Ngạt sau " + left + " tick (" + p.zero_oxy_ticks + "/" + chokeIv + ")";
      chokeCol = left <= 15 ? "#ff5252" : "#ffab40";
    } else if (p.oxygen_ticks === 0) {
      chokeLine = "⚠ Hết oxy · đếm ngạt 0/" + chokeIv;
      chokeCol = "#ffab40";
    } else {
      chokeLine = "Ngạt: ổn (0/" + chokeIv + ")";
      chokeCol = "#81c784";
    }
  }
  text(chokeLine, 430, 26, { size: 12, color: chokeCol });
  const gev = lastHudEvent(GATHER_HUD_EVENTS);
  const gline = hudEventLine(gev);
  text(gline || "Sự kiện: —", 14, 48, { size: 12, color: gline ? "#ffe082" : "#78909c" });
  const holdN = snap.hold ? snap.hold.length : 0;
  const holdCap = cap !== undefined ? holdN + "/" + cap : dash(holdN);
  text("Giỏ " + holdCap + " · trên cùng: " + gatherTopItem(), 300, 48, { size: 12, color: "#cfd8dc" });
  if (p && p.pos) text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`, 14, 64, { size: 11, color: "#9fb3c0" });
  // hồi chiêu bắt (catch_cd_ticks) — luôn hiện
  if (p && p.catch_cd_ticks !== undefined) {
    if (p.catch_cd_ticks > 0) {
      const cdMax = meta.catch_cooldown_s ? meta.catch_cooldown_s * 60 : Math.max(p.catch_cd_ticks, 30);
      bar(150, 52, 120, 10, 1 - p.catch_cd_ticks / cdMax, "#90caf9");
      text("Bắt CD " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 150, 64, { size: 11, color: "#90caf9" });
    } else text("Bắt: sẵn", 150, 64, { size: 11, color: "#a5d6a7" });
  } else text("Bắt CD: —", 150, 64, { size: 11, color: "#78909c" });
  // giỏ (khoang) dưới
  if (snap.hold && cap) {
    const sz = Math.min(30, (w - 260) / cap - 4), y0 = h - bottom + 8;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      if (snap.hold[i]) { ctx.fillStyle = kc(snap.hold[i]); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6); }
      if (i === snap.hold.length - 1) { ctx.strokeStyle = "#ffd54f"; ctx.lineWidth = 2; ctx.strokeRect(x0 + 1, y0 + 1, sz - 2, sz - 2); ctx.lineWidth = 1; }  // LIFO: món trên cùng
    }
    if (snap.hold.length >= cap) text("GIỎ ĐẦY", 14 + cap * (sz + 4) + 6, y0 + sz * 0.7, { size: 13, color: "#ffd54f" });
    const names = {}; snap.hold.forEach((k) => (names[k] = (names[k] || 0) + 1));
    text("Giỏ " + snap.hold.length + "/" + cap + "  " + Object.keys(names).map((k) => (KIND_NAME[k] || k) + "×" + names[k]).join(", "), 14, y0 + sz + 16, { size: 12, color: "#cfd8dc" });
  }
  text("WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 72, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp + đếm ngược nấu
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    const sx0 = sx(st.pos[0]), sy0 = sy(st.pos[1]);
    ctx.fillStyle = col; ctx.fillRect(sx0 - 0.8 * s, sy0 - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id + (st.state ? " · " + st.state : ""), sx0, sy0 + 4, { size: 11, align: "center", color: "#111" });
    const sd = dishOf(st);
    if (sd) text(dn(sd), sx0, sy0 - 0.95 * s, { size: 10, align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) {
      text("còn " + Math.ceil(st.cook_ticks_left / 60) + "s", sx0, sy0 + 1.25 * s, { size: 11, align: "center", color: "#2a1a0a" });
    } else if (st.state === "cooking") {
      text("nấu · —", sx0, sy0 + 1.25 * s, { size: 10, align: "center", color: "#2a1a0a" });
    } else if (st.state === "ready") text("sẵn sàng", sx0, sy0 + 1.25 * s, { size: 10, align: "center", color: "#1b5e20" });
  });
  // bàn + khách (đang ăn nổi bật)
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      const eating = c.state === "eating";
      ctx.fillStyle = eating ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      if (eating) { ctx.strokeStyle = "#c8e6c9"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 0.7 * s, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1; }
      const cd = custDish(c);
      text(cd ? dn(cd) : "?", cx, cy - 0.75 * s, { size: 10, align: "center", color: "#2a1a0a" });
      if (eating) text("đang ăn", cx, cy + 1.35 * s, { size: 10, align: "center", color: "#a5d6a7" });
      const pl = patienceLeft(c), pm = patienceMax(c, meta);
      if (pl !== undefined && pm > 0 && !eating) bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 5, pl / pm, "#e57373");
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    const handD = dishOf(snap.hand);
    if (handD) text("🍲 " + dn(handD), px, py - 0.8 * s, { size: 11, align: "center", color: "#2a1a0a" });
  }
  // HUD: tiền, shift_earned, uy tín, stock, khách, bếp
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 26, { size: 19 });
  const se = snap.shift_earned;
  text("Tiền " + dash(snap.money !== undefined && snap.money !== null ? snap.money + "k" : null) +
       " · Ca " + dash(se !== undefined && se !== null ? se + "k" : null), 108, 26, { size: 15 });
  repBar(320, 12, 160, 16, snap.reputation, meta);
  text("Điểm " + dash(snap.score), 490, 26, { size: 13, color: "#cfd8dc" });
  const qev = lastHudEvent(QUAN_HUD_EVENTS);
  const qline = hudEventLine(qev);
  text(qline || "Sự kiện: —", 14, 48, { size: 12, color: qline ? "#ffe082" : "#78909c" });
  const handLbl = dishOf(snap.hand);
  text("Đang bưng: " + (handLbl ? dn(handLbl) : "—"), w - 14, 48, { size: 12, align: "right", color: "#cfd8dc" });
  const stoves = snap.stoves || [];
  const cookL = stoves.filter((st) => st.state === "cooking").map((st) => {
    const d = dishOf(st);
    return (d ? dn(d) : "?") + (st.cook_ticks_left !== undefined ? " (" + Math.ceil(st.cook_ticks_left / 60) + "s)" : "");
  });
  const readyL = stoves.filter((st) => st.state === "ready").map((st) => dn(dishOf(st) || "?"));
  let stoveHud = "—";
  if (cookL.length) stoveHud = "Nấu: " + cookL.join(", ");
  else if (readyL.length) stoveHud = "Sẵn: " + readyL.join(", ");
  else if (stoves.length) stoveHud = "Bếp nhàn";
  text(stoveHud, 14, 64, { size: 12, color: "#cfd8dc" });
  let stockLine = "—";
  if (snap.stock && typeof snap.stock === "object") {
    const parts = Object.keys(snap.stock).map((k) => (KIND_NAME[k] || k) + "×" + snap.stock[k]);
    stockLine = parts.length ? parts.join(", ") : "(trống)";
  }
  text("Kho: " + stockLine, 280, 64, { size: 12, color: "#cfd8dc" });
  const customers = snap.customers || [];
  const tables = snap.tables || [];
  const pw = Math.min(240, w * 0.32), ph = Math.max(52, 28 + customers.length * 42);
  const tw = Math.min(200, w - pw - 30), th = Math.max(40, 24 + tables.length * 16);
  const panelY = h - bottom - Math.max(ph, th) - 22;
  panel(10, panelY, pw, ph);
  text("Khách", 18, panelY + 18, { size: 13, color: "#90caf9" });
  if (!customers.length) text("(chưa có)", 18, panelY + 36, { size: 12, color: "#9fb3c0" });
  customers.forEach((c, i) => {
    const y0 = panelY + 34 + i * 42;
    const stLabel = c.state === "eating" ? "đang ăn" : dash(c.state);
    text((c.id || "?") + " · " + dash(c.table_id) + " · " + stLabel, 18, y0, { size: 11, color: c.state === "eating" ? "#a5d6a7" : "#e8eef2" });
    const cd = custDish(c);
    text("Món: " + (cd ? dn(cd) : "—"), 18, y0 + 14, { size: 10, color: "#b0bec5" });
    const pl = patienceLeft(c), pm = patienceMax(c, meta);
    if (c.state === "eating") {
      const eatLeft = c.eat_ticks !== undefined ? Math.ceil(c.eat_ticks / 60) + "s" : "—";
      text("Ăn còn " + eatLeft, 18, y0 + 28, { size: 10, color: "#81c784" });
    } else if (pl !== undefined && pm > 0) bar(18, y0 + 20, pw - 16, 5, pl / pm, "#e57373", "");
    else text("Kiên nhẫn —", 18, y0 + 28, { size: 10, color: "#78909c" });
  });
  const byCust = {};
  customers.forEach((c) => { if (c.table_id) byCust[c.table_id] = c; });
  panel(pw + 18, panelY, tw, th);
  text("Bàn / giữ chỗ", pw + 26, panelY + 18, { size: 13, color: "#90caf9" });
  if (!tables.length) text("—", pw + 26, panelY + 36, { size: 12, color: "#9fb3c0" });
  tables.forEach((tb, i) => {
    const c = byCust[tb.id] || (tb.customer_id && customers.find((x) => x.id === tb.customer_id));
    let res = "—";
    if (c && c.reserved && typeof c.reserved === "object") {
      const parts = Object.keys(c.reserved).filter((k) => c.reserved[k] > 0).map((k) => (KIND_NAME[k] || k) + "×" + c.reserved[k]);
      if (parts.length) res = parts.join(", ");
    }
    const who = c ? c.id : dash(tb.customer_id);
    text(tb.id + ": " + who + " · giữ " + res, pw + 26, panelY + 36 + i * 16, { size: 10, color: "#cfd8dc" });
  });
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
