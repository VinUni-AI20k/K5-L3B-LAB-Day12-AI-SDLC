<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #f3ead8; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (module client/ui của DoctorX). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Không có luật chơi nào ở đây: mọi số (oxy, Máu, kho, kiên nhẫn, tiền...) lấy nguyên từ snapshot của sim,
 * nên client không thể làm lệch kết quả headless. Trường nào snapshot chưa có thì bỏ qua.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại · L = bật/tắt nhật ký sự kiện thô.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false, showLog = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  else if (k === "l") showLog = !showLog;
  else if (k === "m") { maOn = !maOn; maLine = null; }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- dữ liệu hiển thị ----------
const KINDS = ["ca_loc", "ca_linh", "bong_dien_dien", "bong_sung"];
const KIND_COLOR = { ca_loc: "#5e7a3c", ca_linh: "#d9e4ea", bong_dien_dien: "#f4c430", bong_sung: "#e8799c" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", bong_dien_dien: "bông điên điển", bong_sung: "bông súng" };
const KIND_SHORT = { ca_loc: "L", ca_linh: "Li", bong_dien_dien: "Đ", bong_sung: "S" };
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển" };
const STOVE_STATE = { idle: "trống", cooking: "đang nấu", ready: "chín, chờ bưng" };
const CUST_STATE = { waiting: "đang chờ", eating: "đang ăn" };
const ORDER_STATUS = { reserved: "đã giữ nguyên liệu", assigned: "đang làm", unfulfillable: "hết nguyên liệu", served: "đã dọn" };
const END_REASON = { docked: "cập bến", time: "hết giờ", fainted: "ngất xỉu", error: "lỗi luật" };

const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const kn = (k) => KIND_NAME[k] || k;
const dishId = (d) => (d == null ? null : typeof d === "string" ? d : d.dish_id);
const dishName = (d) => { const id = dishId(d); return id ? DISH_NAME[id] || id : "—"; };
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function idKey(id) { const m = /^(.*?)(\d+)$/.exec(id); return m ? [m[1], +m[2], id] : [id, -1, id]; }
function idCmp(a, b) {
  const x = idKey(a), y = idKey(b);
  for (let i = 0; i < 3; i++) { if (x[i] < y[i]) return -1; if (x[i] > y[i]) return 1; }
  return 0;
}
function secs(ticks) { return Math.ceil((ticks || 0) / 60); }
function fmtTime(ticks) { const s = secs(ticks); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function countItems(o) { return Object.keys(o || {}).filter((k) => o[k] > 0).map((k) => kn(k) + " ×" + o[k]).join(", "); }

// Kho khả dụng = tồn vật lý trừ phần khách đang giữ chỗ (PRD mục F, Quán).
function reservedTotals() {
  const r = {};
  (snap.customers || []).forEach((c) => {
    if (c.order_status && c.order_status !== "reserved") return;
    Object.entries(c.reserved || {}).forEach(([k, v]) => (r[k] = (r[k] || 0) + v));
  });
  return r;
}
function availableStock() {
  const st = snap.stock || {}, r = reservedTotals(), out = {};
  KINDS.forEach((k) => (out[k] = Math.max(0, (st[k] || 0) - (r[k] || 0))));
  return { avail: out, reserved: r };
}

// Nhãn tiếng Việt cho sự kiện (chỉ để đọc; tên/data gốc vẫn ở nhật ký thô, phím L).
function eventText(e) {
  const d = e.data || {};
  switch (e.name) {
    case "gather": return { t: `Hái ${kn(d.kind)} +${d.amount}`, c: "#c8f7a5" };
    case "node_regrown": return { t: `${d.node_id} đã mọc lại`, c: "#c8f7a5" };
    case "hold_full": return { t: `Giỏ đầy! Cần ${d.required} ô, còn ${d.free}`, c: "#ffcc80" };
    case "fish_caught": return { t: `Bắt được ${kn(d.kind)} ×${d.yield}`, c: "#c8f7a5" };
    case "dive": return { t: "Lặn xuống", c: "#b3e5fc" };
    case "surface": return { t: "Nổi lên thở", c: "#b3e5fc" };
    case "oxygen_empty": return { t: "Hết oxy! Nổi lên ngay!", c: "#ff8a80" };
    case "choke": return { t: `Ngạt nước! Còn ${d.hp} Máu`, c: "#ff8a80" };
    case "faint": return { t: `Út Sen ngất! Mất ${(d.lost || []).length} món trong giỏ`, c: "#ff8a80" };
    case "gather_end": return { t: `Buổi sáng kết thúc: ${END_REASON[d.reason] || d.reason}`, c: "#fff3c4" };
    case "customer_arrived": return { t: `Khách ở ${d.table_id} gọi ${dishName(d.dish_id)}`, c: "#fff3c4" };
    case "no_dish": return { t: "Có khách mà kho không đủ món nào", c: "#ffcc80" };
    case "cook_started": return { t: `${d.stove_id} bắt đầu nấu ${dishName(d.dish_id)}`, c: "#ffd59e" };
    case "dish_ready": return { t: `${dishName(d.dish_id)} đã chín!`, c: "#c8f7a5" };
    case "dish_picked": return { t: `Bưng ${dishName(d.dish_id)}`, c: "#ffd59e" };
    case "served": return { t: `Dọn ${dishName(d.dish_id)} cho ${d.table_id}` + (d.tip ? ` (boa ${d.tip}k)` : ""), c: "#c8f7a5" };
    case "paid": return { t: `Thu ${d.amount}k` + (d.tip ? ` (gồm boa ${d.tip}k)` : ""), c: "#fff59d" };
    case "customer_left": return d.reason === "patience" ? { t: `Khách ${d.table_id} bỏ về! Uy tín ${(+d.reputation).toFixed(1)}`, c: "#ff8a80" }
                                                         : { t: `Khách ${d.table_id} về (đóng quán)`, c: "#fff3c4" };
    case "quan_end": return { t: "Hết ca, dọn quán", c: "#fff3c4" };
    default: return { t: e.name, c: "#e0e0e0" };
  }
}

// ---------- MỞ RỘNG #1: Lời Má Tư (chỉ ở client, headless không có) ----------
// Má Tư nói giọng Nam Bộ theo sự kiện trong snapshot. Không gửi gì vào sim, không dùng RNG của sim:
// câu thoại chọn theo tick (tất định) nên không ảnh hưởng tick/sự kiện/tiền/uy tín. Phím M bật/tắt.
let maOn = true, maLine = null, maSeen = -1, maIntro = false, lastTick = -1;
const MA = {
  intro_gather: ["Út ơi, má đau lưng quá, bữa nay con lặn giùm má nghen. Hái bông điên điển, bông súng trên mặt sông, lặn xuống bắt cá linh, cá lóc. Coi chừng hết hơi nghen con!"],
  intro_quan: ["Tối rồi đó Út, đèn treo lên rồi, khách sắp tới. Nấu cho kịp, bưng cho lẹ, đừng để người ta chờ lâu nghen!"],
  dive: ["Lặn từ từ thôi con, nhớ để dành hơi."],
  oxygen_empty: ["Trời đất ơi, hết hơi rồi! Trồi lên lẹ đi con!", "Út! Lên thở cái đã, cá đâu có chạy mất!"],
  choke: ["Sặc nước rồi kìa! Lên mặt nước liền đi con!", "Má lo quá, lên thở đi Út ơi!"],
  faint: ["Thôi chết, con xỉu rồi! Giỏ trôi mất tiêu… không sao, con khỏe là má mừng."],
  hold_full: ["Giỏ đầy nhóc rồi, về bến cất đi con.", "Hết chỗ chứa rồi Út, đừng ham quá nghen."],
  gather_bong_dien_dien: ["Bông điên điển vàng ươm, đẹp quá trời!", "Điên điển này nấu lẩu cá linh là hết sẩy."],
  gather_bong_sung: ["Bông súng non, trộn gỏi là bắt cơm lắm nghen.", "Bông súng tươi rói, khách ưng lắm đó."],
  fish_ca_linh: ["Cá linh mùa nước nổi, béo mầm!", "Một bầy cá linh luôn, giỏi quá con!"],
  fish_ca_loc: ["Con cá lóc bự chà bá! Tối nướng trui thơm phức.", "Cá lóc đồng đó, khách mê lắm."],
  end_docked: ["Giỏi quá con gái má! Về nghỉ chút rồi tối mình mở quán."],
  end_time: ["Trưa trờ trưa trật rồi, về thôi con, đồ trong giỏ má cất cho."],
  end_fainted: ["Thôi bữa nay vậy được rồi, về má xức dầu cho."],
  customer_arrived: ["Có khách tới kìa Út, ra chào người ta đi con!", "Khách vô rồi, lẹ tay lên nghen."],
  no_dish: ["Kho hết đồ rồi, khách ngồi chơi uống nước trà vậy."],
  cook_started: ["Lửa vừa thôi nghen, đừng để khét."],
  dish_ready: ["Chín rồi đó, bưng ra cho nóng!", "Thơm lừng luôn, bưng lẹ đi con!"],
  served: ["Dọn món rồi, chúc khách ăn ngon miệng!"],
  paid: ["Tiền vô rồi! Cảm ơn khách nghen.", "Khách ăn xong trả tiền rồi, dọn bàn lẹ lên con."],
  served_tip: ["Khách khen ngon, còn boa thêm nữa nè!", "Được boa rồi, quán mình có tiếng rồi đó!"],
  customer_left: ["Trời, khách bỏ về rồi… lần sau mình làm lẹ tay hơn nghen."],
  quan_end_good: ["Dọn hàng thôi con. Bữa nay đắt hàng, má mừng quá!"],
  quan_end: ["Dọn hàng thôi con, mai mình làm tiếp."],
};
// độ ưu tiên khi nhiều sự kiện cùng lúc: chuyện gấp nói trước
const MA_PRIO = { faint: 9, gather_end: 8, quan_end: 8, choke: 7, oxygen_empty: 6, customer_left: 6, hold_full: 5,
                  dish_ready: 4, served: 4, paid: 4, customer_arrived: 4, no_dish: 3, fish_caught: 3, gather: 2, cook_started: 1, dive: 1 };
const pick = (key, n) => { const a = MA[key]; return a ? a[Math.abs(n) % a.length] : null; };
function maKey(e) {
  const d = e.data || {};
  switch (e.name) {
    case "gather": return "gather_" + d.kind;
    case "fish_caught": return "fish_" + d.kind;
    case "gather_end": return "end_" + d.reason;
    case "served": return d.tip > 0 ? "served_tip" : "served";
    case "customer_left": return d.reason === "patience" ? "customer_left" : null;
    case "quan_end": return (snap.earned || 0) > 0 ? "quan_end_good" : "quan_end";
    default: return e.name;
  }
}
function updateMa() {
  if (!snap || snap.tick === undefined) return;
  if (snap.tick < lastTick) { maSeen = -1; maLine = null; maIntro = false; }  // chơi lại
  lastTick = snap.tick;
  if (!maOn) return;
  if (!maIntro && snap.tick < 300) { maIntro = true; maLine = { t: pick("intro_" + snap.mode, 0), p: 5, until: snap.tick + 420 }; }  // chỉ chuyện gấp mới cắt lời mở đầu
  let best = null;
  (snap.events || []).forEach((e) => {
    if (e.tick <= maSeen) return;
    const key = maKey(e), p = MA_PRIO[e.name] || 0;
    if (key && MA[key] && (!best || p >= best.p)) best = { p, t: pick(key, e.tick), tick: e.tick };
  });
  (snap.events || []).forEach((e) => (maSeen = Math.max(maSeen, e.tick)));
  if (best && (!maLine || best.p >= (maLine.p || 0) || snap.tick > maLine.until)) maLine = { t: best.t, p: best.p, until: best.tick + 270 };
  if (maLine && snap.tick > maLine.until && !snap.finished) maLine = null;
}
function wrap(s, maxW, size) {
  ctx.font = size + "px system-ui, sans-serif";
  const out = []; let cur = "";
  s.split(" ").forEach((wd) => { const tr = cur ? cur + " " + wd : wd; if (ctx.measureText(tr).width > maxW && cur) { out.push(cur); cur = wd; } else cur = tr; });
  if (cur) out.push(cur);
  return out;
}
function drawMa(x, yBottom, maxW) {
  if (!maOn || !maLine || !maLine.t) return;
  const lines = wrap(maLine.t, maxW - 92, 14), bh = Math.max(64, 30 + lines.length * 19), y = yBottom - bh;
  rrect(x, y, maxW, bh, 12, "rgba(255,248,230,.96)");
  // chân dung Má Tư: tóc búi bạc, khăn rằn
  const cx = x + 38, cy = y + 36;
  circle(cx, cy + 2, 22, "#7b5a3c");
  circle(cx, cy - 2, 17, "#f0c79c");
  circle(cx, cy - 20, 9, "#cfcfcf");
  ctx.fillStyle = "#b71c1c"; ctx.fillRect(cx - 18, cy - 14, 36, 6);
  ctx.fillStyle = "#fff"; for (let i = 0; i < 6; i++) ctx.fillRect(cx - 16 + i * 6, cy - 14, 2, 6);
  ctx.fillStyle = "#3b2410"; ctx.fillRect(cx - 7, cy - 4, 3, 3); ctx.fillRect(cx + 4, cy - 4, 3, 3);
  ctx.strokeStyle = "#8d4b2a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy + 4, 6, .2, Math.PI - .2); ctx.stroke();
  text("Má Tư", x + 76, y + 22, { size: 13, bold: true, color: "#8d4b2a" });
  lines.forEach((ln, i) => text(ln, x + 76, y + 42 + i * 19, { size: 14, color: "#3b2410" }));
}

// ---------- vẽ: tiện ích ----------
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "600 " : "") + (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#f3ead8";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
  return ctx.measureText(s).width;
}
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function rrect(x, y, w, h, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();
}
function bar(x, y, w, h, frac, color, label) {
  rrect(x, y, w, h, h / 2, "rgba(0,0,0,.45)");
  const f = Math.max(0, Math.min(1, frac));
  if (f > 0) rrect(x, y, Math.max(h, w * f), h, h / 2, color);
  ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h / 2 + 1, { size: 11, align: "center", base: "middle", bold: true });
}
function hudBand(y, h) { ctx.fillStyle = "rgba(20,14,8,.78)"; ctx.fillRect(0, y, innerWidth, h); }
function prompt(p, w, y) {
  if (!p || snap.finished) return;  // hết buổi thì không gợi ý phím nữa
  ctx.font = "600 15px system-ui, sans-serif";
  const tw = ctx.measureText(p.t).width + 28;
  rrect(w / 2 - tw / 2, y - 15, tw, 30, 15, p.act ? "rgba(255,214,102,.95)" : p.warn ? "rgba(229,57,53,.9)" : "rgba(0,0,0,.6)");
  text(p.t, w / 2, y + 1, { size: 15, align: "center", base: "middle", bold: true, color: p.act ? "#3b2410" : "#fff" });
}
function toasts(w, y0) {
  const now = snap.tick || 0;
  const ev = (snap.events || []).filter((e) => now - e.tick <= 180).slice(-5);
  ev.forEach((e, i) => {
    const m = eventText(e), a = Math.min(1, (180 - (now - e.tick)) / 40);
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = "600 13px system-ui, sans-serif";
    const tw = ctx.measureText(m.t).width + 20, y = y0 + i * 26;
    rrect(w - tw - 12, y, tw, 22, 11, "rgba(0,0,0,.6)");
    text(m.t, w - 22, y + 15, { size: 13, align: "right", bold: true, color: m.c });
    ctx.globalAlpha = 1;
  });
}
function rawLog(w, h) {
  if (!showLog) return;
  const ev = (snap.events || []).slice(-12);
  ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(w - 470, h - 60 - ev.length * 15 - 10, 460, ev.length * 15 + 14);
  ev.forEach((e, i) => {
    let s = ""; try { s = JSON.stringify(e.data); } catch (x) { /* bỏ */ }
    if (s.length > 58) s = s.slice(0, 55) + "…";
    text(`t${e.tick} ${e.name} ${s}`, w - 14, h - 60 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "#cfd8dc" });
  });
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 92, { align: "center", color: "#ff8a80", size: 16, bold: true });
  if (snap.error) text("Luật của nhóm báo lỗi, xem terminal. R để chơi lại.", w / 2, 114, { align: "center", color: "#ff8a80", size: 15, bold: true });
  if (!snap.finished) return;
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, w, h);
  rrect(w / 2 - 230, h / 2 - 90, 460, 180, 16, "rgba(43,28,14,.95)");

      const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .3, w / 2, h / 2, Math.max(w, h) * .7);
      vg.addColorStop(0, "rgba(229,57,53,0)"); vg.addColorStop(1, `rgba(229,57,53,${a})`);
      ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
    }
  }
  // HUD trên: thời gian, oxy, Máu, trạng thái
  hudBand(0, 64);
  text("Buổi sáng · sông Chín Khúc", w - 12, 24, { size: 13, align: "right", color: "#d7c3a0" });
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 48, { size: 22, bold: true });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * .25;
    text("Oxy", 120, 20, { size: 12, color: "#d7c3a0" });
    bar(120, 30, 230, 20, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", secs(p.oxygen_ticks) + " / " + secs(p.oxygen_max_ticks) + " s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    text("Máu", 370, 20, { size: 12, color: "#d7c3a0" });
    let hs = ""; for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 370, 50, { size: 24, color: "#ff6b81" });
  }
  if (p && p.pos) {
    const st = p.at_surface ? "Trên mặt nước" : `Đang lặn · sâu ${p.pos[1].toFixed(1)} m`;
    text(st, 470, 30, { size: 13, bold: true, color: p.at_surface ? "#b3e5fc" : "#ffe0b2" });
    let sub = `x ${p.pos[0].toFixed(1)}`;
    if (p.zero_oxy_ticks > 0) sub += `  · ngạt sau ${secs((meta.choke_interval_ticks || 60) - p.zero_oxy_ticks)}s`;
    if (p.catch_cd_ticks > 0) sub += `  · hồi bắt ${(p.catch_cd_ticks / 60).toFixed(1)}s`;
    text(sub, 470, 50, { size: 12, color: "#d7c3a0" });
  }
  // HUD dưới: giỏ theo thứ tự nhặt (mới nhất bên phải)
  hudBand(h - bottom, bottom);
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.max(14, Math.min(32, (w - 300) / cap - 4)), y0 = h - bottom + 10;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4), k = snap.hold[i];
      rrect(x0, y0, sz, sz, 5, "rgba(255,255,255,.12)");
      if (k) {
        rrect(x0 + 2, y0 + 2, sz - 4, sz - 4, 4, "rgba(255,248,230,.18)");
        if (k.startsWith("ca_")) drawFish(k, x0 + sz / 2 + 1, y0 + sz / 2, sz * (k === "ca_loc" ? .36 : .4), 0, 0);
        else drawFlower(k, x0 + sz / 2, y0 + sz / 2, sz * .38, 0);
        if (i === snap.hold.length - 1) { ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 2; ctx.strokeRect(x0 + 1, y0 + 1, sz - 2, sz - 2); }
      }
    }
    const full = snap.hold.length >= cap;
    const names = {}; snap.hold.forEach((k) => (names[k] = (names[k] || 0) + 1));
    text(`Giỏ ${snap.hold.length}/${cap}` + (full ? " (ĐẦY)" : "") + "   " + (countItems(names) || "trống"), 14, y0 + sz + 22,
         { size: 13, bold: full, color: full ? "#ffcc80" : "#f3ead8" });
  }
  text("WASD bơi · E hái / cập bến · Space bắt cá · R chơi lại · M Má Tư · L nhật ký", w - 12, h - 14, { size: 12, align: "right", color: "#bfa98a" });
  prompt(gatherPrompt(meta, p), w, h - bottom - 26);
  toasts(w, 74);
}

// ---------- cảnh QUÁN: nhà bè nhìn từ trên xuống, x sang phải, z lên (bắc) ----------
function oldestReserved() {
  return (snap.customers || []).filter((c) => c.order_status === "reserved")
    .sort((a, b) => (a.order_tick || 0) - (b.order_tick || 0) || idCmp(a.table_id, b.table_id))[0];
}
function handOrderId() { return snap.hand && typeof snap.hand === "object" ? snap.hand.order_id : null; }
function quanPrompt(meta, p) {
  const R = meta.interact_radius;
  if (!p || !p.pos || !R) return null;
  // cùng tiêu chí chọn đối tượng với luật: (khoảng cách, bếp trước bàn, id) — chỉ để gợi ý
  const c = [...(snap.stoves || []).map((o) => ({ k: 0, o })), ...(snap.tables || []).map((o) => ({ k: 1, o }))]
    .map((x) => ({ ...x, d: dist(p.pos, x.o.pos) })).filter((x) => x.d <= R)
    .sort((a, b) => a.d - b.d || a.k - b.k || idCmp(a.o.id, b.o.id))[0];
  if (!c) return null;
  if (c.k === 0) {
    const st = c.o;
    if (st.state === "idle" && snap.hand) {
      const cu = (snap.customers || []).find((x) => x.id === handOrderId());
      return { t: `Đang bưng ${dishName(snap.hand)}, ra bàn ${cu ? cu.table_id : ""} dọn cho khách` };
    }
    if (st.state === "idle") { const o = oldestReserved(); return o ? { t: `E: nấu ${dishName(o.dish_id)} cho ${o.table_id}`, act: true } : { t: `${st.id}: chưa có đơn để nấu` }; }
    if (st.state === "cooking") return { t: `${st.id} đang nấu ${dishName(st.dish)}… còn ${secs(st.cook_ticks_left)}s` };
    if (st.state === "ready") return snap.hand ? { t: "Tay đang bưng món, dọn trước đã", warn: true } : { t: `E: bưng ${dishName(st.dish)}`, act: true };
    return null;
  }
  const cu = (snap.customers || []).find((x) => x.table_id === c.o.id);
  if (!cu) return { t: `${c.o.id}: bàn trống` };
  if (cu.state === "eating") return { t: `${c.o.id}: khách đang ăn ngon lành` };
  if (snap.hand && handOrderId() === cu.id) return { t: `E: dọn ${dishName(snap.hand)} cho khách`, act: true };
  return { t: `${c.o.id}: khách chờ ${dishName(cu.dish_id)}` };
}
function stringLights(x0, y0, x1, s, t) {
  const n = 14;
  ctx.strokeStyle = "rgba(60,40,20,.9)"; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n, y = y0 + Math.sin(Math.PI * (i % 2 ? .5 : 0)) * .25 * s; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = y0 + (i % 2 ? .25 * s : 0) + 4, a = .7 + .3 * Math.sin(t * .1 + i * 1.7);
    const gl = ctx.createRadialGradient(x, y, 0, x, y, .8 * s);
    gl.addColorStop(0, `rgba(255,214,102,${.55 * a})`); gl.addColorStop(1, "rgba(255,214,102,0)");
    ctx.fillStyle = gl; ctx.fillRect(x - .8 * s, y - .8 * s, 1.6 * s, 1.6 * s);
    circle(x, y, Math.max(2, .12 * s), `rgba(255,224,130,${a})`);
  }
}
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const panelW = Math.max(240, Math.min(340, w * .3)), areaW = w - panelW;
  const X = b.x[1], Z = b.z[1], top = 70, bottom = 40;
  const s = Math.max(1, Math.min((areaW - 40) / X, (h - top - bottom - 20) / Z));
  const ox = (areaW - s * X) / 2, oy = top + 10 + ((h - top - bottom - 20) - s * Z) / 2;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  const t = snap.tick || 0;
  // sông đêm quanh nhà bè
  ctx.fillStyle = "#0b1626"; ctx.fillRect(0, 64, areaW, h - 64);
  ctx.strokeStyle = "rgba(255,214,102,.08)"; ctx.lineWidth = 2;
  for (let i = 0; i < 9; i++) { const y = 80 + i * (h / 9) + Math.sin(t * .03 + i) * 3; line(10 + (i * 37) % 60, y, areaW - 10 - (i * 53) % 80, y); }
  // sàn ván
  rrect(sx(0) - 6, sy(Z) - 6, X * s + 12, Z * s + 12, 6, "#5b3b1f");
  ctx.fillStyle = "#a67644"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "rgba(60,36,16,.45)"; ctx.lineWidth = 1;
  for (let z = 1; z < Z; z++) line(sx(0), sy(z), sx(X), sy(z));
  stringLights(sx(0), sy(Z) - 6, sx(X), s, t);
  // bếp
  (snap.stoves || []).forEach((st) => {
    const x = sx(st.pos[0]), y = sy(st.pos[1]);
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    rrect(x - .9 * s, y - .9 * s, 1.8 * s, 1.8 * s, 6, "#3a2a1c");
    circle(x, y, .6 * s, col);
    if (st.state === "cooking") {
      for (let i = 0; i < 3; i++) { const k = ((t + i * 20) % 60) / 60; circle(x + Math.sin(t * .05 + i) * .3 * s, y - .9 * s - k * 1.6 * s, (.2 + k * .3) * s, `rgba(220,220,220,${.35 * (1 - k)})`); }
      const total = st.dish && snap.menu && snap.menu[dishId(st.dish)] ? snap.menu[dishId(st.dish)].cook_s * 60 : 0;
      if (total && st.cook_ticks_left !== undefined) {
        ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 3; ctx.beginPath();
        ctx.arc(x, y, .75 * s, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - st.cook_ticks_left / total)); ctx.stroke();
      }
    }
    text(st.id + " · " + (STOVE_STATE[st.state] || st.state || ""), x, y + 1.35 * s, { size: 11, align: "center", bold: true, color: "#2a1a0a" });
    if (st.dish) text(dishName(st.dish), x, y - 1.1 * s, { size: 11, align: "center", color: "#2a1a0a", bold: true });
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60, eatMax = (meta.eat_s || 10) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const x = sx(tb.pos[0]), y = sy(tb.pos[1]);
    circle(x - 1.1 * s, y, .3 * s, "#6b4423"); circle(x + 1.1 * s, y, .3 * s, "#6b4423");
    circle(x, y, .85 * s, "#7a4a24");
    text(tb.id, x, y + 1, { size: 12, align: "center", base: "middle", bold: true, color: "#fff" });
    const c = byTable[tb.id];
    if (!c) return;
    const cx = x, cy = y - 1.6 * s;
    circle(cx, cy, .5 * s, c.state === "eating" ? "#7bc67b" : "#f4b6c2");
    // bong bóng món gọi
    const label = dishName(c.dish_id);
    ctx.font = "600 11px system-ui, sans-serif";
    const tw = ctx.measureText(label).width + 12;
    rrect(cx - tw / 2, cy - 1.05 * s - 16, tw, 18, 9, "rgba(255,248,230,.95)");
    text(label, cx, cy - 1.05 * s - 3, { size: 11, align: "center", bold: true, color: "#3b2410" });
    if (c.state === "eating" && c.eat_ticks_left !== undefined) bar(cx - .9 * s, cy + .6 * s, 1.8 * s, 6, c.eat_ticks_left / eatMax, "#81c784");
    else if (c.patience_ticks_left !== undefined) {
      const f = c.patience_ticks_left / patMax;
      bar(cx - .9 * s, cy + .6 * s, 1.8 * s, 6, f, f >= (meta.tip_min_patience_ratio ?? .5) ? "#ffd166" : "#e57373");
    }
  });
  // người chơi
  const p = snap.player;
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    circle(px, py, .5 * s, "#f6a5b5"); circle(px, py, .28 * s, "#f1c9a0");
    if (snap.hand) {
      circle(px + .55 * s, py - .35 * s, .28 * s, "#fff8e1");
      text(dishName(snap.hand), px, py - .85 * s, { size: 11, align: "center", bold: true, color: "#fff8e1" });
    }
  }
  // HUD trên
  hudBand(0, 64);
  text("Buổi tối · nhà bè Má Tư", w - 12, 24, { size: 13, align: "right", color: "#d7c3a0" });
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 48, { size: 22, bold: true });
  text(`Tiền ${snap.money ?? 0}k`, 130, 36, { size: 18, bold: true, color: "#fff59d" });
  text(`đã thu ${snap.earned ?? 0}k`, 130, 54, { size: 12, color: "#d7c3a0" });
  const rep = snap.reputation ?? 0, rmax = meta.reputation_max || 5;
  let stars = ""; for (let i = 1; i <= rmax; i++) stars += rep >= i ? "★" : rep >= i - .5 ? "⯪" : "☆";
  text("Uy tín", 260, 20, { size: 12, color: "#d7c3a0" });
  text(stars + "  " + rep.toFixed(1), 260, 48, { size: 18, color: "#ffd166" });
  text(`Điểm ${snap.score ?? 0}`, 440, 44, { size: 18, bold: true });
  drawQuanPanel(areaW, panelW, h, meta);
  text("WASD đi · E nấu / bưng / dọn · R chơi lại · M Má Tư · L nhật ký", areaW - 12, h - 14, { size: 12, align: "right", color: "#bfa98a" });
  prompt(quanPrompt(meta, p), areaW, h - bottom - 24);
  toasts(areaW, 74);
}
function drawQuanPanel(x0, pw, h, meta) {
  ctx.fillStyle = "rgba(38,24,12,.96)"; ctx.fillRect(x0, 64, pw, h - 64);
  ctx.fillStyle = "rgba(255,214,102,.35)"; ctx.fillRect(x0, 64, 2, h - 64);
  let y = 90;
  const L = x0 + 16, Rr = x0 + pw - 16;
  const head = (s) => { text(s, L, y, { size: 13, bold: true, color: "#ffd166" }); y += 20; };
  const row = (a, b, o = {}) => { text(a, L + 4, y, { size: 13, color: o.color }); if (b !== undefined) text(b, Rr, y, { size: 13, align: "right", color: o.bcolor || o.color }); y += 18; };
  // kho khả dụng
  const { avail, reserved } = availableStock();
  head("Kho khả dụng");
  KINDS.forEach((k) => {
    const r = reserved[k] || 0;
    row("       " + kn(k), avail[k] + (r ? `  (giữ ${r})` : ""), { color: avail[k] ? "#f3ead8" : "#8d7b63" });
    if (k.startsWith("ca_")) drawFish(k, L + 14, y - 22, 10, 0, 0); else drawFlower(k, L + 14, y - 20, 8, 0);
  });
  y += 8;
  // thực đơn: món nào nấu được với kho khả dụng
  head("Thực đơn");
  Object.keys(snap.menu || {}).sort().forEach((id) => {
    const m = snap.menu[id], ok = Object.entries(m.recipe || {}).every(([k, n]) => (avail[k] || 0) >= n);
    row((ok ? "✓ " : "✗ ") + dishName(id), m.price + "k", { color: ok ? "#c8f7a5" : "#8d7b63" });
    text(Object.entries(m.recipe || {}).map(([k, n]) => kn(k) + " ×" + n).join(" + ") + ` · nấu ${m.cook_s}s`, L + 20, y - 3, { size: 11, color: "#a8957a" });
    y += 14;
  });
  y += 8;
  // món khách gọi + kiên nhẫn
  head("Khách gọi");
  const cs = (snap.customers || []).slice().sort((a, b) => idCmp(a.table_id, b.table_id));
  if (!cs.length) row("(chưa có khách)", undefined, { color: "#8d7b63" });
  cs.forEach((c) => {
    const timer = c.state === "eating" ? `ăn ${secs(c.eat_ticks_left)}s` : `⏳ ${secs(c.patience_ticks_left)}s`;
    row(`${c.table_id} · ${dishName(c.dish_id)}`, timer, { bcolor: c.state === "eating" ? "#81c784" : "#ffcc80" });
    text(`${CUST_STATE[c.state] || c.state || ""} · ${ORDER_STATUS[c.order_status] || c.order_status || ""}`, L + 20, y - 3, { size: 11, color: "#a8957a" });
    y += 14;
  });
  y += 8;
  // bếp
  head("Bếp");
  (snap.stoves || []).forEach((st) => {
    let b = STOVE_STATE[st.state] || st.state || "";
    if (st.state === "cooking") b += ` ${secs(st.cook_ticks_left)}s`;
    row(`${st.id}${st.dish ? " · " + dishName(st.dish) : ""}`, b, { bcolor: st.state === "ready" ? "#c8f7a5" : st.state === "cooking" ? "#ffcc80" : "#a8957a" });
  });
  y += 8;
  // trên tay
  head("Trên tay");
  row(snap.hand ? dishName(snap.hand) + (handOrderId() ? ` (đơn ${handOrderId()})` : "") : "(trống)", undefined, { color: snap.hand ? "#fff8e1" : "#8d7b63" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    updateMa();
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    rawLog(w, h);
    overlay(w, h);
    const areaW = snap.mode === "quan" ? w - Math.max(240, Math.min(340, w * .3)) : w;
    // góc dưới trái, trên dải HUD dưới và chừa chỗ cho gợi ý phím; màn kết thúc thì đặt dưới khung tổng kết
    const yb = snap.finished ? Math.min(h - 10, h / 2 + 190) : h - (snap.mode === "quan" ? 40 : 78) - 48;
    drawMa(12, yb, Math.min(460, areaW - 24));
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
