<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quán Ăn Chợ Nổi — Út Sen</title>
  <style>
    :root {
      --bg: #0c141c;
      --panel: rgba(16, 26, 36, 0.82);
      --panel-border: rgba(255, 255, 255, 0.16);
      --text: #f1f6fa;
      --muted: #a6bac9;
      --accent: #4fc3f7;
      --warm: #ffca62;
      --danger: #ef5350;
      --good: #66bb6a;
      --purple: #ab47bc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Viền tím cảnh báo thủy quái */
    .monster-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 80px rgba(171, 71, 188, 0.85), inset 0 0 18px rgba(206, 147, 216, 0.9);
      opacity: 0;
      transition: opacity 0.18s ease;
      z-index: 5;
    }

    .monster-vignette.active {
      opacity: 1;
      animation: monsterPulse 0.7s infinite alternate;
    }

    @keyframes monsterPulse {
      from {
        opacity: 0.65;
      }

      to {
        opacity: 1;
      }
    }

    .hud-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px;
      z-index: 10;
    }

    .hud-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 8px 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 18px;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 20px;
      min-width: 82px;
      text-align: center;
    }

    .timer.low {
      color: var(--danger);
      animation: pulse 0.75s infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: 1;
      }

      to {
        opacity: 0.5;
      }
    }

    .bar-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bar-track {
      width: 190px;
      height: 22px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #29b6f6, #4fc3f7);
      transition: width 0.08s linear;
    }

    .bar-fill.low {
      background: linear-gradient(90deg, #d32f2f, #ff5722);
      animation: pulse 0.5s infinite alternate;
    }

    .bar-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
    }

    .hearts {
      font-size: 22px;
      letter-spacing: 2px;
      color: #ff6b81;
      line-height: 1;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 600;
    }

    .stat-pill small {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .btn {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      padding: 7px 12px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: #2e7d32;
      border-color: #66bb6a;
    }

    .btn-primary:hover {
      background: #388e3c;
    }

    /* Bảng kế hoạch ngày (Phase 2) */
    .plan-box {
      position: fixed;
      top: 70px;
      right: 16px;
      max-width: 280px;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
    }

    .plan-title {
      font-weight: 700;
      color: var(--warm);
      margin-bottom: 4px;
    }

    .plan-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      padding: 2px 0;
    }

    .plan-row.done {
      color: var(--good);
      text-decoration: line-through;
      opacity: 0.8;
    }

    /* Cảnh báo trung tâm (Hết hơi! / Thủy quái!) */
    .alert-stack {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      z-index: 15;
    }

    .alert-pill {
      padding: 7px 18px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.3px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    .alert-oxy {
      background: rgba(211, 47, 47, 0.94);
      color: #fff;
      animation: pulse 0.45s infinite alternate;
    }

    .alert-monster {
      background: rgba(123, 31, 162, 0.94);
      color: #f3e5f5;
    }

    .alert-err {
      background: rgba(183, 28, 28, 0.95);
      color: #fff;
      font-size: 14px;
    }

    .hud-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .slots {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }

    .slot {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .slot.filled {
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.25);
    }

    const stockEl = document.getElementById("hud-stock-list");
    const stock = snap.stock || {};
    const reserved = {};
    (snap.customers || []).forEach((c) => {
      if (!c.reserved) return;
      Object.keys(c.reserved).forEach((k) => {
        reserved[k] = (reserved[k] || 0) + (c.reserved[k] || 0);
      });
    });
    const allKinds = Array.from(new Set([...Object.keys(stock), ...Object.keys(reserved)])).filter(
      (k) => (stock[k] || 0) > 0 || (reserved[k] || 0) > 0
    );
    stockEl.innerHTML = allKinds.length
      ? allKinds.map((k) => {
          const total = stock[k] || 0;
          const res = reserved[k] || 0;
          const avail = Math.max(0, total - res);
          const resNote = res > 0 ? ` <small style="color:var(--warm)">(giữ ${res})</small>` : "";
          return `<span class="chip"><span class="dot" style="background:${kc(k)}"></span>${KIND_ICON[k] || ""} ${KIND_NAME[k] || k} ×${avail}${resNote}</span>`;
        }).join("")
      : `<span class="subtext">Kho khả dụng trống</span>`;
    const totalAvail = allKinds.reduce((acc, k) => acc + Math.max(0, (stock[k] || 0) - (reserved[k] || 0)), 0);
    const totalRes = allKinds.reduce((acc, k) => acc + (reserved[k] || 0), 0);
    document.getElementById("hud-bottom-summary").textContent = allKinds.length
      ? `Kho khả dụng: ${totalAvail} món${totalRes > 0 ? ` (đang giữ chỗ cho khách: ${totalRes})` : ""}`
      : "Chưa có nguyên liệu trong kho";
  }

    .stock-list {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .events-box {
      max-width: 380px;
      text-align: right;
      font-size: 12px;
      color: rgba(232, 238, 242, 0.85);
    }

    .events-box div {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls-hint {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    /* Modal kết thúc / Tạm dừng / Shop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 12, 18, 0.72);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }

    .modal {
      background: #14222e;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 24px 28px;
      min-width: 340px;
      max-width: 560px;
      width: 92vw;
      text-align: center;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .modal p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 15px;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin: 14px 0 18px;
      text-align: left;
    }

    .shop-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .shop-card h4 {
      margin: 0 0 4px;
      font-size: 15px;
      color: var(--warm);
    }

    .shop-card .desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div class="monster-vignette" id="monster-vignette"></div>

  <div class="hud-layer">
    <div class="hud-top">
      <div class="hud-group">
        <div class="panel mode-badge" id="hud-mode">☀️ Buổi sáng</div>
        <div class="panel timer" id="hud-timer">--:--</div>

        <!-- HUD Gather -->
        <div class="panel bar-wrap" id="hud-oxy-wrap">
          <div class="bar-track">
            <div class="bar-fill" id="hud-oxy-fill"></div>
            <div class="bar-label" id="hud-oxy-label">Oxy --s</div>
          </div>
          <div class="hearts" id="hud-hearts"></div>
        </div>
        <div class="panel stat-pill" id="hud-gather-meta">
          <span id="hud-pos">x 0.0 · d 0.0</span>
          <small id="hud-surface"></small>
          <small id="hud-cd"></small>
        </div>

        <!-- HUD Quán -->
        <div class="panel stat-pill hidden" id="hud-quan-stats">
          <span id="hud-money">💰 0k</span>
          <span>·</span>
          <span id="hud-rep">⭐ 3.0</span>
          <span>·</span>
          <span id="hud-score">🏆 0</span>
          <span>·</span>
          <span id="hud-hand"><small>Tay không</small></span>
        </div>
      </div>

      <div class="hud-actions">
        <button class="btn" id="btn-pause" type="button">⏸ Tạm dừng (P)</button>
        <button class="btn" id="btn-sound" type="button">🔊 Âm thanh: Bật</button>
        <button class="btn" id="btn-restart" type="button">↻ Chơi lại (R)</button>
      </div>
    </div>

    <!-- Kế hoạch ngày (Phase 2) -->
    <div class="panel plan-box hidden" id="hud-day-plan">
      <div class="plan-title" id="plan-title">📋 Kế hoạch Ngày</div>
      <div id="plan-items"></div>
    </div>

    <div class="hud-bottom">
      <div class="panel" id="hud-bottom-left">
        <div class="slots hidden" id="hud-hold-slots"></div>
        <div class="stock-list hidden" id="hud-stock-list"></div>
        <div class="subtext" id="hud-bottom-summary">Đang kết nối…</div>
      </div>

      <div class="panel events-box">
        <div id="hud-events"></div>
        <div class="controls-hint" id="hud-controls">WASD / Mũi tên: di chuyển · E: tương tác · Space: bắt cá · R: chơi
          lại</div>
      </div>
    </div>
  </div>

  <div class="alert-stack" id="alert-stack">
    <div class="alert-pill alert-err hidden" id="alert-err"></div>
    <div class="alert-pill alert-oxy hidden" id="alert-oxy">Hết hơi!</div>
    <div class="alert-pill alert-monster hidden" id="alert-monster">Thủy quái!</div>
  </div>

  <!-- Modal Shop (Phase 2) -->
  <div class="modal-backdrop" id="shop-modal">
    <div class="modal">
      <h2>🏮 Chợ Đêm — Nâng Cấp</h2>
      <p id="shop-subtitle">Tiền hiện có: 0k</p>
      <div class="shop-grid" id="shop-grid"></div>
      <button class="btn btn-primary" id="btn-shop-done" type="button">Sang ngày mới →</button>
    </div>
  </div>

  <!-- Modal Pause / Kết thúc -->
  <div class="modal-backdrop" id="hud-modal">
    <div class="modal">
      <h2 id="modal-title">Kết thúc buổi</h2>
      <p id="modal-reason"></p>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn btn-primary hidden" id="modal-resume" type="button">▶ Tiếp tục</button>
        <button class="btn" id="modal-restart" type="button">↻ Chơi lại (R)</button>
      </div>
    </div>
  </div>

  <script>
    "use strict";
    /*
     * Client chơi trực tiếp cho Quán Ăn Chợ Nổi (hỗ trợ Phase 1 & Phase 2).
     * CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
     * Trường nào snapshot chưa có thì bỏ qua an toàn.
     */
    const cv = document.getElementById("c");
    const ctx = cv.getContext("2d");

    let snap = null;
    let offline = false;
    let soundEnabled = true;
    let audioCtx = null;

    let lastSeenTick = -1;
    let seenEventKeys = new Set();
    const popups = [];
    const bubbles = [];
    const smoke = [];

    // ---------- Âm thanh tổng hợp bằng WebAudio ----------
    function ensureAudio() {
      if (!soundEnabled) return null;
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => { });
      }
      return audioCtx;
    }
    function playTone(freq, dur = 0.1, type = "sine", vol = 0.08, slideTo = null) {
      const ac = ensureAudio();
      if (!ac) return;
      const now = ac.currentTime;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(now);
      osc.stop(now + dur);
    }

    // ---------- Phím & Lệnh ----------
    const down = new Set();
    const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
    let queue = [], inflight = false, lastSent = "";

    function activePhase() {
      return (snap && (snap.phase || snap.mode)) || "gather";
    }
    function currentInput() {
      const ph = activePhase();
      const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
      let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
      if (ph === "quan") dy = -dy;
      return {
        move: [dx, dy],
        interact: down.has("interact"),
        catch: down.has("catch"),
        attack: down.has("attack"),
        photo: down.has("photo"),
        pause: down.has("pause")
      };
    }
    function sendRaw(obj) {
      queue.push(JSON.stringify(obj));
      flush();
    }
    function pushInput() {
      const inp = currentInput();
      // Chỉ gửi các trường cơ bản để tương thích với khung live.py hiện tại;
      // chỉ thêm trường mở rộng khi đang nhấn.
      const payload = { move: inp.move, interact: inp.interact, catch: inp.catch };
      if (inp.attack) payload.attack = true;
      if (inp.photo) payload.photo = true;
      if (inp.pause) payload.pause = true;
      const s = JSON.stringify(payload);
      if (s === lastSent) return;
      lastSent = s;
      queue.push(s);
      flush();
    }
    async function flush() {
      if (inflight) return;
      inflight = true;
      while (queue.length) {
        const body = queue.shift();
        try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
        catch (e) { /* poll sẽ báo */ }
      }
      inflight = false;
    }
    function doRestart() {
      fetch("/restart", { method: "POST" }).catch(() => { });
      lastSent = "";
      down.clear();
      lastSeenTick = -1;
      seenEventKeys.clear();
      popups.length = 0;
    }
    function keyName(e) { return e.key.toLowerCase(); }

    addEventListener("keydown", (e) => {
      ensureAudio();
      const k = keyName(e);
      if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
      if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
      else if (k === "e") down.add("interact");
      else if (k === " ") { down.add("catch"); e.preventDefault(); }
      else if (k === "q") down.add("attack");
      else if (k === "f") down.add("photo");
      else if (k === "p" || k === "escape") down.add("pause");
      else if (k === "r") { doRestart(); return; }
      pushInput();
    });
    addEventListener("keyup", (e) => {
      const k = keyName(e);
      if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
      else if (k === "e") down.delete("interact");
      else if (k === " ") down.delete("catch");
      else if (k === "q") down.delete("attack");
      else if (k === "f") down.delete("photo");
      else if (k === "p" || k === "escape") down.delete("pause");
      pushInput();
    });
    addEventListener("blur", () => { down.clear(); pushInput(); });

    document.getElementById("btn-restart").addEventListener("click", doRestart);
    document.getElementById("modal-restart").addEventListener("click", doRestart);
    document.getElementById("btn-pause").addEventListener("click", () => {
      sendRaw({ move: [0, 0], interact: false, catch: false, pause: true });
      setTimeout(() => sendRaw({ move: [0, 0], interact: false, catch: false, pause: false }), 40);
    });
    document.getElementById("modal-resume").addEventListener("click", () => {
      sendRaw({ move: [0, 0], interact: false, catch: false, pause: true });
      setTimeout(() => sendRaw({ move: [0, 0], interact: false, catch: false, pause: false }), 40);
    });
    document.getElementById("btn-shop-done").addEventListener("click", () => {
      sendRaw({ move: [0, 0], interact: false, catch: false, shop_done: true });
    });
    document.getElementById("btn-sound").addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      document.getElementById("btn-sound").textContent = soundEnabled ? "🔊 Âm thanh: Bật" : "🔇 Âm thanh: Tắt";
      if (soundEnabled) ensureAudio();
    });

    // ---------- Poll snapshot ----------
    async function poll() {
      try {
        const r = await fetch("/state", { cache: "no-store" });
        const next = await r.json();
        if (snap && next.tick < snap.tick) {
          lastSeenTick = -1;
          seenEventKeys.clear();
          popups.length = 0;
        }
        snap = next;
        offline = false;
        processNewEvents();
        updateHudDom();
      } catch (e) {
        offline = true;
        updateHudDom();
      }
      setTimeout(poll, 16);
    }
    poll();

    // ---------- Từ điển hiển thị (đủ 6 nguyên liệu & 6 món Phase 2) ----------
    const KIND_COLOR = {
      ca_loc: "#7c9a52",
      ca_linh: "#b8dcf2",
      ca_keo: "#d9a066",
      bong_dien_dien: "#f2c230",
      bong_sung: "#e8799c",
      keo_neo: "#8fcf6b"
    };
    const KIND_NAME = {
      ca_loc: "Cá lóc",
      ca_linh: "Cá linh",
      ca_keo: "Cá kèo",
      bong_dien_dien: "Điên điển",
      bong_sung: "Bông súng",
      keo_neo: "Kèo nèo"
    };
    const KIND_ICON = {
      ca_loc: "🐟",
      ca_linh: "🐠",
      ca_keo: "🐡",
      bong_dien_dien: "🌼",
      bong_sung: "🪷",
      keo_neo: "🌿"
    };
    const DISH_NAME = {
      ca_loc_nuong_trui: "Cá lóc nướng trui",
      goi_bong_sung: "Gỏi bông súng",
      lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
      canh_chua_ca_loc: "Canh chua cá lóc",
      ca_keo_nuong: "Cá kèo nướng muối ớt",
      lau_mam: "Lẩu mắm miền Tây"
    };
    const REASON_NAME = {
      docked: "Đã cập bến an toàn!",
      time: "Hết giờ làm việc!",
      fainted: "Út Sen bị ngất vì hết máu!",
      days_complete: "Hoàn thành cả 5 ngày ở Chợ Nổi!",
      error: "Mô phỏng gặp lỗi."
    };
    const kc = (k) => KIND_COLOR[k] || "#b0bec5";

    function fmtTime(ticks) {
      if (ticks === undefined || ticks === null) return "--:--";
      const s = Math.max(0, Math.ceil(ticks / 60));
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }
    function brief(d) {
      try {
        const s = JSON.stringify(d);
        return s.length > 44 ? s.slice(0, 41) + "…" : s;
      } catch (e) {
        return "";
      }
    }

    // ---------- Phản hồi từ events ----------
    function addPopup(msg, color = "#ffffff", worldPos = null) {
      popups.push({ msg, color, worldPos, life: 68, maxLife: 68 });
    }
    function processNewEvents() {
      if (!snap || !Array.isArray(snap.events)) return;
      if (lastSeenTick < 0) {
        snap.events.forEach((ev, idx) => seenEventKeys.add(`${ev.tick}:${ev.name}:${idx}`));
        lastSeenTick = snap.tick || 0;
        return;
      }
      snap.events.forEach((ev) => {
        const key = `${ev.tick}:${ev.name}:${JSON.stringify(ev.data || {})}`;
        if (seenEventKeys.has(key)) return;
        seenEventKeys.add(key);
        if (seenEventKeys.size > 220) {
          seenEventKeys.delete(seenEventKeys.values().next().value);
        }
        const pPos = snap.player && snap.player.pos ? [...snap.player.pos] : null;
        switch (ev.name) {
          case "gather":
            playTone(520, 0.12, "triangle", 0.08, 760);
            addPopup("+1 " + (KIND_NAME[ev.data?.kind] || "rau"), "#ffe082", pPos);
            break;
          case "fish_caught":
            playTone(440, 0.14, "sine", 0.09, 880);
            addPopup(`+${ev.data?.yield || 1} ` + (KIND_NAME[ev.data?.kind] || "cá"), "#81d4fa", pPos);
            break;
          case "hold_full":
            playTone(220, 0.15, "sawtooth", 0.06, 160);
            addPopup("Giỏ đã đầy!", "#ffab91", pPos);
            break;
          case "choke":
            playTone(170, 0.2, "square", 0.07, 110);
            addPopup("Ngạt thở! -1 Máu", "#ef5350", pPos);
            break;
          case "monster_hit":
            playTone(130, 0.25, "sawtooth", 0.1, 80);
            addPopup("Bị thủy quái cắn! -1 Máu", "#ce93d8", ev.data?.pos || pPos);
            break;
          case "monster_stunned":
            playTone(620, 0.14, "square", 0.07, 320);
            addPopup("Choáng thủy quái!", "#ffe082", ev.data?.pos || pPos);
            break;
          case "photo":
            playTone(880, 0.1, "sine", 0.08, 1200);
            addPopup("Chụp Cá Hô! +0.5⭐", "#ffd54f", pPos);
            break;
          case "dive":
            playTone(300, 0.09, "sine", 0.05, 190);
            break;
          case "surface":
            playTone(240, 0.09, "sine", 0.05, 380);
            break;
          case "cook_started":
            playTone(360, 0.1, "triangle", 0.06, 480);
            addPopup("Đang nấu…", "#ffcc80", pPos);
            break;
          case "dish_ready":
            playTone(660, 0.16, "triangle", 0.08, 990);
            addPopup("Món chín rồi!", "#a5d6a7", pPos);
            break;
          case "dish_burnt":
            playTone(160, 0.25, "sawtooth", 0.08, 95);
            addPopup("Cháy món!", "#ff7043", pPos);
            break;
          case "served":
            playTone(580, 0.12, "sine", 0.08, 780);
            addPopup("Đã phục vụ!", "#b3e5fc", pPos);
            break;
          case "paid":
            playTone(740, 0.14, "sine", 0.09, 1040);
            addPopup(`+${ev.data?.amount ?? ""}k`, "#ffd54f", pPos);
            break;
          case "customer_left":
            playTone(210, 0.22, "sawtooth", 0.06, 140);
            addPopup("Khách bỏ đi!", "#ef9a9a", pPos);
            break;
          case "bought":
            playTone(680, 0.15, "triangle", 0.08, 920);
            addPopup("Đã nâng cấp!", "#a5d6a7", null);
            break;
          case "buy_failed":
            playTone(200, 0.16, "sawtooth", 0.06, 140);
            addPopup("Không đủ tiền / Đã tối đa", "#ffab91", null);
            break;
        }
      });
      lastSeenTick = snap.tick || 0;
    }

    // ---------- Cập nhật HUD DOM ----------
    function updateHudDom() {
      const errEl = document.getElementById("alert-err");
      if (offline) {
        errEl.textContent = "Mất kết nối tới máy chủ (đã tắt chưa?)";
        errEl.classList.remove("hidden");
      } else if (snap && snap.error) {
        errEl.textContent = "Luật của nhóm báo lỗi — xem terminal. Nhấn R để chơi lại.";
        errEl.classList.remove("hidden");
      } else {
        errEl.classList.add("hidden");
      }

      if (!snap) return;

      const ph = activePhase();
      const isQuan = ph === "quan";
      const isShop = ph === "shop";
      const dayLabel = snap.day ? `Ngày ${snap.day} · ` : "";
      document.getElementById("hud-mode").textContent = isShop
        ? `🛒 ${dayLabel}Chợ Đêm`
        : isQuan
          ? `🏮 ${dayLabel}Buổi tối · Mở Quán`
          : `☀️ ${dayLabel}Buổi sáng · Lặn & Hái`;

      // Đồng hồ: đổi màu khi còn <= 30s (theo PRD Phase 2)
      const timerEl = document.getElementById("hud-timer");
      timerEl.textContent = "⏱ " + fmtTime(snap.time_left_ticks);
      timerEl.classList.toggle("low", snap.time_left_ticks !== undefined && snap.time_left_ticks <= 30 * 60);

      document.getElementById("hud-oxy-wrap").classList.toggle("hidden", isQuan || isShop);
      document.getElementById("hud-gather-meta").classList.toggle("hidden", isQuan || isShop);
      document.getElementById("hud-quan-stats").classList.toggle("hidden", !isQuan && !isShop);
      document.getElementById("hud-hold-slots").classList.toggle("hidden", isQuan || isShop);
      document.getElementById("hud-stock-list").classList.toggle("hidden", !isQuan && !isShop);

      document.getElementById("hud-controls").textContent = isQuan
        ? "WASD / Mũi tên: đi lại · E: tương tác (bếp / bàn) · P/Esc: tạm dừng · R: chơi lại"
        : "WASD / Mũi tên: bơi · E: hái / cập bến · Space: bắt cá · P/Esc: tạm dừng · R: chơi lại";

      const p = snap.player || {};
      const underwater = p.at_surface === undefined ? (p.pos ? p.pos[1] > 0.5 : false) : !p.at_surface;

      if (!isQuan && !isShop) {
        const oxy = p.oxygen_ticks ?? 0;
        const oxyMax = p.oxygen_max_ticks || 1;
        const frac = Math.max(0, Math.min(1, oxy / oxyMax));
        const fill = document.getElementById("hud-oxy-fill");
        fill.style.width = (frac * 100).toFixed(1) + "%";
        fill.classList.toggle("low", frac < 0.25);
        document.getElementById("hud-oxy-label").textContent = "Oxy " + Math.ceil(oxy / 60) + "s";

        // Cảnh báo "Hết hơi!" khi oxy cạn ở dưới nước
        document.getElementById("alert-oxy").classList.toggle("hidden", !(oxy <= 0 && underwater));

        let hearts = "";
        const hpMax = p.hp_max || 0;
        const hp = p.hp ?? 0;
        for (let i = 0; i < hpMax; i++) hearts += i < hp ? "♥" : "♡";
        document.getElementById("hud-hearts").textContent = hearts;

        if (p.pos) {
          const depth = p.pos[1];
          const zone = depth <= 0.5 ? "Mặt nước" : depth < 10 ? "Nông" : depth < 20 ? "Giữa" : "Sâu";
          document.getElementById("hud-pos").textContent = `x ${p.pos[0].toFixed(1)} · d ${depth.toFixed(1)}m`;
          document.getElementById("hud-surface").textContent = `· ${zone}`;
        }
        const cds = [];
        if (p.catch_cd_ticks > 0) cds.push(`Bắt ${(p.catch_cd_ticks / 60).toFixed(1)}s`);
        if (p.attack_cd_ticks > 0) cds.push(`Lao ${(p.attack_cd_ticks / 60).toFixed(1)}s`);
        document.getElementById("hud-cd").textContent = cds.length ? "· " + cds.join(" · ") : "";

        // Cảnh báo Thủy quái + viền tím khi có quái đang chase hoặc ở gần <= 10m
        const monsters = snap.monsters || [];
        const dangerMonster = p.pos && monsters.some((m) => m.state === "chase" || dist(p.pos, m.pos) <= 10);
        document.getElementById("alert-monster").classList.toggle("hidden", !dangerMonster);
        document.getElementById("monster-vignette").classList.toggle("active", !!dangerMonster);

        // Giỏ đồ
        const slotsEl = document.getElementById("hud-hold-slots");
        const cap = snap.hold_capacity || 0;
        const hold = snap.hold || [];
        let html = "";
        for (let i = 0; i < cap; i++) {
          const k = hold[i];
          if (k) {
            html += `<div class="slot filled" style="background:${kc(k)};color:#102027" title="${KIND_NAME[k] || k}">${KIND_ICON[k] || "•"}</div>`;
          } else {
            html += `<div class="slot"></div>`;
          }
        }
        slotsEl.innerHTML = html;
        const counts = {};
        hold.forEach((k) => (counts[k] = (counts[k] || 0) + 1));
        const summary = Object.keys(counts).map((k) => `${KIND_NAME[k] || k} ×${counts[k]}`).join(", ");
        document.getElementById("hud-bottom-summary").textContent = `Giỏ ${hold.length}/${cap}${summary ? " — " + summary : " (trống)"}`;

        // Kế hoạch ngày (nếu có day_plan trong snapshot)
        const planBox = document.getElementById("hud-day-plan");
        if (snap.day_plan && snap.day_plan.ingredients) {
          planBox.classList.remove("hidden");
          document.getElementById("plan-title").textContent = `📋 Cần cho Ngày ${snap.day || 1}`;
          const req = snap.day_plan.ingredients;
          document.getElementById("plan-items").innerHTML = Object.keys(req).map((k) => {
            const got = counts[k] || 0;
            const need = req[k];
            return `<div class="plan-row ${got >= need ? "done" : ""}"><span>${KIND_ICON[k] || ""} ${KIND_NAME[k] || k}</span><b>${got}/${need}</b></div>`;
          }).join("");
        } else {
          planBox.classList.add("hidden");
        }
      } else {
        document.getElementById("alert-oxy").classList.add("hidden");
        document.getElementById("alert-monster").classList.add("hidden");
        document.getElementById("monster-vignette").classList.remove("active");
        document.getElementById("hud-day-plan").classList.add("hidden");

        document.getElementById("hud-money").textContent = `💰 ${snap.money ?? 0}k`;
        document.getElementById("hud-rep").textContent = `⭐ ${(snap.reputation ?? 0).toFixed(1)}`;
        document.getElementById("hud-score").textContent = `🏆 ${snap.score ?? 0}`;
        const handEl = document.getElementById("hud-hand");
        if (snap.hand) {
          const dish = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
          handEl.innerHTML = `🍲 <strong>${DISH_NAME[dish] || dish}</strong>`;
        } else {
          handEl.innerHTML = `<small>Tay không</small>`;
        }

        const stockEl = document.getElementById("hud-stock-list");
        const stock = snap.stock || {};
        const keys = Object.keys(stock).filter((k) => stock[k] > 0);
        stockEl.innerHTML = keys.length
          ? keys.map((k) => `<span class="chip"><span class="dot" style="background:${kc(k)}"></span>${KIND_ICON[k] || ""} ${KIND_NAME[k] || k} ×${stock[k]}</span>`).join("")
          : `<span class="subtext">Kho nguyên liệu trống</span>`;
        document.getElementById("hud-bottom-summary").textContent = keys.length ? "Kho khả dụng tại quán" : "Chưa có nguyên liệu trong kho";
      }

      // Shop Modal
      const shopModal = document.getElementById("shop-modal");
      if (isShop && !snap.finished) {
        shopModal.style.display = "flex";
        document.getElementById("shop-subtitle").textContent = `Tiền hiện có: ${snap.money ?? 0}k · Tự đóng sau ${fmtTime(snap.time_left_ticks)}`;
        renderShopCards();
      } else {
        shopModal.style.display = "none";
      }

      // Nhật ký sự kiện
      const evBox = document.getElementById("hud-events");
      const recent = (snap.events || []).slice(-4);
      evBox.innerHTML = recent.map((e) => `<div>t${e.tick} · <b>${e.name}</b> ${brief(e.data)}</div>`).join("");

      // Modal Pause hoặc Kết thúc
      const modal = document.getElementById("hud-modal");
      const resumeBtn = document.getElementById("modal-resume");
      if (snap.finished) {
        modal.style.display = "flex";
        resumeBtn.classList.add("hidden");
        document.getElementById("modal-title").textContent = isQuan ? "Kết thúc ca tối" : "Kết thúc buổi sáng";
        document.getElementById("modal-reason").textContent = REASON_NAME[snap.reason] || (snap.reason || "Đã hoàn thành.");
      } else if (snap.state === "paused") {
        modal.style.display = "flex";
        resumeBtn.classList.remove("hidden");
        document.getElementById("modal-title").textContent = "⏸ Tạm dừng";
        document.getElementById("modal-reason").textContent = "Nhấn Tiếp tục hoặc phím P / Esc để chơi tiếp.";
      } else {
        modal.style.display = "none";
      }
    }

    function renderShopCards() {
      const grid = document.getElementById("shop-grid");
      const upg = snap.upgrades || {};
      const defs = [
        { id: "oxygen", name: "Bình oxy", desc: `Cấp hiện tại: ${upg.oxygen || 0} (tăng thời gian lặn)` },
        { id: "hp", name: "Áo phao", desc: `Cấp hiện tại: ${upg.hp || 0} (tăng Máu tối đa)` }
      ];
      grid.innerHTML = defs.map((u) => `
    <div class="shop-card">
      <h4>${u.name}</h4>
      <div class="desc">${u.desc}</div>
      <button class="btn" type="button" onclick="sendRaw({move:[0,0],interact:false,catch:false,buy:'${u.id}'})">Mua nâng cấp</button>
    </div>
  `).join("");
    }

    // ---------- Hỗ trợ vẽ Canvas ----------
    function fit() {
      const dpr = window.devicePixelRatio || 1;
      const w = innerWidth, h = innerHeight;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return [w, h];
    }
    function text(s, x, y, o = {}) {
      ctx.font = (o.bold ? "700 " : "") + (o.size || 13) + "px system-ui, sans-serif";
      ctx.fillStyle = o.color || "#eef4f8";
      ctx.textAlign = o.align || "left";
      ctx.textBaseline = o.base || "alphabetic";
      ctx.fillText(s, x, y);
    }
    function bar(x, y, w, h, frac, color) {
      ctx.fillStyle = "rgba(0,0,0,.55)";
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
      ctx.strokeStyle = "rgba(255,255,255,.45)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    }
    function dist(a, b) {
      return Math.hypot((a[0] || 0) - (b[0] || 0), (a[1] || 0) - (b[1] || 0));
    }

    // ---------- Cảnh GATHER: Chợ Nổi buổi sớm ----------
    function drawGather(w, h) {
      const meta = snap.meta || {};
      const b = meta.bounds || { x: [0, 100], d: [0, 30] };
      const X = b.x[1], D = b.d[1], SKY = 7.2;
      const top = 74, bottom = 82;
      const s = Math.max(1, Math.min((w - 24) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
      const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
      const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
      const t = (snap.tick || 0) / 60;

      // Ánh hồng buổi sớm
      const skyGrad = ctx.createLinearGradient(0, top, 0, oy);
      skyGrad.addColorStop(0, "#7ec4e8");
      skyGrad.addColorStop(0.55, "#f7c7b7");
      skyGrad.addColorStop(1, "#ffe9d2");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, top, w, SKY * s);

      // Mặt trời sớm
      ctx.fillStyle = "rgba(255, 224, 150, 0.75)";
      ctx.beginPath();
      ctx.arc(sx(X * 0.78), sy(-3.6), 2.1 * s, 0, Math.PI * 2);
      ctx.fill();

      // Bờ dừa nước & nhà sàn phía xa
      ctx.fillStyle = "#3a6b35";
      for (let i = 0; i < 6; i++) {
        const px = 8 + i * 17;
        ctx.beginPath();
        ctx.arc(sx(px), sy(-0.3), 2.2 * s, Math.PI, 0);
        ctx.fill();
      }

      // Sông nước phù sa chuyển sâu
      const waterGrad = ctx.createLinearGradient(0, oy, 0, sy(D));
      waterGrad.addColorStop(0, "#5c9fa8");
      waterGrad.addColorStop(0.35, "#377280");
      waterGrad.addColorStop(0.75, "#194357");
      waterGrad.addColorStop(1, "#091e2e");
      ctx.fillStyle = waterGrad;
      ctx.fillRect(sx(0), oy, X * s, D * s);

      // Đáy sông phù sa
      ctx.fillStyle = "#362b1f";
      ctx.fillRect(sx(0), sy(D) - 0.5 * s, X * s, 0.7 * s);

      // Sóng mặt nước
      ctx.strokeStyle = "#f2fbff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= X; x += 1) {
        const wave = Math.sin(x * 0.5 + t * 2.8) * 0.14;
        if (x === 0) ctx.moveTo(sx(x), sy(wave));
        else ctx.lineTo(sx(x), sy(wave));
      }
      ctx.stroke();

      // Vạch độ sâu (10m nông/giữa, 20m giữa/sâu)
      for (let d = 5; d <= D; d += 5) {
        const isZone = d === 10 || d === 20;
        ctx.strokeStyle = isZone ? "rgba(255,255,255,.18)" : "rgba(255,255,255,.07)";
        ctx.lineWidth = isZone ? 1.5 : 1;
        ctx.beginPath();
        ctx.moveTo(sx(0), sy(d));
        ctx.lineTo(sx(X), sy(d));
        ctx.stroke();
        text(d + " m" + (d === 10 ? " (tầng giữa)" : d === 20 ? " (tầng sâu)" : ""), sx(0) + 6, sy(d) - 3, {
          size: 10, color: "rgba(255,255,255,.5)"
        });
      }

      const p = snap.player;
      const underwater = p ? (p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface) : false;

      // Bến nhà bè
      const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
      const nearDock = p && dist(p.pos, dp) <= dr;
      ctx.fillStyle = "#795538";
      ctx.fillRect(sx(dp[0] - 1.7), sy(-0.9), 3.4 * s, 1.1 * s);
      ctx.fillStyle = "#a94438";
      ctx.beginPath();
      ctx.moveTo(sx(dp[0] - 2.1), sy(-0.9));
      ctx.lineTo(sx(dp[0]), sy(-2.8));
      ctx.lineTo(sx(dp[0] + 2.1), sy(-0.9));
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = nearDock ? "#ffe082" : "rgba(255,230,150,.55)";
      ctx.lineWidth = nearDock ? 2.5 : 1.5;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      text(nearDock ? "Bến · Nhấn [E] cập bến" : "Bến (E)", sx(dp[0]), sy(-3.2), {
        size: 11, bold: nearDock, align: "center", color: "#4a2511"
      });

      // Nút hái
      (snap.nodes || []).forEach((n) => {
        const ready = n.ready !== false;
        const inRange = p && !underwater && ready && meta.interact_radius && dist(p.pos, n.pos) <= meta.interact_radius;
        ctx.save();
        ctx.globalAlpha = ready ? 1 : 0.35;
        const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
        ctx.fillStyle = "#4d8c4a";
        ctx.beginPath();
        ctx.ellipse(nx, ny, 1.0 * s, 0.32 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = kc(n.kind);
        ctx.beginPath();
        ctx.arc(nx, ny - 0.35 * s, 0.48 * s, 0, Math.PI * 2);
        ctx.fill();
        if (inRange) {
          ctx.strokeStyle = "#fff59d";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(nx, ny - 0.2 * s, 1.15 * s, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
        text(inRange ? `[E] ${KIND_NAME[n.kind] || n.id}` : n.id, nx, ny - 1.0 * s, {
          size: 10, bold: inRange, align: "center", color: inRange ? "#1b3a1a" : "#234"
        });
        if (!ready && n.regrow_ticks) {
          text(Math.ceil(n.regrow_ticks / 60) + "s", nx, ny + 1.15 * s, { size: 10, align: "center", color: "#fff" });
        }
      });

      // Đàn cá
      (snap.fish || []).forEach((f) => {
        const inCatch = p && underwater && meta.catch_radius && dist(p.pos, f.pos) <= meta.catch_radius;
        const fx = sx(f.pos[0]), fy = sy(f.pos[1]);
        ctx.save();
        ctx.translate(fx, fy);
        ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
        ctx.fillStyle = kc(f.kind);
        ctx.beginPath();
        ctx.ellipse(0, 0, 0.95 * s, 0.45 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-0.85 * s, 0);
        ctx.lineTo(-1.45 * s, -0.45 * s);
        ctx.lineTo(-1.45 * s, 0.45 * s);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#102027";
        ctx.beginPath();
        ctx.arc(0.45 * s, -0.1 * s, 0.1 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (inCatch) {
          ctx.strokeStyle = "#80deea";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(fx, fy, 1.2 * s, 0, Math.PI * 2);
          ctx.stroke();
        }
        text(inCatch ? `[Space] ${KIND_NAME[f.kind] || f.id}` : f.id, fx, fy - 0.8 * s, {
          size: 10, bold: inCatch, align: "center", color: inCatch ? "#e0f7fa" : "rgba(255,255,255,.8)"
        });
      });

      // Cá Hô (nếu bật mở rộng Sổ tay)
      if (snap.ca_ho) {
        const ch = snap.ca_ho;
        const hx = sx(ch.pos[0]), hy = sy(ch.pos[1]);
        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(((ch.heading_deg || 0) * Math.PI) / 180);
        ctx.fillStyle = "#ffb300";
        ctx.beginPath();
        ctx.ellipse(0, 0, 1.5 * s, 0.72 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-1.3 * s, 0);
        ctx.lineTo(-2.1 * s, -0.65 * s);
        ctx.lineTo(-2.1 * s, 0.65 * s);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        text(ch.photographed ? "Cá Hô ✓" : "Cá Hô [F]", hx, hy - 1.0 * s, { size: 11, bold: true, align: "center", color: "#ffe082" });
      }

      // Thủy quái (Cá Sấu Năm Chèo / Rắn Hổ Mây)
      (snap.monsters || []).forEach((m) => {
        const mx = sx(m.pos[0]), my = sy(m.pos[1]);
        const chasing = m.state === "chase";
        const stunned = m.state === "stunned";
        ctx.save();
        ctx.translate(mx, my);
        ctx.fillStyle = stunned ? "#9e9e9e" : m.kind === "ran" ? "#7e57c2" : "#2e7d32";
        ctx.beginPath();
        ctx.ellipse(0, 0, 1.65 * s, 0.62 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = chasing ? "#ff5252" : "#1b5e20";
        ctx.lineWidth = chasing ? 2.5 : 1.5;
        ctx.stroke();
        // Mắt đỏ khi săn đuổi
        ctx.fillStyle = chasing ? "#ff1744" : "#ffeb3b";
        ctx.beginPath();
        ctx.arc(0.95 * s, -0.2 * s, 0.16 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        text(stunned ? `${m.id} (choáng)` : chasing ? `${m.id} !` : m.id, mx, my - 0.9 * s, {
          size: 10, bold: chasing, align: "center", color: chasing ? "#ff8a80" : "#e8f5e9"
        });
      });

      // Bong bóng khi lặn
      if (p && underwater && (snap.tick || 0) % 14 === 0) {
        bubbles.push({ x: p.pos[0], d: p.pos[1] - 0.4, r: 0.15 + Math.random() * 0.15, life: 45 });
      }
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const bb = bubbles[i];
        bb.d -= 0.08;
        bb.life -= 1;
        if (bb.life <= 0 || bb.d <= 0) { bubbles.splice(i, 1); continue; }
        ctx.strokeStyle = "rgba(225, 245, 254, 0.55)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(sx(bb.x), sy(bb.d), bb.r * s, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Út Sen (áo bà ba, khăn rằn, kính lặn, giỏ lưới)
      if (p) {
        const px = sx(p.pos[0]), py = sy(p.pos[1]);
        if (meta.catch_radius && underwater) {
          ctx.strokeStyle = "rgba(128, 222, 234, 0.3)";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2);
          ctx.stroke();
        }
        if (meta.interact_radius && !underwater) {
          ctx.strokeStyle = "rgba(255, 245, 157, 0.38)";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2);
          ctx.stroke();
        }
        if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
          const a = ((p.heading_deg || 0) * Math.PI) / 180;
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(a);
          // Giỏ lưới sau lưng
          ctx.fillStyle = "#c89b60";
          ctx.fillRect(-0.85 * s, -0.35 * s, 0.45 * s, 0.7 * s);
          // Áo bà ba
          ctx.fillStyle = "#6d4c41";
          ctx.beginPath();
          ctx.arc(0, 0, 0.62 * s, 0, Math.PI * 2);
          ctx.fill();
          // Khăn rằn
          ctx.strokeStyle = "#f5f5f5";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0.12 * s, 0, 0.45 * s, -0.9, 0.9);
          ctx.stroke();
          // Kính lặn tự chế
          ctx.fillStyle = underwater ? "#80deea" : "#ffe0b2";
          ctx.beginPath();
          ctx.arc(0.4 * s, 0, 0.24 * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      drawPopups(sx, sy);
    }

    // ---------- Cảnh QUÁN: Nhà bè buổi tối ----------
    function drawQuan(w, h) {
      const meta = snap.meta || {};
      const b = meta.bounds || { x: [0, 16], z: [0, 10] };
      const X = b.x[1], Z = b.z[1], top = 74, bottom = 82;
      const s = Math.max(1, Math.min((w - 48) / X, (h - top - bottom) / Z));
      const ox = (w - s * X) / 2, oy = top + (h - top - bottom - s * Z) / 2;
      const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
      const t = (snap.tick || 0) / 60;

      // Sông đêm
      ctx.fillStyle = "#081520";
      ctx.fillRect(0, top, w, h - top - bottom);

      // Sàn gỗ nhà bè
      ctx.fillStyle = "#b58652";
      ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
      ctx.strokeStyle = "rgba(70, 42, 18, 0.25)";
      ctx.lineWidth = 1;
      for (let gx = 1; gx < X; gx += 1) {
        ctx.beginPath();
        ctx.moveTo(sx(gx), sy(Z));
        ctx.lineTo(sx(gx), sy(0));
        ctx.stroke();
      }
      ctx.strokeStyle = "#5c3b1e";
      ctx.lineWidth = 5;
      ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

      // Đèn dây vàng lung linh dọc mép trên nhà bè
      for (let lx = 1; lx < X; lx += 2) {
        const glow = 0.65 + 0.35 * Math.sin(t * 3 + lx);
        ctx.fillStyle = `rgba(255, 213, 79, ${glow})`;
        ctx.beginPath();
        ctx.arc(sx(lx), sy(Z) + 4, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      const p = snap.player;

      // Bếp + khói bếp
      (snap.stoves || []).forEach((st) => {
        const stX = sx(st.pos[0]), stY = sy(st.pos[1]);
        const near = p && meta.interact_radius && dist(p.pos, st.pos) <= meta.interact_radius;
        const col = st.state === "cooking" ? "#e67e22" : st.state === "ready" ? "#66bb6a" : "#61686e";
        ctx.fillStyle = col;
        ctx.fillRect(stX - 0.85 * s, stY - 0.85 * s, 1.7 * s, 1.7 * s);
        ctx.strokeStyle = near ? "#fff59d" : "#2d241c";
        ctx.lineWidth = near ? 3 : 2;
        ctx.strokeRect(stX - 0.85 * s, stY - 0.85 * s, 1.7 * s, 1.7 * s);

        if (st.state === "cooking" && (snap.tick || 0) % 10 === 0) {
          smoke.push({ x: stX + (Math.random() - 0.5) * 14, y: stY - 12, r: 6, life: 36 });
        }

        text(st.id, stX, stY + 4, { size: 12, bold: true, align: "center", color: "#111" });
        if (st.dish) {
          text(DISH_NAME[st.dish] || st.dish, stX, stY - 1.05 * s, { size: 10, bold: true, align: "center", color: "#2a1606" });
        }
        if (st.state === "cooking" && st.cook_ticks_left !== undefined) {
          text(Math.ceil(st.cook_ticks_left / 60) + "s", stX, stY + 1.3 * s, { size: 11, bold: true, align: "center", color: "#2a1606" });
        } else if (st.state === "ready") {
          text("[E] Lấy món", stX, stY + 1.3 * s, { size: 10, bold: true, align: "center", color: "#1b5e20" });
        }
      });

      // Khói bếp
      for (let i = smoke.length - 1; i >= 0; i--) {
        const sm = smoke[i];
        sm.y -= 0.7;
        sm.r += 0.12;
        sm.life -= 1;
        if (sm.life <= 0) { smoke.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(245, 245, 245, ${(sm.life / 36) * 0.35})`;
        ctx.beginPath();
        ctx.arc(sm.x, sm.y, sm.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Bàn + khách
      const patMax = (meta.patience_s || 60) * 60;
      const byTable = {};
      (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
      (snap.tables || []).forEach((tb) => {
        const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
        const near = p && meta.interact_radius && dist(p.pos, tb.pos) <= meta.interact_radius;
        ctx.fillStyle = "#7d4e24";
        ctx.beginPath();
        ctx.arc(tx, ty, 0.92 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = near ? "#fff59d" : "#4a2c11";
        ctx.lineWidth = near ? 3 : 2;
        ctx.stroke();
        text(tb.id, tx, ty + 4, { size: 12, bold: true, align: "center", color: "#fff" });

        const c = byTable[tb.id];
        if (c) {
          const cx = tx, cy = ty - 1.55 * s;
          ctx.fillStyle = c.state === "eating" ? "#81c784" : "#f48fb1";
          ctx.beginPath();
          ctx.arc(cx, cy, 0.56 * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 1.5;
          ctx.stroke();
          text(DISH_NAME[c.dish_id] || c.dish_id || "?", cx, cy - 0.8 * s, { size: 10, bold: true, align: "center", color: "#2a1606" });
          if (c.patience_ticks_left !== undefined) {
            const frac = c.patience_ticks_left / patMax;
            // Kiên nhẫn < 25% đổi màu đỏ (PRD Phase 2)
            const pCol = frac >= 0.5 ? "#66bb6a" : frac >= 0.25 ? "#ffb74d" : "#ef5350";
            bar(cx - 0.85 * s, cy + 0.68 * s, 1.7 * s, 6, frac, pCol);
          }
        }
      });

      // Út Sen
      if (p) {
        const px = sx(p.pos[0]), py = sy(p.pos[1]);
        if (meta.interact_radius) {
          ctx.strokeStyle = "rgba(255, 255, 255, .45)";
          ctx.lineWidth = 1.2;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.fillStyle = "#6d4c41";
        ctx.beginPath();
        ctx.arc(px, py, 0.54 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#f5f5f5";
        ctx.lineWidth = 2;
        ctx.stroke();
        if (snap.hand) {
          const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
          text("🍲 " + (DISH_NAME[hand] || hand), px, py - 0.85 * s, { size: 11, bold: true, align: "center", color: "#2a1606" });
        }
      }

      drawPopups(sx, sy);
    }

    function drawPopups(sx, sy) {
      for (let i = popups.length - 1; i >= 0; i--) {
        const pp = popups[i];
        pp.life -= 1;
        if (pp.life <= 0) { popups.splice(i, 1); continue; }
        const alpha = Math.min(1, pp.life / 20);
        const rise = (pp.maxLife - pp.life) * 0.6;
        const x = pp.worldPos ? sx(pp.worldPos[0]) : innerWidth / 2;
        const y = (pp.worldPos ? sy(pp.worldPos[1]) : innerHeight / 2) - 24 - rise;
        ctx.save();
        ctx.globalAlpha = alpha;
        text(pp.msg, x, y, { size: 15, bold: true, align: "center", color: pp.color });
        ctx.restore();
      }
    }

    function frame() {
      requestAnimationFrame(frame);
      const [w, h] = fit();
      ctx.fillStyle = "#0c141c";
      ctx.fillRect(0, 0, w, h);
      if (snap) {
        if (activePhase() === "quan") drawQuan(w, h);
        else drawGather(w, h);
      }
    }
    requestAnimationFrame(frame);
  </script>
