<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

const IMAGES = {};
function getImage(src) {
  if (!IMAGES[src]) {
    const img = new Image();
    img.src = src;
    IMAGES[src] = img;
  }
  return IMAGES[src];
}
const RESTAURANT_ASSETS = {
  // Nền nhà hàng bè nổi Chợ Nổi (SVG tự tạo)
  floating_bg: "/assets/custom/scene/floating_restaurant_bg.svg",

  // Bếp & Bàn chính
  stove: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_stove_commercial_six_burner_01.png",
  table: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_table_dining_round_four_01.png",
  chair: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_chair_dining_padded_01.png",
  
  // Món ăn
  ca_loc_nuong_trui: "/assets/Restaurant Assets Pack/food/r_1634.png",
  goi_bong_sung: "/assets/Restaurant Assets Pack/food/r_1636.png",
  lau_ca_linh_dien_dien: "/assets/Restaurant Assets Pack/food/r_1654.png",

  // Khu vực Bếp (Kitchen Fixtures & Props)
  prep_counter: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_open_kitchen_display_counter_01.png",
  griddle: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_griddle_flat_top_01.png",
  deep_fryer: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_deep_fryer_double_01.png",
  stock_pot: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_stock_pot_large_01.png",
  pans_pair: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_pans_commercial_pair_01.png",
  cutting_board: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_cutting_board_vegetables_01.png",
  plates_tower: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_plates_tower_01.png",
  glass_rack: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_glass_rack_hanging_01.png",
  divider: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_divider_screen_folding_01.png",

  // Khu vực Bàn ăn & Trang trí (Dining & Decor)
  table_square: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_table_dining_square_four_01.png",
  table_family: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_table_family_long_01.png",
  table_window: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_table_window_two_01.png",
  bench: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_bench_waiting_01.png",
  host_stand: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_host_stand_podium_01.png",
  menu_easel: "/assets/Restaurant Assets Pack/Tiles/CafeFixtures/fooddrink_cafe_fixtures_menu_board_easel_blank_01.png",
  drink_cart: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_drink_cart_wheeled_01.png",
  condiment: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_condiment_rack_01.png",
  lamp: "/assets/Restaurant Assets Pack/Tiles/CafeProps/fooddrink_cafe_props_lamp_floor_rattan_01.png",
  string_lights: "/assets/Restaurant Assets Pack/Tiles/CafeProps/fooddrink_cafe_props_string_lights_warm_segment_01.png",
  flower_vase: "/assets/Restaurant Assets Pack/Tiles/CafeProps/fooddrink_cafe_props_vase_single_flower_01.png",

  // Thợ lặn Út Sen (Gather Mode)
  diver_swim: "/assets/Nền sông và nhân vật/PNG/player/player-swiming.png",
  diver_idle: "/assets/Nền sông và nhân vật/PNG/player/player-idle.png",
  diver_fast: "/assets/Nền sông và nhân vật/PNG/player/player-fast.png",
  diver_hurt: "/assets/Nền sông và nhân vật/PNG/player/player-hurt.png",
  diver_rush: "/assets/Nền sông và nhân vật/PNG/player/player-rush.png",
};

function drawSprite(key, x, y, w, h, fallbackFn) {
  const src = RESTAURANT_ASSETS[key];
  if (src) {
    const img = getImage(src);
    if (img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, x, y, w, h);
      return true;
    }
  }
  if (fallbackFn) fallbackFn();
  return false;
}

// Vẽ sprite căn giữa tại (cx, cy), GIỮ ĐÚNG TỈ LỆ GỐC (hỗ trợ flipX để xoay hướng ghế trái/phải)
function drawSpriteFit(key, cx, cy, maxSize, fallbackFn, flipX = false) {
  const src = RESTAURANT_ASSETS[key];
  if (src) {
    const img = getImage(src);
    if (img.complete && img.naturalWidth > 0) {
      const ratio = img.naturalWidth / img.naturalHeight;
      let w = maxSize, h = maxSize;
      if (ratio >= 1) h = maxSize / ratio;
      else w = maxSize * ratio;
      ctx.save();
      ctx.translate(cx, cy);
      if (flipX) ctx.scale(-1, 1);
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
      ctx.restore();
      return true;
    }
  }
  if (fallbackFn) fallbackFn();
  return false;
}

// ---------- Khách SVG & Audio kịch bản từ cast.json (chỉ chạy ở UI, tắt ở headless) ----------
let castData = null;
fetch("/assets/custom/customers/cast.json").then((r) => r.ok ? r.json() : null).then((d) => { castData = d; }).catch(() => {});

function getCastSlot(customerId) {
  if (!castData || !castData.rotation || !castData.rotation.length || !customerId) return null;
  const m = String(customerId).match(/(\d+)$/);
  const num = m ? Math.max(1, parseInt(m[1], 10)) : 1;
  return castData.rotation[(num - 1) % castData.rotation.length];
}

const audioQueue = [];
let audioPlaying = false;
const playedEventKeys = new Set();
let lastAudioTick = -1;
const custWalkStart = {}; // customer_id -> tick bắt đầu bước vào từ LỐI VÀO (UI-only)
const WALK_IN_TICKS = 90; // ~1.5 giây đi từ LỐI VÀO [5.6, 0.3] tới bàn T1

function enqueueAudio(paths) {
  paths.forEach((p) => audioQueue.push("/assets/custom/" + p));
  playNextAudio();
}
function playNextAudio() {
  if (audioPlaying || !audioQueue.length) return;
  audioPlaying = true;
  const a = new Audio(audioQueue.shift());
  const done = () => { audioPlaying = false; playNextAudio(); };
  a.onended = done;
  a.onerror = done;
  a.play().catch(done);
}
function processCastAudio(events) {
  if (!events || !castData) return;
  if (snap && snap.tick < lastAudioTick) {
    playedEventKeys.clear();
    for (const k of Object.keys(custWalkStart)) delete custWalkStart[k];
  }
  if (snap) lastAudioTick = snap.tick;
  for (const ev of events) {
    const cid = ev.data && ev.data.customer_id;
    if (!cid) continue;
    const key = `${ev.tick}:${ev.name}:${cid}`;
    if (playedEventKeys.has(key)) continue;
    playedEventKeys.add(key);
    const slot = getCastSlot(cid);
    const clips = slot && slot.audio_triggers && slot.audio_triggers[ev.name];
    if (clips && clips.length) enqueueAudio(clips);
  }
}

let playerLastDirQuan = 0;
let playerLastPosQuan = null;
function drawPixelCharacter(charIndex, dirRow, frameCol, destX, destY, destW, destH) {
  const sheet = getImage("/assets/Pixel Art People/Pixel Art People Sample Sheet.png");
  if (sheet.complete && sheet.naturalWidth > 0) {
    const charX = (charIndex % 4) * 96;
    const charY = Math.floor(charIndex / 4) * 128;
    const srcX = charX + frameCol * 32;
    const srcY = charY + dirRow * 32;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(sheet, srcX, srcY, 32, 32, destX, destY, destW, destH);
    ctx.imageSmoothingEnabled = true;
    return true;
  }
  return false;
}

function drawDiver(p, px, py, s) {
  let spriteKey = "diver_idle";
  let numFrames = 6;
  const speed = p.vel ? Math.hypot(p.vel[0], p.vel[1]) : 0;
  const isHurt = p.invuln_ticks > 0;

  if (isHurt) {
    spriteKey = "diver_hurt";
    numFrames = 5;
  } else if (speed > 1.2) {
    spriteKey = "diver_fast";
    numFrames = 5;
  } else if (speed > 0.05) {
    spriteKey = "diver_swim";
    numFrames = 7;
  } else {
    spriteKey = "diver_idle";
    numFrames = 6;
  }

  const src = RESTAURANT_ASSETS[spriteKey];
  if (!src) return false;
  const img = getImage(src);
  if (!img.complete || img.naturalWidth <= 0) return false;

  const frameIdx = Math.floor(snap.tick / 6) % numFrames;
  const frameW = 80, frameH = 80;
  const sx = frameIdx * frameW;
  const heading = (p.heading_deg || 0) % 360;
  const facingLeft = heading > 90 && heading < 270;

  ctx.save();
  ctx.translate(px, py);
  if (facingLeft) {
    ctx.scale(-1, 1);
  }
  const rotRad = facingLeft ? ((180 - heading) * Math.PI) / 180 : (heading * Math.PI) / 180;
  ctx.rotate(rotRad * 0.4);

  const dw = 1.05 * s, dh = 1.05 * s;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, sx, 0, frameW, frameH, -dw / 2, -dh / 2, dw, dh);
  ctx.imageSmoothingEnabled = true;
  ctx.restore();
  return true;
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      const drawnDiver = drawDiver(p, px, py, s);
      if (!drawnDiver) {
        const heading = (p.heading_deg || 0) % 360;
        const dirRow = (heading > 90 && heading < 270) ? 1 : 2;
        const speed = p.vel ? Math.hypot(p.vel[0], p.vel[1]) : 0;
        const frameCol = speed > 0.05 ? ([1, 0, 1, 2][Math.floor(snap.tick / 6) % 4]) : 1;
        const pW = 0.85 * s, pH = 0.95 * s;
        const drawn = drawPixelCharacter(2, dirRow, frameCol, px - pW / 2, py - pH / 2, pW, pH);
        if (!drawn) {
          ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.45 * s, 0, Math.PI * 2); ctx.fill();
        }
      }
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.8 * s, py + Math.sin(a) * 0.8 * s); ctx.stroke();
    }
  }
  // HUD trên
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 12, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 345, 29, { size: 22, color: "#ff6b81" });
  }
  if (p && p.pos) text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`, 14, 52, { size: 12, color: "#9fb3c0" });
  if (p && p.catch_cd_ticks > 0) text("hồi chiêu bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 150, 52, { size: 12, color: "#9fb3c0" });
  // giỏ (khoang) dưới
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(30, (w - 260) / cap - 4), y0 = h - bottom + 8;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      if (snap.hold[i]) { ctx.fillStyle = kc(snap.hold[i]); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6); }
    }
    const names = {}; snap.hold.forEach((k) => (names[k] = (names[k] || 0) + 1));
    text("Giỏ " + snap.hold.length + "/" + cap + "  " + Object.keys(names).map((k) => (KIND_NAME[k] || k) + "×" + names[k]).join(", "), 14, y0 + sz + 16, { size: 12, color: "#cfd8dc" });
  }
  text("WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  // 1. Nền cảnh Quán Ăn Chợ Nổi (floating_restaurant_bg.svg) khớp chính xác hệ tọa độ 16x10
  ctx.fillStyle = "#0B1F2E";
  ctx.fillRect(0, 0, w, h);
  const bgDrawn = drawSprite("floating_bg", sx(0), sy(Z), X * s, Z * s);
  if (!bgDrawn) {
    ctx.fillStyle = "#cfa068";
    ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  }

  // 2. Khu vực Bếp (góc trên trái, gọn bên phải bếp B1 [2, 8], không đè lối đi)
  drawSpriteFit("prep_counter", sx(4.2), sy(8.1), 1.55 * s);
  drawSpriteFit("cutting_board", sx(3.92), sy(8.1) - 0.24 * s, 0.48 * s);
  drawSpriteFit("plates_tower", sx(4.48), sy(8.1) - 0.28 * s, 0.48 * s);

  // 3. Góc trang trí ép sát mép phải & lối vào (ghế trái flipX=true quay mặt vào bàn)
  // Bàn vuông góc trên phải (T2 decor)
  drawSpriteFit("chair", sx(12.55), sy(8.05), 0.78 * s, null, true);
  drawSpriteFit("chair", sx(14.65), sy(8.05), 0.78 * s, null, false);
  drawSpriteFit("table_square", sx(13.6), sy(8.0), 1.55 * s);
  drawSpriteFit("flower_vase", sx(13.6), sy(8.0) - 0.28 * s, 0.44 * s);

  // Bàn gia đình góc dưới phải (T3 decor)
  drawSpriteFit("chair", sx(12.35), sy(2.45), 0.78 * s, null, true);
  drawSpriteFit("chair", sx(14.85), sy(2.45), 0.78 * s, null, false);
  drawSpriteFit("table_family", sx(13.6), sy(2.4), 1.85 * s);
  drawSpriteFit("condiment", sx(13.6), sy(2.4) - 0.22 * s, 0.36 * s);

  // Lối vào phía dưới (cạnh chữ LỐI VÀO x ≈ 5.6)
  drawSpriteFit("menu_easel", sx(4.1), sy(1.35), 0.95 * s);
  drawSpriteFit("host_stand", sx(6.7), sy(1.35), 0.95 * s);

  // 2 Đèn mây ấm ở 2 góc phải
  drawSpriteFit("lamp", sx(14.9), sy(8.9), 0.95 * s);
  drawSpriteFit("lamp", sx(14.9), sy(1.3), 0.95 * s);

  // 4. Bếp chính (B1 - Interactive)
  (snap.stoves || []).forEach((st) => {
    const isNearby = snap.player && Math.hypot(snap.player.pos[0] - st.pos[0], snap.player.pos[1] - st.pos[1]) <= (meta.interact_radius || 1.5);
    if (isNearby) {
      ctx.fillStyle = "rgba(255, 180, 50, 0.25)";
      ctx.beginPath(); ctx.arc(sx(st.pos[0]), sy(st.pos[1]), 1.35 * s, 0, Math.PI * 2); ctx.fill();
    }
    drawSpriteFit("stove", sx(st.pos[0]), sy(st.pos[1]), 1.65 * s, () => {
      const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
      ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    });

    // Badge nhãn bếp
    ctx.fillStyle = isNearby ? "rgba(230, 81, 0, 0.85)" : "rgba(0,0,0,0.65)";
    ctx.fillRect(sx(st.pos[0]) - 0.9 * s, sy(st.pos[1]) + 0.7 * s, 1.8 * s, 16);
    text(st.id + (isNearby ? " [Bấm E]" : ""), sx(st.pos[0]), sy(st.pos[1]) + 0.7 * s + 12, { size: 11, align: "center", color: "#ffd54f" });

    if (st.dish) {
      if (RESTAURANT_ASSETS[st.dish]) {
        drawSpriteFit(st.dish, sx(st.pos[0]), sy(st.pos[1]) - 1.05 * s, 0.8 * s);
      }
    }
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) {
      // Khói bếp bay lên khi đang nấu
      for (let k = 0; k < 3; k++) {
        const phase = ((snap.tick * 0.035 + k * 0.33) % 1);
        ctx.fillStyle = `rgba(255, 248, 230, ${(1 - phase) * 0.45})`;
        ctx.beginPath();
        ctx.arc(sx(st.pos[0]) + Math.sin(phase * 6 + k) * 8, sy(st.pos[1]) - (0.6 + phase * 1.1) * s, (0.14 + phase * 0.16) * s, 0, Math.PI * 2);
        ctx.fill();
      }
      text("🔥 " + Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.4 * s, { size: 11, align: "center", color: "#ff7043" });
    } else if (st.state === "ready") {
      text("✨ CHÍN! [E]", sx(st.pos[0]), sy(st.pos[1]) + 1.4 * s, { size: 11, align: "center", color: "#69f0ae" });
    }
  });

  // 8. Bàn ăn chính (T1 - Interactive) + Khách hàng
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const isNearby = snap.player && Math.hypot(snap.player.pos[0] - tb.pos[0], snap.player.pos[1] - tb.pos[1]) <= (meta.interact_radius || 1.5);
    if (isNearby) {
      ctx.fillStyle = "rgba(100, 220, 100, 0.25)";
      ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 1.4 * s, 0, Math.PI * 2); ctx.fill();
    }

    // 2 Ghế gọn 2 bên bàn (ghế trái lật gương quay vào bàn, ghế phải quay vào bàn)
    drawSpriteFit("chair", sx(tb.pos[0] - 1.1), sy(tb.pos[1] + 0.05), 0.82 * s, null, true);
    drawSpriteFit("chair", sx(tb.pos[0] + 1.1), sy(tb.pos[1] + 0.05), 0.82 * s, null, false);

    // Sprite bàn căn đúng tâm + đúng tỉ lệ
    drawSpriteFit("table", sx(tb.pos[0]), sy(tb.pos[1]), 1.75 * s, () => {
      ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    });

    // Gia vị căn đúng mặt trên của bàn tròn
    drawSpriteFit("condiment", sx(tb.pos[0]), sy(tb.pos[1]) - 0.18 * s, 0.4 * s);

    // Badge nhãn bàn
    ctx.fillStyle = isNearby ? "rgba(46, 125, 50, 0.85)" : "rgba(0,0,0,0.65)";
    ctx.fillRect(sx(tb.pos[0]) - 0.8 * s, sy(tb.pos[1]) + 0.8 * s, 1.6 * s, 16);
    text(tb.id + (isNearby ? " [Bấm E]" : ""), sx(tb.pos[0]), sy(tb.pos[1]) + 0.8 * s + 12, { size: 11, align: "center", color: "#a5d6a7" });

    // Khách hàng: bước từ LỐI VÀO [5.6, 0.3] đi vào ngồi bàn T1 (UI-only animation)
    const c = byTable[tb.id];
    if (c) {
      if (custWalkStart[c.id] === undefined) {
        // Nếu khách vừa mới vào trong lúc chơi (tick > 2) thì chạy animation bước vào; fixture có sẵn ở tick 0 thì ngồi luôn
        custWalkStart[c.id] = snap.tick > 2 ? snap.tick : -WALK_IN_TICKS;
      }
      const walkProg = Math.max(0, Math.min(1, (snap.tick - custWalkStart[c.id]) / WALK_IN_TICKS));
      const isWalkingIn = walkProg < 1;

      // Đường đi 2 đoạn: LỐI VÀO [5.6, 0.3] -> [5.6, tb.z + 1.35] -> [tb.x, tb.z + 1.35]
      const seatX = tb.pos[0], seatZ = tb.pos[1] + 1.35;
      let worldX = seatX, worldZ = seatZ;
      if (isWalkingIn) {
        if (walkProg < 0.45) {
          const u = walkProg / 0.45;
          worldX = 5.6;
          worldZ = 0.3 + (seatZ - 0.3) * u;
        } else {
          const u = (walkProg - 0.45) / 0.55;
          worldX = 5.6 + (seatX - 5.6) * u;
          worldZ = seatZ;
        }
      }
      const cx = sx(worldX), cy = sy(worldZ);
      const charIdx = (c.id.charCodeAt(c.id.length - 1) % 6) + 1;

      // Hoạt ảnh bước đi / ngồi ăn / chờ
      let custBobY = 0;
      let walkTilt = 0;
      let custCol = 1;
      let custDir = 0;

      if (isWalkingIn) {
        custBobY = -Math.abs(Math.sin(snap.tick * 0.35)) * (0.12 * s);
        walkTilt = Math.sin(snap.tick * 0.35) * 0.1;
        custDir = walkProg < 0.45 ? 3 : 2;
      } else if (c.state === "eating") {
        const chewPhase = Math.floor(snap.tick / 7) % 4;
        custBobY = Math.abs(Math.sin(snap.tick * 0.3)) * (0.05 * s);
        custCol = (chewPhase === 1 || chewPhase === 3) ? 0 : 1;
      } else {
        custBobY = Math.sin((snap.tick + charIdx * 15) * 0.08) * (0.02 * s);
        const glance = Math.floor(snap.tick / 80) % 6;
        if (glance === 2) custDir = 1;
        else if (glance === 4) custDir = 2;
      }

      const slot = getCastSlot(c.id);
      const isImpatient = !isWalkingIn && c.state === "waiting" && c.patience_ticks_left !== undefined && (c.patience_ticks_left / patMax) < 0.5;
      const shakeX = isImpatient ? Math.sin(snap.tick * 0.9) * (0.06 * s) : 0;
      let drawnCust = false;
      if (slot && slot.sprites && slot.sprites.length) {
        const cW = 1.25 * s, cH = 1.25 * s;
        slot.sprites.forEach((sp, i) => {
          const im = getImage("/assets/custom/" + sp);
          if (im.complete && im.naturalWidth > 0) {
            const offsetX = slot.sprites.length === 2 ? (i === 0 ? -0.55 * s : 0.55 * s) : 0;
            ctx.save();
            ctx.translate(cx + offsetX + shakeX, cy - cH * 0.28 + custBobY);
            if (walkTilt) ctx.rotate(walkTilt);
            ctx.drawImage(im, -cW / 2, -cH / 2, cW, cH);
            ctx.restore();
            drawnCust = true;
          }
        });
      }
      if (!drawnCust) {
        const cW = 0.8 * s, cH = 0.9 * s;
        drawnCust = drawPixelCharacter(charIdx, custDir, custCol, cx - cW / 2, cy - cH * 0.7 + custBobY, cW, cH);
      }
      if (!drawnCust) {
        ctx.fillStyle = c.state === "eating" ? "#4caf50" : "#f06292";
        ctx.beginPath(); ctx.arc(cx, cy, 0.35 * s, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
        text(c.state === "eating" ? "😋" : "👤", cx, cy + 4, { size: 12, align: "center" });
      }
      if (slot) {
        text(slot.name, cx, cy - 1.12 * s, { size: 11, align: "center", color: "#fde047" });
      }

      // Chỉ hiện bong bóng món & thanh kiên nhẫn sau khi khách đã bước tới ngồi vào bàn
      if (!isWalkingIn) {
        const bubbleY = cy - 1.75 * s;
        const dishKey = c.dish_id || c.dish;
        ctx.fillStyle = "rgba(15, 23, 42, 0.82)";
        ctx.strokeStyle = "rgba(253, 224, 71, 0.7)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, bubbleY, 0.42 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        if (RESTAURANT_ASSETS[dishKey]) {
          drawSpriteFit(dishKey, cx, bubbleY, 0.62 * s);
        }

        if (c.patience_ticks_left !== undefined && c.state === "waiting") {
          const ratio = c.patience_ticks_left / patMax;
          bar(sx(tb.pos[0]) - 0.8 * s, sy(tb.pos[1]) + 1.05 * s, 1.6 * s, 7, ratio, ratio >= 0.5 ? "#4caf50" : "#e57373", Math.ceil(c.patience_ticks_left / 60) + "s");
        }
      }
    }
  });

  // 9. Người chơi (Út Sen)
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.beginPath(); ctx.ellipse(px, py + 0.35 * s, 0.38 * s, 0.16 * s, 0, 0, Math.PI * 2); ctx.fill();

    if (meta.interact_radius) {
      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Hướng nhìn và hoạt ảnh quay người / bước đi của Út Sen từ Pixel Art People
    let vx = p.vel ? p.vel[0] : 0;
    let vz = p.vel ? p.vel[1] : 0;

    // Nếu không có vel từ server hoặc đang đứng yên, kiểm tra độ dời toạ độ thực tế
    if (playerLastPosQuan) {
      const ddx = p.pos[0] - playerLastPosQuan[0];
      const ddz = p.pos[1] - playerLastPosQuan[1];
      if (Math.hypot(ddx, ddz) > 0.002) {
        vx = ddx;
        vz = ddz;
      }
    }
    playerLastPosQuan = [p.pos[0], p.pos[1]];

    // Phản hồi quay hướng ngay lập tức khi người chơi bấm phím
    if (down.has("left")) vx = -1;
    else if (down.has("right")) vx = 1;
    if (down.has("up")) vz = 1;
    else if (down.has("down")) vz = -1;

    const speed = Math.hypot(vx, vz);
    if (speed > 0.005) {
      if (Math.abs(vx) >= Math.abs(vz)) {
        playerLastDirQuan = vx > 0 ? 2 : 1; // 2: Phải (East), 1: Trái (West)
      } else {
        playerLastDirQuan = vz > 0 ? 3 : 0; // 3: Lên/Bắc (North/Back), 0: Xuống/Nam (South/Front)
      }
    }
    const dirRow = playerLastDirQuan;

    // Chu kỳ bước chân cell animation [Idle, Step1, Idle, Step2]
    let frameCol = 1;
    let bobY = 0;
    if (speed > 0.05) {
      const animStep = Math.floor(snap.tick / 6) % 4;
      frameCol = [1, 0, 1, 2][animStep];
      bobY = (frameCol === 0 || frameCol === 2) ? -0.04 * s : 0; // nhún chân khi bước
    } else {
      bobY = Math.sin(snap.tick * 0.08) * (0.015 * s); // thở nhẹ khi đứng yên
    }

    const spriteW = 0.85 * s;
    const spriteH = 0.95 * s;
    const drawnPlayer = drawPixelCharacter(2, dirRow, frameCol, px - spriteW / 2, py - spriteH * 0.75 + bobY, spriteW, spriteH);
    if (!drawnPlayer) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.4 * s, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#ffe082"; ctx.beginPath(); ctx.arc(px, py - 0.1 * s, 0.25 * s, Math.PI, 0); ctx.fill();
    }
    text("Bà Tư", px, py + 0.65 * s, { size: 11, align: "center", color: "#fff" });

    // Món đang bưng trên tay (chỉ hiện biểu tượng món, không hiện chữ ID)
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish || snap.hand.dish_id || "");
      if (RESTAURANT_ASSETS[hand]) {
        drawSpriteFit(hand, px, py - 1.05 * s + bobY, 0.72 * s);
      }
    }
  }

  // Phát giọng nói nhân vật theo sự kiện trong cast.json
  processCastAudio(snap.events);

  // 10. HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20, color: "#ffd54f" });
  text(`Tiền: ${snap.money ?? 0}k · Uy tín: ${(snap.reputation ?? 0).toFixed(1)} ⭐ · Điểm: ${snap.score ?? 0}`, 120, 28, { size: 16, color: "#fff" });
  const stock = snap.stock ? Object.keys(snap.stock).map((k) => (KIND_NAME[k] || k) + "×" + snap.stock[k]).join(", ") : "";
  text("Kho sẵn có: " + (stock || "(trống)"), 14, 52, { size: 13, color: "#b0bec5" });
  text("WASD/mũi tên di chuyển · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
