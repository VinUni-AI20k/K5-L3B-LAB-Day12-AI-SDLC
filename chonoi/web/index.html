    function drawDayResult(w, h) {
      panel(w * 0.18, h * 0.14, w * 0.64, h * 0.68);
      text("TỔNG KẾT NGÀY " + dayNum(), w / 2, h * 0.24, { size: 36, align: "center", bold: true, color: "#ffe082" });
      const r = (snap && (snap.day_result || snap.result)) || (DEMO ? DEMO_DATA.day_result : {});
      const rows = [
        ["Khách phục vụ thành công", dash(r.served) + " khách"],
        ["Khách bỏ đi do chờ lâu", dash(r.left) + " khách"],
        ["Tiền kiếm được ca tối", r.money !== undefined ? r.money + "k" : "—"],
        ["Tiền boa thêm", r.tip !== undefined ? r.tip + "k" : "—"],
        ["Thay đổi uy tín", dash(r.rep_delta)],
        ["Điểm uy tín hiện tại", dash(r.reputation) + " ⭐"],
      ];
      let y = h * 0.36;
      rows.forEach(([a, b]) => { text(a + ":  " + b, w / 2, y, { size: 22, align: "center" }); y += 38; });
      btn("skipIntro", "Vào Cửa Hàng Nâng Cấp (Shop)", w / 2 - 160, h * 0.80, 320, 48);
    }

    function shopCatalog() {
      if (snap && snap.shop && typeof snap.shop === "object" && !Array.isArray(snap.shop)) {
        const keys = Object.keys(snap.shop);
        if (keys.length && snap.shop[keys[0]] && snap.shop[keys[0]].level !== undefined) return snap.shop;
      }
      const metaShop = snap && snap.meta && snap.meta.shop;
      if (metaShop && metaShop.upgrades) {
        const ups = (snap && snap.upgrades) || {};
        const out = {};
        Object.keys(metaShop.upgrades).forEach((uid) => {
          const lv = ups[uid] || 0;
          const arr = metaShop.upgrades[uid] || [];
          const nxt = arr.find((e) => e.level === lv + 1) || null;
          out[uid] = { level: lv, max_level: arr.length, next: nxt };
        });
        return out;
      }
      return DEMO ? {
        oxygen: { level: 0, max_level: 2, next: { level: 1, price: 200, oxygen_max_s: 45 } },
        hp: { level: 0, max_level: 2, next: { level: 1, price: 250, hp_max: 4 } },
      } : {};
    }
    function upgradeTitle(uid) { return uid === "oxygen" ? "Bình oxy" : uid === "hp" ? "Áo phao" : uid; }
    function upgradeNextDesc(nxt) {
      if (!nxt) return "";
      if (nxt.oxygen_max_s) return nxt.oxygen_max_s + " s oxy";
      if (nxt.hp_max) return nxt.hp_max + " Máu";
      if (nxt.desc) return nxt.desc;
      return "cấp " + nxt.level;
    }
    function drawShop(w, h) {
      panel(40, 40, w - 80, h - 80);
      const money = snap && snap.money !== undefined ? snap.money : ((DEMO ? DEMO_DATA.shop.money : undefined));
      const bought = (snap && snap.upgrades) || {};
      const active = (snap && snap.active_upgrades) || {};
      const cat = shopCatalog();
      const tLeft = snap && snap.phase === "shop" ? snap.time_left_ticks : undefined;

      text("CỬA HÀNG TRANG BỊ CHỢ NỔI", w / 2, 90, { size: 36, align: "center", bold: true, color: "#ffe082" });
      text("Tiền " + dash(money !== undefined ? money + "k" : null) +
        " · đồng hồ " + (tLeft !== undefined ? fmtTime(tLeft) : "—") +
        " · Ngày kế: O₂ L" + dash(active.oxygen || 0) + " / HP L" + dash(active.hp || 0),
        w / 2, 130, { size: 18, align: "center", color: "#69f0ae", bold: true });

      let y = 180;
      ["oxygen", "hp"].forEach((uid) => {
        const u = cat[uid] || { level: bought[uid] || 0, next: null, max_level: 2 };
        const cur = u.level || 0;
        const next = u.next;
        text(upgradeTitle(uid) + " (đã mua L" + cur + "/" + (u.max_level || 2) + ")", 80, y, { size: 24, bold: true, color: "#81d4fa" });
        if (next) {
          text("Mua L" + next.level + ": " + upgradeNextDesc(next) + " — " + next.price + "k", 80, y + 32, { size: 20, color: "#cfd8dc" });
          btn("buy_" + uid, "Mua (" + next.price + "k)", w - 300, y - 8, 200, 44, { size: 18, fill: "#00695c", stroke: "#64ffda" });
        } else {
          text("Đã nâng cấp tối đa!", 80, y + 32, { size: 20, color: "#a5d6a7" });
        }
        y += 100;
      });
      if (shopFlash) text(shopFlash, 80, y + 8, { size: 18, color: "#ffb347" });
      const shopStock = asItemList(snap && snap.stock);
      if (shopStock.length) {
        text("Kho dư (bỏ sau Shop):", 80, h - 200, { size: 18, color: "#ffd54f" });
        shopStock.slice(0, 8).forEach((it, i) => drawFreshSlot(80 + i * 52, h - 170, 44, it, false));
      }
      text("Esc/P pause · Xong = shop_done", 80, h - 100, { size: 18, color: "#90a4ae" });
      btn("shopDone", "Hoàn tất nâng cấp (Enter)", w / 2 - 140, h - 80, 280, 50);
    }

    function drawSummary(w, h) {
      panel(w * 0.18, h * 0.14, w * 0.64, h * 0.68);
      const s = (snap && snap.summary) || (DEMO ? DEMO_DATA.summary : {});
      text("TỔNG KẾT TOÀN BỘ CHUYẾN ĐI", w / 2, h * 0.24, { size: 36, align: "center", bold: true, color: "#ffe082" });
      const rows = [
        ["Tổng tài sản tích lũy", (s.money !== undefined ? s.money : dash(snap && snap.money)) + "k 💰"],
        ["Tổng điểm đánh giá", dash(s.score !== undefined ? s.score : snap && snap.score) + " điểm"],
        ["Uy tín sau 5 ngày", dash(s.reputation !== undefined ? s.reputation : snap && snap.reputation) + " ⭐"],
        ["Món ăn bán chạy nhất", s.top_dish ? dn(s.top_dish) : "—"],
      ];
      let y = h * 0.38;
      rows.forEach(([a, b]) => { text(a + ":  " + b, w / 2, y, { size: 22, align: "center" }); y += 42; });
      btn("summaryOk", "Về Menu Chính (Enter)", w / 2 - 130, h * 0.80, 260, 48);
    }

    function drawPause(w, h) {
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillRect(0, 0, w, h);
      panel(w / 2 - 190, h / 2 - 140, 380, 280);
      text("TẠM DỪNG GAME", w / 2, h / 2 - 80, { size: 32, align: "center", bold: true, color: "#ffe082" });
      text("Nhấn P hoặc Esc để tiếp tục", w / 2, h / 2 - 36, { size: 18, align: "center", color: "#b0bec5" });

      btn("resume", "▶ Tiếp Tục", w / 2 - 120, h / 2 + 10, 240, 48, { fill: "#00695c", stroke: "#64ffda" });
      btn("toMenu", "Về Menu", w / 2 - 120, h / 2 + 74, 240, 48, { fill: "#3e2723", stroke: "#ef5350" });
    }

    function alertBanner(w, y, label) {
      ctx.save();
      ctx.fillStyle = highContrast ? "#000" : "rgba(0,0,0,0.85)";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(w / 2 - 240, y - 32, 480, 48, 8) : ctx.rect(w / 2 - 240, y - 32, 480, 48);
      ctx.fill();
      ctx.strokeStyle = highContrast ? "#ffe600" : "#ff5252";
      ctx.lineWidth = 3;
      ctx.stroke();
      text(label, w / 2, y + 2, { size: 26, align: "center", bold: true, color: highContrast ? "#ffe600" : "#ffffff" });
      ctx.restore();
    }

    function applyContrastFrame(w, h) {
      if (!highContrast) return;
      ctx.strokeStyle = "#ffe600";
      ctx.lineWidth = 6;
      ctx.strokeRect(3, 3, w - 6, h - 6);
      text("CHẾ ĐỘ TƯƠNG PHẢN CAO · Phím C", w / 2, h - 46, { size: 18, align: "center", bold: true, color: "#ffe600" });
    }

    function overlay(w, h) {
      if (offline && !DEMO) text("Mất kết nối tới máy chủ mô phỏng", w / 2, 30, { align: "center", color: "#ff8a80", size: 18 });
      if (snap && snap.error) text("Luật báo lỗi — xem terminal. Nhấn R để chơi lại.", w / 2, 54, { align: "center", color: "#ff8a80", size: 18 });
      if (snap && snap.finished && uiScreen === "play" && !paused) {
        panel(w / 2 - 220, h / 2 - 60, 440, 130);
        text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc!", w / 2, h / 2 - 14, { align: "center", size: 24, bold: true, color: "#ffe082" });
        text("Lý do: " + (snap.reason || ""), w / 2, h / 2 + 16, { align: "center", size: 18, color: "#cfd8dc" });
        text("Nhấn R để chơi lại · Esc về menu", w / 2, h / 2 + 46, { align: "center", size: 18, color: "#90caf9" });
      }
    }

    // ==========================================
    // MAIN RENDER LOOP (60-120 FPS via requestAnimationFrame)
    // ==========================================

    function frame() {
      requestAnimationFrame(frame);
      const now = performance.now();
      const dt = Math.min(0.1, (now - lastFrame) / 1000);
      lastFrame = now;
      gameTime += dt;
      if (dt > 0) fpsEMA = fpsEMA * 0.92 + (1 / dt) * 0.08;

      updateParticles(dt);
      buttons = [];
      const [w, h] = fit();

      ctx.save();
      // Áp dụng rung màn hình (Screen Shake)
      if (lerpState.screenShake.intensity > 0) {
        ctx.translate(lerpState.screenShake.x, lerpState.screenShake.y);
      }

      ctx.fillStyle = "#0c141c";
      ctx.fillRect(0, 0, w, h);

      if (uiScreen === "menu") drawMenu(w, h);
      else if (uiScreen === "dayIntro") drawDayIntro(w, h);
      else if (uiScreen === "eveningIntro") drawEveningIntro(w, h);
      else if (uiScreen === "dayResult") drawDayResult(w, h);
      else if (uiScreen === "shop") {
        drawShop(w, h);
        if (paused) drawPause(w, h);
      }
      else if (uiScreen === "summary") drawSummary(w, h);
      else if (uiScreen === "play" || DEMO === "pause") {
        if (DEMO === "pause" && !snap) {
          text("(demo pause — mở kèm live để thấy nền game)", w / 2, h / 2 - 160, { align: "center", size: 18, color: "#78909c" });
        } else if (!snap) {
          text(offline ? "Không có kết nối…" : "Đang tải dữ liệu…", w / 2, h / 2, { align: "center", size: 24 });
        } else {
          if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
          eventLog(w, h);
          overlay(w, h);
        }
        if (paused || DEMO === "pause") drawPause(w, h);
      }

      ctx.restore();

      // SFX toggles + phụ đề (ngoài screen-shake)
      drawSfxHudToggles(w, h);
      drawSfxCaptions(w, h);

      // Chỉ số FPS góc màn hình cho Phase 4 Benchmark
      text(Math.round(fpsEMA) + " FPS", 10, h - 18, { size: 18, color: highContrast ? "#ffe600" : "rgba(255,255,255,0.4)" });
      applyContrastFrame(w, h);
    }
    requestAnimationFrame(frame);

    // Xử lý các chế độ Demo đặc biệt
    if (DEMO === "pause") { uiScreen = "play"; paused = true; }
    else if (DEMO === "fresh") applyFreshDemo();
    else if (DEMO === "warn") {
      uiScreen = "play";
      highContrast = true;
      snap = {
        mode: "gather", tick: 40, time_left_ticks: 9000, hold_capacity: 12, hold: [],
        player: { pos: [20, 12], oxygen_ticks: 200, oxygen_max_ticks: 1800, hp: 2, hp_max: 3, at_surface: false },
        nodes: [], fish: [],
        monsters: [{ id: "M1", pos: [22, 12], warn_radius: 10 }],
        events: [],
        meta: { bounds: { x: [0, 100], d: [0, 30] }, dock_pos: [2, 0], dock_radius: 3 },
      };
    } else if (DEMO === "warnq") {
      uiScreen = "play";
      highContrast = true;
      snap = {
        mode: "quan", tick: 80, time_left_ticks: 4000, money: 100, earned: 40, reputation: 3, hand: null,
        player: { pos: [4, 4] }, stock: {}, stoves: [{ id: "B1", pos: [2, 8], state: "idle" }],
        tables: [{ id: "T1", pos: [9, 2] }],
        customers: [{ id: "C1", table_id: "T1", state: "waiting", dish_id: "lau_mam", patience_ticks_left: 400, patience_max_ticks: 3600 }],
        events: [],
        meta: { bounds: { x: [0, 16], z: [0, 10] }, patience_s: 60 },
      };
    } else if (DEMO === "sfx") {
      soundOn = false; // kiểm phụ đề với âm tắt (không ghi đè localStorage)
      captionsOn = true;
      startSfxDemo();
    } else if (DEMO) setScreen(DEMO);
  </script>
</body>

</html>
