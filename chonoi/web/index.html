<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — Út Sen & Nhà Bè Má Tư</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0d151d;
    color: #f0f4f8;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  .screen-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    background-size: cover;
    background-position: center;
  }
  .screen-overlay.active { display: flex; }

  /* UI #1: MAIN MENU */
  #menu-screen {
    background-color: #102536;
    background-image:
      linear-gradient(180deg, rgba(10, 22, 36, 0.35) 0%, rgba(10, 22, 36, 0.78) 100%),
      url("/assets/menu_bg.png");
  }
  .menu-card {
    width: min(560px, 92vw);
    padding: 32px 30px;
    border-radius: 18px;
    background: rgba(11, 22, 34, 0.86);
    border: 2px solid rgba(250, 204, 21, 0.6);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    text-align: center;
  }
  .menu-title {
    margin: 0 0 8px;
    font-size: clamp(30px, 4.5vw, 42px);
    font-weight: 800;
    color: #fde047;
    text-shadow: 0 3px 12px rgba(0, 0, 0, 0.6);
  }
  .menu-sub {
    margin: 0 0 22px;
    color: #cbd5e1;
    font-size: 15px;
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 15px 22px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #f59e0b, #ea580c);
    color: #ffffff;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(234, 88, 12, 0.4);
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .menu-secondary-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .btn-secondary {
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid rgba(148, 163, 184, 0.35);
    background: rgba(30, 41, 59, 0.85);
    color: #f1f5f9;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-secondary:hover { background: rgba(51, 65, 85, 0.95); border-color: #38bdf8; }
  .controls-strip {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    font-size: 12px;
    color: #cbd5e1;
  }
  .kbd {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 5px;
    background: #1e293b;
    border: 1px solid #475569;
    color: #fde047;
    font-weight: 700;
  }

  /* UI #4: SHOP SCREEN */
  #shop-screen {
    background-color: #091521;
    background-image:
      linear-gradient(180deg, rgba(8, 18, 30, 0.48) 0%, rgba(8, 18, 30, 0.86) 100%),
      url("/assets/shop_bg.png");
  }
  .shop-card {
    width: min(740px, 94vw);
    padding: 24px 26px;
    border-radius: 16px;
    background: rgba(11, 22, 34, 0.92);
    border: 2px solid rgba(250, 204, 21, 0.55);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(8px);
  }
  .shop-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.22);
  }
  .shop-title { margin: 0; font-size: 22px; font-weight: 800; color: #fde047; }
  .shop-stats { display: flex; gap: 14px; font-size: 15px; font-weight: 800; }
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    margin: 18px 0;
  }
  .upgrade-card {
    padding: 16px;
    border-radius: 12px;
    background: rgba(30, 41, 59, 0.88);
    border: 1px solid rgba(148, 163, 184, 0.3);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .upgrade-card h3 { margin: 0; font-size: 16px; color: #f8fafc; }
  .upgrade-next { font-size: 14px; color: #7dd3fc; font-weight: 700; }
  .btn-buy {
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    background: #16a34a;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-buy:hover:not(:disabled) { background: #15803d; }
  .btn-buy:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
  .shop-footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid rgba(148, 163, 184, 0.22);
  }

  /* QUICK HUD BUTTONS */
  #hud-quick-bar {
    position: fixed;
    top: 14px;
    right: 18px;
    display: none;
    gap: 6px;
    z-index: 15;
  }
  #hud-quick-bar.active { display: flex; }
  .hud-mini-btn {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(148, 163, 184, 0.35);
    background: rgba(15, 23, 42, 0.88);
    color: #e2e8f0;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .hud-mini-btn:hover { border-color: #fde047; color: #fde047; }
  .hud-mini-btn.skip { border-color: rgba(250, 204, 21, 0.55); color: #fde047; }

  /* PAUSE / FINISHED MODAL */
  #modal-screen { background: rgba(5, 10, 18, 0.72); z-index: 30; }
  .modal-card {
    width: min(420px, 92vw);
    padding: 26px 28px;
    border-radius: 14px;
    background: rgba(11, 22, 34, 0.96);
    border: 2px solid rgba(56, 189, 248, 0.65);
    text-align: center;
  }
  .modal-card h2 { margin: 0 0 10px; color: #fde047; font-size: 22px; }
  .modal-card p { margin: 6px 0; color: #e2e8f0; font-size: 14px; }
  .modal-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- QUICK HUD CONTROLS -->
<div id="hud-quick-bar">
  <button class="hud-mini-btn skip" id="btn-hud-skip" title="Kết thúc ca sớm (Phím F)">⏭ Xong ca [F]</button>
  <button class="hud-mini-btn" id="btn-hud-pause" title="Tạm dừng (P / Esc)">⏸ [P]</button>
  <button class="hud-mini-btn" id="btn-hud-audio" title="Bật/tắt nhạc (M)">🔇</button>
  <button class="hud-mini-btn" id="btn-hud-menu" title="Về Menu chính">🏠</button>
</div>

<!-- UI #1: MAIN MENU -->
<div id="menu-screen" class="screen-overlay active">
  <div class="menu-card">
    <h1 class="menu-title">QUÁN ĂN CHỢ NỔI</h1>
    <p class="menu-sub">Út Sen & Nhà Bè Má Tư · Sông Chín Khúc</p>

    <button class="btn-primary" id="btn-start-day">▶ BẮT ĐẦU CHƠI</button>

    <div class="menu-secondary-row">
      <button class="btn-secondary" id="btn-start-gather">🤿 Lặn Sông</button>
      <button class="btn-secondary" id="btn-start-quan">🏮 Mở Quán</button>
    </div>

    <div class="controls-strip">
      <span><span class="kbd">WASD</span> Di chuyển</span>
      <span><span class="kbd">E</span> Hái / Bến / Nấu / Phục vụ</span>
      <span><span class="kbd">Space</span> Bắt cá</span>
      <span><span class="kbd">F</span> Xong ca sớm</span>
      <span><span class="kbd">P</span> Tạm dừng</span>
    </div>
  </div>
</div>

<!-- UI #4: SHOP -->
<div id="shop-screen" class="screen-overlay">
  <div class="shop-card">
    <div class="shop-header">
      <h2 class="shop-title" id="shop-title">🛒 CỬA HÀNG NÂNG CẤP</h2>
      <div class="shop-stats">
        <span style="color:#f8fafc" id="shop-timer">⏱ 0:10</span>
        <span style="color:#4ade80" id="shop-money">💰 0k</span>
        <span style="color:#facc15" id="shop-rep">★ 3.0</span>
        <span style="color:#7dd3fc" id="shop-score">🏆 0</span>
      </div>
    </div>

    <div class="shop-grid" id="shop-upgrades-grid"></div>

    <div class="shop-footer">
      <div style="display:flex; gap:8px;">
        <button class="btn-secondary" id="btn-shop-pause">⏸ [P]</button>
        <button class="btn-secondary" id="btn-shop-menu">🏠 Menu</button>
      </div>
      <button class="btn-primary" id="btn-shop-done" style="width:auto; padding:11px 22px; font-size:15px;">
        ✓ Sang Ngày Tiếp Theo [F / Enter]
      </button>
    </div>
  </div>
</div>

<!-- PAUSE / SUMMARY MODAL -->
<div id="modal-screen" class="screen-overlay">
  <div class="modal-card">
    <h2 id="modal-title">⏸ TẠM DỪNG</h2>
    <p id="modal-desc"></p>
    <p id="modal-stats" style="color:#7dd3fc; font-weight:700;"></p>
    <div class="modal-actions">
      <button class="btn-primary" id="btn-modal-resume">▶ Tiếp tục [P]</button>
      <button class="btn-secondary" id="btn-modal-restart">↻ Chơi lại [R]</button>
      <button class="btn-secondary" id="btn-modal-menu">🏠 Menu chính</button>
    </div>
  </div>
</div>

<script>
"use strict";
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

const menuScreen = document.getElementById("menu-screen");
const shopScreen = document.getElementById("shop-screen");
const modalScreen = document.getElementById("modal-screen");
const hudQuickBar = document.getElementById("hud-quick-bar");
const btnHudAudio = document.getElementById("btn-hud-audio");

let snap = null;
let offline = false;
let highContrast = false;
let uiState = "menu";
let lastShopRenderKey = "";
let toast = { text: "", until: 0, color: "#4ade80" };
let lastEventTickSeen = -1;

// Camera mượt tập trung & phóng to theo nhân vật khi bơi (gather)
const cam = { x: 10, y: 2, zoom: 2.3, ready: false };
const bubbles = [];

// ---------- 1. HỆ THỐNG TÀI NGUYÊN & ÂM THANH ----------
const ASSET_MANIFEST = {
  images: {
    menuBg: "/assets/menu_bg.png",
    gatherBg: "/assets/gather_bg.png",
    quanBg: "/assets/quan_bg.png",
    shopBg: "/assets/shop_bg.png",
    utSen: "/assets/ut_sen.png",
    fish_ca_linh: "/assets/fish_ca_linh.png",
    fish_ca_loc: "/assets/fish_ca_loc.png",
    fish_ca_keo: "/assets/fish_ca_keo.png",
    node_bong_dien_dien: "/assets/node_bong_dien_dien.png",
    node_bong_sung: "/assets/node_bong_sung.png",
    node_keo_neo: "/assets/node_keo_neo.png",
    stove: "/assets/stove.png",
    table: "/assets/table.png",
    customer: "/assets/customer.png"
  },
  audio: {
    bgmGather: "/assets/bgm_gather.mp3",
    bgmQuan: "/assets/bgm_quan.mp3"
  }
};

const loadedImages = {};
const loadedAudio = {};
let audioMuted = true;
let activeBgmKey = null;

function initAssets() {
  Object.entries(ASSET_MANIFEST.images).forEach(([key, url]) => {
    const img = new Image();
    img.onload = () => { loadedImages[key] = img; };
    img.onerror = () => { loadedImages[key] = null; };
    img.src = url;
  });
  Object.entries(ASSET_MANIFEST.audio).forEach(([key, url]) => {
    const aud = new Audio();
    aud.loop = true;
    aud.volume = 0.45;
    aud.preload = "none";
    aud.src = url;
    aud.onerror = () => { loadedAudio[key] = null; };
    loadedAudio[key] = aud;
  });
}
initAssets();

function syncBgm() {
  if (!snap || uiState === "menu") return;
  const phase = snap.phase || snap.mode;
  const wantKey = phase === "quan" || phase === "shop" ? "bgmQuan" : "bgmGather";
  if (audioMuted) {
    Object.values(loadedAudio).forEach((a) => { if (a && !a.paused) a.pause(); });
    return;
  }
  if (activeBgmKey && activeBgmKey !== wantKey && loadedAudio[activeBgmKey]) loadedAudio[activeBgmKey].pause();
  activeBgmKey = wantKey;
  const aud = loadedAudio[wantKey];
  if (aud && aud.paused) aud.play().catch(() => {});
}

function toggleAudio() {
  audioMuted = !audioMuted;
  btnHudAudio.textContent = audioMuted ? "🔇" : "🔊";
  syncBgm();
}

function showToast(msg, color = "#4ade80", ms = 1800) {
  toast = { text: msg, until: performance.now() + ms, color };
}

// ---------- 2. ĐIỀU KHIỂN & API MÁY CHỦ ----------
const down = new Set();
const CODE_TO_MOVE = {
  KeyW: "u", ArrowUp: "u", KeyS: "d", ArrowDown: "d",
  KeyA: "l", ArrowLeft: "l", KeyD: "r", ArrowRight: "r"
};
const KEY_TO_MOVE = {
  w: "u", "ư": "u", arrowup: "u", s: "d", arrowdown: "d",
  a: "l", "ă": "l", "â": "l", arrowleft: "l", d: "r", "đ": "r", arrowright: "r"
};
let queue = [], inflight = false, lastSent = "";

function activePhase() {
  return snap ? (snap.phase || snap.mode || "gather") : "gather";
}

function currentInput(overrides = {}) {
  const phase = activePhase();
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (phase === "quan") dy = -dy;
  const payload = {
    move: [dx, dy],
    interact: overrides.interact !== undefined ? overrides.interact : down.has("interact"),
    catch: overrides.catch !== undefined ? overrides.catch : down.has("catch"),
    pause: overrides.pause !== undefined ? overrides.pause : false,
    shop_done: overrides.shop_done !== undefined ? overrides.shop_done : false
  };
  if (overrides.buy) payload.buy = overrides.buy;
  return payload;
}

function enqueuePayload(obj, force = false) {
  const s = JSON.stringify(obj);
  if (!force && s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}

function pushInput() { enqueuePayload(currentInput()); }

async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) {}
  }
  inflight = false;
}

function triggerPulseButton(btnName) {
  enqueuePayload(currentInput({ [btnName]: false }), true);
  enqueuePayload(currentInput({ [btnName]: true }), true);
  enqueuePayload(currentInput({ [btnName]: false }), true);
}

function sendBuyUpgrade(upgradeKey) {
  enqueuePayload(currentInput({ buy: upgradeKey }), true);
}

async function skipCurrentPhase() {
  try {
    await fetch("/skip_phase", { method: "POST" });
    showToast("⏭ Đã kết thúc ca sớm!", "#fde047", 1500);
  } catch (e) {}
}

async function startMode(mode, opts = {}) {
  down.clear();
  lastSent = "";
  cam.ready = false;
  lastEventTickSeen = -1;
  try {
    await fetch("/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode,
        days: opts.days ?? (mode === "day" ? 5 : 1),
        sample_stock: !!opts.sample_stock
      })
    });
  } catch (e) {}
  uiState = "playing";
  lastShopRenderKey = "";
  syncOverlays();
}

function returnToMenu() {
  down.clear();
  enqueuePayload({ move: [0, 0], interact: false, catch: false, pause: false, shop_done: false }, true);
  uiState = "menu";
  syncOverlays();
}

document.getElementById("btn-start-day").addEventListener("click", () => startMode("day", { days: 5 }));
document.getElementById("btn-start-gather").addEventListener("click", () => startMode("gather"));
document.getElementById("btn-start-quan").addEventListener("click", () => startMode("quan", { sample_stock: true }));

document.getElementById("btn-hud-skip").addEventListener("click", skipCurrentPhase);
document.getElementById("btn-hud-pause").addEventListener("click", () => triggerPulseButton("pause"));
document.getElementById("btn-hud-audio").addEventListener("click", toggleAudio);
document.getElementById("btn-hud-menu").addEventListener("click", returnToMenu);

document.getElementById("btn-shop-done").addEventListener("click", () => triggerPulseButton("shop_done"));
document.getElementById("btn-shop-pause").addEventListener("click", () => triggerPulseButton("pause"));
document.getElementById("btn-shop-menu").addEventListener("click", returnToMenu);

document.getElementById("btn-modal-resume").addEventListener("click", () => triggerPulseButton("pause"));
document.getElementById("btn-modal-restart").addEventListener("click", () => {
  fetch("/restart", { method: "POST" });
  lastSent = "";
  down.clear();
  cam.ready = false;
});
document.getElementById("btn-modal-menu").addEventListener("click", returnToMenu);

function resolveAction(e) {
  const code = e.code || "";
  if (CODE_TO_MOVE[code]) return { type: "move", dir: CODE_TO_MOVE[code] };
  if (code === "KeyE") return { type: "button", btn: "interact" };
  if (code === "Space") return { type: "button", btn: "catch" };
  if (code === "KeyF") return { type: "skip" };
  if (code === "KeyP" || code === "Escape") return { type: "pause" };
  if (code === "Enter") return { type: "enter" };
  if (code === "Digit1") return { type: "digit", idx: 0 };
  if (code === "Digit2") return { type: "digit", idx: 1 };
  if (code === "KeyR") return { type: "restart" };
  if (code === "KeyM") return { type: "mute" };
  if (code === "KeyH") return { type: "contrast" };

  const k = (e.key || "").toLowerCase();
  if (KEY_TO_MOVE[k]) return { type: "move", dir: KEY_TO_MOVE[k] };
  if (k === "e" || k === "ê") return { type: "button", btn: "interact" };
  if (k === " ") return { type: "button", btn: "catch" };
  if (k === "f") return { type: "skip" };
  if (k === "p") return { type: "pause" };
  if (k === "r") return { type: "restart" };
  if (k === "m") return { type: "mute" };
  if (k === "h") return { type: "contrast" };
  return null;
}

addEventListener("keydown", (e) => {
  const act = resolveAction(e);
  if (!act) return;
  if (uiState === "menu") {
    if (act.type === "enter") startMode("day", { days: 5 });
    return;
  }
  if (act.type === "move" || act.type === "button" || act.type === "pause") e.preventDefault();
  if (e.repeat) return;

  const phase = activePhase();
  if (act.type === "pause") {
    if (snap && !snap.finished) triggerPulseButton("pause");
    return;
  }
  if (act.type === "skip") {
    if (snap && !snap.finished) skipCurrentPhase();
    return;
  }
  if (phase === "shop" && snap && !snap.finished && snap.state !== "paused") {
    if (act.type === "enter" || (act.type === "button" && act.btn === "interact")) {
      triggerPulseButton("shop_done");
      return;
    }
    if (act.type === "digit") {
      const keys = Object.keys((snap.meta && snap.meta.shop && snap.meta.shop.upgrades) || {});
      if (keys[act.idx]) sendBuyUpgrade(keys[act.idx]);
      return;
    }
  }

  if (act.type === "move") {
    down.add(act.dir);
    pushInput();
  } else if (act.type === "button") {
    if (down.has(act.btn)) {
      down.delete(act.btn);
      enqueuePayload(currentInput({ [act.btn]: false }), true);
    }
    down.add(act.btn);
    enqueuePayload(currentInput({ [act.btn]: true }), true);
  } else if (act.type === "restart") {
    fetch("/restart", { method: "POST" });
    lastSent = "";
    down.clear();
    cam.ready = false;
  } else if (act.type === "mute") {
    toggleAudio();
  } else if (act.type === "contrast") {
    highContrast = !highContrast;
  }
});

addEventListener("keyup", (e) => {
  const act = resolveAction(e);
  if (!act) return;
  if (act.type === "move") { down.delete(act.dir); pushInput(); }
  else if (act.type === "button") { down.delete(act.btn); enqueuePayload(currentInput({ [act.btn]: false })); }
});

function clearAllInputs() {
  if (!down.size && !lastSent) return;
  down.clear();
  enqueuePayload({ move: [0, 0], interact: false, catch: false, pause: false, shop_done: false });
}
addEventListener("blur", clearAllInputs);
document.addEventListener("visibilitychange", () => { if (document.hidden) clearAllInputs(); });

// ---------- 3. POLL SNAPSHOT & TOAST GỌN NHẸ ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    checkKeyEvents(snap.events || []);
    syncBgm();
    syncOverlays();
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

function checkKeyEvents(evs) {
  if (!evs.length) return;
  const last = evs[evs.length - 1];
  if (last.tick <= lastEventTickSeen) return;
  lastEventTickSeen = last.tick;
  const d = last.data || {};
  if (last.name === "gather") showToast(`+${d.amount} ${kName(d.kind)}`, "#4ade80");
  else if (last.name === "fish_caught") showToast(`+${d.yield} ${kName(d.kind)}`, "#38bdf8");
  else if (last.name === "hold_full") showToast("Giỏ đầy!", "#ef4444");
  else if (last.name === "paid") showToast(`+${d.amount}k`, "#4ade80");
  else if (last.name === "bought") showToast(`Đã mua ${d.upgrade} cấp ${d.level}`, "#4ade80");
  else if (last.name === "buy_failed") showToast("Không thể mua!", "#ef4444");
}

const UPGRADE_LABELS = {

function renderShopUI() {
  if (!snap) return;
  const dayStr = snap.day ? `NGÀY ${snap.day}/${snap.days_total || 5}` : "";
  document.getElementById("shop-title").textContent = `🛒 CỬA HÀNG ${dayStr}`;
  document.getElementById("shop-timer").textContent = `⏱ ${fmtTime(snap.time_left_ticks)}`;
  document.getElementById("shop-money").textContent = `💰 ${snap.money ?? 0}k`;
  document.getElementById("shop-rep").textContent = `★ ${(snap.reputation ?? 3.0).toFixed(1)}`;
  document.getElementById("shop-score").textContent = `🏆 ${snap.score ?? 0}`;

  const upgradesCfg = (snap.meta && snap.meta.shop && snap.meta.shop.upgrades) || {};
  const boughtMap = snap.upgrades || {};
  const renderKey = JSON.stringify({ money: snap.money, boughtMap, upgradesCfg });
  if (renderKey === lastShopRenderKey) return;
  lastShopRenderKey = renderKey;

  const grid = document.getElementById("shop-upgrades-grid");
  grid.innerHTML = "";
  Object.entries(upgradesCfg).forEach(([key, levels], idx) => {
    const curLv = boughtMap[key] || 0;
    const nextSpec = levels.find((lv) => lv.level === curLv + 1) || null;
    const metaInfo = UPGRADE_LABELS[key] || { title: key, unit: () => "" };

    const card = document.createElement("div");
    card.className = "upgrade-card";
    card.innerHTML = `<h3>${metaInfo.title} (Cấp ${curLv})</h3>`;

    const pNext = document.createElement("div");
    pNext.className = "upgrade-next";
    if (nextSpec) pNext.textContent = `→ ${metaInfo.unit(nextSpec)} · ${nextSpec.price}k`;
    else { pNext.style.color = "#4ade80"; pNext.textContent = "✓ Tối đa"; }
    card.appendChild(pNext);

    const btn = document.createElement("button");
    btn.className = "btn-buy";
    if (!nextSpec) { btn.disabled = true; btn.textContent = "Tối đa"; }
    else if ((snap.money ?? 0) < nextSpec.price) { btn.disabled = true; btn.textContent = `Thiếu ${nextSpec.price - (snap.money ?? 0)}k`; }
    else {
      btn.textContent = `Mua (${nextSpec.price}k) [${idx + 1}]`;
      btn.addEventListener("click", () => sendBuyUpgrade(key));
    }
    card.appendChild(btn);
    grid.appendChild(card);
  });
}

// ---------- 4. TIỆN ÍCH ID & MỤC TIÊU KHỚP SIM ----------
function idKey(idStr) {
  const s = String(idStr || "");
  let i = s.length;
  while (i > 0 && s.charCodeAt(i - 1) >= 48 && s.charCodeAt(i - 1) <= 57) i--;
  return { prefix: s.slice(0, i), num: i < s.length ? parseInt(s.slice(i), 10) : -1, raw: s };
}
function cmpIdKey(a, b) {
  const ka = idKey(a), kb = idKey(b);
  if (ka.prefix !== kb.prefix) return ka.prefix < kb.prefix ? -1 : 1;
  if (ka.num !== kb.num) return ka.num - kb.num;
  return ka.raw < kb.raw ? -1 : (ka.raw > kb.raw ? 1 : 0);
}

function findGatherInteractTarget(p, nodes, meta) {
  if (!p || !p.pos) return null;
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  if (Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= dr) return { kind: "dock" };
  const surfDepth = meta.surface_depth ?? 0.5;
  const atSurface = p.at_surface !== undefined ? p.at_surface : (p.pos[1] <= surfDepth);
  if (!atSurface) return null;
  const radius = meta.interact_radius || 2.0;
  const ready = [];
  (nodes || []).forEach((n) => {
    if (n.ready !== false && (n.regrow_ticks ?? 0) === 0) {
      const d = Math.hypot(p.pos[0] - n.pos[0], p.pos[1] - n.pos[1]);
      if (d <= radius) ready.push({ d, node: n });
    }
  });
  if (!ready.length) return null;
  ready.sort((a, b) => (a.d !== b.d ? a.d - b.d : cmpIdKey(a.node.id, b.node.id)));
  return { kind: "node", node: ready[0].node };
}

function findGatherCatchTarget(p, fishList, meta) {
  if (!p || !p.pos) return null;
  const surfDepth = meta.surface_depth ?? 0.5;
  const atSurface = p.at_surface !== undefined ? p.at_surface : (p.pos[1] <= surfDepth);
  if (atSurface) return null;
  const radius = meta.catch_radius || 2.0;
  const inRadius = [];
  (fishList || []).forEach((f) => {
    const d = Math.hypot(p.pos[0] - f.pos[0], p.pos[1] - f.pos[1]);
    if (d <= radius) inRadius.push({ d, fish: f });
  });
  if (!inRadius.length) return null;
  inRadius.sort((a, b) => (a.d !== b.d ? a.d - b.d : cmpIdKey(a.fish.id, b.fish.id)));
  return { kind: "fish", fish: inRadius[0].fish };
}

function findQuanInteractTarget(p, stoves, tables, meta) {
  if (!p || !p.pos) return null;
  const radius = meta.interact_radius || 1.5;
  const cands = [];
  (stoves || []).forEach((s) => {
    const d = Math.hypot(p.pos[0] - s.pos[0], p.pos[1] - s.pos[1]);
    if (d <= radius) cands.push({ d, prio: 0, id: s.id, kind: "stove", target: s });
  });
  (tables || []).forEach((tb) => {
    const d = Math.hypot(p.pos[0] - tb.pos[0], p.pos[1] - tb.pos[1]);
    if (d <= radius) cands.push({ d, prio: 1, id: tb.id, kind: "table", target: tb });
  });
  if (!cands.length) return null;
  cands.sort((a, b) => (a.d !== b.d ? a.d - b.d : (a.prio !== b.prio ? a.prio - b.prio : cmpIdKey(a.id, b.id))));
  return cands[0];
}

function findOldestReservedCustomer(customers) {
  const res = (customers || []).filter((c) => c.state === "waiting" && c.order_status === "reserved");
  if (!res.length) return null;
  res.sort((a, b) => ((a.order_tick ?? 0) !== (b.order_tick ?? 0) ? (a.order_tick ?? 0) - (b.order_tick ?? 0) : cmpIdKey(a.table_id, b.table_id)));
  return res[0];
}

const KIND_COLOR = { ca_loc: "#6c9a4b", ca_linh: "#8ecae6", ca_keo: "#d9a066", bong_dien_dien: "#f6c945", bong_sung: "#ec6f98", keo_neo: "#8fcf6b" };

const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const kName = (k) => KIND_NAME[k] || k;
function dShort(d) {

  return (cat[d] && cat[d].name) || (DEFAULT_DISH_INFO[d] && DEFAULT_DISH_INFO[d].name) || d || "Món";

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}

function text(s, x, y, o = {}) {
  ctx.font = (o.weight ? o.weight + " " : "") + (o.size || 14) + "px system-ui, -apple-system, sans-serif";
  ctx.fillStyle = o.color || "#f0f4f8";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}

function roundRect(x, y, w, h, r = 8) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

function panel(x, y, w, h, bg = "rgba(11, 22, 33, 0.88)", border = "rgba(255,255,255,0.2)", r = 10) {
  roundRect(x, y, w, h, r);
  ctx.fillStyle = highContrast ? "#000000" : bg;
  ctx.fill();
  if (border) { ctx.strokeStyle = highContrast ? "#ffffff" : border; ctx.lineWidth = highContrast ? 2 : 1; ctx.stroke(); }
}

function bar(x, y, w, h, frac, color, label, opts = {}) {
  const f = Math.max(0, Math.min(1, Number.isFinite(frac) ? frac : 0));
  roundRect(x, y, w, h, opts.radius ?? 5);
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fill();
  if (f > 0) { roundRect(x, y, Math.max(4, w * f), h, opts.radius ?? 5); ctx.fillStyle = color; ctx.fill(); }
  if (opts.marker > 0 && opts.marker < 1) {
    const mx = x + w * opts.marker;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mx, y); ctx.lineTo(mx, y + h); ctx.stroke();
  }
  roundRect(x, y, w, h, opts.radius ?? 5);
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1; ctx.stroke();
  if (label) text(label, x + w / 2, y + h / 2 + 4, { size: opts.fontSize || 12, weight: "700", align: "center", color: "#fff" });
}

function badge(x, y, label, bg, fg = "#fff", size = 12) {
  ctx.font = `700 ${size}px system-ui, sans-serif`;
  const tw = ctx.measureText(label).width + 16;
  const th = size + 10;
  roundRect(x - tw / 2, y, tw, th, th / 2);
  ctx.fillStyle = highContrast ? "#000" : bg;
  ctx.fill();
  ctx.strokeStyle = highContrast ? fg : "rgba(255,255,255,0.3)";
  ctx.lineWidth = 1;
  ctx.stroke();
  text(label, x, y + th - 6, { size, weight: "700", align: "center", color: fg });
}

function fmtTime(ticks) {
  const s = Math.max(0, Math.ceil((ticks ?? 0) / 60));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function drawUtSen(px, py, radius, headingDeg, opts = {}) {
  const sprite = loadedImages.utSen;
  if (sprite) {
    ctx.save();
    ctx.translate(px, py);
    const rad = ((headingDeg || 0) * Math.PI) / 180;
    const facingLeft = opts.flipByHeading && Math.cos(rad) < -0.1;
    if (facingLeft) ctx.scale(-1, 1);
    const sz = radius * 3.1;
    ctx.drawImage(sprite, -sz / 2, -sz / 2, sz, sz);
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = "#f97316";
  ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

// ============================================================================
// UI #2: RIVER — DIVING (CAMERA PHÓNG TO TẬP TRUNG NHÂN VẬT + CÁ BƠI + HUD GỌN)
// ============================================================================
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 7.0;
  const top = 62, bottom = 64;
  const viewH = Math.max(200, h - top - bottom);

  const p = snap.player;
  const surfDepth = meta.surface_depth ?? 0.5;
  const atSurface = p ? (p.at_surface !== undefined ? p.at_surface : p.pos[1] <= surfDepth) : true;
  const speed = p && p.vel ? Math.hypot(p.vel[0], p.vel[1]) : 0;

  // Hiệu ứng phóng to, tập trung vào Út Sen khi đang bơi / lặn
  const baseScale = Math.max(12, Math.min(w / 46, viewH / 20));
  const targetZoom = !atSurface ? (speed > 0.3 ? 1.55 : 1.38) : (speed > 0.3 ? 1.28 : 1.15);
  if (!cam.ready && p && p.pos) {
    cam.x = p.pos[0];
    cam.y = p.pos[1];
    cam.zoom = targetZoom;
    cam.ready = true;
  }
  if (p && p.pos) {
    cam.x += (p.pos[0] - cam.x) * 0.12;
    cam.y += (p.pos[1] - cam.y) * 0.12;
  }
  cam.zoom += (targetZoom - cam.zoom) * 0.06;

  const s = baseScale * cam.zoom;
  const halfVisX = (w / 2) / s;
  const halfVisY = (viewH / 2) / s;
  const minCamX = Math.min(X / 2, halfVisX - 2);
  const maxCamX = Math.max(X / 2, X - halfVisX + 2);
  const minCamY = Math.min((D - SKY) / 2, -SKY + halfVisY);
  const maxCamY = Math.max((D - SKY) / 2, D - halfVisY + 1);
  const cx = Math.max(minCamX, Math.min(maxCamX, cam.x));
  const cy = Math.max(minCamY, Math.min(maxCamY, cam.y));

  const sx = (x) => w / 2 + (x - cx) * s;
  const sy = (d) => top + viewH / 2 + (d - cy) * s;

  // Clip vùng chơi giữa top và bottom
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, top, w, viewH);
  ctx.clip();

  // Hình nền sông Chín Khúc tự tạo (canh đường chân trời khớp chính xác d = 0)
  const worldLeft = sx(-2), worldW = (X + 4) * s;
  const skyTop = sy(-SKY), waterLine = sy(0), waterBot = sy(D + 2);
  if (loadedImages.gatherBg) {
    const img = loadedImages.gatherBg;
    const horizonY = Math.round(img.height * 0.50);
    ctx.drawImage(img, 0, 0, img.width, horizonY, worldLeft, skyTop, worldW, Math.max(1, waterLine - skyTop));
    ctx.drawImage(img, 0, horizonY, img.width, img.height - horizonY, worldLeft, waterLine, worldW, Math.max(1, waterBot - waterLine));
  } else {
    ctx.fillStyle = "#f9c5b8"; ctx.fillRect(worldLeft, skyTop, worldW, waterLine - skyTop);
    ctx.fillStyle = "#13455c"; ctx.fillRect(worldLeft, waterLine, worldW, waterBot - waterLine);
  }

  // Đường mặt nước d = 0
  ctx.strokeStyle = "rgba(224, 247, 250, 0.85)";
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(sx(0), waterLine); ctx.lineTo(sx(X), waterLine); ctx.stroke();

  const hold = snap.hold || [];
  const cap = snap.hold_capacity || meta.hold_capacity || 12;
  const freeSpace = Math.max(0, cap - hold.length);
  const interactTarget = findGatherInteractTarget(p, snap.nodes, meta);
  const catchTarget = findGatherCatchTarget(p, snap.fish, meta);

  // Bến nhà sàn
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  const dockTargeted = interactTarget && interactTarget.kind === "dock";
  ctx.fillStyle = "#5c3d24";
  ctx.fillRect(sx(dp[0] - 1.2), sy(-0.4), 0.28 * s, 2.0 * s);
  ctx.fillRect(sx(dp[0] + 0.9), sy(-0.4), 0.28 * s, 2.0 * s);
  ctx.fillStyle = "#8d6e4b";
  ctx.fillRect(sx(dp[0] - 1.6), sy(-0.7), 3.2 * s, 0.7 * s);
  ctx.fillStyle = "#b45309";
  ctx.beginPath();
  ctx.moveTo(sx(dp[0] - 2.0), sy(-0.7));
  ctx.lineTo(sx(dp[0]), sy(-2.5));
  ctx.lineTo(sx(dp[0] + 2.0), sy(-0.7));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = dockTargeted ? "#4ade80" : "rgba(253, 224, 71, 0.75)";
  ctx.lineWidth = dockTargeted ? 3 : 1.5;
  ctx.setLineDash(dockTargeted ? [] : [6, 5]);
  ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // Bụi bông (sprites tự tạo, không text rác)
  const regrowMax = (meta.regrow_s || 20) * 60;
  const nodeYield = meta.node_yield || 1;
  (snap.nodes || []).forEach((n) => {
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
    const ready = n.ready !== false && (n.regrow_ticks ?? 0) === 0;
    const isTarget = interactTarget && interactTarget.kind === "node" && interactTarget.node.id === n.id;
    const sprite = loadedImages["node_" + n.kind];

    if (isTarget) {
      ctx.strokeStyle = freeSpace >= nodeYield ? "#4ade80" : "#ef4444";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(nx, ny, 1.3 * s, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.globalAlpha = ready ? 1 : 0.35;
    if (sprite) {
      ctx.drawImage(sprite, nx - 1.15 * s, ny - 1.3 * s, 2.3 * s, 2.3 * s);
    } else {
      ctx.fillStyle = kc(n.kind);
      ctx.beginPath(); ctx.arc(nx, ny - 0.2 * s, 0.6 * s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (!ready && n.regrow_ticks > 0) {
      bar(nx - 0.9 * s, ny + 0.55 * s, 1.8 * s, 7, 1 - n.regrow_ticks / regrowMax, "#84cc16");
    } else if (isTarget) {
      badge(nx, ny - 2.2 * s, freeSpace >= nodeYield ? "[E] Hái" : "Giỏ đầy", freeSpace >= nodeYield ? "#15803d" : "#991b1b", "#fff", 13);
    }
  });

  // Đàn cá chuyển động (sprites tự tạo, tự lật hướng theo heading_deg)
  const fishYieldMap = meta.fish_yield || { ca_linh: 3, ca_loc: 1, ca_keo: 2 };
  (snap.fish || []).forEach((f) => {
    const fx = sx(f.pos[0]), fy = sy(f.pos[1]);
    const yld = fishYieldMap[f.kind] || 1;
    const isTarget = catchTarget && catchTarget.kind === "fish" && catchTarget.fish.id === f.id;
    const sprite = loadedImages["fish_" + f.kind];

    if (isTarget) {
      const canCatch = ((p && p.catch_cd_ticks) || 0) === 0 && freeSpace >= yld;
      ctx.strokeStyle = canCatch ? "#38bdf8" : "#ef4444";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(fx, fy, 1.4 * s, 0, Math.PI * 2); ctx.stroke();
    }

    const rad = ((f.heading_deg || 0) * Math.PI) / 180;
    const facingLeft = Math.cos(rad) < 0;
    ctx.save();
    ctx.translate(fx, fy);
    if (facingLeft) ctx.scale(-1, 1);
    const tilt = Math.sin(rad) * 0.25;
    ctx.rotate(tilt);
    if (sprite) {
      const fw = f.kind === "ca_loc" ? 2.8 * s : 2.2 * s;
      const fh = f.kind === "ca_loc" ? 1.8 * s : 1.5 * s;
      ctx.drawImage(sprite, -fw / 2, -fh / 2, fw, fh);
    } else {
      ctx.fillStyle = kc(f.kind);
      ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    if (isTarget) {
      const cd = (p && p.catch_cd_ticks) || 0;
      const label = cd > 0 ? "⏳ Hồi" : (freeSpace < yld ? "Giỏ đầy" : `[Space] Bắt ×${yld}`);
      const bg = cd > 0 ? "#b45309" : (freeSpace < yld ? "#991b1b" : "#0284c7");
      badge(fx, fy - 1.9 * s, label, bg, "#fff", 13);
    }
  });

  // Thủy quái (Phase 2)
  let monsterNear = false;
  (snap.monsters || []).forEach((m) => {
    const mx = sx(m.pos[0]), my = sy(m.pos[1]);
    if (p && p.pos && p.pos[1] >= 10 && Math.hypot(p.pos[0] - m.pos[0], p.pos[1] - m.pos[1]) <= 10) monsterNear = true;
    ctx.fillStyle = m.state === "chase" ? "#dc2626" : "#4d7c0f";
    ctx.beginPath(); ctx.ellipse(mx, my, 1.5 * s, 0.65 * s, 0, 0, Math.PI * 2); ctx.fill();
  });

  // Bọt khí khi Út Sen bơi dưới nước
  if (p && p.pos && !atSurface && speed > 0.3 && Math.random() < 0.35) {
    bubbles.push({ x: p.pos[0], y: p.pos[1], r: 2 + Math.random() * 4, life: 1.0 });
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const bb = bubbles[i];
    bb.y -= 0.03;
    bb.life -= 0.025;
    if (bb.life <= 0) { bubbles.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(224, 247, 250, ${bb.life * 0.7})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sx(bb.x), sy(bb.y), bb.r, 0, Math.PI * 2); ctx.stroke();
  }

  // Nhân vật Út Sen
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (!atSurface && meta.catch_radius) {
      ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (!((p.invuln_ticks || 0) > 0 && Math.floor(snap.tick / 5) % 2)) {
      drawUtSen(px, py, Math.max(8, 0.78 * s), p.heading_deg || 0, { flipByHeading: true });
    }
    if (dockTargeted) badge(px, py - 2.1 * s, "[E] Cập bến", "#ca8a04", "#fff", 13);

    // Hiệu ứng vignette tập trung ánh sáng vào nhân vật khi lặn sâu
    if (!atSurface) {
      const depthAlpha = Math.min(0.48, (p.pos[1] / D) * 0.55);
      const vg = ctx.createRadialGradient(px, py, 2.5 * s, px, py, Math.max(w, viewH) * 0.62);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, `rgba(2, 12, 24, ${depthAlpha})`);
      ctx.fillStyle = vg;
      ctx.fillRect(0, top, w, viewH);
    }
  }

  if (monsterNear) {
    ctx.strokeStyle = "rgba(168, 85, 247, 0.85)";
    ctx.lineWidth = 8;
    ctx.strokeRect(4, top + 4, w - 8, viewH - 8);
    badge(w / 2, top + 14, "🐊 THỦY QUÁI!", "#7e22ce", "#fff", 14);
  }
  ctx.restore();

  // --- HUD TRÊN GỌN GÀNG (CHỈ THÔNG TIN CƠ BẢN) ---
  panel(10, 8, w - 20, 48, "rgba(11, 22, 33, 0.9)", "rgba(148, 163, 184, 0.22)", 10);
  const lowTime = (snap.time_left_ticks ?? 0) <= 30 * 60;
  let curX = 22;
  if (snap.day) {
    text(`N${snap.day}`, curX, 38, { size: 16, weight: "800", color: "#fde047" });
    curX += 40;
  }
  text("⏱ " + fmtTime(snap.time_left_ticks), curX, 39, { size: 20, weight: "800", color: lowTime ? "#f87171" : "#f8fafc" });
  curX += 105;

  if (p) {
    const oxyMax = p.oxygen_max_ticks || ((meta.oxygen_max_s || 30) * 60);
    const oxy = p.oxygen_ticks ?? oxyMax;
    const oxyFrac = oxy / oxyMax;
    bar(curX, 20, 175, 24, oxyFrac, oxyFrac <= 0.25 ? "#ef4444" : "#38bdf8", `Oxy ${Math.ceil(oxy / 60)}s`, { fontSize: 13 });
    if (oxy === 0) badge(w / 2, top + 12, "⚠ HẾT HƠI!", "#dc2626", "#fff", 14);
    curX += 192;

    const hpMax = p.hp_max || meta.hp_max || 3;
    const hp = p.hp ?? hpMax;
    let hearts = "";
    for (let i = 0; i < hpMax; i++) hearts += i < hp ? "♥ " : "♡ ";
    text(hearts.trim(), curX, 40, { size: 22, color: hp <= 1 ? "#ef4444" : "#fb7185" });
    curX += hpMax * 24 + 18;

    text(`🏆 ${snap.score ?? 0}`, curX, 39, { size: 17, weight: "800", color: "#fde047" });
  }

  // Toast phản hồi ngắn gọn
  if (toast.text && performance.now() < toast.until) {
    badge(w / 2, top + 14, toast.text, "rgba(15, 23, 42, 0.9)", toast.color, 14);
  }

  // --- HUD DƯỚI GỌN GÀNG: GIỎ + MINI-MAP ---
  const barY = h - bottom + 6;
  panel(10, barY, w - 20, bottom - 12, "rgba(11, 22, 33, 0.92)", "rgba(148, 163, 184, 0.22)", 10);
  text(`🧺 ${hold.length}/${cap}`, 24, barY + 32, { size: 16, weight: "800", color: hold.length >= cap ? "#f87171" : "#f8fafc" });

  const slotW = 34, slotH = 34;
  for (let i = 0; i < cap; i++) {
    const sx0 = 105 + i * (slotW + 5);
    const item = hold[i];
    roundRect(sx0, barY + 9, slotW, slotH, 6);
    ctx.fillStyle = item ? kc(item) : "rgba(255, 255, 255, 0.08)";
    ctx.fill();
    if (item) text(KIND_ICON[item] || "•", sx0 + slotW / 2, barY + 32, { size: 16, align: "center" });
  }

  // Mini-map tối giản góc dưới phải (không chữ)
  const mmW = 160, mmH = 38, mmX = w - mmW - 22, mmY = barY + 7;
  roundRect(mmX, mmY, mmW, mmH, 6);
  ctx.fillStyle = "rgba(8, 28, 42, 0.9)";
  ctx.fill();
  ctx.strokeStyle = "rgba(148, 163, 184, 0.35)";
  ctx.stroke();
  const mx = (x) => mmX + 4 + (x / X) * (mmW - 8);
  const my = (d) => mmY + 5 + (d / D) * (mmH - 10);
  ctx.fillStyle = "#fde047"; ctx.fillRect(mx(dp[0]) - 2, my(0) - 2, 4, 4);
  (snap.nodes || []).forEach((n) => {
    ctx.fillStyle = n.ready !== false ? "#84cc16" : "#475569";
    ctx.fillRect(mx(n.pos[0]) - 1.5, my(0) - 1.5, 3, 3);
  });
  (snap.fish || []).forEach((f) => {
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath(); ctx.arc(mx(f.pos[0]), my(f.pos[1]), 2, 0, Math.PI * 2); ctx.fill();
  });
  if (p && p.pos) {
    ctx.fillStyle = "#fb923c";
    ctx.beginPath(); ctx.arc(mx(p.pos[0]), my(p.pos[1]), 3.5, 0, Math.PI * 2); ctx.fill();
  }
}

// ============================================================================
// UI #3: RESTAURANT (QUAN — GỌN GÀNG, CHỈ THÔNG TIN CƠ BẢN)
// ============================================================================
function getRelevantIngredients(stock, customers, menuCat) {
  const extra = new Set(["ca_loc", "ca_linh", "bong_dien_dien", "bong_sung"]);
  Object.keys(stock || {}).forEach((k) => extra.add(k));
  (customers || []).forEach((c) => Object.keys(c.reserved || {}).forEach((k) => extra.add(k)));
  Object.values(menuCat || {}).forEach((d) => Object.keys(d.recipe || {}).forEach((k) => extra.add(k)));
  return Array.from(extra);
}

function computeAvailableStock(stock, customers, allKinds) {
  const resMap = {};
  (customers || []).forEach((c) => Object.entries(c.reserved || {}).forEach(([k, q]) => { resMap[k] = (resMap[k] || 0) + q; }));
  const out = {};
  allKinds.forEach((k) => {
    const total = (stock && stock[k]) || 0;
    const res = resMap[k] || 0;
    out[k] = { total, reserved: res, available: Math.max(0, total - res) };
  });
  return out;
}

function canCookRecipe(recipe, availMap) {
  return Object.entries(recipe || {}).every(([k, q]) => ((availMap[k] ? availMap[k].available : 0) >= q));
}

function drawQuan(w, h) {
  const meta = snap.meta || {};
  const menuCat = getMenuCatalog();
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1];
  const top = 62, bottom = 60;
  const leftW = 225, rightW = 240;
  const centerW = Math.max(260, w - leftW - rightW - 36);
  const centerH = Math.max(200, h - top - bottom - 16);

  const s = Math.max(1, Math.min((centerW - 24) / X, (centerH - 24) / Z));
  const ox = leftW + 18 + (centerW - s * X) / 2;
  const oy = top + 8 + (centerH - s * Z) / 2;
  const sx = (x) => ox + x * s;
  const sy = (z) => oy + (Z - z) * s;

  ctx.fillStyle = "#081c29";
  ctx.fillRect(0, top, w, h - top - bottom);

  if (loadedImages.quanBg) {
    ctx.drawImage(loadedImages.quanBg, sx(0) - 0.6 * s, sy(Z) - 0.6 * s, (X + 1.2) * s, (Z + 1.2) * s);
  } else {
    ctx.fillStyle = "#b5854b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  }

  const p = snap.player;
  const quanTarget = findQuanInteractTarget(p, snap.stoves, snap.tables, meta);
  const oldestReserved = findOldestReservedCustomer(snap.customers);

  // Bếp
  (snap.stoves || []).forEach((st) => {
    const bx = sx(st.pos[0]), by = sy(st.pos[1]);
    const stState = st.state || "idle";
    const dishObj = st.dish && typeof st.dish === "object" ? st.dish : null;
    const dishId = dishObj ? dishObj.dish_id : st.dish;
    const isSelected = quanTarget && quanTarget.kind === "stove" && quanTarget.id === st.id;

    if (isSelected) {
      ctx.strokeStyle = "#fde047"; ctx.lineWidth = 3;
      roundRect(bx - 1.15 * s, by - 1.15 * s, 2.3 * s, 2.3 * s, 10); ctx.stroke();
    }
    roundRect(bx - 0.9 * s, by - 0.9 * s, 1.8 * s, 1.8 * s, 8);
    ctx.fillStyle = stState === "cooking" ? "#ea580c" : stState === "ready" ? "#16a34a" : "#475569";
    ctx.fill();
    text(`🔥 ${st.id}`, bx, by + 5, { size: 13, weight: "800", align: "center", color: "#fff" });

    if (stState === "cooking" && st.cook_ticks_left !== undefined) {
      const cookMax = ((menuCat[dishId] && menuCat[dishId].cook_s) || 6) * 60;
      bar(bx - 0.95 * s, by + 1.0 * s, 1.9 * s, 12, 1 - st.cook_ticks_left / Math.max(1, cookMax), "#f97316", `${(st.cook_ticks_left / 60).toFixed(1)}s`, { fontSize: 10 });
    } else if (stState === "ready") {
      badge(bx, by + 1.0 * s, "[E] Bưng", "#15803d", "#fff", 12);
    } else if (isSelected && oldestReserved) {
      badge(bx, by + 1.0 * s, "[E] Nấu", "#0284c7", "#fff", 12);
    }
  });

  // Bàn & Khách
  const patMax = (meta.patience_s || 60) * 60;
  const eatMax = (meta.eat_s || 10) * 60;
  const tipRatio = meta.tip_min_patience_ratio ?? 0.5;
  const byTable = {};
  (snap.customers || []).forEach((c) => { byTable[c.table_id] = c; });

  (snap.tables || []).forEach((tb) => {
    const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
    const isSelected = quanTarget && quanTarget.kind === "table" && quanTarget.id === tb.id;

    if (isSelected) {
      ctx.strokeStyle = "#fde047"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(tx, ty, 1.25 * s, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = "#7c4a1e";
    ctx.beginPath(); ctx.arc(tx, ty, 0.9 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#451a03"; ctx.lineWidth = 2; ctx.stroke();
    text(tb.id, tx, ty + 5, { size: 13, weight: "800", align: "center", color: "#fef3c7" });

    const c = byTable[tb.id];
    if (c) {
      const cx = tx, cy = ty - 1.45 * s;
      const isEating = c.state === "eating" || c.order_status === "served";
      ctx.fillStyle = isEating ? "#22c55e" : "#f472b6";
      ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
      badge(cx, cy - 1.45 * s, dShort(c.dish_id), "rgba(15, 23, 42, 0.9)", "#f8fafc", 11);

      if (isEating && c.eat_ticks_left !== undefined) {
        bar(cx - 1.0 * s, ty + 1.05 * s, 2.0 * s, 10, 1 - c.eat_ticks_left / Math.max(1, eatMax), "#22c55e");
      } else if (c.patience_ticks_left !== undefined) {
        const pFrac = c.patience_ticks_left / Math.max(1, patMax);
        bar(cx - 1.0 * s, ty + 1.05 * s, 2.0 * s, 10, pFrac, pFrac < 0.25 ? "#dc2626" : (pFrac >= tipRatio ? "#38bdf8" : "#f59e0b"), "", { marker: tipRatio });
      }
      if (isSelected && !isEating && snap.hand && snap.hand.order_id === c.id) {
        badge(tx, ty + 1.45 * s, "[E] Phục vụ", "#15803d", "#fff", 12);
      }
    }
  });

  // Út Sen
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    drawUtSen(px, py, Math.max(8, 0.68 * s), 0);
    if (snap.hand) {
      const hDish = typeof snap.hand === "string" ? snap.hand : snap.hand.dish_id;
      badge(px, py - 1.45 * s, `🍲 ${dShort(hDish)}`, "#b45309", "#fef3c7", 12);
    }
  }

  // --- HUD TRÊN GỌN GÀNG ---
  panel(10, 8, w - 20, 48, "rgba(11, 22, 33, 0.92)", "rgba(246, 201, 69, 0.3)", 10);
  const lowTime = (snap.time_left_ticks ?? 0) <= 30 * 60;
  let curX = 22;
  if (snap.day) { text(`N${snap.day}`, curX, 38, { size: 16, weight: "800", color: "#fde047" }); curX += 40; }
  text("⏱ " + fmtTime(snap.time_left_ticks), curX, 39, { size: 20, weight: "800", color: lowTime ? "#f87171" : "#f8fafc" });
  curX += 110;
  text(`💰 ${snap.money ?? 0}k`, curX, 39, { size: 19, weight: "800", color: "#4ade80" });
  curX += 110;
  const rep = snap.reputation ?? meta.reputation_initial ?? 3.0;
  text(`★ ${rep.toFixed(1)}`, curX, 39, { size: 18, weight: "800", color: "#facc15" });
  curX += 85;
  text(`🏆 ${snap.score ?? 0}`, curX, 39, { size: 18, weight: "800", color: "#7dd3fc" });

  if (toast.text && performance.now() < toast.until) {
    badge(w / 2, top + 14, toast.text, "rgba(15, 23, 42, 0.9)", toast.color, 14);
  }

  // --- PANEL TRÁI GỌN: KHO KHẢ DỤNG + MENU ---
  const allKinds = getRelevantIngredients(snap.stock, snap.customers, menuCat);
  const availMap = computeAvailableStock(snap.stock || {}, snap.customers || [], allKinds);
  panel(10, top + 6, leftW, centerH, "rgba(11, 22, 33, 0.9)", "rgba(148, 163, 184, 0.22)", 10);
  text("📦 KHO", 22, top + 28, { size: 14, weight: "800", color: "#38bdf8" });

  allKinds.forEach((k, idx) => {
    const ky = top + 52 + idx * 28;
    text(`${KIND_ICON[k] || "•"} ${kName(k)}`, 22, ky, { size: 13, weight: "600" });
    text(`${availMap[k].available}`, leftW - 6, ky, { size: 14, weight: "800", align: "right", color: availMap[k].available > 0 ? "#4ade80" : "#64748b" });
  });

  const menuY = top + 66 + allKinds.length * 28;
  text("📜 MENU", 22, menuY, { size: 14, weight: "800", color: "#fde047" });
  Object.entries(menuCat).forEach(([id, d], idx) => {
    const dy = menuY + 24 + idx * 32;
    if (dy > top + centerH - 8) return;
    const ok = canCookRecipe(d.recipe, availMap);
    text(d.name, 22, dy, { size: 12, weight: "700", color: ok ? "#f8fafc" : "#64748b" });
    text(`${d.price}k`, leftW - 6, dy, { size: 12, weight: "800", align: "right", color: ok ? "#4ade80" : "#ef4444" });
  });

  // --- PANEL PHẢI GỌN: KHÁCH HÀNG ---
  const rx = w - rightW - 10;
  panel(rx, top + 6, rightW, centerH, "rgba(11, 22, 33, 0.9)", "rgba(148, 163, 184, 0.22)", 10);
  text("🧾 ĐƠN KHÁCH", rx + 14, top + 28, { size: 14, weight: "800", color: "#f472b6" });
  (snap.customers || []).forEach((c, idx) => {
    const cy = top + 44 + idx * 68;
    if (cy + 60 > top + centerH) return;
    roundRect(rx + 10, cy, rightW - 20, 60, 8);
    ctx.fillStyle = "rgba(30, 41, 59, 0.85)";
    ctx.fill();
    text(`${c.table_id} · ${dShort(c.dish_id)}`, rx + 18, cy + 22, { size: 13, weight: "700", color: "#fde047" });
    const isEating = c.state === "eating" || c.order_status === "served";
    if (isEating) {
      bar(rx + 18, cy + 32, rightW - 36, 16, 1 - (c.eat_ticks_left ?? 0) / Math.max(1, eatMax), "#22c55e", "Đang ăn", { fontSize: 11 });
    } else {
      const pLeft = c.patience_ticks_left ?? patMax;
      const pFrac = pLeft / Math.max(1, patMax);
      bar(rx + 18, cy + 32, rightW - 36, 16, pFrac, pFrac < 0.25 ? "#dc2626" : (pFrac >= tipRatio ? "#38bdf8" : "#f59e0b"), `${Math.ceil(pLeft / 60)}s`, { marker: tipRatio, fontSize: 11 });
    }
  });

  // --- HUD DƯỚI GỌN ---
  const barY = h - bottom + 6;
  panel(10, barY, w - 20, bottom - 12, "rgba(11, 22, 33, 0.92)", "rgba(148, 163, 184, 0.22)", 10);
  const handTxt = snap.hand ? `🍲 ${dShort(typeof snap.hand === "string" ? snap.hand : snap.hand.dish_id)}` : "Trống";
  text(`🤲 Tay: ${handTxt}`, 24, barY + 30, { size: 15, weight: "800", color: snap.hand ? "#4ade80" : "#cbd5e1" });
  const stSummary = (snap.stoves || []).map((st) => {
    if (st.state === "cooking") return `🔥 ${st.id}: ${(st.cook_ticks_left / 60).toFixed(1)}s`;
    if (st.state === "ready") return `✓ ${st.id}: Chín!`;
    return `🔥 ${st.id}: Rỗi`;
  }).join("   ");
  text(stSummary, w - 24, barY + 30, { size: 15, weight: "800", align: "right", color: "#fde047" });
}

// ---------- 6. VÒNG LẶP RENDER CHÍNH ----------
function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = "#0d151d";
  ctx.fillRect(0, 0, w, h);
  if (uiState === "menu") return;
  if (snap) {
    const phase = activePhase();
    if (phase === "quan") drawQuan(w, h);
    else if (phase === "gather") drawGather(w, h);
  }
}
requestAnimationFrame(frame);
</script>
