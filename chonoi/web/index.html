"use strict";
/*
 * Client chơi trực tiếp (Pixel Art HUD + Smooth Animation). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua; giữ nguyên hoàn toàn API /state, /input, /restart.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

for (const [k, src] of Object.entries(FISH_SRC)) {

  FISH_IMG[k] = img;

  lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
};
function dishName(dish) {
  if (!dish) return "";
  const id = typeof dish === "string" ? dish : (dish.dish_id || "");
  return DISH_NAME[id] || id;
}
function dishWithOrder(dish) {
  if (!dish) return "";
  const name = dishName(dish);
  return (typeof dish === "object" && dish.order_id) ? `${name} (#${dish.order_id})` : name;
}
function computeAvailableStock(stock, customers) {
  const reserved = {};
  (customers || []).forEach((c) => {
    const res = c.reserved || {};
    Object.keys(res).forEach((k) => {
      if (res[k] > 0) reserved[k] = (reserved[k] || 0) + res[k];
    });
  });
  const avail = {};
  Object.keys(stock || {}).forEach((k) => {
    const v = Math.max(0, (stock[k] || 0) - (reserved[k] || 0));
    if (v > 0) avail[k] = v;
  });
  return { avail, reserved };
}
function fmtItems(map) {
  return Object.keys(map || {}).filter((k) => map[k] > 0).sort()
    .map((k) => (KIND_NAME[k] || k) + "×" + map[k]).join(", ");
}

// ---------- bộ sprite pixel art (offscreen canvas) ----------
function makeSprite(rows, palette) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === "." || !palette[ch]) continue;
      g.fillStyle = palette[ch];
      g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}

function drawSprite(sp, x, y, w, h) {
  if (!sp) return;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(sp, Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function drawItemIcon(kind, cx, cy, size) {
  const img = FISH_IMG[kind];
  if (img && img.complete && img.naturalWidth > 0) {
    const ratio = img.naturalHeight / img.naturalWidth;
    const iw = size;
    const ih = Math.max(4, Math.round(iw * ratio));
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, Math.round(cx - iw / 2), Math.round(cy - ih / 2), iw, ih);
    return;
  }
  if (PIXEL_ICON[kind]) {
    drawSprite(PIXEL_ICON[kind], cx - size / 2, cy - size / 2, size, size);
    return;
  }
  ctx.fillStyle = kc(kind);
  ctx.fillRect(Math.round(cx - size * 0.4), Math.round(cy - size * 0.4), Math.round(size * 0.8), Math.round(size * 0.8));
}

// ---------- animation & nội suy mượt (client-only) ----------
const vis = {
  now: performance.now() / 1000,
  dt: 1 / 60,
  lastTick: -1,
  lastMode: "",
  vals: {},
  pos: {},
  bubbles: [],
  floats: [],
  seenEvents: new Set(),
};

function smoothVal(key, target, speed = 0.22) {
  if (target === undefined || target === null || Number.isNaN(target)) return 0;
  const cur = vis.vals[key];
  if (cur === undefined) {
    vis.vals[key] = target;
    return target;
  }
  const alpha = 1 - Math.pow(1 - speed, Math.max(0.2, vis.dt * 60));
  const next = cur + (target - cur) * alpha;
  vis.vals[key] = Math.abs(target - next) < 0.0005 ? target : next;
  return vis.vals[key];
}
function smoothPos(id, tx, ty, speed = 0.35) {
  const cur = vis.pos[id];
  if (!cur || Math.hypot(tx - cur.x, ty - cur.y) > 4) {
    vis.pos[id] = { x: tx, y: ty };
    return vis.pos[id];
  }
  const alpha = 1 - Math.pow(1 - speed, Math.max(0.2, vis.dt * 60));
  cur.x += (tx - cur.x) * alpha;
  cur.y += (ty - cur.y) * alpha;
  return cur;
}
function spawnFloat(wx, wy, label, color) {
  vis.floats.push({ wx, wy, label, color, life: 1.15, maxLife: 1.15 });
}
function trackEvents() {
  if (!snap) return;
  if (snap.mode !== vis.lastMode || snap.tick < vis.lastTick) {
    vis.vals = {};
    vis.pos = {};
    vis.bubbles = [];
    vis.floats = [];
    vis.seenEvents.clear();
  }
  vis.lastMode = snap.mode;
  vis.lastTick = snap.tick;

  const pPos = (snap.player && snap.player.pos) ? snap.player.pos : [8, 5];
  (snap.events || []).forEach((ev, idx) => {
    const key = `${ev.tick}:${ev.name}:${JSON.stringify(ev.data || {})}:${idx}`;
    if (vis.seenEvents.has(key)) return;
    vis.seenEvents.add(key);
    if (vis.seenEvents.size > 160) {
      const first = vis.seenEvents.values().next().value;
      vis.seenEvents.delete(first);
    }
    const d = ev.data || {};
    if (ev.name === "gather") spawnFloat(pPos[0], pPos[1] - 1, `+${d.amount || 1} ${KIND_NAME[d.kind] || d.kind}`, "#b9f6ca");
    else if (ev.name === "fish_caught") spawnFloat(pPos[0], pPos[1] - 1, `+${d.yield || 1} ${KIND_NAME[d.kind] || d.kind}`, "#80d8ff");
    else if (ev.name === "hold_full") spawnFloat(pPos[0], pPos[1] - 1, "GIỎ ĐẦY!", "#ff8a80");
    else if (ev.name === "choke") spawnFloat(pPos[0], pPos[1] - 1, "-1 MÁU!", "#ff5252");
    else if (ev.name === "cook_started") spawnFloat(pPos[0], pPos[1] + 0.8, `Nấu ${dishName(d.dish_id)}`, "#ffd180");
    else if (ev.name === "dish_ready") spawnFloat(pPos[0], pPos[1] + 0.8, "MÓN CHÍN!", "#a5d6a7");
    else if (ev.name === "served") spawnFloat(pPos[0], pPos[1] + 0.8, d.tip > 0 ? `Phục vụ! Boa +${d.tip}k` : "Phục vụ!", "#fff59d");
    else if (ev.name === "paid") spawnFloat(pPos[0], pPos[1] + 1.2, `+${d.amount || 0}k`, "#ffd740");
    else if (ev.name === "customer_left" && d.reason === "patience") spawnFloat(pPos[0], pPos[1] + 1.2, "Khách bỏ đi!", "#ff8a80");
  });
}

// ---------- đồ họa cơ bản & khung HUD pixel ----------
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  const sz = o.size || 13;
  ctx.font = `bold ${sz}px "Courier New", Consolas, monospace, system-ui`;
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  const rx = Math.round(x), ry = Math.round(y);
  if (o.shadow !== false) {
    ctx.fillStyle = o.shadowColor || "#0d1117";
    ctx.fillText(s, rx + 1, ry + 1);
  }
  ctx.fillStyle = o.color || "#f4eedc";
  ctx.fillText(s, rx, ry);
}
function pixelBox(x, y, w, h, bg = "#1c2632", border = "#0b0f14", hi = "#4f6278") {
  const rx = Math.round(x), ry = Math.round(y), rw = Math.round(w), rh = Math.round(h);
  ctx.fillStyle = border;
  ctx.fillRect(rx + 2, ry, rw - 4, rh);
  ctx.fillRect(rx, ry + 2, rw, rh - 4);
  ctx.fillStyle = bg;
  ctx.fillRect(rx + 2, ry + 2, rw - 4, rh - 4);
  ctx.fillStyle = hi;
  ctx.fillRect(rx + 2, ry + 2, rw - 4, 2);
  ctx.fillRect(rx + 2, ry + 2, 2, rh - 4);
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.fillRect(rx + 2, ry + rh - 4, rw - 4, 2);
  ctx.fillRect(rx + rw - 4, ry + 2, 2, rh - 4);
}
function pixelBar(x, y, w, h, frac, color, label, segs = 10) {
  const rx = Math.round(x), ry = Math.round(y), rw = Math.round(w), rh = Math.round(h);
  const f = Math.max(0, Math.min(1, frac));
  pixelBox(rx, ry, rw, rh, "#111820", "#090d12", "#344457");
  const innerX = rx + 3, innerY = ry + 3, innerW = Math.max(2, rw - 6), innerH = Math.max(2, rh - 6);
  const fillW = Math.round(innerW * f);
  if (fillW > 0) {
    ctx.fillStyle = color;
    ctx.fillRect(innerX, innerY, fillW, innerH);
    ctx.fillStyle = "rgba(255,255,255,.32)";
    ctx.fillRect(innerX, innerY, fillW, Math.min(3, innerH));
  }
  if (segs > 1) {
    ctx.fillStyle = "rgba(9,13,18,.55)";
    for (let i = 1; i < segs; i++) {
      const sx = innerX + Math.round((innerW * i) / segs);
      ctx.fillRect(sx, innerY, 1, innerH);
    }
  }
  if (label) text(label, rx + rw / 2, ry + rh - 4, { size: Math.min(12, Math.max(10, rh - 5)), align: "center" });
}
function keyBadge(k, desc, x, y) {
  const kw = Math.max(18, k.length * 8 + 8);
  pixelBox(x, y, kw, 18, "#2c3948", "#0b0f14", "#6e849e");
  text(k, x + kw / 2, y + 13, { size: 11, align: "center", color: "#ffe082" });
  text(desc, x + kw + 5, y + 13, { size: 11, color: "#cfd8dc" });
  return kw + 14 + desc.length * 6.8;
}
function fmtTime(ticks) {
  const s = Math.ceil((ticks || 0) / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 52 ? s.slice(0, 49) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-5);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 12, h - 82 - (ev.length - 1 - i) * 14, { size: 11, align: "right", color: "rgba(244,238,220,.72)" }));
}
function overlay(w, h) {
  if (offline) {
    pixelBox(w / 2 - 210, 8, 420, 30, "#4a1b1b", "#140606", "#b84a4a");
    text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 28, { align: "center", color: "#ffcdd2", size: 14 });
  }
  if (snap.error) {
    pixelBox(w / 2 - 230, 44, 460, 30, "#4a1b1b", "#140606", "#b84a4a");
    text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 64, { align: "center", color: "#ffcdd2", size: 13 });
  }
  if (snap.finished) {
    pixelBox(w / 2 - 205, h / 2 - 58, 410, 116, "#1b2430", "#080b0f", "#647a94");
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 14, { align: "center", size: 18, color: "#ffe082" });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 22, { align: "center", size: 13, color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 78, bottom = 74;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  const animF = Math.floor(vis.now * 10);

  // 1. Trời ánh hồng buổi sớm dạng dải pixel + dừa nước đung đưa
  const skyBands = ["#f2b793", "#f7ccaa", "#fbe0c6", "#e4f0e8"];
  const bandH = (SKY * s) / skyBands.length;
  skyBands.forEach((col, i) => {
    ctx.fillStyle = col;
    ctx.fillRect(0, Math.round(top + i * bandH), w, Math.ceil(bandH) + 1);
  });
  for (let px = 8; px <= X - 6; px += 18) {
    const sway = Math.round(Math.sin(vis.now * 1.8 + px) * 2);
    ctx.fillStyle = "#3f6e3a";
    for (let k = -2; k <= 2; k++) {
      ctx.fillRect(Math.round(sx(px) + k * 0.48 * s + sway), Math.round(oy - (1.2 - Math.abs(k) * 0.2) * s), Math.max(3, Math.round(0.32 * s)), Math.max(4, Math.round(1.1 * s)));
    }
  }

  // 2. Nước màu phù sa dạng tầng pixel + gợn sóng bậc thang
  const waterBands = ["#8c7c4c", "#6f7752", "#4e6d5a", "#325658", "#1d3d48", "#122733"];
  const wbH = (D * s) / waterBands.length;
  waterBands.forEach((col, i) => {
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(sx(0)), Math.round(oy + i * wbH), Math.ceil(X * s), Math.ceil(wbH) + 1);
  });
  for (let wx = 0; wx < X; wx += 1.5) {
    const wy = Math.round(Math.sin(vis.now * 3.5 + wx * 0.7) * 2);
    ctx.fillStyle = "#f2f8e9";
    ctx.fillRect(Math.round(sx(wx)), Math.round(oy + wy - 1), Math.max(3, Math.ceil(1.6 * s)), 2);
  }
  const surfD = meta.surface_depth ?? 0.5;
  ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(sx(0), sy(surfD)); ctx.lineTo(sx(X), sy(surfD)); ctx.stroke(); ctx.setLineDash([]);
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.45)" });
  }

  // 3. Bến nhà sàn pixel
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#4d331d";
  ctx.fillRect(Math.round(sx(dp[0] - 1.2)), Math.round(sy(-0.1)), Math.max(3, Math.round(0.3 * s)), Math.round(1.3 * s));
  ctx.fillRect(Math.round(sx(dp[0] + 0.9)), Math.round(sy(-0.1)), Math.max(3, Math.round(0.3 * s)), Math.round(1.3 * s));
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(Math.round(sx(dp[0] - 1.6)), Math.round(sy(-0.8)), Math.round(3.2 * s), Math.round(0.8 * s));
  ctx.fillStyle = "#b9503a";
  ctx.fillRect(Math.round(sx(dp[0] - 1.8)), Math.round(sy(-1.4)), Math.round(3.6 * s), Math.round(0.6 * s));
  ctx.fillRect(Math.round(sx(dp[0] - 1.1)), Math.round(sy(-2.0)), Math.round(2.2 * s), Math.round(0.6 * s));
  ctx.strokeStyle = "rgba(255,230,150,.75)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.35), { size: 11, align: "center", color: "#fff59d" });

  // 4. Nút hái (hoa điên điển / bông súng pixel nhấp nhô)
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    const bob = Math.sin(vis.now * 3.2 + n.pos[0]) * 1.8;
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]) + bob;
    const sz = Math.max(18, Math.round(1.9 * s));
    ctx.globalAlpha = ready ? 1 : 0.35;
    drawSprite(PIXEL_ICON[n.kind], nx - sz / 2, ny - sz * 0.65, sz, sz * 0.72);
    ctx.globalAlpha = 1;
    text(n.id, nx, ny - sz * 0.75, { size: 10, align: "center", color: "#fff" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", nx, ny + 1.15 * s, { size: 10, align: "center", color: "#ffe082" });
  });

  // 5. Đàn cá (sprite assets/fish + bobbing + squash & stretch nhẹ)
  (snap.fish || []).forEach((f, idx) => {
    const bob = Math.sin(vis.now * 3.8 + idx * 1.7) * 2.4;
    const wiggle = 1 + Math.sin(vis.now * 7 + idx * 1.7) * 0.06;
    ctx.save();
    ctx.translate(sx(f.pos[0]), sy(f.pos[1]) + bob);
    ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.scale(wiggle, 1 / wiggle);
    const img = FISH_IMG[f.kind];
    if (img && img.complete && img.naturalWidth > 0) {
      const fw = (f.kind === "ca_loc" ? 2.4 : 1.7) * s;
      const fh = fw * (img.naturalHeight / img.naturalWidth);
      ctx.imageSmoothingEnabled = false;
      ctx.scale(-1, 1);
      ctx.drawImage(img, -fw / 2, -fh / 2, fw, fh);
    } else {
      ctx.fillStyle = kc(f.kind);
      ctx.fillRect(-0.9 * s, -0.4 * s, 1.8 * s, 0.8 * s);
    }
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.85 * s + bob, { size: 10, align: "center", color: "#e8eef2" });
  });

  // 6. Út Sen (sprite pixel 2 frame + nội suy mượt + bong bóng dưới nước)
  const p = snap.player;
  const underwater = p ? (p.at_surface === undefined ? p.pos[1] > surfD : !p.at_surface) : false;
  if (p) {
    const spPos = smoothPos("gather_p", p.pos[0], p.pos[1], 0.42);
    const px = sx(spPos.x), py = sy(spPos.y);
    const moving = p.vel && (Math.abs(p.vel[0]) > 0.1 || Math.abs(p.vel[1]) > 0.1);
    if (underwater && Math.random() < (moving ? 0.25 : 0.08)) {
      vis.bubbles.push({ wx: spPos.x + (Math.random() - 0.5) * 0.5, wy: spPos.y - 0.3, r: 2 + Math.floor(Math.random() * 2) });
    }
    for (let i = vis.bubbles.length - 1; i >= 0; i--) {
      const bb = vis.bubbles[i];
      bb.wy -= 2.4 * vis.dt;
      if (bb.wy <= 0) { vis.bubbles.splice(i, 1); continue; }
      ctx.fillStyle = "rgba(210,248,255,.75)";
      ctx.fillRect(Math.round(sx(bb.wx)), Math.round(sy(bb.wy)), bb.r, bb.r);
    }

    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(128,216,255,.35)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,245,157,.45)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    if (p.oxygen_ticks === 0 && underwater && Math.floor(vis.now * 6) % 2 === 0) {
      ctx.strokeStyle = "#ff5252"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, 1.0 * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      const uSprite = (moving && animF % 2 === 1) ? PIXEL_ICON.utSide1 : PIXEL_ICON.utSide0;
      const pw = Math.max(20, Math.round(1.6 * s)), ph = Math.max(16, Math.round(1.2 * s));
      const hd = ((p.heading_deg || 0) % 360 + 360) % 360;
      ctx.save();
      ctx.translate(px, py);
      if (hd > 90 && hd < 270) { ctx.scale(-1, 1); ctx.rotate(((180 - hd) * Math.PI) / 180); }
      else ctx.rotate((hd * Math.PI) / 180);
      drawSprite(uSprite, -pw / 2, -ph / 2, pw, ph);
      ctx.restore();
    }
  }

  // 7. Popup sự kiện nổi
  for (let i = vis.floats.length - 1; i >= 0; i--) {
    const fl = vis.floats[i];
    fl.life -= vis.dt;
    fl.wy -= 1.2 * vis.dt;
    if (fl.life <= 0) { vis.floats.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, fl.life / 0.45);
    text(fl.label, sx(fl.wx), sy(fl.wy), { size: 12, align: "center", color: fl.color });
    ctx.globalAlpha = 1;
  }

  // 8. HUD Pixel trên
  pixelBox(8, 6, w - 16, 66, "#1a232e", "#090d12", "#4b6078");
  drawSprite(PIXEL_ICON.clock, 18, 15, 18, 18);
  text(fmtTime(snap.time_left_ticks), 42, 30, { size: 19, color: "#ffe082" });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const oxyS = smoothVal("oxy", p.oxygen_ticks, 0.25);
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    const oxyColor = (low && Math.floor(vis.now * 6) % 2 === 0) ? "#ff5252" : (low ? "#ef5350" : "#38c6f4");
    drawSprite(PIXEL_ICON.oxy, 118, 14, 18, 18);
    pixelBar(140, 14, 210, 20, oxyS / p.oxygen_max_ticks, oxyColor, "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s", 12);
  }
  if (p && p.hp !== undefined && p.hp_max) {
    for (let i = 0; i < p.hp_max; i++) {
      const pulse = (i < p.hp && p.hp === 1) ? Math.sin(vis.now * 10) * 1.5 : 0;
      drawSprite(i < p.hp ? PIXEL_ICON.heartFull : PIXEL_ICON.heartEmpty, 366 + i * 24 - pulse / 2, 15 - pulse / 2, 20 + pulse, 18 + pulse);
    }
    text(`${p.hp}/${p.hp_max}`, 370 + p.hp_max * 24, 30, { size: 14, color: "#ff8fa3" });
  }
  if (p && p.zero_oxy_ticks > 0) {
    const chokeMax = meta.choke_interval_ticks || 60;
    const blink = Math.floor(vis.now * 8) % 2 === 0;
    pixelBox(505, 11, 145, 24, blink ? "#7f1d1d" : "#450a0a", "#090d12", "#ef5350");
    text(`⚠ NGẠT ${p.zero_oxy_ticks}/${chokeMax}`, 577, 27, { size: 12, align: "center", color: "#fff" });
  }
  if (p && p.pos) {
    const zone = underwater ? "Dưới nước [Space: bắt cá]" : "Mặt nước [E: hái / cập bến]";
    text(`x ${p.pos[0].toFixed(1)}m · d ${p.pos[1].toFixed(1)}m · ${zone}`, 18, 59, { size: 12, color: underwater ? "#80d8ff" : "#b9f6ca" });
  }
  if (p && p.catch_cd_ticks > 0) {
    const cdS = smoothVal("catch_cd", p.catch_cd_ticks, 0.35);
    const cdMax = Math.max(1, (meta.catch_cooldown_s || 0.5) * 60);
    pixelBar(410, 44, 150, 18, cdS / cdMax, "#ffb300", "Hồi bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 6);
  }

  // 9. Giỏ Pixel dưới
  pixelBox(8, h - bottom + 4, w - 16, bottom - 10, "#1a232e", "#090d12", "#4b6078");
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(30, Math.floor((w - 340) / cap) - 4), y0 = h - bottom + 10;
    for (let i = 0; i < cap; i++) {
      const x0 = 18 + i * (sz + 4);
      const isTop = snap.hold[i] && i === snap.hold.length - 1;
      pixelBox(x0, y0, sz, sz, "#101720", "#080b10", (isTop && animF % 4 < 2) ? "#ffe082" : "#324152");
      if (snap.hold[i]) drawItemIcon(snap.hold[i], x0 + sz / 2, y0 + sz / 2, sz - 8);
    }
    const names = {}; snap.hold.forEach((k) => (names[k] = (names[k] || 0) + 1));
    const fullWarn = snap.hold.length >= cap ? " · GIỎ ĐẦY!" : "";
    const summary = "Giỏ " + snap.hold.length + "/" + cap + (Object.keys(names).length ? "  " + fmtItems(names) : " (trống)") + fullWarn;
    text(summary, 18, y0 + sz + 15, { size: 12, color: snap.hold.length >= cap ? "#ff8a80" : "#cfd8dc" });
  }
  let kx = w - 310;
  kx += keyBadge("WASD", "Bơi", kx, h - 30);
  kx += keyBadge("E", "Hái/Bến", kx, h - 30);
  kx += keyBadge("Space", "Bắt", kx, h - 30);
  keyBadge("R", "Lại", kx, h - 30);
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 96, bottom = 44;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  const animF = Math.floor(vis.now * 10);

  // 1. Mặt sông đêm lấp lánh + sàn gỗ nhà bè + đèn dây vàng lung linh
  ctx.fillStyle = "#0b1a26"; ctx.fillRect(0, top, w, h - top - bottom);
  for (let i = 0; i < 18; i++) {
    const rx = ((i * 97) % Math.max(100, w - 40)) + 20;
    const ry = top + 12 + ((i * 53) % Math.max(40, h - top - bottom - 24));
    const alpha = 0.12 + 0.16 * Math.abs(Math.sin(vis.now * 2 + i));
    ctx.fillStyle = `rgba(128,216,255,${alpha.toFixed(2)})`;
    ctx.fillRect(rx, ry, 8, 2);
  }
  ctx.fillStyle = "#5d3d20"; ctx.fillRect(Math.round(sx(0) - 4), Math.round(sy(Z) - 4), Math.round(X * s + 8), Math.round(Z * s + 8));
  ctx.fillStyle = "#bf945b"; ctx.fillRect(Math.round(sx(0)), Math.round(sy(Z)), Math.round(X * s), Math.round(Z * s));
  ctx.fillStyle = "rgba(93,61,32,.25)";
  for (let gx = 2; gx < X; gx += 2) ctx.fillRect(Math.round(sx(gx)), Math.round(sy(Z)), 2, Math.round(Z * s));
  for (let lx = 0.8; lx < X; lx += 1.6) {
    const glow = 0.65 + 0.35 * Math.sin(vis.now * 4 + lx * 2);
    ctx.fillStyle = `rgba(255,224,102,${glow.toFixed(2)})`;
    ctx.fillRect(Math.round(sx(lx) - 3), Math.round(sy(Z) + 2), 6, 6);
  }

  // 2. Bếp pixel + lửa & khói
  (snap.stoves || []).forEach((st) => {
    const bx = sx(st.pos[0]), by = sy(st.pos[1]);
    const stCol = st.state === "cooking" ? "#d97724" : st.state === "ready" ? "#56a64b" : "#5a636e";
    pixelBox(bx - 0.85 * s, by - 0.85 * s, 1.7 * s, 1.7 * s, stCol, "#1c120c", "#f0d9b5");
    if (st.state === "cooking") {
      const fCol = animF % 2 === 0 ? "#ffea00" : "#ff6d00";
      ctx.fillStyle = fCol;
      ctx.fillRect(Math.round(bx - 0.35 * s), Math.round(by + 0.35 * s), Math.round(0.7 * s), Math.max(3, Math.round(0.22 * s)));
      for (let k = 0; k < 2; k++) {
        const puff = ((vis.now * 0.9 + k * 0.5) % 1);
        ctx.fillStyle = `rgba(245,245,245,${(0.55 * (1 - puff)).toFixed(2)})`;
        const pSz = Math.max(4, Math.round(0.32 * s));
        ctx.fillRect(Math.round(bx - pSz / 2 + Math.sin(vis.now * 4 + k) * 4), Math.round(by - (0.65 + puff * 0.9) * s), pSz, pSz);
      }
    } else if (st.state === "ready") {
      const bounce = Math.round(Math.sin(vis.now * 6) * 2);
      drawSprite(PIXEL_ICON.pot, bx - 0.45 * s, by - 0.55 * s + bounce, 0.9 * s, 0.9 * s);
    }
    text(st.id, bx, by + 4, { size: 12, align: "center", color: "#fff" });
    if (st.dish) text(dishName(st.dish), bx, by - 1.0 * s, { size: 11, align: "center", color: "#ffe082" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) {
      text(Math.ceil(st.cook_ticks_left / 60) + "s", bx, by + 1.3 * s, { size: 11, align: "center", color: "#fff" });
    } else if (st.state === "ready") {
      text("XONG (E)", bx, by + 1.3 * s, { size: 11, align: "center", color: "#b9f6ca" });
    }
  });

  // 3. Bàn + Khách + thanh kiên nhẫn / ăn mượt
  const patMax = (meta.patience_s || 60) * 60;
  const eatMax = (meta.eat_s || 10) * 60;
  const tipMin = meta.tip_min_patience_ratio ?? 0.5;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
    pixelBox(tx - 0.85 * s, ty - 0.85 * s, 1.7 * s, 1.7 * s, "#8a5a2e", "#2b190b", "#c48a52");
    text(tb.id, tx, ty + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const lowPat = c.state !== "eating" && c.patience_ticks_left !== undefined && (c.patience_ticks_left / patMax) < 0.25;
      const jx = lowPat ? Math.round(Math.sin(vis.now * 28) * 2) : 0;
      const jy = c.state === "eating" ? Math.round(Math.sin(vis.now * 8) * 2) : Math.round(Math.sin(vis.now * 3) * 1.2);
      const cx = tx + jx, cy = ty - 1.65 * s + jy;
      pixelBox(cx - 0.45 * s, cy - 0.45 * s, 0.9 * s, 0.9 * s, c.state === "eating" ? "#66bb6a" : "#f48fb1", "#1a0e14", "#ffe4ec");
      text(`${c.id}: ${dishName(c.dish_id) || "?"}`, cx, cy - 0.65 * s, { size: 11, align: "center", color: "#fff" });
      if (c.state === "eating") {
        const left = c.eat_ticks_left || 0;
        const eatSm = smoothVal("eat_" + c.id, left, 0.25);
        pixelBar(cx - 0.95 * s, cy + 0.55 * s, 1.9 * s, 14, eatSm / eatMax, "#66bb6a", "Ăn " + Math.ceil(left / 60) + "s", 8);
      } else if (c.patience_ticks_left !== undefined) {
        const patSm = smoothVal("pat_" + c.id, c.patience_ticks_left, 0.25);
        const frac = c.patience_ticks_left / patMax;
        const pCol = frac >= tipMin ? "#66bb6a" : (frac >= 0.25 ? "#ffca28" : "#ef5350");
        pixelBar(cx - 0.95 * s, cy + 0.55 * s, 1.9 * s, 14, patSm / patMax, pCol, Math.ceil(c.patience_ticks_left / 60) + "s", 8);
      }
    }
  });

  // 4. Út Sen (trên xuống, 2 frame + nội suy vị trí mượt)
  const p = snap.player;
  if (p) {
    const spPos = smoothPos("quan_p", p.pos[0], p.pos[1], 0.42);
    const px = sx(spPos.x), py = sy(spPos.y);
    const moving = p.vel && (Math.abs(p.vel[0]) > 0.1 || Math.abs(p.vel[1]) > 0.1);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    const uSprite = (moving && animF % 2 === 1) ? PIXEL_ICON.utTop1 : PIXEL_ICON.utTop0;
    const ps = Math.max(20, Math.round(1.15 * s));
    drawSprite(uSprite, px - ps / 2, py - ps / 2, ps, ps);
    if (snap.hand) {
      drawSprite(PIXEL_ICON.pot, px - 10, py - ps / 2 - 22, 20, 18);
      text(dishWithOrder(snap.hand), px, py - ps / 2 - 24, { size: 11, align: "center", color: "#ffe082" });
    }
  }

  // 5. Popup sự kiện nổi
  for (let i = vis.floats.length - 1; i >= 0; i--) {
    const fl = vis.floats[i];
    fl.life -= vis.dt;
    fl.wy += 0.9 * vis.dt;
    if (fl.life <= 0) { vis.floats.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, fl.life / 0.45);
    text(fl.label, sx(fl.wx), sy(fl.wy), { size: 12, align: "center", color: fl.color });
    ctx.globalAlpha = 1;
  }

  // 6. HUD Pixel 2 tầng cố định ở trên
  pixelBox(8, 6, w - 16, 32, "#1a232e", "#090d12", "#4b6078");
  drawSprite(PIXEL_ICON.clock, 16, 13, 18, 18);
  text(fmtTime(snap.time_left_ticks), 38, 28, { size: 18, color: "#ffe082" });
  drawSprite(animF % 4 < 2 ? PIXEL_ICON.coin0 : PIXEL_ICON.coin1, 118, 13, 18, 18);
  text(`Tiền ${snap.money ?? 0}k`, 140, 27, { size: 15, color: "#ffd54f" });
  drawSprite(PIXEL_ICON.star, 250, 13, 18, 18);
  text(`Uy tín ${(snap.reputation ?? 0).toFixed(1)}`, 272, 27, { size: 15, color: "#ffe082" });
  text(`Điểm ${snap.score ?? 0}`, 395, 27, { size: 15, color: "#b9f6ca" });

  const { avail, reserved } = computeAvailableStock(snap.stock, snap.customers);
  const halfW = Math.floor((w - 22) / 2);
  pixelBox(8, 42, halfW, 48, "#161f29", "#090d12", "#3e5166");
  const availKeys = Object.keys(avail).sort();
  text("Kho khả dụng:", 16, 60, { size: 12, color: "#b9f6ca" });
  if (availKeys.length) {
    let ix = 122;
    availKeys.forEach((k) => {
      drawItemIcon(k, ix + 8, 56, 16);
      const lbl = `${KIND_NAME[k] || k}×${avail[k]}`;
      text(lbl, ix + 20, 60, { size: 12, color: "#f4eedc" });
      ix += 28 + lbl.length * 7;
    });
  } else {
    text("(trống)", 122, 60, { size: 12, color: "#90a4ae" });
  }
  const resTxt = fmtItems(reserved);
  text("Đang giữ: " + (resTxt || "(không)"), 16, 80, { size: 11, color: resTxt ? "#ffd180" : "#78909c" });

  pixelBox(14 + halfW, 42, w - 22 - halfW, 48, "#161f29", "#090d12", "#3e5166");
  const rx = 22 + halfW;
  const st0 = (snap.stoves || [])[0];
  if (st0 && st0.state === "cooking") {
    text(`${st0.id}: Nấu ${dishName(st0.dish)} (${Math.ceil((st0.cook_ticks_left || 0) / 60)}s)`, rx, 60, { size: 12, color: "#ffd180" });
  } else if (st0 && st0.state === "ready") {
    text(`${st0.id}: XONG ${dishName(st0.dish)} [E]`, rx, 60, { size: 12, color: animF % 4 < 2 ? "#b9f6ca" : "#fff" });
  } else {
    text(`${st0 ? st0.id : "B1"}: Rảnh`, rx, 60, { size: 12, color: "#cfd8dc" });
  }
  const handTxt = snap.hand ? dishWithOrder(snap.hand) : "(trống)";
  const custTxt = (snap.customers || []).map((c) => {
    if (c.state === "eating") return `${c.table_id}: Ăn (${Math.ceil((c.eat_ticks_left || 0) / 60)}s)`;
    return `${c.table_id}: ${dishName(c.dish_id)} (${Math.ceil((c.patience_ticks_left || 0) / 60)}s)`;
  }).join(" | ") || "trống";
  text(`Tay: ${handTxt}  ·  Khách: ${custTxt}`, rx, 80, { size: 11, color: "#ffe0b2" });

  // 7. Điều khiển dưới
  pixelBox(8, h - bottom + 4, w - 16, bottom - 10, "#1a232e", "#090d12", "#4b6078");
  let kx = w - 225;
  kx += keyBadge("WASD", "Đi", kx, h - 29);
  kx += keyBadge("E", "Bếp/Bàn", kx, h - 29);
  keyBadge("R", "Lại", kx, h - 29);
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const now = performance.now() / 1000;
  vis.dt = Math.min(0.05, Math.max(0.001, now - vis.now));
  vis.now = now;
  const [w, h] = fit();
  ctx.fillStyle = "#0c1218"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    trackEvents();
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
