<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/assets/sfx.js"></script>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
let HC = false;  // chế độ tương phản cao (phím H)
try { HC = localStorage.getItem("hc") === "1"; } catch (e) { /* không có localStorage: vẫn chạy */ }

// --- bench (Hùng): đo rAF thật khi ?bench=1; browser bình thường không thay đổi hành vi.
// HUD harness Node.js không định nghĩa location nên mặc định chế độ chơi thường.
const benchQuery = new URLSearchParams(typeof location === "undefined" ? "" : location.search);
const benchEnabled = benchQuery.get("bench") === "1";
const benchSeconds = Number(benchQuery.get("duration"));
const benchDurationMs = Number.isFinite(benchSeconds) && benchSeconds > 0 ? benchSeconds * 1000 : 30000;
let benchStage = "waiting", benchFirstAt = 0, benchStartAt = 0, benchLastAt = 0;
const benchIntervals = [];
let benchErrorMessage = "";


// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  if (benchEnabled) return;  // bench (Hùng): giữ Út Sen đứng yên ở bến.
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  if (benchEnabled) return;  // bench: không nhận phím thay đổi cảnh.
  const k = keyName(e);
  if (HAS_SFX) SFX.unlock();  // trình duyệt chỉ cho phát âm sau thao tác của người dùng
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  else if (k === "m" && HAS_SFX) SFX.toggleMute();
  else if (k === "v") captionsOn = !captionsOn;
  else if (k === "h") toggleHC();
  pushInput();
});
addEventListener("keyup", (e) => {
  if (benchEnabled) return;
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    processSfx();
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
// ---- Sprite SVG tự tạo (tools/gen_assets.py). Chưa tải xong thì trả false và nơi gọi vẽ hình khối cũ. ----
const SPRITE_NAMES = ["usen", "ca_linh", "ca_loc", "ca_keo", "ca_sau", "bong_dien_dien", "bong_sung", "keo_neo", "dock", "stove", "table",
  "customer", "warn_monster", "warn_oxygen", "warn_angry", "dish_ca_loc_nuong_trui", "dish_goi_bong_sung", "dish_lau_ca_linh_dien_dien",
  "dish_canh_chua_ca_loc", "dish_ca_keo_nuong", "dish_lau_mam"];
const SPRITES = {};
SPRITE_NAMES.forEach((n) => { const im = new Image(); im.src = "/assets/" + n + ".svg"; SPRITES[n] = im; });
// Vẽ sprite tâm (cx, cy), cỡ w×h. o.rot: xoay (rad); o.flipX/o.flipY: lật quanh tâm.
function sprite(name, cx, cy, w, h, o) {
  const im = SPRITES[name];
  if (!im || !im.complete || im.naturalWidth === 0) return false;
  o = o || {};
  ctx.save(); ctx.translate(cx, cy);
  if (o.rot) ctx.rotate(o.rot);
  ctx.scale(o.flipX ? -1 : 1, o.flipY ? -1 : 1);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
  return true;
}
// ---- SFX + phụ đề (assets/sfx.js). Phụ đề hiện kể cả khi tắt tiếng. ----
const HAS_SFX = typeof SFX !== "undefined";
let captionsOn = true, lastEvTick = null;
const captions = [];  // {text, until}
function pushCaption(t) { captions.push({ text: t, until: performance.now() + 1800 }); if (captions.length > 3) captions.shift(); }
function processSfx() {
  const evs = snap.events || [], tick = snap.tick || 0;
  if (lastEvTick === null) { lastEvTick = evs.length ? evs[evs.length - 1].tick : tick; return; }  // lần đầu: không phát lại quá khứ
  if (tick < lastEvTick) lastEvTick = -1;  // chơi lại
  let top = lastEvTick;
  evs.forEach((e) => {
    if (e.tick <= lastEvTick) return;
    top = Math.max(top, e.tick);
    if (!HAS_SFX) return;
    const c = SFX.handle(e.name, e.data);
    if (c) pushCaption(c);
  });
  lastEvTick = top;
}
function drawCaptions(w, h) {
  const now = performance.now();
  while (captions.length && captions[0].until < now) captions.shift();
  if (captionsOn) captions.forEach((c, i) => {
    const y = h - 118 - (captions.length - 1 - i) * 26;
    ctx.font = "16px system-ui, sans-serif";
    const tw = ctx.measureText("🔊 " + c.text).width + 20;
    ctx.fillStyle = "rgba(0,0,0,.62)"; ctx.fillRect(w / 2 - tw / 2, y - 18, tw, 24);
    text("🔊 " + c.text, w / 2, y, { size: 16, align: "center", color: "#fff" });
  });
  if (HAS_SFX) text((SFX.isMuted() ? "🔇" : "🔊") + " M tắt/bật tiếng · V " + (captionsOn ? "ẩn" : "hiện") + " phụ đề · H tương phản " + (HC ? "BẬT" : "tắt"), w - 10, 20,
    { size: 12, align: "right", color: "rgba(232,238,242,.75)" });
}
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển" };
const dn = (d) => DISH_NAME[d] || d || "?";
const STOVE_STATE = { idle: "trống", cooking: "đang nấu", ready: "xong, chờ bưng" };
// ---- Kho: đọc được CẢ hai định dạng ----
//  v1.1: giỏ = mảng kind, kho = {kind: số}, reserved = {kind: số}
//  v1.2 (Ticket-03): giỏ/kho = mảng cá thể {id, kind, fresh}, reserved = mảng id; hàng ươn khi fresh < 30.
const SPOIL_BELOW = 30;
const kindOf = (x) => (typeof x === "string" ? x : x && x.kind);
const hasFresh = (x) => !!x && typeof x === "object" && typeof x.fresh === "number";
const isSpoiled = (x) => hasFresh(x) && x.fresh < SPOIL_BELOW;
const freshColor = (f) => (f < SPOIL_BELOW ? "#8d8d8d" : f < 60 ? "#e6b422" : "#6fcf6f");
// Mảng cá thể (hoặc kind) từ kho đếm {kind: số} / mảng.
function itemsOf(list) {
  if (Array.isArray(list)) return list;
  const out = [];
  Object.keys(list || {}).sort().forEach((k) => { for (let i = 0; i < list[k]; i++) out.push(k); });
  return out;
}
// Kho khả dụng = tồn trừ phần giữ chỗ (PRD-0 mục F Quán); v1.2 bỏ thêm hàng ươn (không dùng nấu được).
function availableStock(s) {
  const customers = s.customers || [];
  if (!Array.isArray(s.stock)) {
    const free = Object.assign({}, s.stock || {});
    customers.forEach((c) => Object.entries(c.reserved || {}).forEach(([k, n]) => (free[k] = (free[k] || 0) - n)));
    return itemsOf(free);
  }
  const held = new Set();
  customers.forEach((c) => (Array.isArray(c.reserved) ? c.reserved : []).forEach((id) => held.add(id)));
  return s.stock.filter((i) => !held.has(i.id) && !isSpoiled(i));
}
// "cá lóc×2 (tươi 85, 1 ươn)": tươi = trung bình hàng chưa ươn; không có fresh thì chỉ hiện số lượng.
function fmtItems(list) {
  const by = {};
  itemsOf(list).forEach((x) => {
    const g = (by[kindOf(x)] = by[kindOf(x)] || { n: 0, sum: 0, good: 0, spoiled: 0 });
    g.n++;
    if (isSpoiled(x)) g.spoiled++; else if (hasFresh(x)) { g.good++; g.sum += x.fresh; }
  });
  return Object.keys(by).sort().map((k) => {
    const g = by[k], note = [];
    if (g.good) note.push("tươi " + Math.round(g.sum / g.good));
    if (g.spoiled) note.push(g.spoiled + " ươn");
    return (KIND_NAME[k] || k) + "×" + g.n + (note.length ? " (" + note.join(", ") + ")" : "");
  }).join(", ");
}
const countSpoiled = (list) => itemsOf(list).filter(isSpoiled).length;

function fit() {
  // bench (Hùng): kích thước canvas thật 1280x720 pixel, không phụ thuộc DPR.
  if (benchEnabled) {
    cv.style.width = "1280px";
    cv.style.height = "720px";
    if (cv.width !== 1280 || cv.height !== 720) { cv.width = 1280; cv.height = 720; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    return [1280, 720];
  }
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
const DIM_TEXT = /^rgba|^#9fb3c0|^#cfd8dc/;  // chữ mờ / xám nhạt
// Độ sáng 0..1 của màu hex (#rgb hoặc #rrggbb); màu khác (rgba, tên) coi là sáng.
function lum(c) {
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c);
  if (!m) return 1;
  const h = m[1].length === 3 ? m[1].split("").map((x) => x + x).join("") : m[1];
  const v = [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16) / 255);
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold || HC ? "bold " : "") + (o.size || 14) + "px system-ui, sans-serif";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  let color = o.color || "#e8eef2", halo = "#000";
  if (HC) {  // chữ mờ -> trắng viền đen; chữ TỐI (vd trên nền sáng) -> đen viền trắng, để đọc được trên mọi nền
    if (DIM_TEXT.test(color)) color = "#ffffff";
    else if (lum(color) < 0.4) { color = "#000000"; halo = "#ffffff"; }
    ctx.lineJoin = "round"; ctx.lineWidth = 4; ctx.strokeStyle = halo; ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = HC ? "#fff" : "rgba(255,255,255,.5)"; ctx.lineWidth = HC ? 2 : 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (benchEnabled && benchStage === "done") {
    text("Benchmark đã hoàn tất — xem kết quả trong terminal", w / 2, 30,
         { align: "center", color: "#83df98", size: 16 });
  } else if (benchEnabled && benchStage === "failed") {
    text("Benchmark bị gián đoạn: " + benchErrorMessage, w / 2, 30,
         { align: "center", color: "#ff8a80", size: 16 });
  } else if (benchEnabled && benchStage === "waiting" &&
             (document.hidden || !document.hasFocus())) {
    text("Benchmark: đưa tab này ra trước để bắt đầu đo", w / 2, 30,
         { align: "center", color: "#ffe082", size: 16 });
  }
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  const dockH = 4.4 * s;  // sàn bến (đáy 82% chiều cao hình) đặt đúng mặt nước d = 0
  if (!sprite("dock", sx(dp[0]), sy(0) - 0.325 * dockH, dockH * 1.2, dockH)) {
    ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
    ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  }
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-4.0), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    const nh = 1.6 * s;
    if (!sprite(n.kind, sx(n.pos[0]), sy(n.pos[1]) - 0.35 * nh, nh * 1.6, nh)) {
      ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 1.9 * s, { size: 10, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    const hr = ((f.heading_deg || 0) * Math.PI) / 180;
    // cá vẽ quay +x; hướng sang trái thì lật dọc để không bị úp ngược
    if (!sprite(f.kind, sx(f.pos[0]), sy(f.pos[1]), 2.8 * s, 1.4 * s, { rot: hr, flipY: Math.cos(hr) < 0 })) {
      ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(hr);
      ctx.fillStyle = kc(f.kind);
      ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
      ctx.restore();
    }
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });
  // thủy quái (Cá Sấu Năm Chèo): quay mặt về waypoint đang tới
  (snap.monsters || []).forEach((m) => {
    const wp = m.waypoints && m.waypoints[m.target_idx], left = wp ? wp[0] < m.pos[0] : false;
    const chase = m.state === "chase";
    if (!sprite("ca_sau", sx(m.pos[0]), sy(m.pos[1]), 6 * s, 2.25 * s, { flipX: left })) {
      ctx.fillStyle = "#3d5a2e"; ctx.beginPath(); ctx.ellipse(sx(m.pos[0]), sy(m.pos[1]), 2.4 * s, 0.9 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
    text(chase ? "đuổi!" : m.id, sx(m.pos[0]), sy(m.pos[1]) - 1.5 * s, { size: 11, align: "center", color: chase ? "#ff8a80" : "rgba(255,255,255,.7)" });
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      if (!sprite("usen", px, py, 2.6 * s, 2.6 * s, { flipX: Math.cos(a) < 0 })) {
        ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
      }
    }
  }
  // HUD trên
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 12, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 345, 29, { size: 22, color: "#ff6b81" });
  }
  if (p && p.pos) text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`, 14, 52, { size: 12, color: "#9fb3c0" });
  if (p && p.catch_cd_ticks > 0) text("hồi chiêu bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 150, 52, { size: 12, color: "#9fb3c0" });
  // giỏ (khoang) dưới
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(30, (w - 260) / cap - 4), y0 = h - bottom + 8;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      const it = snap.hold[i];
      if (!it) continue;
      ctx.fillStyle = isSpoiled(it) ? "#555" : kc(kindOf(it)); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6);
      if (hasFresh(it)) {  // thanh độ tươi dưới ô; ươn thì gạch chéo
        ctx.fillStyle = freshColor(it.fresh); ctx.fillRect(x0 + 3, y0 + sz - 6, (sz - 6) * Math.max(0, Math.min(1, it.fresh / 100)), 3);
        if (isSpoiled(it)) { ctx.strokeStyle = "#ef5350"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0 + 3, y0 + 3); ctx.lineTo(x0 + sz - 3, y0 + sz - 3); ctx.stroke(); }
      }
    }
    text("Giỏ " + snap.hold.length + "/" + cap + "  " + fmtItems(snap.hold), 14, y0 + sz + 16, { size: 12, color: "#cfd8dc" });
    const bad = countSpoiled(snap.hold);
    if (bad) text("⚠ " + bad + " món ươn trong giỏ (vẫn chiếm ô, không nấu được)", w - 10, y0 + sz + 16, { size: 12, align: "right", color: "#ff8a80" });
  }
  text("WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 100, bottom = 40;  // chừa chỗ cho 3 dòng HUD kho phía trên
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    if (sprite("stove", sx(st.pos[0]), sy(st.pos[1]), 2.1 * s, 2.1 * s)) {
      ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 1.0 * s, sy(st.pos[1]) + 1.1 * s, 2.0 * s, 4);  // vạch trạng thái bếp
    } else {
      ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    }
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 1.7 * s, { size: 11, align: "center", color: "#111" });
    const stDish = st.dish && typeof st.dish === "object" ? st.dish.dish_id : st.dish;
    text((STOVE_STATE[st.state] || st.state || "") + (stDish ? " · " + dn(stDish) : ""), sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { size: 10, align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) text(Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.25 * s, { size: 11, align: "center", color: "#2a1a0a" });
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    if (!sprite("table", sx(tb.pos[0]), sy(tb.pos[1]), 2.0 * s, 2.0 * s)) {
      ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    }
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 1.45 * s, { size: 11, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      if (sprite("customer", cx, cy, 1.4 * s, 1.4 * s)) {  // viền xanh = đang ăn, hồng = đang chờ
        ctx.strokeStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, 0.78 * s, 0, Math.PI * 2); ctx.stroke();
        sprite("dish_" + c.dish_id, cx + 1.25 * s, cy, 0.9 * s, 0.9 * s);
      } else {
        ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      }
      const status = c.state === "eating" ? "đang ăn" : c.order_status === "unfulfillable" ? "không nấu được" : "chờ";
      text(dn(c.dish_id) + " · " + status, cx, cy - 0.75 * s, { size: 10, align: "center", color: "#2a1a0a" });
      if (c.state !== "eating" && c.patience_ticks_left !== undefined) {
        bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 12, c.patience_ticks_left / patMax, HC ? "#ff1744" : "#e57373", Math.ceil(c.patience_ticks_left / 60) + "s");
        if (c.patience_ticks_left < WARN_FRAC * patMax) sprite("warn_angry", cx - 1.3 * s, cy, 0.95 * s, 0.95 * s);
      }
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    if (!sprite("usen", px, py, 1.7 * s, 1.7 * s)) { ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill(); }
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : snap.hand.dish_id;
      sprite("dish_" + hand, px, py - 1.55 * s, 0.95 * s, 0.95 * s);
      text("🍲 " + dn(hand), px, py - 0.8 * s, { size: 11, align: "center", color: "#2a1a0a" });
    }
  }
  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  text(`Tiền ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 28, { size: 16 });
  text("Kho khả dụng: " + (fmtItems(availableStock(snap)) || "(trống)"), 14, 52, { size: 13, color: "#cfd8dc" });
  text("Tồn (gồm giữ chỗ): " + (fmtItems(snap.stock || {}) || "(trống)"), 14, 70, { size: 11, color: "#9fb3c0" });
  const badStock = countSpoiled(snap.stock || []);
  if (badStock) text("⚠ " + badStock + " nguyên liệu ươn trong kho", 14, 86, { size: 11, color: "#ff8a80" });
  const handTxt = snap.hand ? dn(typeof snap.hand === "string" ? snap.hand : snap.hand.dish_id) : "(trống)";
  text("Trên tay: " + handTxt, 360, 52, { size: 13, color: "#cfd8dc" });
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ---- Cảnh báo (Ticket-04, AC-P4-04): CHỮ + BIỂU TƯỢNG, không chỉ dựa vào màu ----
const WARN_FRAC = 0.25;  // oxy / kiên nhẫn dưới 25% thì cảnh báo (Ticket-02 HUD)
// Hàm thuần: đọc snapshot, trả danh sách cảnh báo đang bật (dễ test, không vẽ gì).
function warningList(s) {
  const out = [], meta = s.meta || {}, p = s.player;
  if (p && p.oxygen_max_ticks && Array.isArray(p.pos)) {  // buổi sáng
    const species = (meta.monsters && meta.monsters.species) || {};
    const near = (s.monsters || []).some((m) => {
      const r = ((species[m.kind] || {}).detect_radius || 10) * 1.5;  // báo sớm hơn bán kính phát hiện của quái
      return m.state === "chase" || Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= r;
    });
    if (near) out.push({ id: "monster", text: "Thủy quái!", icon: "warn_monster", color: "#b388ff", crit: true });
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (underwater && p.oxygen_ticks <= 0) out.push({ id: "oxygen", text: "Hết hơi!", icon: "warn_oxygen", color: "#ff5252", crit: true });
    else if (underwater && p.oxygen_ticks < WARN_FRAC * p.oxygen_max_ticks) out.push({ id: "oxygen", text: "Oxy sắp hết!", icon: "warn_oxygen", color: "#ff5252", crit: false });
  }
  const patMax = (meta.patience_s || 60) * 60;
  const angry = (s.customers || []).filter((c) => c.state === "waiting" && c.patience_ticks_left < WARN_FRAC * patMax);
  if (angry.length) out.push({ id: "angry", text: "Khách sắp giận! " + angry.map((c) => c.table_id).join(", "), icon: "warn_angry", color: "#ffab40", crit: false });
  return out;
}
function toggleHC() {
  HC = !HC;
  try { localStorage.setItem("hc", HC ? "1" : "0"); } catch (e) { /* không lưu được thì thôi */ }
}
function drawWarnings(w, h) {
  const list = warningList(snap);
  const blink = Math.floor(performance.now() / 350) % 2 === 0;
  if (list.some((x) => x.id === "monster")) {  // viền tím quanh cả màn hình
    ctx.strokeStyle = HC ? "#d1b3ff" : "rgba(179,136,255,.85)"; ctx.lineWidth = HC ? 10 : 6; ctx.strokeRect(3, 3, w - 6, h - 6);
  }
  list.forEach((x, i) => {
    ctx.font = "bold 20px system-ui, sans-serif";
    const bw = ctx.measureText(x.text).width + 64, bh = 38, bx = w - 10 - bw, by = 36 + i * 46;
    ctx.globalAlpha = x.crit && !HC && !blink ? 0.7 : 1;  // nhấp nháy nhẹ, không tắt hẳn; tương phản cao thì đứng yên
    ctx.fillStyle = HC ? "#000" : "rgba(10,10,14,.85)"; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = x.color; ctx.lineWidth = HC ? 5 : 3; ctx.strokeRect(bx, by, bw, bh);
    if (!sprite(x.icon, bx + 22, by + bh / 2, 30, 30)) text("⚠", bx + 12, by + 27, { size: 20, color: x.color });
    text(x.text, bx + 42, by + 27, { size: 20, bold: true, color: "#ffffff" });
    ctx.globalAlpha = 1;
  });
}

function frame(timestamp) {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (HC) ctx.filter = "contrast(1.35) saturate(1.25)";  // tăng tương phản cả cảnh
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    ctx.filter = "none";
    eventLog(w, h);
    drawWarnings(w, h);
    drawCaptions(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
  if (benchEnabled && snap && snap.mode === "gather" && !offline && !snap.error) benchFrame(timestamp);
}

// --- bench (Hùng): 3 giây warmup, lấy khoảng cách rAF thật rồi gửi cho Python tính FPS.
// Không giả lập FPS; tab mất tiêu điểm sẽ báo lỗi và không ghi kết quả.
function benchFail(message) {
  if (benchStage === "failed" || benchStage === "done") return;
  benchErrorMessage = message;
  benchStage = "failed";
  console.error("Benchmark:", message);
  fetch("/bench-error", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({error: message})}).catch((e) => console.error("Benchmark report:", e));
}
addEventListener("blur", () => {
  if (benchStage === "warmup" || benchStage === "measure") benchFail("cửa sổ trình duyệt mất tiêu điểm");
});
addEventListener("visibilitychange", () => {
  if (document.hidden && (benchStage === "warmup" || benchStage === "measure"))
    benchFail("tab không còn ở phía trước");
});
function benchFrame(timestamp) {
  if (benchStage === "waiting" && (document.hidden || !document.hasFocus())) return;
  if ((benchStage === "warmup" || benchStage === "measure") && (document.hidden || !document.hasFocus())) {
    benchFail("tab mất tiêu điểm trong khi đo");
    return;
  }
  if (benchStage === "waiting") {
    benchFirstAt = timestamp;
    benchStage = "warmup";
    fetch("/bench-start", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"})
      .then((r) => { if (!r.ok) throw Error("bench-start " + r.status); })
      .catch((e) => benchFail("không báo được khung hình đầu tiên: " + e.message));
    return;
  }
  if (benchStage === "warmup") {
    if (timestamp - benchFirstAt >= 3000) {
      benchStage = "measure";
      benchStartAt = timestamp;
      benchLastAt = timestamp;
    }
    return;
  }
  if (benchStage !== "measure") return;
  const delta = timestamp - benchLastAt;
  benchLastAt = timestamp;
  if (!Number.isFinite(delta) || delta <= 0) {
    benchFail("timestamp khung hình không hợp lệ");
    return;
  }
  benchIntervals.push(delta);
  if (timestamp - benchStartAt >= benchDurationMs && benchIntervals.length) {
    benchStage = "submitted";
    fetch("/bench", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({frame_intervals_ms: benchIntervals})})
      .then(async (r) => { if (!r.ok) throw Error("bench " + r.status + ": " + await r.text()); benchStage = "done"; })
      .catch((e) => benchFail("không gửi được FPS: " + e.message));
  }
}
requestAnimationFrame(frame);
</script>
