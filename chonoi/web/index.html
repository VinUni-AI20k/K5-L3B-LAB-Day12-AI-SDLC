<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #status[hidden] { display: none; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(11 21 24 / .8); }
  #status.shop { background: transparent; }
  #panel { position: relative; box-sizing: border-box; max-height: 90vh; overflow: auto;
    width: min(33rem, calc(100vw - 2rem)); padding: 1.8rem; border: 1px solid #a88b59;
    border-radius: .75rem; background: #203632; color: #fff9e8; font-size: 18px; }
  #panel h1 { margin: 0 0 .75rem; }
  #panel p { margin: .45rem 0; }
  #actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }
  button { padding: .5rem .8rem; font: inherit; color: #203632; background: #f9df9d; border-radius: .35rem; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: initial; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status" hidden>
  <section id="panel" aria-labelledby="screen-title">
    <h1 id="screen-title"></h1>
    <div id="screen-detail"></div>
    <div id="actions"></div>
  </section>
</div>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
const statusPanel = document.getElementById("status");
const title = document.getElementById("screen-title");
const detail = document.getElementById("screen-detail");
const actions = document.getElementById("actions");
let visiblePanel = null, introTimer;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const phase = snap?.phase || "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (phase === "quan") dy = -dy;                               // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
function sendAction(input) {
  queue.push(JSON.stringify(input));
  flush();
}
function pulse(button) {
  sendAction({ [button]: true });
  sendAction({ [button]: false });
}
function changeScreen(action) {
  down.clear();
  lastSent = "";
  fetch("/screen", { method: "POST", body: JSON.stringify({ action }) });
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (snap?.screen) {
    if (snap.screen === "day_intro" && e.target?.tagName !== "BUTTON") changeScreen("day_intro");
    return;
  }
  if ((k === "p" || k === "escape") && snap?.supports_pause) {
    e.preventDefault();
    pulse("pause");
    return;
  }
  if (snap?.state === "paused" || snap?.phase === "shop") return;
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r" && snap?.mode !== "day") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const DISH_NAME = {
  ca_loc_nuong_trui: "cá lóc nướng trui",
  goi_bong_sung: "gỏi bông súng",
  lau_ca_linh_dien_dien: "lẩu cá linh bông điên điển",
  canh_chua_ca_loc: "canh chua cá lóc",
  ca_keo_nuong: "cá kèo nướng muối ớt",
  lau_mam: "lẩu mắm miền Tây",
};
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const dishName = (id) => DISH_NAME[id] || id || "—";
const kindName = (id) => KIND_NAME[id] || id;

function setDetails(lines) {
  const text = lines.join("\n");
  if (detail.dataset.lines === text) return;
  detail.dataset.lines = text;
  detail.replaceChildren(...lines.map((line) => {
    const p = document.createElement("p");
    p.textContent = line;
    return p;
  }));
}

function updatePanel() {
  const panel = snap.screen || (snap.state === "paused" ? "pause" : (snap.phase === "shop" ? "shop" : null));
  statusPanel.hidden = !panel;
  statusPanel.className = panel === "shop" ? "shop" : "";
  if (panel !== visiblePanel) {
    visiblePanel = panel;
    clearTimeout(introTimer);
    actions.replaceChildren();
    const add = (label, run, id) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.addEventListener("click", run);
      if (id) b.id = id;
      actions.append(b);
    };
    if (panel === "menu") {
      add("Chơi", () => changeScreen("play"));
      add("Thoát", () => changeScreen("quit"));
    } else if (["day_intro", "evening_intro", "day_result"].includes(panel)) {
      add("Tiếp tục", () => changeScreen(panel));
      if (panel === "day_intro") introTimer = setTimeout(() => changeScreen(panel), 4000);
    } else if (panel === "pause") {
      add("Tiếp tục", () => pulse("pause"));
      if (snap.mode === "day") add("Về menu", () => changeScreen("menu"));
    } else if (panel === "shop") {
      for (const kind of ["oxygen", "hp"]) add("", () => sendAction({ buy: kind }), "buy-" + kind);
      add("Đóng Shop", () => pulse("shop_done"));
    } else if (panel === "summary" || panel === "exit") {
      add("Về menu", () => changeScreen("menu"));
    }
  }
  if (!panel) return;
  const shift = snap.shift;
  const formatCounts = (items, name) => Object.entries(items || {})
    .map(([id, n]) => name(id) + " × " + n).join(", ");
  const head = {
    menu: "Quán Ăn Chợ Nổi", day_intro: "Ngày " + snap.day, evening_intro: "Mở Quán",
    day_result: "Kết quả ca tối", pause: "Tạm dừng", shop: "Shop", summary: "Tổng kết", exit: "Hẹn gặp lại",
  };
  title.textContent = head[panel];
  if (panel === "day_intro") {
    setDetails(["Má Tư dặn chuẩn bị " + formatCounts(snap.day_plan.dishes, dishName),
      "Cần lấy " + formatCounts(snap.day_plan.ingredients, kindName)]);
  } else if (panel === "evening_intro") {
    const stock = inventoryCounts(snap.stock);
    const available = availableCounts(snap.stock, snap.customers || []);
    const ready = Object.keys(snap.day_plan.dishes).filter((id) =>
      Object.entries(snap.menu[id].recipe).every(([kind, amount]) => (available[kind] || 0) >= amount)
    );
    setDetails(["Kho nhập " + (formatCounts(stock, kindName) || "trống"),
      "Món có thể nấu " + (ready.map(dishName).join(", ") || "chưa có")]);
  } else if (panel === "day_result") {
    const change = snap.reputation - shift.reputation_before;
    setDetails(["Đã phục vụ " + shift.served + " · Bỏ đi " + shift.left,
      "Thu " + shift.earned + "k · Boa " + shift.tips + "k", "Đổi uy tín " + change.toFixed(1)]);
  } else if (panel === "shop") {
    for (const [kind, label] of [["oxygen", "Bình oxy"], ["hp", "Áo phao"]]) {
      const current = snap.upgrades[kind] || 0;
      const next = snap.meta.upgrades[kind][current];
      const button = document.getElementById("buy-" + kind);
      button.textContent = label + (next ? " cấp " + next.level + " · " + next.price + "k" : " đã tối đa");
      button.disabled = !next || snap.money < next.price;
    }
    setDetails(["Còn " + fmtTime(snap.time_left_ticks) + " · Tiền " + snap.money + "k",
      "Bình oxy cấp " + (snap.upgrades.oxygen || 0) + " · Áo phao cấp " + (snap.upgrades.hp || 0),
      "Cấp đã mua có hiệu lực từ Ngày sau."]);
  } else if (panel === "summary") {
    const sold = Object.entries(snap.sold).sort((a, b) => b[1] - a[1]);
    setDetails(["Tổng thu " + snap.earned + "k · Còn lại " + snap.money + "k",
      "Điểm " + snap.score + " · Uy tín " + snap.reputation.toFixed(1),
      "Món bán nhiều nhất " + (sold.length ? dishName(sold[0][0]) : "chưa có")]);
  } else {
    setDetails(panel === "exit" ? ["Bạn có thể đóng tab."] : []);
  }
}

function inventoryCounts(items) {
  if (!Array.isArray(items)) return { ...items };
  const counts = {};
  for (const item of items) {
    const kind = typeof item === "string" ? item : item.kind;
    counts[kind] = (counts[kind] || 0) + 1;
  }
  return counts;
}

function availableCounts(stock, customers) {
  if (Array.isArray(stock)) {
    const reserved = new Set(customers.flatMap(c => c.reserved || []));
    return inventoryCounts(stock.filter(item => item.fresh >= snap.freshness.spoiled_below && !reserved.has(item.id)));
  }
  const available = inventoryCounts(stock);
  for (const customer of customers) {
    for (const [kind, count] of Object.entries(customer.reserved || {})) {
      available[kind] = (available[kind] || 0) - count;
    }
  }
  return available;
}

function availableStock(stock, customers) {
  return Object.entries(availableCounts(stock, customers)).filter(([, count]) => count > 0)
    .map(([kind, count]) => (KIND_NAME[kind] || kind) + " × " + count).join(", ");
}

function freshnessLabel(items) {
  if (!snap.freshness || !Array.isArray(items) || !items.length) return "";
  const spoiled = items.filter(item => item.fresh < snap.freshness.spoiled_below).length;
  const lowest = Math.min(...items.map(item => item.fresh));
  return " · Tươi thấp nhất " + lowest.toFixed(1) + "%" + (spoiled ? " · Ươn × " + spoiled : "");
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.maxWidth) ctx.fillText(s, x, y, o.maxWidth);
  else ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label, labelSize = 11) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: labelSize, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const phase2 = snap.supports_pause;
  const top = phase2 ? 108 : 64, bottom = phase2 ? 68 : 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });
  // người chơi
  const p = snap.player;
  let nearbyMonster = false;
  for (const monster of snap.monsters || []) {
    const [mx, md] = monster.pos;
    const species = meta.monsters?.species[monster.kind];
    if (p && species && p.pos[1] >= species.depths[0] && Math.hypot(mx - p.pos[0], md - p.pos[1]) <= species.detect_radius) {
      nearbyMonster = true;
    }
    ctx.fillStyle = monster.state === "chase" ? "#9e753c" : "#557346";
    ctx.beginPath(); ctx.ellipse(sx(mx), sy(md), 1.8 * s, 0.65 * s, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
  // HUD trên
  const warnedTime = phase2 && snap.time_left_ticks <= 30 * 60;
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20, color: warnedTime ? "#ff8a80" : "#e8eef2" });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 8, Math.min(220, Math.max(78, w - 250)), phase2 ? 24 : 18, p.oxygen_ticks / p.oxygen_max_ticks,
      low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s", phase2 ? 18 : 11);
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text("Máu " + hs, w - 14, 29, { size: 18, align: "right", color: "#ff6b81" });
  }
  if (p && p.pos) text(phase2 ? "Độ sâu " + p.pos[1].toFixed(1) + " m" : `x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`,
    14, 52, { size: phase2 ? 18 : 12, color: "#9fb3c0" });
  if (p && p.catch_cd_ticks > 0) text("Hồi bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 175, 52, { size: phase2 ? 18 : 12, color: "#9fb3c0" });
  const names = inventoryCounts(snap.hold);
  if (snap.day_plan) {
    const goals = Object.entries(snap.day_plan.ingredients).map(([kind, amount]) =>
      kindName(kind) + " " + (names[kind] || 0) + "/" + amount).join(" · ");
    text("Ngày " + snap.day + " · Cần lấy " + goals, 14, 76, { size: 18, maxWidth: w - 28 });
  }
  if (phase2 && p?.at_surface) {
    const near = (pos, radius) => Math.hypot(p.pos[0] - pos[0], p.pos[1] - pos[1]) <= radius;
    const hint = near(dp, dr) ? "E · Cập bến" :
      (snap.nodes || []).some((n) => n.ready && near(n.pos, meta.interact_radius)) ? "E · Hái rau" : "";
    if (hint) text(hint, 14, 100, { size: 18 });
  }
  const alerts = [nearbyMonster && "Thủy quái!", phase2 && p?.oxygen_ticks === 0 && "Hết hơi!"].filter(Boolean);
  if (alerts.length) text(alerts.join(" · "), w - 14, 100, { align: "right", color: "#ffb5c3", size: 18 });
  if (nearbyMonster) {
    ctx.strokeStyle = "#b982e4"; ctx.lineWidth = 4; ctx.strokeRect(2, 2, w - 4, h - 4);
  }
  // giỏ (khoang) dưới
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(24, (w - 28) / cap - 4), y0 = h - bottom + 3;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      const item = snap.hold[i];
      if (item) {
        ctx.fillStyle = item.fresh < snap.freshness?.spoiled_below ? "#96766a" : kc(item.kind || item);
        ctx.fillRect(x0 + 2, y0 + 2, Math.max(1, sz - 4), Math.max(1, sz - 4));
      }
    }
    text("Giỏ " + snap.hold.length + "/" + cap + "  " + Object.keys(names).map((k) => kindName(k) + "×" + names[k]).join(", ") + freshnessLabel(snap.hold),
      14, y0 + sz + (phase2 ? 19 : 14), { size: phase2 ? 18 : 13, color: "#cfd8dc", maxWidth: w - 28 });
  }
  text("WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại", w - 10, h - 5, { size: 12, align: "right", color: "#9fb3c0", maxWidth: w - 20 });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const phase2 = snap.supports_pause;
  const X = b.x[1], Z = b.z[1], top = phase2 ? 116 : 108, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 4, { size: 12, align: "center", color: "#111" });
    if (st.dish) text(dishName(st.dish.dish_id), sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { size: 12, align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) text(Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.25 * s, { size: 11, align: "center", color: "#2a1a0a" });
    const cookTime = snap.menu?.[st.dish?.dish_id]?.cook_s;
    if (st.state === "cooking" && cookTime) {
      bar(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) + 0.85 * s, 1.6 * s, 6,
        1 - st.cook_ticks_left / (cookTime * 60), "#e8892b");
    }
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      text(dishName(c.dish_id), cx, cy - 0.75 * s, { size: 12, align: "center", color: "#2a1a0a" });
      if (c.state === "waiting" && Number.isFinite(c.patience_ticks_left)) {
        const fraction = c.patience_ticks_left / patMax;
        bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 6, fraction, phase2 && fraction >= 0.25 ? "#65b976" : "#e57373");
        if (phase2) text(fmtTime(c.patience_ticks_left), cx, cy - 1.15 * s,
          { size: 18, align: "center", color: fraction < 0.25 ? "#8d1631" : "#2a1a0a" });
      }
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      text("🍲 " + dishName(hand), px, py - 0.8 * s, { size: 11, align: "center", color: "#2a1a0a" });
    }
  }
  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  const income = phase2 ? " · Thu ca " + (snap.shift_earned || 0) + "k" : "";
  text(`Tiền ${snap.money ?? 0}k${income} · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`,
    110, 28, { size: phase2 ? 18 : 16, maxWidth: w - 125 });
  const stock = availableStock(snap.stock, snap.customers || []);
  text("Kho khả dụng: " + (stock || "trống") + freshnessLabel(snap.stock), 14, 50, { size: phase2 ? 18 : 14, maxWidth: w - 28 });
  const stoves = (snap.stoves || []).map((st) => {
    if (st.state === "cooking") return st.id + " đang nấu · " + fmtTime(st.cook_ticks_left);
    return st.id + (st.state === "ready" ? " đã chín" : " trống");
  }).join(", ");
  text(stoves + "  |  Trên tay: " + dishName(snap.hand?.dish_id), 14, 71, { size: phase2 ? 18 : 14, maxWidth: w - 28 });
  const orders = (snap.customers || []).map((c) => {
    const order = c.table_id + " " + dishName(c.dish_id);
    if (c.state === "eating") return order + " · đang ăn";
    if (Number.isFinite(c.patience_ticks_left)) return order + " · chờ " + fmtTime(c.patience_ticks_left);
    return order + " · đang chờ";
  }).join(", ");
  text("Đơn gọi: " + (orders || "chưa có"), 14, 92, { size: phase2 ? 18 : 14, maxWidth: w - 28 });
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.phase === "quan") drawQuan(w, h);
    else if (snap.phase !== "shop") drawGather(w, h);
    updatePanel();
    eventLog(w, h);
    if (snap.mode !== "day" || snap.error) overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
