<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

const FISH_SRC = {
  ca_loc: "/assets/fish/Ictaluridae/Catfish/channel_catfish.png",
  ca_linh: "/assets/fish/Cenrarchidae/Panfish/bluegill_panfish.png",
};
const FISH_IMG = {};
for (const [k, src] of Object.entries(FISH_SRC)) {
  const img = new Image();
  img.src = src;
  FISH_IMG[k] = img;
}
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
};
function dishName(dish) {
  if (!dish) return "";
  const id = typeof dish === "string" ? dish : (dish.dish_id || "");
  return DISH_NAME[id] || id;
}
function dishWithOrder(dish) {
  if (!dish) return "";
  const name = dishName(dish);
  return (typeof dish === "object" && dish.order_id) ? `${name} (#${dish.order_id})` : name;
}
function computeAvailableStock(stock, customers) {
  const reserved = {};
  (customers || []).forEach((c) => {
    const res = c.reserved || {};
    Object.keys(res).forEach((k) => {
      if (res[k] > 0) reserved[k] = (reserved[k] || 0) + res[k];
    });
  });
  const avail = {};
  Object.keys(stock || {}).forEach((k) => {
    const v = Math.max(0, (stock[k] || 0) - (reserved[k] || 0));
    if (v > 0) avail[k] = v;
  });
  return { avail, reserved };
}
function fmtItems(map) {
  return Object.keys(map || {}).filter((k) => map[k] > 0).sort()
    .map((k) => (KIND_NAME[k] || k) + "×" + map[k]).join(", ");
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 72, bottom = 68;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời ánh hồng buổi sớm + khóm dừa nước ven bờ
  const sky = ctx.createLinearGradient(0, top, 0, oy);
  sky.addColorStop(0, "#f6c49f"); sky.addColorStop(0.55, "#fde4c8"); sky.addColorStop(1, "#d5eef7");
  ctx.fillStyle = sky; ctx.fillRect(0, top, w, SKY * s);
  for (let px = 8; px <= X - 6; px += 18) {
    ctx.fillStyle = "#4b7b44";
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.ellipse(sx(px) + k * 0.55 * s, oy - 0.65 * s, 0.28 * s, 0.9 * s, k * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // nước màu phù sa đậm dần theo độ sâu
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#8c7d4d"); g.addColorStop(0.45, "#3e675e"); g.addColorStop(1, "#132a36");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#f2f8e9"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  const surfD = meta.surface_depth ?? 0.5;
  ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(sx(0), sy(surfD)); ctx.lineTo(sx(X), sy(surfD)); ctx.stroke(); ctx.setLineDash([]);
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.45)" });
  }
  // bến nhà sàn
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#5c4028";
  ctx.fillRect(sx(dp[0] - 1.2), sy(-0.1), 0.3 * s, 1.3 * s);
  ctx.fillRect(sx(dp[0] + 0.9), sy(-0.1), 0.3 * s, 1.3 * s);
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.6), sy(-0.8), 3.2 * s, 0.8 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.9), sy(-0.8)); ctx.lineTo(sx(dp[0]), sy(-2.5)); ctx.lineTo(sx(dp[0] + 1.9), sy(-0.8)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.75)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.85), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = "#4f8a42"; ctx.beginPath(); ctx.ellipse(nx, ny + 0.05 * s, 1.0 * s, 0.32 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = kc(n.kind);
    ctx.beginPath(); ctx.arc(nx - 0.3 * s, ny - 0.25 * s, 0.3 * s, 0, Math.PI * 2); ctx.arc(nx + 0.25 * s, ny - 0.3 * s, 0.32 * s, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    text(n.id, nx, ny - 0.75 * s, { size: 10, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", nx, ny + 1.15 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    const img = FISH_IMG[f.kind];
    if (img && img.complete && img.naturalWidth > 0) {
      const fw = (f.kind === "ca_loc" ? 2.4 : 1.7) * s;
      const fh = fw * (img.naturalHeight / img.naturalWidth);
      ctx.imageSmoothingEnabled = false;
      ctx.scale(-1, 1); // sprite gốc quay mặt sang trái, lật để heading 0° hướng +x
      ctx.drawImage(img, -fw / 2, -fh / 2, fw, fh);
    } else {
      ctx.fillStyle = kc(f.kind);
      ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    }
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.75 * s, { size: 10, align: "center", color: "rgba(255,255,255,.85)" });
  });
  // Út Sen (áo bà ba, khăn rằn, kính lặn)
  const p = snap.player;
  const underwater = p ? (p.at_surface === undefined ? p.pos[1] > surfD : !p.at_surface) : false;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (p.oxygen_ticks === 0 && underwater && Math.floor(snap.tick / 8) % 2 === 0) {
      ctx.strokeStyle = "#ff5252"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(px, py, 0.95 * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#5c4033"; ctx.beginPath(); ctx.arc(px, py, 0.62 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f4c7a1"; ctx.beginPath(); ctx.arc(px, py - 0.1 * s, 0.38 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#2b211e"; ctx.fillRect(px - 0.35 * s, py + 0.18 * s, 0.7 * s, 0.18 * s); // khăn rằn
      ctx.fillStyle = "#6fe3ff"; ctx.fillRect(px - 0.25 * s, py - 0.22 * s, 0.5 * s, 0.18 * s); // kính lặn
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
  // HUD trên
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 26, { size: 20 });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 10, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(`${hs} (${p.hp}/${p.hp_max})`, 345, 27, { size: 19, color: "#ff6b81" });
  }
  if (p && p.zero_oxy_ticks > 0) {
    const chokeMax = meta.choke_interval_ticks || 60;
    text(`⚠ NGẠT ${p.zero_oxy_ticks}/${chokeMax}`, 485, 26, { size: 15, color: "#ff5252" });
  }
  if (p && p.pos) {
    const zone = underwater ? "Dưới nước (Space: bắt cá)" : "Mặt nước (E: hái / cập bến)";
    text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)} · ${zone}`, 14, 52, { size: 12, color: "#cfd8dc" });
  }
  if (p && p.catch_cd_ticks > 0) text("Hồi chiêu bắt: " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 345, 52, { size: 12, color: "#ffd54f" });
  // giỏ (khoang) dưới
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(30, (w - 300) / cap - 4), y0 = h - bottom + 10;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      if (snap.hold[i]) {
        ctx.fillStyle = kc(snap.hold[i]); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6);
        if (i === snap.hold.length - 1) { ctx.strokeStyle = "#fff59d"; ctx.lineWidth = 1.5; ctx.strokeRect(x0 + 1, y0 + 1, sz - 2, sz - 2); }
      }
    }
    const names = {}; snap.hold.forEach((k) => (names[k] = (names[k] || 0) + 1));
    const fullWarn = snap.hold.length >= cap ? " · GIỎ ĐẦY!" : "";
    const summary = "Giỏ " + snap.hold.length + "/" + cap + (Object.keys(names).length ? "  " + fmtItems(names) : " (trống)") + fullWarn;
    text(summary, 14, y0 + sz + 18, { size: 12, color: snap.hold.length >= cap ? "#ff8a80" : "#cfd8dc" });
  }
  text("WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 90, bottom = 42;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  // nền sông đêm + sàn gỗ nhà bè + đèn dây vàng
  ctx.fillStyle = "#0f212e"; ctx.fillRect(0, top, w, h - top - bottom);
  ctx.fillStyle = "#bf945b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "rgba(93,61,32,.22)"; ctx.lineWidth = 1;
  for (let gx = 2; gx < X; gx += 2) { ctx.beginPath(); ctx.moveTo(sx(gx), sy(Z)); ctx.lineTo(sx(gx), sy(0)); ctx.stroke(); }
  ctx.strokeStyle = "#5d3d20"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  for (let lx = 0.8; lx < X; lx += 1.6) {
    ctx.fillStyle = "rgba(255,224,130,.85)";
    ctx.beginPath(); ctx.arc(sx(lx), sy(Z) + 4, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  // bếp
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    const bx = sx(st.pos[0]), by = sy(st.pos[1]);
    ctx.fillStyle = col; ctx.fillRect(bx - 0.8 * s, by - 0.8 * s, 1.6 * s, 1.6 * s);
    ctx.strokeStyle = "#2b1d12"; ctx.lineWidth = 1.5; ctx.strokeRect(bx - 0.8 * s, by - 0.8 * s, 1.6 * s, 1.6 * s);
    if (st.state === "cooking") {
      const puff = (snap.tick % 40) / 40;
      ctx.fillStyle = `rgba(255,255,255,${0.45 * (1 - puff)})`;
      ctx.beginPath(); ctx.arc(bx + Math.sin(snap.tick * 0.1) * 4, by - (0.6 + puff * 0.8) * s, 0.28 * s, 0, Math.PI * 2); ctx.fill();
    }
    text(st.id, bx, by + 4, { size: 12, align: "center", color: "#111" });
    if (st.dish) text(dishName(st.dish), bx, by - 0.95 * s, { size: 11, align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) {
      text(Math.ceil(st.cook_ticks_left / 60) + "s", bx, by + 1.25 * s, { size: 11, align: "center", color: "#2a1a0a" });
    } else if (st.state === "ready") {
      text("XONG (E)", bx, by + 1.25 * s, { size: 11, align: "center", color: "#1b5e20" });
    }
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const eatMax = (meta.eat_s || 10) * 60;
  const tipMin = meta.tip_min_patience_ratio ?? 0.5;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.55 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      text(`${c.id}: ${dishName(c.dish_id) || "?"}`, cx, cy - 0.72 * s, { size: 11, align: "center", color: "#2a1a0a" });
      if (c.state === "eating") {
        const left = c.eat_ticks_left || 0;
        bar(cx - 0.9 * s, cy + 0.65 * s, 1.8 * s, 12, left / eatMax, "#66bb6a", "Ăn " + Math.ceil(left / 60) + "s");
      } else if (c.patience_ticks_left !== undefined) {
        const frac = c.patience_ticks_left / patMax;
        const pCol = frac >= tipMin ? "#66bb6a" : (frac >= 0.25 ? "#ffca28" : "#ef5350");
        bar(cx - 0.9 * s, cy + 0.65 * s, 1.8 * s, 12, frac, pCol, Math.ceil(c.patience_ticks_left / 60) + "s");
      }
    }
  });
  // Út Sen (trên xuống)
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#5c4033"; ctx.beginPath(); ctx.arc(px, py, 0.52 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2b211e"; ctx.fillRect(px - 0.35 * s, py - 0.1 * s, 0.7 * s, 0.2 * s);
    ctx.fillStyle = "#f4c7a1"; ctx.beginPath(); ctx.arc(px, py, 0.26 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) text("🍲 " + dishWithOrder(snap.hand), px, py - 0.85 * s, { size: 11, align: "center", color: "#2a1a0a" });
  }
  // HUD 3 dòng cố định
  const { avail, reserved } = computeAvailableStock(snap.stock, snap.customers);
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 24, { size: 20 });
  text(`Tiền ${snap.money ?? 0}k · Uy tín ${(snap.reputation ?? 0).toFixed(1)}★ · Điểm ${snap.score ?? 0}`, 110, 24, { size: 16 });
  const availTxt = fmtItems(avail) || "(trống)";
  const resTxt = fmtItems(reserved);
  text("Kho khả dụng: " + availTxt + (resTxt ? "  ·  Đang giữ: " + resTxt : ""), 14, 48, { size: 13, color: "#cfd8dc" });
  const stoveTxt = (snap.stoves || []).map((st) => {
    if (st.state === "cooking") return `${st.id}: Nấu ${dishName(st.dish)} (${Math.ceil((st.cook_ticks_left || 0) / 60)}s)`;
    if (st.state === "ready") return `${st.id}: XONG ${dishName(st.dish)}`;
    return `${st.id}: Rảnh`;
  }).join(" | ") || "Bếp: --";
  const handTxt = snap.hand ? dishWithOrder(snap.hand) : "(trống)";
  const custTxt = (snap.customers || []).map((c) => {
    if (c.state === "eating") return `${c.table_id}: Đang ăn (${Math.ceil((c.eat_ticks_left || 0) / 60)}s)`;
    return `${c.table_id}: ${dishName(c.dish_id)} (${Math.ceil((c.patience_ticks_left || 0) / 60)}s)`;
  }).join(" | ") || "trống";
  text(`${stoveTxt}  ·  Tay: ${handTxt}  ·  Khách: ${custTxt}`, 14, 72, { size: 12, color: "#ffe0b2" });
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
