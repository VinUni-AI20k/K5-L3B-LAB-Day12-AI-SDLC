<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp — Phiên bản HUD Nâng Cao & VFX/Audio (Ticket 06 + Phase 2 + Phase 3 Ticket 05 - Vinh).
 * CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * An toàn tuyệt đối: thiếu trường nào thì bỏ qua, không văng lỗi JS.
 * Hỗ trợ ?fx=0 để tắt hiệu ứng nặng.
 * Hỗ trợ contract v1.0/v1.1 (đếm) lẫn v1.2 (cá thể + độ tươi fresh).
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại · M = âm thanh · C = tương phản.
 * Chế độ day: menu chính → intro Ngày (tự dừng sim 4 s) → lặn → quán → kết quả + Shop (1/2/3 mua, Enter sang Ngày kế)
 * → Summary sau ngày cuối. Esc/P = pause (gửi cạnh `pause`), Shop gửi `buy` / `shop_done`. ?menu=0 bỏ qua menu.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
let restartBtnRect = null;
let soundBtnRect = null;
let contrastBtnRect = null;

// Kiểm tra tham số ?fx=0 và ?hc=1 (hoặc lưu trong sessionStorage - Ticket 03 Phase 4)
const urlParams = new URLSearchParams(window.location.search);
const noFx = urlParams.get("fx") === "0";
let highContrast = urlParams.get("hc") === "1" || sessionStorage.getItem("chonoi_high_contrast") === "1";

// ---------- trạng thái UI Ngày / Menu / Pause / Shop (chỉ phía client, không đụng luật) ----------
const SKIP_MENU = urlParams.get("menu") === "0";   // ?menu=0 bỏ qua menu chính
const INTRO_MS = 4000;                              // intro tự chuyển sau 4 s
let restartGen = 0;                                 // tăng mỗi lần restart để bỏ /state cũ đang bay
let screen = "boot";                                // boot | menu | game | exited
let pauseMenu = false, intro = null, hoverId = null, lastPauseCmd = 0;
const introShown = new Set();
const uiButtons = [];                               // nút của màn modal, dựng lại mỗi khung hình
let dayStats = {};                                  // thống kê một Ngày (đọc từ event + snapshot)
let totals = { served: 0, tips: 0, dishes: {} };    // cộng dồn cả lượt (cho Summary)
const UPGRADE_NAME = { oxygen: "Bình dưỡng khí", hp: "Áo phao (Máu)", net: "Lưới bắt cá" };
const BUY_FAIL = { funds: "không đủ tiền", max_level: "đã đạt cấp tối đa", out_of_stock: "hết hàng", unknown: "không có nâng cấp này" };

function toggleHighContrast() {
  highContrast = !highContrast;
  sessionStorage.setItem("chonoi_high_contrast", highContrast ? "1" : "0");
}

// ---------- HỆ THỐNG ÂM THANH PROCEDURAL (Web Audio API - Tự sinh 100%, 0 asset ngoài) ----------
let audioCtx = null;
let soundEnabled = true;
let lastProcessedEventTick = -1;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function playTone(freq, duration, type = "sine", gainVal = 0.15) {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playHarvest() {
  if (!soundEnabled || !audioCtx) return;
  playTone(523.25, 0.1, "triangle", 0.12);
  setTimeout(() => playTone(659.25, 0.12, "triangle", 0.12), 50);
  setTimeout(() => playTone(783.99, 0.18, "sine", 0.15), 100);
}

function playCatch() {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.18);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.22);
  } catch (e) {}
}

function playSplash() {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(340, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.22);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.22);
  } catch (e) {}
}

function playBell() {
  if (!soundEnabled || !audioCtx) return;
  playTone(880, 0.35, "sine", 0.18);
  setTimeout(() => playTone(1760, 0.45, "sine", 0.12), 70);
}

function playCoin() {
  if (!soundEnabled || !audioCtx) return;
  playTone(987.77, 0.08, "sine", 0.15);
  setTimeout(() => playTone(1318.51, 0.3, "sine", 0.18), 60);
}

function playAlert() {
  if (!soundEnabled || !audioCtx) return;
  playTone(330, 0.12, "square", 0.08);
  setTimeout(() => playTone(293.66, 0.18, "square", 0.08), 100);
}

function playMonsterHit() {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.35);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
  } catch (e) {}
}

function playRoar() {
  if (!soundEnabled || !audioCtx) return;
  playTone(130, 0.25, "sawtooth", 0.16);
  setTimeout(() => playTone(85, 0.35, "sawtooth", 0.2), 100);
}

// ---------- HIỆU ỨNG RUNG MÀN HÌNH (Screen Shake) ----------
let shakeTicks = 0, shakeMag = 0;
function triggerScreenShake(ticks = 15, mag = 6) {
  if (noFx || highContrast) return;
  shakeTicks = ticks;
  shakeMag = mag;
}

// ---------- HIỆU ỨNG CHỮ NỔI / TIỀN THƯỞNG (Floating Text) ----------
const floatingTexts = [];
function addFloatingText(str, x, y, color = "#ffd54f") {
  floatingTexts.push({ str, x, y, alpha: 1.0, dy: 0, color });
}
function updateAndDrawFloatingTexts() {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.dy -= 0.6;
    ft.alpha -= 0.018;
    if (ft.alpha <= 0) {
      floatingTexts.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.globalAlpha = ft.alpha;
    text(ft.str, ft.x, ft.y + ft.dy, {
      size: 14,
      weight: "bold",
      align: "center",
      color: ft.color,
      stroke: true
    });
    ctx.restore();
  }
}

// ---------- HỆ THỐNG TOAST THÔNG BÁO HÀNG ƯƠN (Ticket 05) ----------
const toasts = [];
const seenSpoiledItems = new Set();

function addToast(msg, durationTicks = 180, color = "#ff5252") {
  toasts.push({ msg, ticks: durationTicks, maxTicks: durationTicks, color });
  if (toasts.length > 4) toasts.shift();
}

function checkAudioAndGameEvents() {
  if (!snap || !snap.events || !snap.events.length) return;
  const evs = snap.events;
  const prevTick = lastProcessedEventTick; // nhiều event có thể cùng tick: so với mốc cũ, không phải mốc vừa cập nhật
  for (let i = 0; i < evs.length; i++) {
    const ev = evs[i];
    if (ev.tick > prevTick) {
      if (ev.tick > lastProcessedEventTick) lastProcessedEventTick = ev.tick;
      trackDayEvent(ev);
      if (ev.name === "gather") playHarvest();
      else if (ev.name === "fish_caught") playCatch();
      else if (ev.name === "dive" || ev.name === "surface") playSplash();
      else if (ev.name === "dish_ready" || (ev.name === "gather_end" && ev.data?.reason === "docked")) playBell();
      else if (ev.name === "paid") {
        playCoin();
        const tip = ev.data?.tip ? ` (+Tip ${ev.data.tip}k)` : "";
        addFloatingText(`+${ev.data?.bill || 60}k 💰${tip}`, window.innerWidth / 2, window.innerHeight / 2 - 30, "#ffd54f");
      }
      else if (ev.name === "choke" || ev.name === "oxygen_empty") {
        playAlert();
        triggerScreenShake(12, 4);
      }
      else if (ev.name === "monster_hit") {
        playMonsterHit();
        triggerScreenShake(20, 8);
        const lost = ev.data?.lost || [];
        const lostCount = Array.isArray(lost) ? lost.length : 0;
        addFloatingText("💥 -1 ♥ THỦY QUÁI TÁP!", window.innerWidth / 2, window.innerHeight / 2 - 40, "#ff1744");
        addToast(`💥 [🐊 THỦY QUÁI] Bị Cá Sấu táp mất 1 Máu${lostCount > 0 ? " và rơi " + lostCount + " món" : ""}!`, 200, "#ff1744");
      }
      else if (ev.name === "faint") {
        playAlert();
        triggerScreenShake(25, 10);
        const cause = ev.data?.cause || "";
        if (cause === "monster") {
          addToast("☠️ [🐊 THỦY QUÁI] Út Sen đã bị Cá Sấu ngoạm kiệt sức!", 240, "#d50000");
        } else {
          addToast("😵 [🫁 HẾT HƠI] Cạn kiệt oxy! Út Sen đã ngất đi!", 240, "#d50000");
        }
      }
      else if (ev.name === "bought") {
        playCoin();
        addToast(`✅ Đã mua ${UPGRADE_NAME[ev.data?.upgrade] || ev.data?.upgrade} cấp ${ev.data?.level} (−${ev.data?.price}k)`, 180, "#69f0ae");
      }
      else if (ev.name === "buy_failed") {
        playAlert();
        addToast(`❌ Không mua được ${UPGRADE_NAME[ev.data?.action] || ev.data?.action}: ${BUY_FAIL[ev.data?.reason] || ev.data?.reason}`, 180, "#ff5252");
      }
      else if (ev.name === "spoiled") {
        playAlert();
        const itId = ev.data?.item_id || ev.data?.id || "";
        if (itId && !seenSpoiledItems.has(itId)) {
          seenSpoiledItems.add(itId);
          const kind = ev.data?.kind || "";
          const name = KIND_NAME[kind] || kind || itId;
          addToast(`⚠️ [ƯƠN] Cá thể ${itId} (${name}) đã bị ươn (< 30)!`, 180, "#ff5252");
        }
      }
    }
  }
}

// ---------- HỆ THỐNG PARTICLE SINH ĐỘNG (Bọt khí & Khói bếp) ----------
const bubbles = [];
const steams = [];

function updateParticles() {
  if (noFx || highContrast) return;
  const p = snap?.player;
  if (phaseOf() === "gather" && p && p.pos && p.pos[1] > 0.5) {
    if (Math.random() < 0.3) {
      bubbles.push({
        x: p.pos[0] + (Math.random() - 0.5) * 0.8,
        d: p.pos[1],
        r: Math.random() * 2.2 + 1.2,
        speed: Math.random() * 0.04 + 0.02,
        alpha: 0.65
      });
    }
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.d -= b.speed;
    b.x += (Math.random() - 0.5) * 0.02;
    if (b.d <= 0.2) bubbles.splice(i, 1);
  }
  if (bubbles.length > 40) bubbles.shift();

  if (phaseOf() === "quan" && snap.stoves) {
    snap.stoves.forEach((st) => {
      if (st.state === "cooking" && Math.random() < 0.35) {
        steams.push({
          x: st.pos[0] + (Math.random() - 0.5) * 0.6,
          z: st.pos[1] + 0.5,
          r: Math.random() * 3 + 2,
          speed: Math.random() * 0.03 + 0.015,
          alpha: 0.5
        });
      }
    });
  }
  for (let i = steams.length - 1; i >= 0; i--) {
    const s = steams[i];
    s.z += s.speed;
    s.alpha -= 0.012;
    s.r += 0.04;
    if (s.alpha <= 0.02) steams.splice(i, 1);
  }
  if (steams.length > 35) steams.shift();
}

// ---------- vào: phím & chuột ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = phaseOf();
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (mode === "quan") dy = -dy;
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) {}
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }

addEventListener("keydown", (e) => {
  initAudio();
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (uiKey(k, e)) { e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { restartGame(); }
  else if (k === "m") { soundEnabled = !soundEnabled; }
  else if (k === "c") { toggleHighContrast(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

function restartGame() {
  restartGen++;           // bỏ qua mọi /state đang bay từ phiên cũ
  lastProcessedEventTick = -1;
  resetDayUi();
  lastSent = "";
  down.clear();
  return fetch("/restart", { method: "POST" }).catch(() => {});
}

cv.addEventListener("click", (e) => {
  initAudio();
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const ub = uiButtons.find((u) => x >= u.x && x <= u.x + u.w && y >= u.y && y <= u.y + u.h);
  if (ub) { ub.onClick(); return; }
  if (modalActive()) { dismissIntro(); return; }

  if (contrastBtnRect) {
    if (x >= contrastBtnRect.x && x <= contrastBtnRect.x + contrastBtnRect.w &&
        y >= contrastBtnRect.y && y <= contrastBtnRect.y + contrastBtnRect.h) {
      toggleHighContrast();
      return;
    }
  }

  if (soundBtnRect) {
    if (x >= soundBtnRect.x && x <= soundBtnRect.x + soundBtnRect.w &&
        y >= soundBtnRect.y && y <= soundBtnRect.y + soundBtnRect.h) {
      soundEnabled = !soundEnabled;
      return;
    }
  }

  if (snap && snap.finished && restartBtnRect) {
    if (x >= restartBtnRect.x && x <= restartBtnRect.x + restartBtnRect.w &&
        y >= restartBtnRect.y && y <= restartBtnRect.y + restartBtnRect.h) {
      restartGame();
    }
  }
});

cv.addEventListener("mousemove", (e) => {
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  let isHover = false;
  const hb = uiButtons.find((u) => x >= u.x && x <= u.x + u.w && y >= u.y && y <= u.y + u.h);
  hoverId = hb ? hb.id : null;
  if (hb) isHover = true;
  if (contrastBtnRect && x >= contrastBtnRect.x && x <= contrastBtnRect.x + contrastBtnRect.w &&
      y >= contrastBtnRect.y && y <= contrastBtnRect.y + contrastBtnRect.h) {
    isHover = true;
  }
  if (soundBtnRect && x >= soundBtnRect.x && x <= soundBtnRect.x + soundBtnRect.w &&
      y >= soundBtnRect.y && y <= soundBtnRect.y + soundBtnRect.h) {
    isHover = true;
  }
  if (snap && snap.finished && restartBtnRect &&
      x >= restartBtnRect.x && x <= restartBtnRect.x + restartBtnRect.w &&
      y >= restartBtnRect.y && y <= restartBtnRect.y + restartBtnRect.h) {
    isHover = true;
  }
  cv.style.cursor = isHover ? "pointer" : "default";
});

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const gen = restartGen;
    const r = await fetch("/state", { cache: "no-store" });
    const next = await r.json();
    offline = false;
    if (gen === restartGen) {
      snap = next;
      trackDay();
      checkAudioAndGameEvents();
    }
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- từ điển & bảng màu ----------
const KIND_COLOR = {
  ca_loc: "#7c9a52",
  ca_linh: "#82b1ff",
  ca_keo: "#d9a066",
  bong_dien_dien: "#ffd54f",
  bong_sung: "#f06292",
  keo_neo: "#81c784"
};
const KIND_NAME = {
  ca_loc: "Cá lóc",
  ca_linh: "Cá linh",
  ca_keo: "Cá kèo",
  bong_dien_dien: "Bông điên điển",
  bong_sung: "Bông súng",
  keo_neo: "Kèo nèo"
};
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc",
  ca_keo_nuong: "Cá kèo nướng",
  lau_mam: "Lẩu mắm"
};
const DISH_ICON = {
  ca_loc_nuong_trui: "🐟",
  goi_bong_sung: "🥗",
  lau_ca_linh_dien_dien: "🍲",
  canh_chua_ca_loc: "🥣",
  ca_keo_nuong: "🍢",
  lau_mam: "🥘"
};
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}

function roundRect(ctx, x, y, w, h, r = 6) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(s, x, y, o = {}) {
  ctx.save();
  ctx.font = (o.weight ? o.weight + " " : "") + (o.size || 14) + "px system-ui, -apple-system, sans-serif";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  const str = String(s ?? "");
  if (highContrast || o.stroke) {
    ctx.strokeStyle = o.strokeColor || "#000000";
    ctx.lineWidth = o.strokeWidth || (highContrast ? 3.5 : 2.5);
    ctx.strokeText(str, x, y);
  }
  let fillCol = o.color || "#e8eef2";
  if (highContrast) {
    if (o.hcColor) fillCol = o.hcColor;
    else if (fillCol === "#000000") fillCol = "#000000";
    else if (fillCol === "#ff5252" || fillCol === "#ff1744") fillCol = "#ff3333";
    else if (fillCol === "#ffd54f" || fillCol === "#ffca28") fillCol = "#ffff00";
    else fillCol = "#ffffff";
  }
  ctx.fillStyle = fillCol;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function bar(x, y, w, h, frac, color, label = "", bg = "rgba(0,0,0,0.5)") {
  ctx.save();
  roundRect(ctx, x, y, w, h, Math.min(h / 2, 4));
  ctx.fillStyle = highContrast ? "#000000" : bg;
  ctx.fill();
  const clamped = Math.max(0, Math.min(1, frac || 0));
  if (clamped > 0) {
    ctx.save();
    ctx.clip();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * clamped, h);
    ctx.restore();
  }
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,0.25)";
  ctx.lineWidth = highContrast ? 2.2 : 1;
  roundRect(ctx, x, y, w, h, Math.min(h / 2, 4));
  ctx.stroke();
  if (label) {
    text(label, x + w / 2, y + h / 2, {
      size: Math.max(10, h - 4),
      align: "center",
      base: "middle",
      weight: "bold",
      color: highContrast ? "#ffff00" : "#ffffff",
      stroke: highContrast
    });
  }
  ctx.restore();
}

function fmtTime(ticks) {
  if (ticks === undefined || ticks === null) return "--:--";
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 55 ? s.slice(0, 52) + "…" : s; } catch (e) { return ""; }
}

function eventLog(w, h) {
  const ev = (snap?.events || []).slice(-5);
  ev.forEach((e, i) => {
    text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 14, h - 68 - (ev.length - 1 - i) * 16, {
      size: 11, align: "right", color: highContrast ? "#ffffff" : "rgba(232,238,242,0.7)"
    });
  });
}

function drawPrompt(textStr, x, y, o = {}) {
  ctx.save();
  ctx.font = "bold " + (o.size || 18) + "px system-ui, sans-serif";
  const tw = ctx.measureText(textStr).width;
  const pw = tw + 28, ph = (o.size || 18) + 16;
  const px = x - pw / 2, py = y - ph / 2;
  
  ctx.fillStyle = highContrast ? "#000000" : (o.bg || "rgba(12, 20, 28, 0.92)");
  roundRect(ctx, px, py, pw, ph, 8);
  ctx.fill();
  
  ctx.strokeStyle = highContrast ? (o.hcBorder || "#ffff00") : (o.border || "#ffca28");
  ctx.lineWidth = highContrast ? 2.5 : 1.8;
  ctx.stroke();
  
  text(textStr, x, y, {
    size: o.size || 18,
    align: "center",
    base: "middle",
    weight: "bold",
    color: highContrast ? (o.hcColor || "#ffff00") : (o.color || "#ffffff"),
    stroke: highContrast
  });
  ctx.restore();
}

function drawToasts(w, h) {
  for (let i = toasts.length - 1; i >= 0; i--) {
    const t = toasts[i];
    t.ticks--;
    if (t.ticks <= 0) {
      toasts.splice(i, 1);
      continue;
    }
    const alpha = Math.min(1, t.ticks / 25);
    const y = phaseOf() === "shop" ? h - 112 - (toasts.length - 1 - i) * 40 : 84 + (toasts.length - 1 - i) * 36;
    ctx.save();
    ctx.globalAlpha = alpha;
    drawPrompt(t.msg, w / 2, y, { size: 16, color: "#fff", bg: "rgba(35, 12, 16, 0.94)", border: t.color });
    ctx.restore();
  }
}

// ---------- HIỆU ỨNG NGUY HIỂM / VIGNETTE KHẨN CẤP ----------
function drawDangerVignette(w, h) {
  if (highContrast) return; // Không dùng vignette mờ trong chế độ tương phản cao
  const p = snap?.player;
  const isChased = phaseOf() === "gather" && (snap?.monsters || []).some((m) => m.state === "chase");
  const isLowOxy = phaseOf() === "gather" && p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks && (p.oxygen_ticks / p.oxygen_max_ticks < 0.25);
  const isLowHp = p && p.hp === 1;

  if (isChased || isLowOxy || isLowHp) {
    const timeSec = (snap?.tick || 0) / 60;
    const pulse = 0.5 + 0.5 * Math.sin(timeSec * (isChased ? 8 : 4));
    const vigGrad = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.72);
    const col = isChased ? `rgba(255, 0, 0, ${0.28 * pulse})` : isLowOxy ? `rgba(0, 140, 255, ${0.24 * pulse})` : `rgba(220, 0, 0, ${0.22 * pulse})`;
    vigGrad.addColorStop(0, "rgba(0,0,0,0)");
    vigGrad.addColorStop(1, col);
    ctx.save();
    ctx.fillStyle = vigGrad;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
}

// ---------- HỌA TIẾT CÁ SẤU NĂM CHÈO (PRD Phase 2 §1.2 & Ticket 03 Phase 4) ----------
function drawCrocodile(m, sx, sy, s, p, timeSec) {
  if (!m || !m.pos) return;
  const mx = sx(m.pos[0]);
  const my = sy(m.pos[1]);
  const isChase = m.state === "chase";
  const isRecoil = m.state === "recoil" || m.state === "stunned";

  // Góc hướng mặt
  let angle = 0;
  if (isChase && p && p.pos) {
    angle = Math.atan2(p.pos[1] - m.pos[1], p.pos[0] - m.pos[0]);
  } else if (m.waypoints && m.waypoints.length > 1) {
    const tgt = m.waypoints[m.target_idx || 0] || m.waypoints[1];
    angle = Math.atan2(tgt[1] - m.pos[1], tgt[0] - m.pos[0]);
  }

  // Vẽ vòng cảnh báo đe dọa khi săn đuổi (chase)
  if (isChase && !noFx) {
    ctx.save();
    const pulse = 1 + 0.08 * Math.sin(timeSec * 8);
    ctx.strokeStyle = highContrast ? "#ff3333" : `rgba(255, 23, 68, ${0.35 + 0.2 * Math.sin(timeSec * 8)})`;
    ctx.lineWidth = highContrast ? 2.5 : 1.8;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.arc(mx, my, 1.8 * s * pulse, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(mx, my);

  // Hiệu ứng giật lùi (recoil / stunned)
  if (isRecoil) {
    ctx.globalAlpha = Math.floor(Date.now() / 90) % 2 === 0 ? 0.35 : 0.85;
  }

  ctx.rotate(angle);

  // Vẫy đuôi uyển chuyển theo nhịp bơi
  const tailWag = Math.sin(timeSec * (isChase ? 12 : 5)) * 0.18;

  // Đuôi cá sấu
  ctx.save();
  ctx.rotate(tailWag);
  ctx.fillStyle = highContrast ? "#000000" : (isChase ? "#162e1a" : "#1a3820");
  ctx.beginPath();
  ctx.moveTo(-1.2 * s, -0.35 * s);
  ctx.quadraticCurveTo(-2.1 * s, -0.15 * s, -2.7 * s, 0);
  ctx.quadraticCurveTo(-2.1 * s, 0.15 * s, -1.2 * s, 0.35 * s);
  ctx.closePath();
  ctx.fill();
  if (highContrast) {
    ctx.strokeStyle = "#ff3333";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();

  // Thân cá sấu
  const bodyGrad = ctx.createLinearGradient(-1.6 * s, 0, 1.6 * s, 0);
  bodyGrad.addColorStop(0, "#132717");
  bodyGrad.addColorStop(0.5, isChase ? "#2d5229" : "#224225");
  bodyGrad.addColorStop(1, "#17331a");
  ctx.fillStyle = highContrast ? "#000000" : bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, 1.4 * s, 0.58 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  if (highContrast) {
    ctx.strokeStyle = isChase ? "#ff3333" : "#00ff00";
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // Vảy gai nhọn dọc sống lưng
  ctx.fillStyle = isChase ? "#ff3d00" : (highContrast ? "#00ff00" : "#3e6939");
  for (let sp = -1.0; sp <= 0.8; sp += 0.35) {
    ctx.beginPath();
    ctx.moveTo(sp * s, -0.55 * s);
    ctx.lineTo((sp + 0.16) * s, -0.85 * s);
    ctx.lineTo((sp + 0.32) * s, -0.55 * s);
    ctx.closePath();
    ctx.fill();
  }

  // Đầu và mõm dài
  ctx.fillStyle = highContrast ? "#000000" : (isChase ? "#254a22" : "#1e3d21");
  ctx.beginPath();
  ctx.moveTo(0.8 * s, -0.45 * s);
  ctx.lineTo(2.3 * s, -0.22 * s);
  ctx.lineTo(2.3 * s, 0.22 * s);
  ctx.lineTo(0.8 * s, 0.45 * s);
  ctx.closePath();
  ctx.fill();
  if (highContrast) {
    ctx.strokeStyle = isChase ? "#ff3333" : "#00ff00";
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // Hàm răng nanh sắc nhọn
  ctx.fillStyle = "#ffffff";
  for (let t = 1.0; t <= 2.1; t += 0.28) {
    ctx.beginPath();
    ctx.moveTo(t * s, -0.22 * s);
    ctx.lineTo((t + 0.12) * s, -0.05 * s);
    ctx.lineTo((t + 0.24) * s, -0.22 * s);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(t * s, 0.22 * s);
    ctx.lineTo((t + 0.12) * s, 0.05 * s);
    ctx.lineTo((t + 0.24) * s, 0.22 * s);
    ctx.fill();
  }

  // Mắt săn mồi
  const eyeColor = isChase ? "#ff1744" : isRecoil ? "#ffd54f" : "#ffca28";
  ctx.fillStyle = eyeColor;
  ctx.beginPath();
  ctx.arc(0.9 * s, -0.32 * s, 0.14 * s, 0, Math.PI * 2);
  ctx.arc(0.9 * s, 0.32 * s, 0.14 * s, 0, Math.PI * 2);
  ctx.fill();

  if (isChase && !highContrast) {
    ctx.fillStyle = "rgba(255, 23, 68, 0.6)";
    ctx.beginPath();
    ctx.arc(0.9 * s, -0.32 * s, 0.3 * s, 0, Math.PI * 2);
    ctx.arc(0.9 * s, 0.32 * s, 0.3 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();

  // Nhãn cảnh báo nổi bật: 🐊 THỦY QUÁI! (Ticket 03 Phase 4)
  let tag = `🐊 Thủy quái (${m.id})`;
  let tagColor = "#a5d6a7";
  let tagBg = "rgba(10, 25, 15, 0.88)";
  let tagBorder = "#2e7d32";

  if (isChase) {
    tag = `🚨 🐊 THỦY QUÁI TRUY ĐUỔI! [${m.id}]`;
    tagColor = "#ff8a80";
    tagBg = "rgba(50, 10, 15, 0.94)";
    tagBorder = "#ff1744";
  } else if (isRecoil) {
    tag = `💫 Đẩy lùi (${Math.ceil((m.state_ticks_left || 0) / 60 * 10) / 10}s)`;
    tagColor = "#ffd54f";
    tagBg = "rgba(35, 30, 10, 0.92)";
    tagBorder = "#ffa000";
  }

  drawPrompt(tag, mx, my - 1.8 * s, {
    size: 10,
    color: tagColor,
    bg: tagBg,
    border: tagBorder,
    hcBorder: isChase ? "#ff3333" : "#ffffff",
    hcColor: isChase ? "#ff3333" : "#ffffff"
  });
}

// ----- CẢNH GATHER: Buổi sáng -----
function drawGather(w, h) {
  const meta = snap?.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1] || 100, D = b.d[1] || 30, SKY = 6;
  const top = 68, bottom = 64;
  const s = Math.max(1, Math.min((w - 24) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;

  // Trời + nước
  ctx.fillStyle = highContrast ? "#000000" : "#cfeaf5";
  ctx.fillRect(0, top, w, SKY * s);

  if (highContrast) {
    ctx.fillStyle = "#091724";
    ctx.fillRect(sx(0), oy, X * s, D * s);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.strokeRect(sx(0), oy, X * s, D * s);
  } else {
    const g = ctx.createLinearGradient(0, oy, 0, sy(D));
    g.addColorStop(0, "#49b0dc");
    g.addColorStop(0.3, "#21709e");
    g.addColorStop(0.65, "#0f3e61");
    g.addColorStop(1, "#051829");
    ctx.fillStyle = g;
    ctx.fillRect(sx(0), oy, X * s, D * s);

    // Tia nắng chiếu xiên (Sunbeams / God rays)
    if (!noFx) {
      ctx.save();
      const timeSec = (snap?.tick || 0) / 60;
      ctx.globalCompositeOperation = "screen";
      for (let r = 0; r < 4; r++) {
        const rx = sx(15 + r * 22 + Math.sin(timeSec * 0.4 + r * 1.5) * 4);
        const rg = ctx.createLinearGradient(rx, oy, rx + 50, sy(22));
        rg.addColorStop(0, "rgba(200, 245, 255, 0.12)");
        rg.addColorStop(0.4, "rgba(120, 215, 255, 0.05)");
        rg.addColorStop(1, "rgba(40, 140, 200, 0)");
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.moveTo(rx - 8, oy);
        ctx.lineTo(rx + 30, oy);
        ctx.lineTo(rx + 90, sy(22));
        ctx.lineTo(rx + 35, sy(22));
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // Hiệu ứng sóng nước lăn tăn
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(233, 247, 255, 0.85)";
  ctx.lineWidth = highContrast ? 3 : 2.5;
  ctx.beginPath();
  if (noFx || highContrast) {
    ctx.moveTo(sx(0), oy);
    ctx.lineTo(sx(X), oy);
  } else {
    const timeSec = (snap?.tick || 0) / 60;
    for (let x = 0; x <= X; x += 2) {
      const wy = oy + Math.sin(x * 0.4 + timeSec * 3) * 1.5;
      if (x === 0) ctx.moveTo(sx(x), wy);
      else ctx.lineTo(sx(x), wy);
    }
  }
  ctx.stroke();

  // Vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = highContrast ? "rgba(255,255,255,0.25)" : "rgba(255,255,255,0.08)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx(0), sy(d));
    ctx.lineTo(sx(X), sy(d));
    ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 3, { size: 10, color: highContrast ? "#ffffff" : "rgba(255,255,255,0.4)" });
  }

  // Vẽ bọt khí lặn (VFX)
  if (!noFx) {
    ctx.save();
    bubbles.forEach((bb) => {
      ctx.strokeStyle = `rgba(255, 255, 255, ${bb.alpha})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(sx(bb.x), sy(bb.d), bb.r, 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.restore();
  }

  // Bến tàu (Dock)
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b";
  ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a";
  ctx.beginPath();
  ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7));
  ctx.lineTo(sx(dp[0]), sy(-2.4));
  ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7));
  ctx.fill();
  ctx.strokeStyle = "rgba(255, 230, 150, 0.6)";
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  text("⚓ Bến tàu", sx(dp[0]), sy(-2.7), { size: 11, align: "center", weight: "bold", color: "#5a3a22" });

  // Nút hái rau
  const p = snap?.player;
  const nodes = snap?.nodes || [];
  nodes.forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind);
    ctx.beginPath();
    ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    text(KIND_NAME[n.kind] || n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.8 * s, { size: 10, align: "center", weight: "bold", color: "#234" });
    if (!ready && n.regrow_ticks) {
      text("🌱 " + Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
    }
  });

  // Đàn cá
  const fishList = snap?.fish || [];
  fishList.forEach((f) => {
    ctx.save();
    ctx.translate(sx(f.pos[0]), sy(f.pos[1]));
    ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = highContrast ? "#00ffff" : kc(f.kind);
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-0.8 * s, 0);
    ctx.lineTo(-1.4 * s, -0.4 * s);
    ctx.lineTo(-1.4 * s, 0.4 * s);
    ctx.fill();
    if (highContrast) {
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();
    text(KIND_NAME[f.kind] || f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.8 * s, {
      size: 10, align: "center", color: highContrast ? "#ffffff" : "rgba(255,255,255,0.85)", stroke: highContrast
    });
  });

  // Quái vật Thủy quái Cá Sấu (PRD P2 §1.2 & Ticket 03 Phase 4)
  const monsterList = snap?.monsters || [];
  const timeSec = (snap?.tick || 0) / 60;
  monsterList.forEach((m) => {
    drawCrocodile(m, sx, sy, s, p, timeSec);
  });

  // Người chơi (Út Sen)
  let contextualPrompt = null;
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > (meta.surface_depth || 0.5) : !p.at_surface;

    // 1. CẢNH BÁO: Thủy quái Cá Sấu gần (Ticket 03 Phase 4)
    let nearestMonster = null, minMDist = Infinity;
    monsterList.forEach((m) => {
      const d = Math.hypot(p.pos[0] - m.pos[0], p.pos[1] - m.pos[1]);
      if (d < minMDist) { minMDist = d; nearestMonster = m; }
    });

    const isMonsterThreat = nearestMonster && (
      nearestMonster.state === "chase" ||
      (underwater && p.pos[1] >= 10 && minMDist <= 10.0)
    );

    if (isMonsterThreat) {
      // Vệt đỏ/vàng đứt nét nối giữa cá sấu và người chơi
      ctx.save();
      ctx.strokeStyle = highContrast ? "#ff3333" : "rgba(255, 23, 68, 0.65)";
      ctx.lineWidth = highContrast ? 2.5 : 1.8;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(sx(nearestMonster.pos[0]), sy(nearestMonster.pos[1]));
      ctx.stroke();
      ctx.restore();

      // Nhãn trên đầu Út Sen
      text("🐊 THỦY QUÁI ÁP SÁT!", px, py - 1.4 * s, {
        size: 11, weight: "bold", align: "center", color: "#ff3333", stroke: true
      });
    }

    if (meta.catch_radius && underwater) {
      ctx.strokeStyle = highContrast ? "#00ffff" : "rgba(130,177,255,0.3)";
      ctx.beginPath();
      ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (meta.interact_radius && !underwater) {
      ctx.strokeStyle = highContrast ? "#ffff00" : "rgba(255,235,59,0.35)";
      ctx.beginPath();
      ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Hiệu ứng nhấp nháy bất tử khi vừa bị đòn (i-frames)
    const isInvuln = (p.invuln_ticks || 0) > 0;
    if (isInvuln && Math.floor((snap?.tick || 0) / 5) % 2 === 0) {
      ctx.globalAlpha = 0.35;
    }

    ctx.fillStyle = highContrast ? "#000000" : "#ff8a3d";
    ctx.beginPath();
    ctx.arc(px, py, 0.65 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = isInvuln ? "#ffd54f" : (highContrast ? "#ffff00" : "#ffffff");
    ctx.lineWidth = highContrast ? 3 : 2.2;
    ctx.stroke();

    // Họa tiết nón lá / kính lặn và hướng nhìn
    const a = ((p.heading_deg || 0) * Math.PI) / 180;
    ctx.fillStyle = highContrast ? "#ffff00" : "#81d4fa";
    ctx.beginPath();
    ctx.arc(px + Math.cos(a) * 0.32 * s, py + Math.sin(a) * 0.32 * s, 0.22 * s, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = highContrast ? "#ffffff" : "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + Math.cos(a) * 1.0 * s, py + Math.sin(a) * 1.0 * s);
    ctx.stroke();

    ctx.globalAlpha = 1.0;

    const isHoldFull = snap.hold && snap.hold_capacity && snap.hold.length >= snap.hold_capacity;
    const distToDock = Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]);
    
    // 2. CẢNH BÁO: Oxy dưới 25% (Hết hơi! — Ticket 03 Phase 4)
    const oxyRatio = (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) ? (p.oxygen_ticks / p.oxygen_max_ticks) : 1;
    const isLowOxy = underwater && oxyRatio < 0.25;

    if (distToDock <= dr) {
      contextualPrompt = { text: "⚓ Nhấn [E] CẬP BẾN & CHỐT KHO", color: "#ffd54f", border: "#ffca28" };
    } else if (isMonsterThreat) {
      contextualPrompt = {
        text: `🚨 🐊 THỦY QUÁI! CÁ SẤU ÁP SÁT (${minMDist.toFixed(1)}m) — BƠI LÊN ĐỘ SÂU < 10M!`,
        color: "#ffffff",
        border: highContrast ? "#ffff00" : "#ff1744",
        bg: highContrast ? "#000000" : "rgba(60, 10, 15, 0.95)"
      };
    } else if (isLowOxy) {
      contextualPrompt = {
        text: `🫁 HẾT HƠI (${Math.ceil(p.oxygen_ticks / 60)}s)! NỔI LÊN MẶT NƯỚC NGAY!`,
        color: "#ffffff",
        border: highContrast ? "#ffff00" : "#ff1744",
        bg: highContrast ? "#000000" : "rgba(60, 10, 10, 0.95)"
      };
    } else if (!underwater) {
      let nearestNode = null, minDist = Infinity;
      const iRad = meta.interact_radius || 2.0;
      nodes.forEach((n) => {
        const d = Math.hypot(p.pos[0] - n.pos[0], p.pos[1] - n.pos[1]);
        if (d <= iRad && d < minDist) { minDist = d; nearestNode = n; }
      });
      if (nearestNode) {
        if (isHoldFull) {
          contextualPrompt = { text: "⚠️ Giỏ hàng đã đầy! Hãy về bến [E]", color: "#ff8a80", border: "#ff5252" };
        } else if (nearestNode.ready !== false) {
          contextualPrompt = { text: `🌿 Nhấn [E] Hái ${KIND_NAME[nearestNode.kind] || nearestNode.kind}`, color: "#ffffff", border: "#69f0ae" };
        } else if (nearestNode.regrow_ticks) {
          contextualPrompt = { text: `🌱 ${KIND_NAME[nearestNode.kind]} đang mọc (${Math.ceil(nearestNode.regrow_ticks / 60)}s)`, color: "#b0bec5", border: "#78909c" };
        }
      }
    } else {
      let nearestFish = null, minDist = Infinity;
      const cRad = meta.catch_radius || 2.0;
      fishList.forEach((f) => {
        const d = Math.hypot(p.pos[0] - f.pos[0], p.pos[1] - f.pos[1]);
        if (d <= cRad && d < minDist) { minDist = d; nearestFish = f; }
      });
      if (nearestFish) {
        if (p.catch_cd_ticks > 0) {
          contextualPrompt = { text: `⏳ Hồi chiêu bắt: ${(p.catch_cd_ticks / 60).toFixed(1)}s`, color: "#ffb74d", border: "#ffa726" };
        } else if (isHoldFull) {
          contextualPrompt = { text: "⚠️ Giỏ đầy! Nổi lên về bến chốt kho", color: "#ff8a80", border: "#ff5252" };
        } else {
          contextualPrompt = { text: `🐟 Nhấn [Space] Bắt đàn ${KIND_NAME[nearestFish.kind] || nearestFish.kind}`, color: "#ffffff", border: "#40c4ff" };
        }
      }
    }
  }

  // ===== HUD TRÊN =====
  ctx.fillStyle = highContrast ? "#000000" : "rgba(12, 20, 28, 0.88)";
  ctx.fillRect(0, 0, w, 56);
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,0.1)";
  ctx.lineWidth = highContrast ? 2 : 1;
  ctx.beginPath(); ctx.moveTo(0, 56); ctx.lineTo(w, 56); ctx.stroke();

  // 1. Đồng hồ
  const timeLeft = snap?.time_left_ticks ?? 0;
  text("⏱ " + fmtTime(timeLeft), 16, 36, {
    size: 20, weight: "bold", color: timeLeft < 1800 ? "#ff5252" : "#e8eef2"
  });

  // 2. Tọa độ
  if (p && p.pos) {
    text(`Độ sâu: ${p.pos[1].toFixed(1)}m`, 120, 35, { size: 18, color: "#9fb3c0" });
  }

  // 3. Thanh Oxy — Nhấp nháy nhanh dần khi gần 0 (Ticket 03 Phase 4)
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const oxyRatio = p.oxygen_ticks / p.oxygen_max_ticks;
    const isOxyLow = oxyRatio < 0.25;
    const isOxyMed = oxyRatio < 0.5;

    // Tần số nhấp nháy nhanh dần khi gần cạn oxy
    const flashSpeed = Math.max(2, Math.floor(oxyRatio * 20));
    const blink = Math.floor((snap?.tick || 0) / flashSpeed) % 2 === 0;

    let oxyColor = "#4fc3f7";
    let oxyLabel = "Oxy: " + Math.ceil(p.oxygen_ticks / 60) + "s";
    if (isOxyLow) {
      oxyColor = blink ? "#ff1744" : (highContrast ? "#ffff00" : "#ff8a80");
      oxyLabel = `🫁 HẾT HƠI: ${Math.ceil(p.oxygen_ticks / 60)}s!`;
    } else if (isOxyMed) {
      oxyColor = "#ffa726";
    }
    bar(w / 2 - 120, 18, 240, 20, oxyRatio, oxyColor, oxyLabel);
  }

  // 4. Máu
  if (p && p.hp !== undefined && p.hp_max) {
    let hearts = "";
    for (let i = 0; i < p.hp_max; i++) hearts += i < p.hp ? "♥ " : "♡ ";
    text("Máu:", w - 420, 35, { size: 18, color: "#b0bec5", weight: "bold" });
    text(hearts, w - 360, 36, { size: 20, color: p.hp <= 1 ? "#ff1744" : "#ff5252", weight: "bold" });
  }

  // 5. Nút Chế độ tương phản cao (Ticket 03 Phase 4)
  contrastBtnRect = { x: w - 240, y: 14, w: 124, h: 28 };
  roundRect(ctx, contrastBtnRect.x, contrastBtnRect.y, contrastBtnRect.w, contrastBtnRect.h, 6);
  ctx.fillStyle = highContrast ? "#ffff00" : "rgba(255, 255, 255, 0.08)";
  ctx.fill();
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255, 255, 255, 0.25)";
  ctx.lineWidth = highContrast ? 2 : 1;
  ctx.stroke();
  text(highContrast ? "👁️ Tương phản (C)" : "👁️ Chuẩn (C)", contrastBtnRect.x + contrastBtnRect.w / 2, contrastBtnRect.y + contrastBtnRect.h / 2, {
    size: 11, align: "center", base: "middle", weight: "bold",
    color: highContrast ? "#000000" : "#9fb3c0"
  });

  // 6. Nút Âm thanh
  soundBtnRect = { x: w - 110, y: 14, w: 96, h: 28 };
  roundRect(ctx, soundBtnRect.x, soundBtnRect.y, soundBtnRect.w, soundBtnRect.h, 6);
  ctx.fillStyle = soundEnabled ? "rgba(41, 182, 246, 0.25)" : "rgba(255, 255, 255, 0.08)";
  ctx.fill();
  ctx.strokeStyle = soundEnabled ? "#29b6f6" : "rgba(255, 255, 255, 0.25)";
  ctx.stroke();
  text(soundEnabled ? "🔊 Bật (M)" : "🔇 Tắt (M)", soundBtnRect.x + soundBtnRect.w / 2, soundBtnRect.y + soundBtnRect.h / 2, {
    size: 11, align: "center", base: "middle", weight: "bold", color: soundEnabled ? "#81d4fa" : "#9fb3c0"
  });

  if (contextualPrompt) {
    drawPrompt(contextualPrompt.text, w / 2, 92, {
      color: contextualPrompt.color,
      border: contextualPrompt.border,
      bg: contextualPrompt.bg,
      size: 18
    });
  }

  // ===== HUD DƯỚI: Giỏ hàng + Hiển thị độ tươi / Ươn (Ticket 05 Phase 3) =====
  ctx.fillStyle = "rgba(12, 20, 28, 0.9)";
  ctx.fillRect(0, h - bottom, w, bottom);
  ctx.strokeStyle = "rgba(255,255,255,0.1)";
  ctx.beginPath(); ctx.moveTo(0, h - bottom); ctx.lineTo(w, h - bottom); ctx.stroke();

  if (snap?.hold !== undefined && snap?.hold_capacity) {
    const cap = snap.hold_capacity;
    const holdItems = snap.hold || [];
    const sz = Math.min(28, Math.floor((w / 2 - 20) / cap) - 4);
    const startX = 16, startY = h - bottom + 8;

    let spoiledCount = 0;
    const counts = {};

    for (let i = 0; i < cap; i++) {
      const bx = startX + i * (sz + 4);
      roundRect(ctx, bx, startY, sz, sz, 4);
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.stroke();

      const it = holdItems[i];
      if (it) {
        const isObj = typeof it === "object" && it !== null;
        const kind = isObj ? it.kind : it;
        const fresh = isObj ? it.fresh : undefined;
        const isSpoiled = fresh !== undefined && fresh < 30;
        if (isSpoiled) spoiledCount++;
        counts[kind] = (counts[kind] || 0) + 1;

        roundRect(ctx, bx + 2, startY + 2, sz - 4, sz - 4, 3);
        ctx.fillStyle = isSpoiled ? "rgba(90, 80, 80, 0.6)" : kc(kind);
        ctx.fill();

        // Hiển thị thanh độ tươi hoặc nhãn ƯƠN (Ticket 05)
        if (fresh !== undefined) {
          if (isSpoiled) {
            ctx.strokeStyle = "#ff1744";
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(bx + 3, startY + 3);
            ctx.lineTo(bx + sz - 3, startY + sz - 3);
            ctx.stroke();
            text("ƯƠN", bx + sz / 2, startY + sz / 2 + 1, {
              size: 8, align: "center", base: "middle", weight: "bold", color: "#ff8a80"
            });
          } else {
            const fRatio = Math.max(0, Math.min(1, fresh / 100));
            const fCol = fresh >= 70 ? "#69f0ae" : "#ffd54f";
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(bx + 2, startY + sz - 5, sz - 4, 3);
            ctx.fillStyle = fCol;
            ctx.fillRect(bx + 2, startY + sz - 5, (sz - 4) * fRatio, 3);
          }
        }
      }
    }

    const summary = Object.keys(counts).map((k) => (KIND_NAME[k] || k) + " ×" + counts[k]).join(" · ");
    let giỏLabel = `Giỏ (${holdItems.length}/${cap})` + (summary ? `: ${summary}` : " (Đang trống)");
    if (spoiledCount > 0) {
      giỏLabel += ` · ⚠️ Có ${spoiledCount} món đã ươn!`;
    }
    text(giỏLabel, 16, h - bottom + sz + 24, { size: 16, color: spoiledCount > 0 ? "#ff8a80" : "#cfd8dc", weight: "bold" });
  }

  text("WASD: Bơi · E: Hái/Cập bến · Space: Bắt cá · Esc/P: Tạm dừng · R: Chơi lại", w - 16, h - 22, {
    size: 12, align: "right", color: "#9fb3c0"
  });
}

// ----- CẢNH QUÁN: Buổi tối -----
function drawQuan(w, h) {
  const meta = snap?.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1] || 16, Z = b.z[1] || 10;
  const top = 68, bottom = 64;
  const s = Math.max(1, Math.min((w - 48) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  if (highContrast) {
    ctx.fillStyle = "#000000";
    ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  } else {
    ctx.fillStyle = "#b88e58";
    ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
    ctx.strokeStyle = "#5a3a1f";
    ctx.lineWidth = 4;
    ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

    ctx.strokeStyle = "rgba(0,0,0,0.06)";
    ctx.lineWidth = 1;
    for (let x = 1; x < X; x++) {
      ctx.beginPath(); ctx.moveTo(sx(x), sy(0)); ctx.lineTo(sx(x), sy(Z)); ctx.stroke();
    }
  }

  // Bếp
  const stoves = snap?.stoves || [];
  stoves.forEach((st) => {
    const isCooking = st.state === "cooking";
    const isReady = st.state === "ready";
    let col = isCooking ? "#f57c00" : isReady ? "#43a047" : "#546e7a";
    let strokeCol = isReady ? "#b9f6ca" : "rgba(255,255,255,0.4)";
    if (highContrast) {
      col = "#000000";
      strokeCol = isReady ? "#00ff66" : isCooking ? "#ffff00" : "#ffffff";
    }
    
    roundRect(ctx, sx(st.pos[0]) - 0.9 * s, sy(st.pos[1]) - 0.9 * s, 1.8 * s, 1.8 * s, 6);
    ctx.fillStyle = col;
    ctx.fill();
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = highContrast ? 2.5 : 2;
    ctx.stroke();

    text("Bếp " + st.id, sx(st.pos[0]), sy(st.pos[1]) + 4, { size: 12, align: "center", weight: "bold", color: "#ffffff" });
    if (st.dish) {
      const icon = DISH_ICON[st.dish] || "🍲";
      text(icon + " " + (DISH_NAME[st.dish] || st.dish), sx(st.pos[0]), sy(st.pos[1]) - 1.05 * s, {
        size: 10, align: "center", weight: "bold", color: highContrast ? "#ffff00" : "#1a0f05"
      });
    }
    if (isCooking && st.cook_ticks_left !== undefined) {
      text("⏳ " + Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.35 * s, {
        size: 11, align: "center", weight: "bold", color: highContrast ? "#ffffff" : "#212121"
      });
    } else if (isReady) {
      text("✨ SẴN SÀNG", sx(st.pos[0]), sy(st.pos[1]) + 1.35 * s, {
        size: 10, align: "center", weight: "bold", color: highContrast ? "#00ff66" : "#1b5e20"
      });
    }
  });

  // Khói bếp
  if (!noFx && !highContrast) {
    ctx.save();
    steams.forEach((sm) => {
      ctx.fillStyle = `rgba(240, 240, 245, ${sm.alpha * 0.45})`;
      ctx.beginPath();
      ctx.arc(sx(sm.x), sy(sm.z), sm.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  // Bàn & Khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap?.customers || []).forEach((c) => (byTable[c.table_id] = c));
  const tables = snap?.tables || [];
  let urgentCustomerBanner = null;

  tables.forEach((tb) => {
    let tbFill = "#6d4c41";
    let tbStroke = "#3e2723";
    if (highContrast) {
      tbFill = "#000000";
      tbStroke = "#ffffff";
    }
    roundRect(ctx, sx(tb.pos[0]) - 1.0 * s, sy(tb.pos[1]) - 0.9 * s, 2.0 * s, 1.8 * s, 8);
    ctx.fillStyle = tbFill;
    ctx.fill();
    ctx.strokeStyle = tbStroke;
    ctx.lineWidth = highContrast ? 2.5 : 2;
    ctx.stroke();
    text("Bàn " + tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", weight: "bold", color: "#ffffff" });

    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.6 * s;
      const isEating = c.state === "eating";
      
      let cCol = isEating ? "#81c784" : "#ff80ab";
      let cBorder = "#ffffff";
      if (highContrast) {
        cCol = isEating ? "#00ff66" : "#ffffff";
        cBorder = "#ffffff";
      }
      ctx.fillStyle = cCol;
      ctx.beginPath();
      ctx.arc(cx, cy, 0.6 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = cBorder;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const dishName = DISH_NAME[c.dish_id] || c.dish_id || "?";
      const dishIcon = DISH_ICON[c.dish_id] || "🍲";
      text(dishIcon + " " + dishName, cx, cy - 0.85 * s, {
        size: 10, align: "center", weight: "bold", color: highContrast ? "#ffff00" : "#1a0f05"
      });

      if (!isEating && c.patience_ticks_left !== undefined) {
        const pRatio = c.patience_ticks_left / patMax;
        const pCol = pRatio < 0.25 ? "#ff1744" : pRatio < 0.5 ? "#ffa726" : "#4caf50";
        bar(cx - 0.9 * s, cy + 0.7 * s, 1.8 * s, 6, pRatio, pCol);

        // CẢNH BÁO NGUY HIỂM 3: KHÁCH SẮP GIẬN (< 25% kiên nhẫn)
        if (pRatio < 0.25) {
          const secLeft = Math.ceil(c.patience_ticks_left / 60);
          const blink = Math.floor(Date.now() / 250) % 2 === 0;

          // Viền cảnh báo nhấp nháy đỏ/vàng quanh bàn
          ctx.save();
          ctx.strokeStyle = blink ? "#ff1744" : "#ffea00";
          ctx.lineWidth = 3;
          ctx.setLineDash([5, 3]);
          roundRect(ctx, sx(tb.pos[0]) - 1.15 * s, sy(tb.pos[1]) - 1.05 * s, 2.3 * s, 2.1 * s, 10);
          ctx.stroke();
          ctx.restore();

          // Nhãn chữ + biểu tượng rõ ràng
          text(`😡 KHÁCH SẮP GIẬN! (${secLeft}s)`, cx, cy - 1.45 * s, {
            size: 11,
            align: "center",
            weight: "bold",
            color: blink ? "#ff1744" : "#ffffff",
            stroke: true,
            strokeColor: "#000000"
          });

          if (!urgentCustomerBanner) {
            urgentCustomerBanner = `Bàn ${tb.id}: 😡 KHÁCH SẮP GIẬN (${secLeft}s)!`;
          }
        }
      } else if (isEating) {
        text("😋 Đang ăn...", cx, cy + 0.85 * s, { size: 10, align: "center", color: highContrast ? "#00ff66" : "#2e7d32", weight: "bold" });
      }
    }
  });

  // Người chơi
  const p = snap?.player;
  let quanPrompt = null;
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const iRad = meta.interact_radius || 1.5;

    ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,0.4)";
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(px, py, iRad * s, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = highContrast ? "#ffffff" : "#ff8a3d";
    ctx.beginPath();
    ctx.arc(px, py, 0.55 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = highContrast ? "#000000" : "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();

    if (snap.hand) {
      const handDish = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      const icon = DISH_ICON[handDish] || "🍲";
      text(icon + " " + (DISH_NAME[handDish] || handDish), px, py - 0.9 * s, {
        size: 11, align: "center", weight: "bold", color: "#fff", stroke: true
      });
    }

    let nearStove = null, minSDist = Infinity;
    stoves.forEach((st) => {
      const d = Math.hypot(p.pos[0] - st.pos[0], p.pos[1] - st.pos[1]);
      if (d <= iRad && d < minSDist) { minSDist = d; nearStove = st; }
    });

    let nearTable = null, minTDist = Infinity;
    tables.forEach((tb) => {
      const d = Math.hypot(p.pos[0] - tb.pos[0], p.pos[1] - tb.pos[1]);
      if (d <= iRad && d < minTDist) { minTDist = d; nearTable = tb; }
    });

    if (nearStove) {
      if (nearStove.state === "ready") {
        quanPrompt = snap.hand
          ? { text: "⚠️ Tay đang bận cầm món khác!", color: "#ff8a80", border: "#ff5252" }
          : { text: `🍲 Nhấn [E] Bưng ${DISH_NAME[nearStove.dish] || nearStove.dish} từ Bếp ${nearStove.id}`, color: "#69f0ae", border: "#00e676" };
      } else if (nearStove.state === "idle") {
        quanPrompt = { text: `🍳 Nhấn [E] Bắt đầu nấu tại Bếp ${nearStove.id}`, color: "#ffffff", border: "#ffca28" };
      } else if (nearStove.state === "cooking") {
        quanPrompt = { text: `⏳ Bếp ${nearStove.id} đang nấu... (${Math.ceil((nearStove.cook_ticks_left || 0) / 60)}s)`, color: "#ffb74d", border: "#ffa726" };
      }
    } else if (nearTable) {
      const c = byTable[nearTable.id];
      if (c && c.state === "waiting") {
        const handDish = typeof snap.hand === "string" ? snap.hand : (snap.hand?.dish_id || null);
        if (handDish && handDish === c.dish_id) {
          quanPrompt = { text: `✨ Nhấn [E] Phục vụ Bàn ${nearTable.id} (${DISH_NAME[c.dish_id] || c.dish_id})`, color: "#69f0ae", border: "#00e676" };
        } else if (handDish) {
          quanPrompt = { text: `⚠️ Món trên tay không đúng! (Khách gọi: ${DISH_NAME[c.dish_id] || c.dish_id})`, color: "#ff8a80", border: "#ff5252" };
        } else {
          quanPrompt = { text: `Khách Bàn ${nearTable.id} đang đợi món: ${DISH_NAME[c.dish_id] || c.dish_id}`, color: "#ffd54f", border: "#ffca28" };
        }
      } else if (c && c.state === "eating") {
        quanPrompt = { text: `Bàn ${nearTable.id}: Khách đang thưởng thức món ăn`, color: "#b0bec5", border: "#78909c" };
      }
    }
  }

  // ===== HUD TRÊN =====
  ctx.fillStyle = highContrast ? "#000000" : "rgba(12, 20, 28, 0.88)";
  ctx.fillRect(0, 0, w, 56);
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,0.1)";
  ctx.lineWidth = highContrast ? 2.5 : 1;
  ctx.beginPath(); ctx.moveTo(0, 56); ctx.lineTo(w, 56); ctx.stroke();

  const timeLeft = snap?.time_left_ticks ?? 0;
  text("⏱ " + fmtTime(timeLeft), 16, 36, {
    size: 20, weight: "bold", color: timeLeft < 1800 ? "#ff5252" : "#e8eef2"
  });

  const money = snap?.money ?? 0;
  const rep = (snap?.reputation ?? 0).toFixed(1);
  const score = snap?.score ?? 0;
  text(`💰 Tiền: ${money}k`, 120, 35, { size: 18, weight: "bold", color: highContrast ? "#ffff00" : "#ffd54f" });
  text(`⭐ Uy tín: ${rep} / 5.0`, 280, 35, { size: 18, weight: "bold", color: highContrast ? "#00ffff" : "#81d4fa" });
  text(`🏆 Điểm: ${score}`, 480, 35, { size: 18, weight: "bold", color: highContrast ? "#00ff66" : "#a5d6a7" });

  const handDish = typeof snap?.hand === "string" ? snap.hand : (snap?.hand?.dish_id || null);
  const handLabel = handDish ? `🍲 Tay: ${DISH_NAME[handDish] || handDish}` : "✋ Tay trống";
  text(handLabel, Math.max(620, w - 640), 35, {
    size: 18, weight: "bold", color: handDish ? (highContrast ? "#00ff66" : "#69f0ae") : "#b0bec5"
  });

  // Nút Chế độ tương phản cao
  contrastBtnRect = { x: w - 240, y: 14, w: 122, h: 28 };
  roundRect(ctx, contrastBtnRect.x, contrastBtnRect.y, contrastBtnRect.w, contrastBtnRect.h, 6);

// =====================================================================================
//  NGÀY · MENU · INTRO · SHOP · PAUSE · SUMMARY  (Ticket 05/06 Phase 2 — Vinh)
//  Mọi thứ chỉ ĐỌC snapshot và gửi input (pause / shop_done / buy) qua POST /input.
// =====================================================================================
function phaseOf() { return snap ? (snap.phase || snap.mode || "gather") : "gather"; }
function isDay() { return snap?.mode === "day"; }
function modalActive() { return screen !== "game" || !!intro || pauseMenu; }

function sendNow(obj) { queue.push(JSON.stringify(obj)); flush(); }
function pulse(name) { sendNow({ [name]: true }); sendNow({ [name]: false }); }   // cạnh lên rồi nhả
function buyUpgrade(action) { sendNow({ buy: action }); }

function resetDayUi() {
  snap = null;
  pauseMenu = false; intro = null; screen = "game";
  introShown.clear();
  dayStats = {};
  totals = { served: 0, tips: 0, dishes: {} };
}

function trackDay() {
  if (!isDay()) return;
  if (dayStats.day !== snap.day) {
    dayStats = { day: snap.day, served: 0, left: 0, tips: 0, earned0: snap.earned ?? 0, rep0: snap.reputation ?? 0 };
  }
}
function trackDayEvent(ev) {
  const d = ev.data || {};
  if (ev.name === "paid") {
    dayStats.served = (dayStats.served || 0) + 1;
    dayStats.tips = (dayStats.tips || 0) + (d.tip || 0);
    totals.served++; totals.tips += d.tip || 0;
  } else if (ev.name === "customer_left") {
    dayStats.left = (dayStats.left || 0) + 1;
  } else if (ev.name === "served" && d.dish_id) {
    totals.dishes[d.dish_id] = (totals.dishes[d.dish_id] || 0) + 1;
  }
}

// --- pause: pause là CẠNH, nên chỉ gửi khi trạng thái thật (snap.state) khác ý muốn ---
function setPause(want) {
  if (!snap || snap.finished || snap.state === undefined) return;
  if ((snap.state === "paused") === want) return;
  const now = performance.now();
  if (now - lastPauseCmd < 250) return;     // chờ snapshot phản ánh lệnh trước, tránh gửi đôi
  lastPauseCmd = now;
  pulse("pause");
}
function uiTick() {
  const now = performance.now();
  if (screen === "boot") screen = (isDay() && !SKIP_MENU) ? "menu" : "game";
  if (screen === "game" && isDay() && !snap.finished && (snap.phase === "gather" || snap.phase === "quan")) {
    const key = snap.day + ":" + snap.phase;
    if (!introShown.has(key)) { introShown.add(key); intro = { kind: snap.phase, start: now }; }
  }
  if (intro && now - intro.start > INTRO_MS) intro = null;
  if (snap.finished) { pauseMenu = false; intro = null; }
  setPause(screen !== "game" || !!intro || pauseMenu);
}

function startGame() { restartGame(); }
function exitGame() { screen = "exited"; try { window.close(); } catch (e) {} }
function toMenu() { pauseMenu = false; intro = null; screen = "menu"; }
function dismissIntro() { intro = null; }
function togglePause() { if (snap && !snap.finished && screen === "game" && !intro) pauseMenu = !pauseMenu; }
function upgradeKeys() { return Object.keys(snap?.meta?.upgrades || { oxygen: 1, hp: 1, net: 1 }); }

// Trả true nếu phím đã bị UI tiêu thụ (không chuyển cho gameplay).
function uiKey(k, e) {
  if (k === "c" || k === "m") return false;
  if (screen === "menu") {
    if (k === "enter" || k === " ") startGame();
    else if (k === "escape" || k === "q") exitGame();
    return true;
  }
  if (screen === "exited") return true;
  if (!snap) return false;
  if (snap.finished && isDay() && snap.reason === "days_complete") {
    if (k === "r") return false;
    if (k === "enter") restartGame();
    else if (k === "q" || k === "escape") toMenu();
    return true;
  }
  if (intro) { dismissIntro(); return true; }
  if (k === "escape" || k === "p") { togglePause(); return true; }
  if (pauseMenu) {
    if (k === "r") return false;
    if (k === "enter") pauseMenu = false;
    else if (k === "q") toMenu();
    return true;
  }
  if (isDay() && phaseOf() === "shop" && !snap.finished) {
    const ks = upgradeKeys();
    if (/^[1-9]$/.test(k) && ks[Number(k) - 1]) { buyUpgrade(ks[Number(k) - 1]); return true; }
    if (k === "enter" || k === "n") { pulse("shop_done"); return true; }
  }
  return false;
}

// --- tiện ích vẽ ---
function stockCounts(stock) {
  const c = {};
  if (Array.isArray(stock)) stock.forEach((it) => { const k = typeof it === "object" && it ? it.kind : it; if (k) c[k] = (c[k] || 0) + 1; });
  else if (stock && typeof stock === "object") Object.keys(stock).forEach((k) => { if (stock[k] > 0) c[k] = stock[k]; });
  return c;
}
function holdCounts() {
  const c = {};
  (snap?.hold || []).forEach((it) => {
    const o = typeof it === "object" && it !== null;
    if (o && it.fresh !== undefined && it.fresh < 30) return;      // hàng ươn không tính vào kế hoạch
    const k = o ? it.kind : it;
    c[k] = (c[k] || 0) + 1;
  });
  return c;
}
const ingText = (o) => Object.keys(o || {}).map((k) => `${KIND_NAME[k] || k} ×${o[k]}`).join(" · ") || "—";
function panelBox(x, y, pw, ph, title) {

}
function uiButton(id, label, x, y, bw, bh, onClick, o = {}) {

  ctx.fill();
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,0.5)";

function drawTopButtons(w) {

  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,0.25)"; ctx.lineWidth = 1; ctx.stroke();
  text(highContrast ? "👁️ Tương phản (C)" : "👁️ Chuẩn (C)", contrastBtnRect.x + 62, contrastBtnRect.y + 14, {

  soundBtnRect = { x: w - 110, y: 14, w: 96, h: 28 };
  roundRect(ctx, soundBtnRect.x, soundBtnRect.y, soundBtnRect.w, soundBtnRect.h, 6);
  ctx.fillStyle = soundEnabled ? "rgba(41,182,246,0.25)" : "rgba(255,255,255,0.08)"; ctx.fill();
  ctx.strokeStyle = soundEnabled ? "#29b6f6" : "rgba(255,255,255,0.25)"; ctx.stroke();
  text(soundEnabled ? "🔊 Bật (M)" : "🔇 Tắt (M)", soundBtnRect.x + 48, soundBtnRect.y + 14, {

// --- huy hiệu Ngày + bảng "đã lấy/cần" (HUD sáng) ---
function drawDayBadge(w, h) {

// --- Shop (kèm kết quả Ngày) ---
function upEffect(k, spec) {
  if (!spec) return "";
  if (k === "oxygen") return `Oxy tối đa ${spec.oxygen_max_s}s`;
  if (k === "hp") return `Máu tối đa ${spec.hp_max}`;
  if (k === "net") return `Lưới bán kính ${spec.catch_radius}, ${spec.max_schools} đàn/lần`;

}
function drawShop(w, h) {

  const earned = (snap?.earned ?? 0) - (dayStats.earned0 ?? 0);
  const repDelta = (snap?.reputation ?? 0) - (dayStats.rep0 ?? snap?.reputation ?? 0);
  const rows = [
    ["Khách đã phục vụ", String(dayStats.served ?? 0), "#69f0ae"],
    ["Khách bỏ đi", String(dayStats.left ?? 0), (dayStats.left ?? 0) > 0 ? "#ff8a80" : "#ffffff"],
    ["Doanh thu ngày", `${earned}k`, "#ffd54f"],
    ["Tiền boa", `${dayStats.tips ?? 0}k`, "#ffd54f"],

  ];
  rows.forEach((r, i) => {

}

  const mw = Math.min(680, w - 40), mh = 120 + 34 * (dishes.length + 2) + 80;
  const mx = (w - mw) / 2, my = Math.max(20, (h - mh) / 2);
  panelBox(mx, my, mw, mh, evening ? `🌆 Ngày ${snap.day} — Mở quán buổi tối` : `📅 Ngày ${snap.day} — Má Tư dặn`);
  let y = my + 76;
  text(evening ? "Món cần bán hôm nay (số suất):" : "Món cần làm hôm nay (số suất):", mx + 24, y, { size: 19, color: "#b0bec5" });
  dishes.forEach((d) => { y += 34; text(`${DISH_ICON[d] || "🍲"} ${DISH_NAME[d] || d}`, mx + 40, y, { size: 20, weight: "bold" });
    text(`× ${plan.dishes[d]}`, mx + mw - 40, y, { size: 20, align: "right", weight: "bold", color: "#ffd54f" }); });
  y += 40;
  if (evening) {
    text("📦 Nhập kho:", mx + 24, y, { size: 19, color: "#b0bec5" });
    text(ingText(stockCounts(snap?.stock)), mx + 150, y, { size: 19, weight: "bold", color: "#69f0ae" });
  } else {
    text("🎯 Nguyên liệu cần lấy:", mx + 24, y, { size: 19, color: "#b0bec5" });
    y += 32;
    text(ingText(plan.ingredients), mx + 40, y, { size: 19, weight: "bold", color: "#69f0ae" });
  }
  const frac = 1 - (performance.now() - intro.start) / INTRO_MS;
  bar(mx + 24, my + mh - 56, mw - 48, 14, frac, "#4fc3f7");
  text(evening ? "Nhấn phím bất kỳ để mở quán" : "Nhấn phím bất kỳ để lặn", w / 2, my + mh - 18, { size: 18, align: "center", color: "#9fb3c0" });
}
function drawPause(w, h) {
  if (!noFx && !highContrast && "filter" in ctx) {   // làm mờ nền: vẽ lại chính canvas với blur
    ctx.save();
    ctx.filter = "blur(6px)";
    ctx.drawImage(cv, 0, 0, cv.width, cv.height, 0, 0, w, h);
    ctx.restore();
  }
  dimBackground(w, h, 0.62);
  const mw = 420, mh = 280, mx = (w - mw) / 2, my = (h - mh) / 2;
  panelBox(mx, my, mw, mh, "");
  text("⏸ TẠM DỪNG", w / 2, my + 56, { size: 32, align: "center", weight: "bold", color: "#ffd54f" });
  uiButton("pause-resume", "▶ Tiếp tục (Esc / Enter)", mx + 40, my + 90, mw - 80, 56, () => { pauseMenu = false; }, { size: 20 });
  uiButton("pause-menu", "🏠 Về menu (Q)", mx + 40, my + 164, mw - 80, 56, toMenu, { fill: "#b0bec5", hover: "#eceff1", size: 20 });
  text("Mọi đồng hồ đã dừng", w / 2, my + mh - 20, { size: 18, align: "center", color: "#9fb3c0" });
}
function drawSummary(w, h) {
  dimBackground(w, h, 0.9);
  const mw = Math.min(620, w - 40), mh = 460, mx = (w - mw) / 2, my = (h - mh) / 2;
  panelBox(mx, my, mw, mh, "");
  text(`🏆 TỔNG KẾT — hết Ngày ${snap.day}`, w / 2, my + 56, { size: 32, align: "center", weight: "bold", color: "#ffd54f" });
  const dishes = Object.keys(totals.dishes).sort((a, b) => totals.dishes[b] - totals.dishes[a] || (a < b ? -1 : 1));
  const best = dishes.length ? `${DISH_ICON[dishes[0]] || "🍲"} ${DISH_NAME[dishes[0]] || dishes[0]} (${totals.dishes[dishes[0]]} suất)` : "—";
  const rows = [
    ["💰 Tổng tiền kiếm được", `${snap.earned ?? 0}k`, "#ffd54f"],
    ["👛 Tiền đang có", `${snap.money ?? 0}k`, "#ffd54f"],
    ["🏆 Tổng điểm", String(snap.score ?? 0), "#69f0ae"],
    ["⭐ Uy tín", `${(snap.reputation ?? 0).toFixed(1)} / 5.0`, "#81d4fa"],
    ["🍽 Khách đã phục vụ", String(totals.served), "#ffffff"],
    ["🔥 Món bán chạy", best, "#ffffff"],
  ];
  rows.forEach((r, i) => {
    text(r[0], mx + 32, my + 112 + i * 42, { size: 20 });
    text(r[1], mx + mw - 32, my + 112 + i * 42, { size: 20, align: "right", weight: "bold", color: r[2] });
  });
  uiButton("sum-again", "🔄 Chơi lại (R / Enter)", mx + 32, my + mh - 82, (mw - 80) / 2, 54, restartGame, { size: 18 });
  uiButton("sum-menu", "🏠 Về menu (Q)", mx + 48 + (mw - 80) / 2, my + mh - 82, (mw - 80) / 2, 54, toMenu, { fill: "#b0bec5", hover: "#eceff1", size: 18 });
  restartBtnRect = null;
}
function drawModals(w, h) {
  if (screen === "menu") drawMenu(w, h);
  else if (screen === "exited") drawExited(w, h);
  else if (intro) drawIntro(w, h);
  else if (pauseMenu) drawPause(w, h);
}

// ----- MÀN HÌNH KẾT THÚC & TOASTS -----
function overlay(w, h) {
  drawDangerVignette(w, h);
  updateAndDrawFloatingTexts();
  drawToasts(w, h);

  if (offline) {
    text("⚠️ Mất kết nối tới máy chủ (hãy kiểm tra tiến trình server)", w / 2, 80, {
      align: "center", color: "#ff5252", size: 16, weight: "bold"
    });
  }
  if (snap?.error) {
    text("❌ Luật game báo lỗi — kiểm tra terminal. Nhấn R để chơi lại.", w / 2, 105, {
      align: "center", color: "#ff5252", size: 15, weight: "bold"
    });
  }

  if (snap?.finished && snap.mode === "day" && snap.reason === "days_complete") {
    restartBtnRect = null;
    drawSummary(w, h);
    return;
  }

  if (snap?.finished) {
    ctx.save();
    ctx.fillStyle = highContrast ? "rgba(0, 0, 0, 0.92)" : "rgba(6, 12, 18, 0.85)";
    ctx.fillRect(0, 0, w, h);

    const mw = Math.min(520, w - 40);
    const mh = 320;
    const mx = (w - mw) / 2, my = (h - mh) / 2;

    roundRect(ctx, mx, my, mw, mh, 12);
    ctx.fillStyle = highContrast ? "#000000" : "rgba(16, 26, 38, 0.96)";
    ctx.fill();
    ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255, 255, 255, 0.18)";
    ctx.lineWidth = highContrast ? 3 : 1.5;
    ctx.stroke();

    const modeName = snap.mode === "gather" ? "BUỔI SÁNG (GATHER)" : snap.mode === "day" ? "NGÀY CHƠI" : "BUỔI TỐI (QUÁN)";
    text(modeName + " KẾT THÚC", w / 2, my + 42, {
      align: "center", size: 22, weight: "bold", color: highContrast ? "#ffff00" : "#ffd54f"
    });

    let reasonText = "Hoàn thành phiên chơi";
    let reasonColor = "#81d4fa";
    if (snap.reason === "docked") {
      reasonText = "⚓ CẬP BẾN AN TOÀN — Toàn bộ giỏ hàng đã được chốt vào kho!";
      reasonColor = highContrast ? "#00ff66" : "#69f0ae";
    } else if (snap.reason === "time") {
      reasonText = "⏱ HẾT GIỜ CA LÀM — Ca làm việc đã kết thúc đúng giờ quy định.";
      reasonColor = highContrast ? "#ffff00" : "#ffb74d";
    } else if (snap.reason === "fainted") {
      if (snap.faint_cause === "monster") {
        reasonText = "🐊 BỊ THỦY QUÁI TÁP KIỆT SỨC — Toàn bộ giỏ thu hoạch đã bị trôi mất!";
      } else {
        reasonText = "😵 KIỆT SỨC VÌ CẠN OXY — Toàn bộ giỏ thu hoạch đã bị trôi mất!";
      }
      reasonColor = highContrast ? "#ff3333" : "#ff5252";
    } else if (snap.reason) {
      reasonText = "Lý do: " + snap.reason;
    }
    text(reasonText, w / 2, my + 78, {
      align: "center", size: 13, weight: "bold", color: reasonColor
    });

    roundRect(ctx, mx + 30, my + 105, mw - 60, 115, 8);
    ctx.fillStyle = highContrast ? "#111111" : "rgba(255, 255, 255, 0.05)";
    ctx.fill();
    if (highContrast) {
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    if (snap.mode === "gather") {
      const holdCount = snap.hold ? snap.hold.length : 0;
      const holdCap = snap.hold_capacity || 12;
      text(`📦 Sản lượng thu hoạch: ${holdCount} / ${holdCap} món`, mx + 50, my + 140, { size: 14, color: "#ffffff" });
      text(`🫧 Lượng Máu còn lại: ${snap.player?.hp ?? 0} ♥`, mx + 50, my + 172, { size: 14, color: highContrast ? "#ff3333" : "#ff8a80" });
      text(`⏱ Thời gian tồn tại: ${fmtTime(snap.time_left_ticks)}`, mx + 50, my + 200, { size: 14, color: highContrast ? "#00ffff" : "#90caf9" });
    } else {
      text(`💰 Doanh thu: ${snap.money ?? 0}k`, mx + 50, my + 140, { size: 14, weight: "bold", color: highContrast ? "#ffff00" : "#ffd54f" });
      text(`⭐ Điểm Uy tín: ${(snap.reputation ?? 0).toFixed(1)} / 5.0`, mx + 50, my + 172, { size: 14, weight: "bold", color: highContrast ? "#00ffff" : "#81d4fa" });
      text(`🏆 Tổng điểm chung cuộc: ${snap.score ?? 0}`, mx + 50, my + 200, { size: 15, weight: "bold", color: highContrast ? "#00ff66" : "#69f0ae" });
    }

    const bw = 220, bh = 42;
    const bx = (w - bw) / 2, by = my + mh - 60;
    restartBtnRect = { x: bx, y: by, w: bw, h: bh };

    roundRect(ctx, bx, by, bw, bh, 8);
    ctx.fillStyle = highContrast ? "#ffffff" : "#29b6f6";
    ctx.fill();
    ctx.strokeStyle = highContrast ? "#ffffff" : "#81d4fa";
    ctx.lineWidth = 2;
    ctx.stroke();

    text("🔄 CHƠI LẠI (Phím R)", w / 2, by + bh / 2, {
      align: "center", base: "middle", size: 14, weight: "bold", color: "#000000"
    });

    ctx.restore();
  } else {
    restartBtnRect = null;
  }
}

// ----- VÒNG LẶP CHÍNH -----
function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();

  ctx.save();
  if (shakeTicks > 0) {
    const ox = (Math.random() - 0.5) * shakeMag;
    const oy = (Math.random() - 0.5) * shakeMag;
    ctx.translate(ox, oy);
    shakeTicks--;
  }

  ctx.fillStyle = highContrast ? "#000000" : "#0c1218";
  ctx.fillRect(0, 0, w, h);
  
  if (snap) {
    uiButtons.length = 0;
    uiTick();
    updateParticles();
    const ph = phaseOf();
    if (ph === "quan") drawQuan(w, h);
    else if (ph === "shop") drawShop(w, h);
    else drawGather(w, h);
    drawDayBadge(w, h);
    if (ph !== "shop") eventLog(w, h);
    overlay(w, h);
    drawModals(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải dữ liệu trò chơi…", w / 2, h / 2, {
      align: "center", size: 18, color: "#9fb3c0"
    });
  }
  ctx.restore();
}
requestAnimationFrame(frame);
</script>
