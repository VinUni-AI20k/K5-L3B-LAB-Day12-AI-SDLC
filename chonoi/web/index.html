<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 18px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp. CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input (không tính luật).
 * HUD v1.1 (TICKET-02 mục 2): menu chính (Chơi/Thoát), DayIntro/EveningIntro/DayResult/Shop/Summary,
 * pause (Esc/P: Tiếp tục, Về menu), chữ không chân ≥ 18 px ở 1280×720.
 * Màn hình giới thiệu (DayIntro, EveningIntro, DayResult) chỉ có ở client: client tự bật pause của sim khi hiện
 * và tắt khi đóng (sau 4 s hoặc nhấn phím), nên đồng hồ gameplay không chạy trong lúc đọc. Headless không bị ảnh hưởng.
 * Phím: WASD/mũi tên di chuyển · E tương tác · Space bắt cá · Esc/P tạm dừng · 1/2 mua oxy/áo phao · Enter đóng Shop ·
 * R chơi lại · L bật/tắt nhật ký sự kiện.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
const FONT = "px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";  // chữ không chân
const MIN = 18;  // cỡ chữ nhỏ nhất (DoD: ≥ 18 px ở 1280×720)
let DRY = false;  // lượt đo chiều cao HUD: không vẽ gì

// ---------- trạng thái client (không phải luật) ----------
let screen = "menu";        // menu | play | quit
let menuIdx = 0;            // 0 = Chơi, 1 = Thoát
let intro = null;           // {kind, until} khi đang hiện DayIntro / EveningIntro / DayResult
let shownDay = 0, lastPhase = null, showLog = false, highContrast = false;
const stats = { served: 0, left: 0, tips: 0, shift: 0, repStart: null, repEnd: null, earnedAtQuan: 0, best: {}, shopMsg: "" };
const seen = new Set();

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "", oneShot = {};

function currentInput() {
  const mode = snap ? (snap.phase || snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return Object.assign({ move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"),
                         pause: down.has("pause"), shop_done: down.has("shop_done") }, oneShot);
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  oneShot = {};
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
// Nhấn-nhả một nút boolean (tạo đúng một cạnh lên phía server).
function tap(name) { down.add(name); pushInput(); down.delete(name); pushInput(); }
const paused = () => !!snap && snap.state === "paused";
function setSimPaused(want) { if (snap && paused() !== want) tap("pause"); }
function restart() { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); seen.clear(); shownDay = 0; lastPhase = null; intro = null; }

function keyName(e) { return e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (e.repeat) return;
  if (screen === "menu") {                      // menu chính: ↑/↓ chọn, Enter/Space xác nhận
    if (k === "arrowup" || k === "w") menuIdx = 0;
    else if (k === "arrowdown" || k === "s") menuIdx = 1;
    else if (k === "enter" || k === " ") { if (menuIdx === 0) { screen = "play"; restart(); } else screen = "quit"; }
    else if (k === "escape") screen = "quit";
    return;
  }
  if (screen === "quit") { if (k === "enter") screen = "menu"; return; }
  if (k === "h") { highContrast = !highContrast; return; }
  if (intro) { closeIntro(); return; }          // DayIntro/EveningIntro/DayResult: nhấn phím bất kỳ để tiếp
  if (snap && snap.mode === "day" && snap.finished && k === "m") { screen = "menu"; menuIdx = 0; return; }  // Tổng kết
  if (paused()) {                               // menu pause
    if (k === "escape" || k === "p" || k === "q") tap("pause");
    else if (k === "m") { screen = "menu"; menuIdx = 0; }
    return;
  }
  if (MOVE_KEYS[k]) down.add(MOVE_KEYS[k]);
  else if (k === "e") down.add("interact");
  else if (k === " ") down.add("catch");
  else if (k === "escape" || k === "p") down.add("pause");
  else if (k === "enter") down.add("shop_done");
  else if (k === "1" || k === "2") oneShot.buy = k === "1" ? "oxygen" : "hp";
  else if (k === "l") showLog = !showLog;
  else if (k === "r") { restart(); return; }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "escape" || k === "p") down.delete("pause");
  else if (k === "enter") down.delete("shop_done");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  if (screen === "quit") { setTimeout(poll, 250); return; }
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    track();
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// Gom số liệu cho DayResult/Summary từ event (chỉ hiển thị) và bật màn hình giới thiệu khi đổi Ngày / đổi pha.
function track() {
  for (const ev of snap.events || []) {
    const key = ev.tick + "|" + ev.name + "|" + JSON.stringify(ev.data);
    if (seen.has(key)) continue;
    seen.add(key);
    const d = ev.data || {};
    if (ev.name === "day_start") Object.assign(stats, { served: 0, left: 0, tips: 0, shift: 0, repStart: snap.reputation, shopMsg: "" });
    else if (ev.name === "phase_start" && ev.phase === "quan") stats.earnedAtQuan = snap.earned || 0;
    else if (ev.name === "served") { stats.served++; stats.best[d.dish_id] = (stats.best[d.dish_id] || 0) + 1; }
    else if (ev.name === "paid") stats.tips += d.tip || 0;
    else if (ev.name === "customer_left" && d.reason === "patience") stats.left++;
    else if (ev.name === "quan_end") { stats.shift = d.shift_earned || 0; stats.repEnd = d.reputation; }
    else if (ev.name === "bought") stats.shopMsg = `Đã mua ${UP_NAME[d.upgrade] || d.upgrade} cấp ${d.level} (−${d.price}k)`;
    else if (ev.name === "buy_failed") stats.shopMsg = `Không mua được: ${FAIL[d.reason] || d.reason}`;
  }
  if (screen !== "play" || snap.mode !== "day" || snap.finished) return;
  if ((snap.day || 0) > shownDay) { shownDay = snap.day; if (stats.repStart === null) stats.repStart = snap.reputation; openIntro("day"); }
  else if (lastPhase === "gather" && snap.phase === "quan") openIntro("evening");
  else if (lastPhase === "quan" && snap.phase === "shop") openIntro("result");
  lastPhase = snap.phase;
}
function openIntro(kind) { intro = { kind, until: performance.now() + 4000 }; setSimPaused(true); }
function closeIntro() { intro = null; setSimPaused(false); }

// ---------- dữ liệu hiển thị ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const DISH_NAME = { ca_loc_nuong_trui: "cá lóc nướng trui", goi_bong_sung: "gỏi bông súng", lau_ca_linh_dien_dien: "lẩu cá linh điên điển", canh_chua_ca_loc: "canh chua cá lóc", ca_keo_nuong: "cá kèo nướng", lau_mam: "lẩu mắm" };
const dn = (id) => DISH_NAME[id] || id;
const UP_NAME = { oxygen: "Bình oxy", hp: "Áo phao" };
const FAIL = { funds: "không đủ tiền", max_level: "đã tối đa", unknown: "lệnh không hỗ trợ", out_of_stock: "hết hàng" };
// Kho khả dụng = tồn vật lý − phần khách đang giữ chỗ (PRD mục F, Quán bước 5; contracts mục 3).
function availableStock(stock, customers) {
  // v1.2 stock/reserved are individual items; retain v1.1 support while phases integrate.
  if (Array.isArray(stock)) {
    const reserved = new Set((customers || []).flatMap((c) => Array.isArray(c.reserved) ? c.reserved : []));
    return stock.filter((item) => !reserved.has(item.id));
  }
  const out = Object.assign({}, stock || {});
  (customers || []).forEach((c) => Object.keys(c.reserved || {}).forEach((k) => { out[k] = (out[k] || 0) - c.reserved[k]; }));
  return out;
}
function itemSummary(items, { includeFresh = false, availableOnly = false } = {}) {
  if (!Array.isArray(items)) return Object.keys(items || {}).map((k) => `${KIND_NAME[k] || k} ×${items[k]}`).join(" · ") || "Trống";
  let list = items;
  if (availableOnly) {
    const reserved = new Set((snap.customers || []).flatMap((c) => Array.isArray(c.reserved) ? c.reserved : []));
    list = list.filter((item) => !reserved.has(item.id));
  }
  return list.map((item) => {
    const stale = Number(item.fresh) < Number((snap.freshness || {}).spoiled_below ?? 30);
    const label = `${KIND_NAME[item.kind] || item.kind}${includeFresh ? ` ${Math.round(Number(item.fresh))}%` : ""}${stale ? " · ƯƠN" : ""}`;
    return label;
  }).join(" · ") || "Trống";
}
const blinkOn = () => Math.floor(performance.now() / 250) % 2 === 0;

// ---------- vẽ: tiện ích ----------
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  if (DRY) return;
  ctx.font = (o.bold ? "600 " : "") + Math.max(MIN, o.size || MIN) + FONT;
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function measure(s, o = {}) { ctx.font = (o.bold ? "600 " : "") + Math.max(MIN, o.size || MIN) + FONT; return ctx.measureText(String(s)).width; }
// Như text() nhưng cắt bớt kèm "…" để không vượt maxW. maxW < 24 thì không vẽ.
function fitText(s, x, y, maxW, o = {}) {
  if (maxW < 24) return;
  s = String(s);
  if (measure(s, o) > maxW) {
    while (s.length > 1 && measure(s + "…", o) > maxW) s = s.slice(0, -1);
    s += "…";
  }
  text(s, x, y, o);
}
function panel(x, y, w, h, fill = "rgba(13,25,32,.9)") {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.15)"; ctx.lineWidth = 1; ctx.stroke();
}
function bar(x, y, w, h, frac, color) {
  if (DRY) return;
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}
function fmtTime(ticks) {
  const s = Math.ceil((ticks || 0) / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function timeColor() { return (snap.time_left_ticks || 0) <= 30 * 60 ? (blinkOn() ? "#ff5252" : "#ffcdd2") : "#e8eef2"; }
// Bố trí một hàng HUD từ trái sang phải; phần tử không vừa thì xuống hàng mới. Trả y của hàng cuối.
function flow(items, x0, y, maxX, rowH) {
  let x = x0;
  for (const it of items) {
    const w = it.w();
    if (x > x0 && x + w > maxX) { x = x0; y += rowH; }
    it.draw(x, y, maxX - x);
    x += w + 22;
  }
  return y;
}
const T = (s, o = {}) => ({ w: () => measure(s, o), draw: (x, y) => text(s, x, y, o) });
function statusCard(w, h, title, subtitle, details, accent = "#f0cf88", footer = "") {
  ctx.fillStyle = "rgba(5,12,18,.78)"; ctx.fillRect(0, 0, w, h);
  const pw = Math.min(720, w - 32), ph = Math.min(470, h - 32), x = (w - pw) / 2, y = (h - ph) / 2;
  panel(x, y, pw, ph, "rgba(18,32,40,.98)");
  fitText(title, w / 2, y + 58, pw - 40, { size: 30, align: "center", color: accent, bold: true });
  fitText(subtitle || "", w / 2, y + 98, pw - 40, { size: 20, align: "center" });
  (details || []).slice(0, 10).forEach((line, i) => fitText(line, x + 36, y + 142 + i * 30, pw - 72, { size: 18, color: i % 2 ? "#cbd8d8" : "#f1e7d2" }));
  if (footer) fitText(footer, w / 2, y + ph - 22, pw - 40, { size: 18, align: "center", color: "#9fb3c0" });
}
function promptBox(w, h, message, color = "#fff0ae") {
  const width = Math.min(560, w - 32), height = 52, x = (w - width) / 2, y = h - height - 70;
  panel(x, y, width, height, "rgba(10,24,32,.94)");
  fitText(message, w / 2, y + 34, width - 32, { size: 22, align: "center", color, bold: true });
}
function warningBanner(w, h, message, kind) {
  const palette = highContrast
    ? { monster: ["#fff", "#790000"], oxygen: ["#111", "#ffdf00"], patience: ["#111", "#ffdf00"] }
    : { monster: ["#fff", "#6d287f"], oxygen: ["#fff", "#9b271f"], patience: ["#fff", "#8a4b00"] };
  const [fg, bg] = palette[kind];
  const width = Math.min(w - 24, 560), x = (w - width) / 2, y = Math.max(8, h - 118);
  ctx.fillStyle = bg; ctx.fillRect(x, y, width, 48);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = highContrast ? 4 : 2; ctx.strokeRect(x + 1, y + 1, width - 2, 46);
  fitText(message, w / 2, y + 32, width - 24, { size: 22, align: "center", color: fg, bold: true });
}

// ---------- màn hình ----------
function drawMenu(w, h) {
  ctx.fillStyle = "#0d2230"; ctx.fillRect(0, 0, w, h);
  fitText("QUÁN ĂN CHỢ NỔI", w / 2, h / 2 - 110, w - 32, { size: 40, align: "center", color: "#f4c430", bold: true });
  fitText("Út Sen lặn bắt cá, hái rau rồi tối mở quán trên nhà bè Má Tư", w / 2, h / 2 - 68, w - 32, { size: 20, align: "center", color: "#cdbfa6" });
  ["Chơi", "Thoát"].forEach((label, i) => {
    const y = h / 2 + i * 64, sel = i === menuIdx;
    panel(w / 2 - 130, y - 36, 260, 50, sel ? "rgba(244,196,48,.95)" : "rgba(18,32,40,.95)");
    text(label, w / 2, y - 4, { size: 24, align: "center", color: sel ? "#1b1205" : "#e8eef2", bold: true });
  });
  fitText("↑/↓ chọn · Enter để xác nhận", w / 2, h / 2 + 150, w - 32, { size: 18, align: "center", color: "#9fb3c0" });
}
function drawQuit(w, h) {
  ctx.fillStyle = "#0d2230"; ctx.fillRect(0, 0, w, h);
  fitText("Hẹn gặp lại ở chợ nổi!", w / 2, h / 2 - 10, w - 32, { size: 30, align: "center", color: "#f4c430" });
  fitText("Có thể đóng tab này. Enter để về menu.", w / 2, h / 2 + 30, w - 32, { size: 18, align: "center", color: "#9fb3c0" });
}
function dayLines() {
  const p = snap.day_plan || {}, dishes = p.dishes || {}, ing = p.ingredients || {};
  return Object.keys(dishes).map((id) => `• ${dn(id)} × ${dishes[id]}`)
    .concat(["Nguyên liệu cần gom: " + Object.keys(ing).map((k) => `${KIND_NAME[k] || k} ${ing[k]}`).join(", ")]);
}
function cookable(stock) {
  const plan = (snap.day_plan && snap.day_plan.dishes) || snap.menu || {}, menu = snap.menu || {};  // công thức từ contract
  const counts = Array.isArray(stock) ? stock.reduce((a, item) => {
    if (Number(item.fresh) >= Number((snap.freshness || {}).spoiled_below ?? 30)) a[item.kind] = (a[item.kind] || 0) + 1;
    return a;
  }, {}) : stock || {};
  return Object.keys(plan).filter((id) => menu[id] && Object.keys(menu[id].recipe).every((k) => (counts[k] || 0) >= menu[id].recipe[k])).map(dn);
}
function drawIntro(w, h) {
  const left = Math.max(0, Math.ceil((intro.until - performance.now()) / 1000));
  const foot = `Nhấn phím bất kỳ để tiếp tục · tự chuyển sau ${left} s`;
  if (intro.kind === "day") {
    statusCard(w, h, `NGÀY ${snap.day} · MÁ TƯ DẶN`, "Hôm nay quán định nấu:", dayLines(), "#f0cf88", foot);
  } else if (intro.kind === "evening") {
    const stock = snap.stock || [], can = cookable(stock);
    statusCard(w, h, "HÀNG ĐÃ VỀ BẾN", "Kho nhập cho quán tối nay", [
      "Nhập kho: " + itemSummary(stock, { includeFresh: true }),
      "Món nấu được: " + (can.join(", ") || "chưa đủ nguyên liệu món nào")], "#9bd5dc", foot);
  } else {
    const delta = stats.repEnd !== null && stats.repStart !== null ? (stats.repEnd - stats.repStart) : 0;
    statusCard(w, h, `KẾT QUẢ NGÀY ${snap.day}`, "Ca quán đã khép lại", [
      `Khách đã phục vụ: ${stats.served}`, `Khách bỏ đi: ${stats.left}`, `Tiền ca: ${stats.shift}k (boa ${stats.tips}k)`,
      `Uy tín: ${delta >= 0 ? "+" : ""}${delta.toFixed(1)} → ${Number(snap.reputation || 0).toFixed(1)}/5`], "#f5d58a", foot);
  }
  if (performance.now() >= intro.until) closeIntro();
}
function drawShop(w, h) {
  const ups = snap.upgrades || {}, active = snap.active_upgrades || {}, levels = (snap.meta && snap.meta.upgrades) || {};
  const lines = [`Tiền: ${snap.money ?? 0}k · Shop tự đóng sau ${fmtTime(snap.time_left_ticks)}`];
  [["oxygen", "1", "oxygen_max_s", "s oxy"], ["hp", "2", "hp_max", " Máu"]].forEach(([id, key, field, unit]) => {
    const cur = ups[id] || 0, next = (levels[id] || [])[cur];
    lines.push(`${key} · ${UP_NAME[id]}: cấp ${cur} (đang dùng ${active[id] || 0})` +
               (next ? ` → cấp ${next.level}: ${next[field]}${unit}, giá ${next.price}k` : " — đã tối đa"));
  });
  if (stats.shopMsg) lines.push(stats.shopMsg);
  statusCard(w, h, `SHOP CUỐI NGÀY ${snap.day || ""}`, "Nâng cấp có hiệu lực từ Ngày kế", lines, "#a9d6a2", "Enter · đóng Shop, sang Ngày tiếp");
}
function drawSummary(w, h) {
  const best = Object.keys(stats.best).sort((a, b) => stats.best[b] - stats.best[a])[0];
  statusCard(w, h, "TỔNG KẾT", `Đã xong ${snap.days_completed ?? snap.day ?? ""} Ngày ở chợ nổi`, [
    `Tổng tiền thu: ${snap.earned ?? 0}k (còn ${snap.money ?? 0}k)`, `Tổng điểm: ${snap.score ?? 0}`,
    `Uy tín: ${Number(snap.reputation || 0).toFixed(1)}/5`, `Món bán chạy: ${best ? dn(best) + " ×" + stats.best[best] : "—"}`],
    "#f4c430", "R · chơi lại   ·   M · về menu");
}
function drawPause(w, h) {
  statusCard(w, h, "TẠM DỪNG", "Đồng hồ và mọi hoạt động đang dừng", ["Esc / P / Q · Tiếp tục", "M · Về menu"], "#c5d8f5");
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => fitText(`t${e.tick} ${e.name}`, w - 16, h - 110 - (ev.length - 1 - i) * 24, w / 2, { size: 18, align: "right", color: "rgba(232,238,242,.8)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 40, { align: "center", color: "#ff8a80" });
  if (snap.error) text("Luật báo lỗi — xem terminal. R để chơi lại.", w / 2, 66, { align: "center", color: "#ff8a80" });
  if (snap.finished && snap.mode !== "day") {
    panel(w / 2 - 220, h / 2 - 54, 440, 108, "rgba(0,0,0,.75)");
    fitText("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 10, 400, { align: "center", size: 22 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 26, { align: "center", color: "#cfd8dc" });
  }
}

// ---------- HUD sáng ----------
function drawGatherHud(w) {
  const p = snap.player || {}, maxX = w - 26;
  const oxyMax = p.oxygen_max_ticks || 1, oxy = p.oxygen_ticks || 0, low = oxy < oxyMax * 0.25;
  const hpMax = p.hp_max || 3;
  let hearts = "";
  for (let i = 0; i < hpMax; i++) hearts += i < (p.hp || 0) ? "♥" : "♡";
  const cd = p.catch_cd_ticks || 0;
  const items = [
    T(snap.day ? `SÁNG · NGÀY ${snap.day}` : "BUỔI SÁNG", { color: "#9bd5dc", bold: true }),
    T("Còn " + fmtTime(snap.time_left_ticks), { size: 22, color: timeColor(), bold: true }),
    { w: () => 190, draw: (x, y) => { bar(x, y - 20, 190, 26, oxy / oxyMax, low ? (blinkOn() ? "#ff3d3d" : "#7a1f1f") : "#45c4df");
                                     text("Oxy " + Math.ceil(oxy / 60) + "s", x + 95, y, { align: "center", color: low ? "#fff" : "#e8eef2", bold: true }); } },
    T(hearts, { size: 26, color: "#ff7085" }),
    T(`Độ sâu ${Number((p.pos || [0, 0])[1]).toFixed(1)} m`, { color: "#d7ecf2" }),
    T(cd > 0 ? `Hồi bắt ${(cd / 60).toFixed(1)}s` : "Bắt cá: sẵn sàng", { color: cd > 0 ? "#ffd59a" : "#a5e3b0" }),
  ];
  const yTop = 38;
  let y = flow(items, 26, yTop, maxX, 32);
  const hold = snap.hold || [];
  const got = {};
  if (Array.isArray(hold)) hold.forEach((item) => { const kind = typeof item === "string" ? item : item.kind; got[kind] = (got[kind] || 0) + 1; });
  else Object.assign(got, hold);
  y += 32;
  const g = "GIỎ " + (snap.hold_count ?? (Array.isArray(hold) ? hold.length : Object.values(hold).reduce((a, n) => a + n, 0))) + "/" + (snap.hold_capacity || "—");
  text(g, 26, y, { color: "#b8c8cc", bold: true });
  const gw = measure(g, { bold: true }) + 16;
  fitText(Array.isArray(hold) ? itemSummary(hold, { includeFresh: true }) : Object.keys(got).map((k) => (KIND_NAME[k] || k) + " ×" + got[k]).join(" · ") || "Trống",
          26 + gw, y, maxX - 26 - gw, { color: "#f1dfae" });
  const need = (snap.day_plan && snap.day_plan.ingredients) || null;
  if (need) {
    y += 32;
    fitText("CẦN LẤY  " + Object.keys(need).map((k) => `${KIND_NAME[k] || k} ${got[k] || 0}/${need[k]}`).join(" · "), 26, y, maxX - 26, { color: "#ffe6a8" });
  }
  return y + 16;  // đáy HUD
}

// ---------- HUD quán ----------
function drawQuanHud(w) {
  const customers = snap.customers || [], stoves = snap.stoves || [], maxX = w - 26;
  const patMax = ((snap.meta && snap.meta.patience_s) || 60) * 60;
  const shift = Math.max(0, (snap.earned || 0) - (snap.mode === "day" ? stats.earnedAtQuan : 0));
  const items = [
    T(snap.day ? `TỐI · NGÀY ${snap.day}` : "BUỔI TỐI", { color: "#f5d58a", bold: true }),
    T("Còn " + fmtTime(snap.time_left_ticks), { size: 22, color: timeColor(), bold: true }),
    T("Tiền " + (snap.money ?? 0) + "k", { size: 20, color: "#ffe08a", bold: true }),
    T("Tiền ca " + shift + "k", { color: "#ffe08a" }),
    T("Uy tín " + Number(snap.reputation ?? 0).toFixed(1) + "/5", { color: "#d8c4ff" }),
    T("Điểm " + (snap.score ?? 0), { color: "#d7dbe0" }),
  ];
  let y = flow(items, 26, 38, maxX, 32) + 32;
  // DoD: KHO KHẢ DỤNG (tồn − phần khách giữ), không phải tồn vật lý. Chuỗi kho vẽ NGAY sau nhãn (tools/hud_check.py đọc vậy).
  const avail = availableStock(snap.stock, customers);
  text("KHO KHẢ DỤNG", 26, y, { color: "#b8c8cc", bold: true });
  const kw = measure("KHO KHẢ DỤNG", { bold: true }) + 16;
  fitText(Array.isArray(avail) ? itemSummary(avail, { includeFresh: true }) : Object.keys(avail).sort().filter((k) => avail[k] > 0).map((k) => (KIND_NAME[k] || k) + " ×" + avail[k]).join(" · ") || "Trống",
          26 + kw, y, maxX - 26 - kw, { color: "#d6edda" });
  y += 32;
  const stoveText = stoves.map((s) => {
    const dish = s.dish && s.dish.dish_id ? " " + dn(s.dish.dish_id) : "";
    return s.id + ": " + (s.state === "cooking" ? "nấu" + dish + " " + Math.ceil((s.cook_ticks_left || 0) / 60) + "s"
                         : s.state === "ready" ? "CHÍN" + dish : "rảnh");
  }).join("  ·  ") || "Chưa có bếp";
  fitText(stoveText, 26, y, maxX - 26, { color: stoves.some((s) => s.state === "ready") ? "#a5e3b0" : "#ffd1a1" });
  y += 32;
  // Món và kiên nhẫn từng bàn; đổi màu khi kiên nhẫn < 25%.
  let x = 26;
  if (!customers.length) text("Chưa có khách", 26, y, { color: "#cbd8d8" });
  let angry = false;
  for (const c of customers) {
    const eating = c.state === "eating", frac = (c.patience_ticks_left || 0) / patMax;
    const s = c.table_id + ": " + (c.dish_id ? dn(c.dish_id) : "đang chọn món") +
              (eating ? " · đang ăn " + Math.ceil((c.eat_ticks_left || 0) / 60) + "s" : " · " + Math.ceil((c.patience_ticks_left || 0) / 60) + "s");
    if (!eating && frac <= 0.25) angry = true;
    const sw = measure(s);
    if (x > 26 && x + sw > maxX) { x = 26; y += 28; }
    fitText(s, x, y, maxX - x, { color: eating ? "#a5e3b0" : frac < 0.25 ? (blinkOn() ? "#ff5252" : "#ffcdd2") : "#f5e4d3" });
    x += sw + 22;
  }
  if (angry) warningBanner(w, innerHeight, "⚠ KHÁCH SẮP GIẬN · PHỤC VỤ SỚM", "patience");
  y += 32;
  const hand = snap.hand ? dn(typeof snap.hand === "string" ? snap.hand : snap.hand.dish_id) : "Tay trống";
  fitText("ĐANG CẦM: " + hand, 26, y, maxX - 26, { color: "#ffcf8b", bold: true });
  return y + 16;
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  // vẽ HUD trước để biết chiều cao, rồi vẽ cảnh bên dưới (nền HUD vẽ lại sau cảnh)
  DRY = true; const hudBottom = drawGatherHud(w); DRY = false;
  const top = hudBottom + 8, bottom = 64;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  for (let d = 10; d <= D; d += 10) {  // ranh vùng nông/giữa/sâu
    ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 6, sy(d) - 4, { color: "rgba(255,255,255,.55)" });
  }
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.6 * s, { align: "center", color: "#fff" });
  });
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
  });
  (snap.monsters || []).forEach((m) => {
    const mp = m.pos || [0, 0];
    ctx.fillStyle = m.state === "recoil" ? "#7d5a8c" : m.state === "chase" ? "#d14fe0" : "#9c5cc2";
    ctx.beginPath(); ctx.ellipse(sx(mp[0]), sy(mp[1]), Math.max(10, 1.1 * s), Math.max(6, 0.5 * s), 0, 0, Math.PI * 2); ctx.fill();
  });
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && blinkOn())) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
  // gợi ý / cảnh báo
  const pp = (p && p.pos) || [0, 0];
  const nearMonster = (snap.monsters || []).some((m) => m.pos && Math.hypot(m.pos[0] - pp[0], m.pos[1] - pp[1]) <= 10);
  const nearNode = p && p.at_surface && (snap.nodes || []).some((n) => n.ready !== false && Math.hypot(n.pos[0] - pp[0], n.pos[1] - pp[1]) <= (meta.interact_radius || 2));
  const nearDock = Math.hypot(dp[0] - pp[0], dp[1] - pp[1]) <= dr;
  const lowOxygen = p && !p.at_surface && p.oxygen_ticks <= (p.oxygen_max_ticks || 0) * 0.25;
  if (nearMonster) { ctx.strokeStyle = highContrast ? "#fff" : (blinkOn() ? "#bd71dc" : "#7d3f99"); ctx.lineWidth = highContrast ? 10 : 8; ctx.strokeRect(4, 4, w - 8, h - 8); warningBanner(w, h, "⚠ THỦY QUÁI Ở GẦN", "monster"); }
  else if (lowOxygen) {
    ctx.strokeStyle = highContrast ? "#ffdf00" : (blinkOn() ? "#ff5252" : "#8f2929");
    ctx.lineWidth = highContrast ? 10 : 8;
    ctx.strokeRect(4, 4, w - 8, h - 8);
    warningBanner(w, h, "⚠ OXY SẮP HẾT · LÊN MẶT NƯỚC", "oxygen");
  }
  else if (nearDock) promptBox(w, h, "E · cập bến (về quán)");
  else if (nearNode) promptBox(w, h, "E · hái nguyên liệu");
  panel(12, 10, Math.max(280, w - 24), hudBottom - 6);
  drawGatherHud(w);
  fitText("WASD/↑↓ bơi · E hái/cập bến · Space bắt cá · Esc tạm dừng · H tương phản " + (highContrast ? "CAO" : "thường"), w - 16, h - 18, w - 32, { align: "right", color: highContrast ? "#fff" : "#d4e0e5", bold: highContrast });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  DRY = true; const hudBottom = drawQuanHud(w); DRY = false;
  const X = b.x[1], Z = b.z[1], top = hudBottom + 12, bottom = 44;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 7, { align: "center", color: "#111", bold: true });
    if (st.state === "cooking" && st.dish) {  // tiến độ nấu
      const total = ((snap.menu || {})[st.dish.dish_id] || {}).cook_s * 60 || null;  // thời gian nấu từ contract
      bar(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) + 0.9 * s, 1.6 * s, 6, total ? 1 - st.cook_ticks_left / total : 0.5, "#ffb74d");
    }
  });
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 7, { align: "center", color: "#fff", bold: true });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s, frac = (c.patience_ticks_left || 0) / patMax;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      if (c.state !== "eating") bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 6, frac, frac < 0.25 ? "#ff3d3d" : "#e57373");
    }
  });
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) { ctx.fillStyle = "#fff3c4"; ctx.beginPath(); ctx.arc(px + 0.45 * s, py - 0.45 * s, 0.25 * s, 0, Math.PI * 2); ctx.fill(); }
  }
  panel(12, 10, Math.max(280, w - 24), hudBottom - 6);
  drawQuanHud(w);
  fitText("WASD/↑↓ đi · E nấu/bưng/phục vụ · Esc tạm dừng · H tương phản " + (highContrast ? "CAO" : "thường"), w - 16, h - 14, w - 32, { align: "right", color: highContrast ? "#fff" : "#f0e3ca", bold: highContrast });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (screen === "menu") return drawMenu(w, h);
  if (screen === "quit") return drawQuit(w, h);
  if (!snap) { text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center" }); return; }
  if (snap.phase === "shop") drawShop(w, h);
  else if (snap.phase === "quan") drawQuan(w, h);
  else drawGather(w, h);
  if (showLog) eventLog(w, h);
  overlay(w, h);
  if (snap.mode === "day" && snap.finished) drawSummary(w, h);
  else if (intro) drawIntro(w, h);
  else if (paused()) drawPause(w, h);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
