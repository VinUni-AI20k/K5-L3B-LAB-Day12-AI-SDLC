<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  :root { color-scheme: light; background: #f5f2e9; color: #182e29; font: 14px/1.5 system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  .shell { max-width: 1360px; margin: auto; padding: 0 clamp(16px,4vw,58px); }
  .topbar { min-height: 73px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #dedfd1; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 11px; font-weight: 750; letter-spacing: -.025em; }
  .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: #174e43; color: #fff6d8; font-size: 27px; line-height: 1; }
  button { cursor: pointer; color: inherit; font: inherit; }
  button:focus-visible { outline: 3px solid #b7613e; outline-offset: 3px; }
  .restart { border: 1px solid #d9dccd; border-radius: 10px; background: #fffdf6; padding: 8px 13px; font-weight: 650; white-space: nowrap; }
  .restart:hover { background: #eeeee1; }
  .restart span { margin-right: 5px; font-size: 16px; }
  .intro { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin: 29px 0 23px; }
  .phase { color: #326958; font-weight: 750; font-size: .74rem; letter-spacing: .13em; text-transform: uppercase; }
  .quan .phase { color: #935335; }
  h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; }
  h1 { font-size: clamp(2.25rem, 4.1vw, 4.15rem); line-height: 1.1; letter-spacing: -.052em; margin: 4px 0 8px; }
  .intro p { margin: 0; color: #54655a; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { background: #fffdf6; border: 1px solid #e2e2d5; border-radius: 13px; padding: 9px 13px; min-width: 85px; }
  .stat span, .detail small { display: block; color: #5a6a5f; font-size: .76rem; font-weight: 650; }
  .stat strong { display: block; font-size: 1.19rem; line-height: 1.45; font-variant-numeric: tabular-nums; }
  .stat meter { display: block; width: 100%; height: 6px; appearance: none; }
  .stat meter::-webkit-meter-bar { background: #e4ebe1; border: 0; border-radius: 4px; }
  .stat meter::-webkit-meter-optimum-value { background: #477c66; border-radius: 4px; }
  .stat .hearts span { color: #ae504b; font-size: 1em; letter-spacing: .1em; }
  .board { display: grid; grid-template: "scene panel" "controls controls" / minmax(0,1fr) minmax(238px,27%); gap: 14px 16px; }
  .scene { grid-area: scene; position: relative; isolation: isolate; height: clamp(345px, 57vh, 540px); background: #143c3b; overflow: hidden; border-radius: 19px; box-shadow: 0 10px 25px #253c3020; }
  canvas { display: block; width: 100%; height: 100%; }
  .location, .notice { position: absolute; max-width: calc(100% - 28px); padding: 6px 11px; border: 1px solid #f1fff34a; border-radius: 8px; color: #fff8df; background: #153632e8; font-size: .78rem; font-weight: 650; }
  .location { top: 14px; left: 14px; }
  .notice { bottom: 14px; left: 14px; }
  .result { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; background: #0b252b9c; color: #fff8e5; padding: 16px; }
  .result strong { font: 600 clamp(1.55rem, 3vw, 2.2rem)/1.1 Georgia, serif; }
  .result button { color: #19342c; }
  aside { grid-area: panel; background: #fffdf6; border: 1px solid #e2e2d5; border-radius: 19px; padding: 20px; min-width: 0; }
  .panel-title { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
  h2 { margin: 0; font-size: 1.61rem; letter-spacing: -.035em; }
  .count { color: #315b4f; background: #e9efe3; padding: 2px 8px; border-radius: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: .82rem; font-weight: 750; }
  .slots { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 5px; margin: 14px 0 13px; }
  .slot { aspect-ratio: 1.45; border-radius: 5px; background: #edf0e7; border: 1px solid #e1e6da; }
  .slot.full { background: var(--item); border-color: transparent; }
  .ingredients { list-style: none; margin: 0; padding: 0; }
  .ingredients li { display: flex; gap: 9px; align-items: center; min-height: 30px; }
  .ingredients strong { margin-left: auto; font-variant-numeric: tabular-nums; }
  .ingredient-dot { width: 9px; height: 9px; flex: 0 0 9px; border-radius: 50%; background: var(--item); }
  .muted { color: #5a6a5f; }
  .hint { border-top: 1px solid #e5e7dc; margin: 15px 0 0; padding-top: 12px; color: #4c6055; font-size: .87rem; }
  .order { margin: 12px 0 10px; padding: 9px 11px; border-radius: 8px; background: #f4eadb; color: #633f27; }
  .order small { display: block; font-size: .76rem; font-weight: 650; }
  .order strong { display: block; line-height: 1.3; }
  .detail { padding: 4px 0; }
  .detail strong { display: block; line-height: 1.35; font-weight: 650; }
  .stock-title { display: block; margin: 11px 0 4px; padding-top: 9px; border-top: 1px solid #e5e7dc; font-weight: 750; }
  .controls { grid-area: controls; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: .84rem; color: #4e6056; }
  .board { margin-bottom: 20px; }
  kbd { display: inline-block; border: 1px solid #d9ddcf; border-bottom-width: 2px; background: #fffdf6; padding: 0 6px; border-radius: 5px; margin-right: 4px; font: 650 .76rem/1.6 system-ui,sans-serif; color: #263e34; }
  @media (max-width: 785px) {
    .intro { align-items: start; flex-direction: column; gap: 13px; margin: 19px 0 15px; }
    .board { grid-template: "scene" "controls" "panel" / minmax(0,1fr); }
    .scene { height: clamp(265px, 55vw, 420px); }
    aside { padding: 15px; }
    .slot { aspect-ratio: auto; height: 18px; }
  }
  @media (max-width: 405px) {
    .topbar { min-height: 56px; }
    .stat { min-width: 65px; padding: 5px 8px; }
    .intro p { font-size: .88rem; }
    .controls { gap: 7px 12px; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">≋</span>Quán Ăn Chợ Nổi</div>
    <button class="restart" type="button"><span aria-hidden="true">↻</span>Chơi lại</button>
  </header>
  <section class="intro" aria-labelledby="title">
    <div>
      <div class="phase" id="phase">Buổi sáng</div>
      <h1 id="title">Lặn &amp; hái</h1>
      <p id="instruction">Hái rau trên mặt nước, lặn bắt cá rồi mang giỏ về bến.</p>
    </div>
    <div class="stats" id="stats" aria-label="Thông tin lượt chơi"></div>
  </section>
  <div class="board">
    <section class="scene" aria-label="Khu vực chơi">
      <canvas id="c"></canvas>
      <div class="location" id="location">Sông Chín Khúc</div>
      <div class="notice" id="notice" role="status">Đang kết nối…</div>
      <div class="result" id="result" hidden>
        <strong id="result-title"></strong>
        <button class="restart" type="button">Chơi lại</button>
      </div>
    </section>
    <aside id="panel" aria-label="Chi tiết lượt chơi"></aside>
    <footer class="controls" aria-label="Điều khiển">
      <span><kbd>WASD</kbd><kbd>↑ ↓ ← →</kbd> Di chuyển</span>
      <span><kbd>E</kbd> <span id="action-label">Hái / cập bến</span></span>
      <span id="catch-control"><kbd>Space</kbd> Bắt cá</span>
      <span><kbd>R</kbd> Chơi lại</span>
    </footer>
  </div>
</main>
<script>
"use strict";
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const el = (id) => document.getElementById(id);
let snap = null, offline = false;
// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function restart() {
  fetch("/restart", { method: "POST" });
  lastSent = "";
  down.clear();
  pushInput();
}
document.querySelectorAll(".restart").forEach((button) => button.addEventListener("click", restart));
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === " " && e.target instanceof HTMLButtonElement) return;
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") return restart();
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- HUD ----------
const INGREDIENTS = {
  ca_loc: { name: "Cá lóc", color: "#799b69" },
  ca_linh: { name: "Cá linh", color: "#84aeb3" },
  bong_dien_dien: { name: "Bông điên điển", color: "#d7a144" },
  bong_sung: { name: "Bông súng", color: "#cb7890" },
};
const DISH_NAMES = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh bông điên điển",
};
const STOVE_STATES = { idle: "Đang trống", cooking: "Đang nấu", ready: "Món đã chín" };
const END_REASONS = { docked: "Đã cập bến", fainted: "Út Sen đã ngất", time: "Đã hết giờ", error: "Lượt chơi gặp lỗi" };
const MODES = {
  gather: {
    phase: "Buổi sáng", title: "Lặn & hái", location: "Sông Chín Khúc", action: "Hái / cập bến",
    description: "Hái rau trên mặt nước, lặn bắt cá rồi mang giỏ về bến.",
  },
  quan: {
    phase: "Buổi tối", title: "Mở quán", location: "Nhà bè Má Tư", action: "Tương tác bếp / bàn",
    description: "Nấu món khách gọi, bưng đến bàn và phục vụ trước khi khách rời đi.",
  },
};
const ingredient = (kind) => INGREDIENTS[kind] ?? { name: kind, color: "#899387" };
const dishName = (id) => DISH_NAMES[id] ?? id;
const escaped = (value) => String(value).replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
})[c]);
const rendered = new Map();
let activeMode;

function setHtml(id, html) {
  if (rendered.get(id) === html) return;
  el(id).innerHTML = html;
  rendered.set(id, html);
}
function setText(id, text) {
  if (el(id).textContent !== text) el(id).textContent = text;
}
function fmtTime(ticks) {
  const sec = Math.ceil(ticks / 60);
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
}
function stat(label, value, extra = "", className = "") {
  return `<div class="stat"><span>${label}</span><strong class="${className}">${value}</strong>${extra}</div>`;
}
function ingredientList(entries, empty) {
  if (!entries.length) return `<p class="muted">${empty}</p>`;
  return `<ul class="ingredients">${entries.map(([kind, count]) => {
    const item = ingredient(kind);
    return `<li><i class="ingredient-dot" style="--item:${item.color}" aria-hidden="true"></i>${escaped(item.name)}<strong>×${count}</strong></li>`;
  }).join("")}</ul>`;
}

function gatherHud(state) {
  const player = state.player;
  const oxy = Math.ceil(player.oxygen_ticks / 60);
  const meter = `<meter aria-label="Oxy còn lại" max="${player.oxygen_max_ticks}" value="${player.oxygen_ticks}"></meter>`;
  const hearts = "♥".repeat(player.hp) + "♡".repeat(Math.max(0, player.hp_max - player.hp));
  setHtml("stats", stat("Còn lại", fmtTime(state.time_left_ticks)) +
    stat("Oxy", `${oxy} giây`, meter) + stat("Máu", `<span aria-label="${player.hp}/${player.hp_max} máu">${hearts}</span>`, "", "hearts"));

  const items = {};
  for (const kind of state.hold) items[kind] = (items[kind] ?? 0) + 1;
  const slots = Array.from({ length: state.hold_capacity }, (_, index) => {
    const kind = state.hold[index];
    return kind ? `<i class="slot full" style="--item:${ingredient(kind).color}"></i>` : '<i class="slot"></i>';
  }).join("");
  const cooldown = player.catch_cd_ticks > 0 ? ` · Hồi bắt ${(player.catch_cd_ticks / 60).toFixed(1)} giây` : "";
  setHtml("panel", `<div class="panel-title"><h2>Giỏ nguyên liệu</h2><span class="count">${state.hold_count} / ${state.hold_capacity} ô</span></div>
    <div class="slots" aria-hidden="true">${slots}</div>
    ${ingredientList(Object.entries(items), "Giỏ đang trống.")}
    <p class="hint">Độ sâu <strong>${player.pos[1].toFixed(1)} m</strong>${cooldown}</p>`);
}

function quanHud(state) {
  setHtml("stats", stat("Còn lại", fmtTime(state.time_left_ticks)) + stat("Doanh thu", `${state.money}k`) +
    stat("Uy tín", state.reputation.toFixed(1)) + stat("Điểm", state.score));
  const available = { ...state.stock };
  const orders = state.customers.map((customer) => {
    for (const [kind, amount] of Object.entries(customer.reserved ?? {})) {
      available[kind] = (available[kind] ?? 0) - amount;
    }
    const ticks = customer.patience_ticks_left ?? state.meta.patience_s * 60;
    const status = customer.state === "eating" ? "Đang ăn" : `Còn ${fmtTime(ticks)}`;
    return `<div class="order"><small>${escaped(customer.table_id)} · ${status}</small><strong>${escaped(dishName(customer.dish_id))}</strong></div>`;
  }).join("");
  const stoves = state.stoves.map((stove) => {
    const dish = stove.dish ? ` · ${escaped(dishName(stove.dish.dish_id))}` : "";
    const timer = stove.state === "cooking" ? ` · ${fmtTime(stove.cook_ticks_left)}` : "";
    return `<div class="detail"><small>Bếp ${escaped(stove.id)}</small><strong>${STOVE_STATES[stove.state]}${dish}${timer}</strong></div>`;
  }).join("");
  setHtml("panel", `<h2>Phục vụ</h2>${orders || '<div class="order">Chưa có khách gọi món.</div>'}${stoves}
    <div class="detail"><small>Trên tay</small><strong>${state.hand ? escaped(dishName(state.hand.dish_id)) : "Chưa có món"}</strong></div>
    <div class="stock-title">Kho khả dụng</div>
    ${ingredientList(Object.entries(available).filter(([, amount]) => amount > 0), "Kho đang trống.")}`);
}

function eventLabel({name, data}) {
  switch (name) {
    case "gather": return `Đã hái ${ingredient(data.kind).name.toLowerCase()} ×${data.amount}`;
    case "fish_caught": return `Đã bắt ${ingredient(data.kind).name.toLowerCase()} ×${data.yield}`;
    case "node_regrown": return `${data.node_id} đã mọc lại`;
    case "hold_full": return `Giỏ còn ${data.free} ô, cần ${data.required} ô`;
    case "oxygen_empty": return "Hết oxy. Bơi lên mặt nước!";
    case "choke": return "Út Sen đang ngạt!";
    case "no_dish": return "Kho chưa đủ nguyên liệu để lên món.";
    case "dish_ready": return `${dishName(data.dish_id)} đã chín`;
    case "paid": return `Đã thu ${data.amount} nghìn đồng`;
    case "customer_left": return data.reason === "patience" ? "Khách đã rời bàn vì chờ lâu." : "";
    default: return "";
  }
}

function updateHud() {
  const notice = el("notice");
  if (!snap || offline || snap.error) {
    notice.hidden = false;
    setText("notice", snap?.error ? "Có lỗi trong lượt chơi. Nhấn R để chơi lại." :
      offline ? "Mất kết nối với máy chủ." : "Đang kết nối…");
  } else {
    const message = [...snap.events].reverse().find((event) => snap.tick - event.tick <= 220 && eventLabel(event));
    notice.hidden = !message;
    if (message) setText("notice", eventLabel(message));
  }
  if (!snap) return;

  if (activeMode !== snap.mode) {
    activeMode = snap.mode;
    document.body.classList.toggle("quan", activeMode === "quan");
    const mode = MODES[activeMode];
    setText("phase", mode.phase);
    setText("title", mode.title);
    setText("instruction", mode.description);
    setText("location", mode.location);
    setText("action-label", mode.action);
    el("catch-control").hidden = activeMode === "quan";
  }
  el("result").hidden = !snap.finished;
  setText("result-title", END_REASONS[snap.reason] ?? "Ca chơi đã kết thúc");
  if (activeMode === "quan") quanHud(snap);
  else gatherHud(snap);
}

// ---------- Vẽ cảnh ----------
function fitCanvas() {
  const w = cv.clientWidth, h = cv.clientHeight;
  const scale = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(w * scale) || cv.height !== Math.round(h * scale)) {
    cv.width = Math.round(w * scale);
    cv.height = Math.round(h * scale);
  }
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  return [w, h];
}
function rect(x, y, w, h, radius, fill) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.fillStyle = fill;
  ctx.fill();
}
function ellipse(x, y, rx, ry, fill) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = fill;
  ctx.fill();
}
function line(points, color, width = 1) {
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.lineWidth = width;
  ctx.strokeStyle = color;
  ctx.stroke();
}
function polygon(points, fill) {
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}
function verticalGradient(y, end, stops) {
  const grad = ctx.createLinearGradient(0, y, 0, end);
  for (const [offset, color] of stops) grad.addColorStop(offset, color);
  return grad;
}
function marker(text, x, y) {
  ctx.font = "650 11px system-ui";
  const width = ctx.measureText(text).width + 14;
  rect(x - width / 2, y - 15, width, 19, 5, "#153632ed");
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#fff8df";
  ctx.fillText(text, x, y - 2);
}
function range(x, y, rx, ry, color = "#fff8d67d") {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.2;
  ctx.setLineDash([4, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
}
function ripple(x, y, length, color) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + length * .53, y - 3, x + length, y);
  ctx.lineWidth = 1;
  ctx.strokeStyle = color;
  ctx.stroke();
}
function palm(x, y, size, color, lean) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size, size);
  ctx.beginPath();
  ctx.moveTo(-3, 1);
  ctx.quadraticCurveTo(lean * .2, -36, lean, -63);
  ctx.lineTo(lean + 4, -63);
  ctx.quadraticCurveTo(lean * .42 + 5, -32, 4, 1);
  ctx.fillStyle = color;
  ctx.fill();
  for (const direction of [-1, 1]) {
    for (let leaf = 0; leaf < 3; leaf++) {
      const end = direction * (30 + leaf * 6);
      ctx.beginPath();
      ctx.moveTo(lean + 1, -62);
      ctx.quadraticCurveTo(lean + end * .7, -89 + leaf * 11, lean + end, -68 + leaf * 12);
      ctx.quadraticCurveTo(lean + end * .62, -76 + leaf * 11, lean + 1, -62);
      ctx.fill();
    }
  }
  ctx.restore();
}

function riverBackground(w, h, surface) {
  const sky = verticalGradient(0, surface, [[0, "#d4e1c2"], [.59, "#f4dfa1"], [1, "#f4c187"]]);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, surface);
  const sun = Math.min(w * .061, surface * .39);
  ellipse(w * .75, surface * .46, sun * 1.38, sun * 1.38, "#ffedac52");
  ellipse(w * .75, surface * .46, sun, sun, "#fff0bc");

  ctx.fillStyle = "#6b8b72";
  ctx.beginPath();
  ctx.moveTo(0, surface * .88);
  ctx.quadraticCurveTo(w * .12, surface * .58, w * .31, surface * .81);
  ctx.quadraticCurveTo(w * .49, surface * 1.01, w * .68, surface * .88);
  ctx.quadraticCurveTo(w * .88, surface * .68, w, surface * .77);
  ctx.lineTo(w, surface);
  ctx.lineTo(0, surface);
  ctx.fill();
  ctx.fillStyle = "#486d5d";
  ctx.beginPath();
  ctx.moveTo(0, surface * .86);
  ctx.quadraticCurveTo(w * .16, surface * .72, w * .39, surface);
  ctx.lineTo(0, surface);
  ctx.fill();
  for (const [x, size, lean] of [[.10, .56, -11], [.16, .46, 17], [.23, .35, -14], [.9, .49, -15], [.96, .33, 12]]) {
    palm(x * w, surface * .99, size * Math.min(w / 650 + .35, 1.4), "#395b4c", lean);
  }

  ctx.fillStyle = verticalGradient(surface, h, [[0, "#5c9b83"], [.20, "#3a7b70"], [.58, "#235858"], [1, "#13343b"]]);
  ctx.fillRect(0, surface, w, h - surface);
  for (let i = 0; i < 22; i++) {
    const x = w * ((i * 37 % 101) / 101);
    const y = surface + 5 + (i * 17 % 49);
    ripple(x, y, 11 + (i * 9 % 36), i % 3 === 0 ? "#ffefc56a" : "#d0edde37");
  }
  for (let i = 0; i < 60; i++) {
    const x = w * ((i * 43 % 103) / 103);
    const y = surface + 40 + (h - surface - 40) * (i * 67 % 101) / 101;
    ellipse(x, y, i % 7 === 0 ? 1.6 : .8, .8, "#b3e3ce35");
  }
  ctx.fillStyle = "#1a4647";
  ctx.beginPath();
  ctx.moveTo(0, h - 10);
  ctx.quadraticCurveTo(w * .17, h - 43, w * .36, h - 15);
  ctx.quadraticCurveTo(w * .60, h + 1, w * .82, h - 26);
  ctx.quadraticCurveTo(w * .94, h - 35, w, h - 20);
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.fill();
  for (let i = 0; i < 13; i++) {
    const x = w * (i * 31 % 101) / 101;
    const root = h - 7;
    const height = 12 + i * 11 % 30;
    line([[x, root], [x - 5, root - height * .7], [x - 10, root - height]], "#367166", 2);
    line([[x, root], [x + 5, root - height]], "#2d6057", 2);
  }
}

function dock(x, y) {
  line([[x - 14, y + 12], [x - 14, y - 21]], "#5b392b", 3);
  line([[x + 17, y + 14], [x + 17, y - 20]], "#5b392b", 3);
  rect(x - 16, y - 17, 35, 14, 1, "#ddab71");
  polygon([[x - 23, y - 16], [x - 3, y - 33], [x + 23, y - 16]], "#975643");
  line([[x - 20, y - 17], [x - 3, y - 32], [x + 20, y - 17]], "#d18760", 2);
  rect(x - 21, y - 4, 47, 6, 2, "#a66746");
  rect(x - 7, y - 13, 10, 9, 1, "#6a4836");
}

function bloom(node, x, y) {
  const kind = ingredient(node.kind);
  ctx.save();
  ctx.globalAlpha = node.ready ? 1 : .45;
  ellipse(x - 5, y, 10, 2.5, "#40694d");
  ellipse(x + 7, y + 1, 9, 2.5, "#6c8a53");
  line([[x, y], [x + 1, y - 10]], "#48693d", 1.7);
  ellipse(x - 3, y - 8, 4, 3, kind.color);
  ellipse(x + 4, y - 8, 4, 3, kind.color);
  ellipse(x + 1, y - 10, 3, 4, kind.color);
  ellipse(x + 1, y - 8, 2, 2, "#ffdda0");
  ctx.restore();
}

function fishShape(x, y, size, color) {
  polygon([[x - size * .45, y], [x - size, y - size * .33], [x - size, y + size * .33]], color);
  ellipse(x, y, size * .64, size * .32, color);
  ellipse(x + size * .37, y - size * .06, size * .095, size * .095, "#223334");
}
function swimmer(x, y, player) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(player.heading_deg * Math.PI / 180);
  line([[-12, 0], [-16, -3], [-19, -2]], "#253938", 3.5);
  ellipse(-6, 0, 10, 5.5, "#e38851");
  ellipse(-9, -3, 4.5, 3, "#a16445");
  ellipse(3, 0, 5.7, 5.4, "#f0c08a");
  ellipse(5, -1, 4.4, 3.2, "#2c665f");
  ellipse(7, -1.5, 1.4, 1.1, "#b8e0cb");
  ctx.restore();
}

function drawGather(w, h) {
  const meta = snap.meta;
  const surface = h * .23;
  const xPad = Math.min(34, w * .09), depth = h - surface - 25;
  const sx = (x) => xPad + x * (w - 2 * xPad) / meta.bounds.x[1];
  const sy = (d) => surface + d * depth / meta.bounds.d[1];
  riverBackground(w, h, surface);
  const dp = meta.dock_pos;
  dock(sx(dp[0]), sy(dp[1]));
  range(sx(dp[0]), sy(dp[1]), sx(meta.dock_radius) - sx(0), sy(meta.dock_radius) - sy(0), "#fbe5a691");
  marker("Bến", Math.max(31, sx(dp[0])), sy(dp[1]) + 35);

  for (const node of snap.nodes) {
    const x = sx(node.pos[0]), y = sy(node.pos[1]);
    bloom(node, x, y);
    if (!node.ready) marker(fmtTime(node.regrow_ticks), x, y + 24);
  }
  for (const fish of snap.fish) {
    ctx.save();
    ctx.translate(sx(fish.pos[0]), sy(fish.pos[1]));
    ctx.rotate(fish.heading_deg * Math.PI / 180);
    const size = w < 500 ? 8 : 11;
    const color = ingredient(fish.kind).color;
    fishShape(0, 0, size, color);
    fishShape(-size * 1.37, size * .5, size * .64, color);
    fishShape(size * .28, -size * .7, size * .6, color);
    ctx.restore();
  }

  const player = snap.player;
  const x = sx(player.pos[0]), y = sy(player.pos[1]);
  const radius = player.at_surface ? meta.interact_radius : meta.catch_radius;
  range(x, y, sx(radius) - sx(0), sy(radius) - sy(0));
  swimmer(x, y, player);
  marker("Út Sen", Math.min(w - 24, Math.max(24, x)), Math.max(23, y - 17));
}

function lantern(x, y, size) {
  const glow = ctx.createRadialGradient(x, y, 0, x, y, size * 3.5);
  glow.addColorStop(0, "#ffd28886");
  glow.addColorStop(1, "#ffd28800");
  ellipse(x, y, size * 3.5, size * 3.5, glow);
  ellipse(x, y, size * .8, size, "#edaa5d");
  ellipse(x, y, size * .48, size * .72, "#ffdf8f");
  line([[x - size * .48, y - size], [x + size * .48, y - size]], "#7f4b34", 2);
}
function nightWater(w, h) {
  ctx.fillStyle = verticalGradient(0, h, [[0, "#15343b"], [.55, "#204c50"], [1, "#102d3d"]]);
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 96; i++) {
    const x = w * (i * 37 % 101) / 101;
    const y = h * (i * 29 % 89) / 89;
    ripple(x, y, 12 + (i * 11 % 31), i % 11 === 0 ? "#d6b47c4d" : "#a7dad124");
  }
}
function raft(x, y, w, h) {
  rect(x - 10, y + 6, w + 20, h + 13, 14, "#112c31");
  for (const end of [x + w * .11, x + w * .87]) {
    rect(end - 9, y - 7, 18, h + 24, 6, "#654b38");
    rect(end - 4, y - 5, 5, h + 20, 2, "#a77e56");
  }
  rect(x - 3, y - 3, w + 6, h + 6, 10, "#795237");
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 8);
  ctx.clip();
  ctx.fillStyle = verticalGradient(y, y + h, [[0, "#c69966"], [.46, "#ba8759"], [1, "#a67853"]]);
  ctx.fillRect(x, y, w, h);
  for (let i = 0; i <= 18; i++) {
    const py = y + h * i / 18;
    line([[x, py], [x + w, py]], "#60402965");
    const seam = x + w * (.25 + (i * 13 % 54) / 100);
    line([[seam, py], [seam, py + h / 18]], "#74503365");
    ripple(x + w * (i * 19 % 78) / 100, py + h / 21, Math.min(30, w * .09), "#ffdda83a");
  }
  ctx.restore();
  ctx.beginPath();
  ctx.moveTo(x + 7, y - 3);
  ctx.bezierCurveTo(x + w * .25, y + 29, x + w * .75, y + 29, x + w - 7, y - 3);
  ctx.strokeStyle = "#573d32";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  for (let i = 1; i < 10; i++) {
    const t = i / 10;
    lantern(x + w * t, y + 2 + 19 * Math.sin(t * Math.PI), Math.min(6, w / 65));
  }
}

function avatar(x, y, u, shirt, guest = false) {
  ellipse(x + u * .10, y + u * .21, u * .56, u * .34, "#4b342951");
  rect(x - u * .34, y - u * .03, u * .68, u * .6, u * .18, shirt);
  ellipse(x, y - u * .13, u * .27, u * .29, "#f0be85");
  if (guest) {
    ellipse(x, y - u * .27, u * .49, u * .28, "#e8cf98");
    ellipse(x - u * .05, y - u * .3, u * .25, u * .14, "#f6dfaa");
  } else {
    ellipse(x, y - u * .24, u * .33, u * .18, "#263735");
    line([[x - u * .29, y + u * .08], [x + u * .25, y + u * .19]], "#fff0d0", 2);
  }
}
function drawQuan(w, h) {
  const { bounds, interact_radius: radius, patience_s: patience } = snap.meta;
  const pad = Math.min(33, w * .08), top = 45;
  const u = Math.min((w - pad * 2) / bounds.x[1], (h - top - 29) / bounds.z[1]);
  const width = bounds.x[1] * u, height = bounds.z[1] * u;
  const left = (w - width) / 2, y = top + (h - top - 29 - height) / 2;
  const sx = (x) => left + x * u, sy = (z) => y + height - z * u;
  nightWater(w, h);
  raft(left, y, width, height);

  for (const stove of snap.stoves) {
    const x = sx(stove.pos[0]), py = sy(stove.pos[1]);
    rect(x - u * .78, py - u * .48, u * 1.56, u * 1.06, u * .15, "#694a36");
    rect(x - u * .71, py - u * .62, u * 1.42, u * .91, u * .12, "#dfc09a");
    ellipse(x, py - u * .16, u * .52, u * .3, "#453d37");
    ellipse(x, py - u * .2, u * .39, u * .22, stove.state === "idle" ? "#61584b" : "#cd7343");
    if (stove.state === "ready") ellipse(x, py - u * .2, u * .27, u * .14, "#d7bc5f");
    if (stove.state === "cooking") {
      ripple(x - u * .28, py - u * .63, u * .42, "#fff2c8");
      ripple(x - u * .18, py - u * .82, u * .32, "#fff2c89e");
    }
    marker(`Bếp ${stove.id}`, x, py + u * .95 + 10);
  }
  const guests = new Map(snap.customers.map((customer) => [customer.table_id, customer]));
  for (const table of snap.tables) {
    const x = sx(table.pos[0]), py = sy(table.pos[1]);
    for (const offset of [-1, 1]) {
      rect(x + offset * u * .83 - u * .19, py - u * .24, u * .38, u * .5, u * .09, "#80573b");
    }
    ellipse(x, py + u * .13, u * .76, u * .53, "#6c4931");
    ellipse(x, py, u * .76, u * .52, "#a8443d");
    ellipse(x, py, u * .51, u * .34, "#d27959");
    ellipse(x - u * .22, py - u * .04, u * .13, u * .09, "#faf0cd");
    ellipse(x + u * .2, py - u * .04, u * .13, u * .09, "#faf0cd");
    marker(`Bàn ${table.id}`, x, py + u * 1.02 + 10);
    const guest = guests.get(table.id);
    if (guest) {
      avatar(x, py - u * 1.05, u * .78, "#6b8275", true);
      if (guest.state === "waiting") {
        const total = patience * 60;
        const ratio = Math.max(0, Math.min(1, (guest.patience_ticks_left ?? total) / total));
        rect(x - u * .45, py - u * 1.52, u * .9, 4, 2, "#79533e");
        if (ratio > 0) rect(x - u * .45, py - u * 1.52, u * .9 * ratio, 4, 2, "#ffdfa0");
      }
    }
  }
  const [px, pz] = snap.player.pos;
  const playerX = sx(px), playerY = sy(pz);
  range(playerX, playerY, radius * u, radius * u);
  avatar(playerX, playerY, u, "#e68d53");
  if (snap.hand) {
    ellipse(playerX + u * .35, playerY + u * .26, u * .23, u * .13, "#fff0d0");
    ellipse(playerX + u * .35, playerY + u * .25, u * .14, u * .07, "#874b3e");
  }
  marker("Út Sen", Math.min(w - 24, Math.max(24, playerX)), Math.max(24, playerY - u * .52));
}

function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fitCanvas();
  updateHud();
  if (!snap) return;
  if (snap.mode === "quan") drawQuan(w, h);
  else drawGather(w, h);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
