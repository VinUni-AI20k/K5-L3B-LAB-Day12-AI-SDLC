<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c" aria-label="Quán Ăn Chợ Nổi"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
const demo = new URLSearchParams(location.search).get("demo");
const demoStates = {
  pickup: { stove: "ready", seconds: 8, hand: null, target: { id: "B1", action: "dish_picked" } },
  serve: { stove: "idle", seconds: 6, hand: "lau_ca_linh_dien_dien", target: { id: "T1", action: "served" } },
  missing: { stove: "idle", seconds: 30, hand: null, target: null, missing: { bong_dien_dien: 1 } },
};

function previewState(state) {
  if (state.mode === "gather" && (demo === "fish" || demo === "plants")) {
    const fish = demo === "fish";
    const target = fish ? state.fish[0] : state.nodes[1];
    const harvested = state.nodes[0];
    if (!target || !harvested) return state;
    return {
      ...state,
      preview: true,
      finished: false,
      time_left_ticks: 25 * 60,
      player: { ...state.player, pos: [target.pos[0] - 1, target.pos[1]], at_surface: !fish },
      catch_target_id: fish ? target.id : null,
      harvest_target_id: fish ? null : target.id,
      nodes: state.nodes.map((node) => node.id === harvested.id
        ? { ...node, ready: false, regrow_ticks: 12 * 60 } : node),
      events: [{ name: "gather", tick: state.tick, data: { kind: harvested.kind, quantity: 1, pos: harvested.pos } }],
    };
  }
  if (state.mode !== "quan" || !Object.hasOwn(demoStates, demo)) return state;
  const example = demoStates[demo];
  const dish = "lau_ca_linh_dien_dien";
  return {
    ...state,
    preview: true,
    finished: false,
    time_left_ticks: 90 * 60,
    hand: example.hand,
    interact_target: example.target,
    stoves: state.stoves.map((stove) => stove.id === "B1"
      ? { ...stove, state: example.stove, dish: example.stove === "ready" ? dish : null } : stove),
    customers: [{ table_id: "T1", dish_id: dish, state: "waiting", patience_ticks_left: example.seconds * 60 }],
    stock: { ca_linh: 3, bong_sung: 2 },
    events: example.missing
      ? [{ name: "cook_blocked", tick: state.tick, data: { stove_id: "B1", missing: example.missing } }] : [],
  };
}

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  if (snap?.preview) return;
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e" && snap?.can_open_quan) {
    down.clear();
    lastSent = "";
    fetch("/continue", { method: "POST" });
    return;
  }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  if (snap?.preview) return;
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); if (!snap?.preview) pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = previewState(await r.json());
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.weight || 400) + " " + (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.maxWidth) ctx.fillText(s, x, y, o.maxWidth);
  else ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
const HUD_TOP = 86, HUD_BOTTOM = 72;
const footerHeight = (w) => HUD_BOTTOM + (w < 540 ? 18 : 0);
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
};
const dishName = (id) => DISH_NAME[id] || id;
function hud(w, h, title, accent, summary, controls) {
  const footer = h - footerHeight(w);
  ctx.fillStyle = "#241b16";
  ctx.fillRect(0, 0, w, HUD_TOP);
  ctx.fillRect(0, footer, w, footerHeight(w));
  ctx.fillStyle = accent;
  ctx.fillRect(0, HUD_TOP - 2, w, 2);
  ctx.fillRect(0, footer, w, 2);
  text(title, 16, 30, { size: 20, weight: 700, maxWidth: w - 120 });
  text("Còn " + fmtTime(snap.time_left_ticks), w - 16, 30, { align: "right", color: accent, weight: 700 });
  text(summary, 16, footer + 26, { color: "#fff3d9", weight: 600, maxWidth: w - 32 });
  const rows = w < 540 ? controls : [controls.join("   ·   ")];
  rows.forEach((row, index) => {
    text(row, 16, footer + 54 + index * 18, { size: 12, color: "#dccbb7", maxWidth: w - 32 });
  });
}
function itemSummary(counts) {
  return Object.entries(counts).filter(([, count]) => count > 0)
    .map(([kind, count]) => `${KIND_NAME[kind] || kind} ×${count}`).join(" · ");
}
function marker(label, x, y, w, color = "#fff3d9") {
  ctx.font = "600 12px system-ui, sans-serif";
  const width = Math.min(ctx.measureText(label).width + 16, w - 16);
  const left = Math.max(8, Math.min(x - width / 2, w - width - 8));
  const top = Math.max(HUD_TOP + 4, y - 19);
  ctx.fillStyle = "#342219";
  ctx.fillRect(left, top, width, 22);
  text(label, left + width / 2, top + 15, { size: 12, weight: 600, align: "center", color, maxWidth: width - 12 });
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished) {
    const gather = snap.mode === "gather";
    const width = Math.min(420, w - 32);
    const reason = { time: "Hết giờ", docked: "Đã cập bến", fainted: "Út Sen bị ngất" };
    const end = (snap.events || []).findLast((event) => event.name === (gather ? "gather_end" : "quan_end"));
    const items = end?.data?.inventory?.items;
    const summary = gather
      ? (items && itemSummary(items)) || "Giỏ trống"
      : `Tiền ${snap.money ?? 0}k · Điểm ${snap.score ?? 0}`;
    ctx.fillStyle = "rgba(15,12,10,.64)";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#342219";
    ctx.fillRect((w - width) / 2, h / 2 - 75, width, 150);
    text(gather ? "Kết thúc buổi sáng" : "Kết thúc buổi tối", w / 2, h / 2 - 40, { align: "center", weight: 700, size: 20 });
    text(reason[snap.reason] || "", w / 2, h / 2 - 12, { align: "center", color: "#ffd68b" });
    text(summary, w / 2, h / 2 + 16, { align: "center", maxWidth: width - 24 });
    text(snap.can_open_quan ? "[E] Mở quán với kho vừa thu thập" : "Nhấn R để chơi lại",
      w / 2, h / 2 + 45, { align: "center", color: "#dccbb7", maxWidth: width - 24 });
    return;
  }
  const messages = { gather: "Đã hái nguyên liệu", fish_caught: "Đã bắt được cá", hold_full: "Giỏ đầy" };
  const recent = (snap.events || []).findLast((event) => Object.hasOwn(messages, event.name));
  if (recent && snap.tick - recent.tick < 120) {
    if (snap.mode === "gather" && gatherReward(recent)) return;
    marker(messages[recent.name], w / 2, h - footerHeight(w) - 14, w);
  }
}

function gatherReward(event) {
  const { pos, kind, count, quantity = count } = event.data || {};
  if ((event.name === "gather" || event.name === "fish_caught")
      && Array.isArray(pos) && pos.length === 2 && pos.every(Number.isFinite)
      && typeof kind === "string" && Number.isFinite(quantity) && quantity > 0) {
    return { pos, label: `+${quantity} ${KIND_NAME[kind] || kind}` };
  }
  return null;
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h, frameTime) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = HUD_TOP, bottom = footerHeight(w);
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  const sky = ctx.createLinearGradient(0, top, 0, oy);
  sky.addColorStop(0, "#eacb87");
  sky.addColorStop(1, "#f8e8b7");
  ctx.fillStyle = sky;
  ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#408d89"); g.addColorStop(1, "#122d31");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  text("Mặt nước", sx(X) - 5, oy - 5, { size: 11, align: "right", color: "#3b3b29" });
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  const dockX = sx(dp[0]), dockY = sy(dp[1]);
  const p = snap.player;
  const canDock = !snap.finished && p && Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= dr;
  ctx.fillStyle = "#694631";
  ctx.fillRect(dockX - 1.5 * s, dockY - 0.45 * s, 3 * s, 0.45 * s);
  ctx.fillRect(dockX - 1.2 * s, dockY, 0.32 * s, 0.8 * s);
  ctx.fillRect(dockX + 0.88 * s, dockY, 0.32 * s, 0.8 * s);
  ctx.fillStyle = "#ad5236";
  ctx.beginPath();
  ctx.moveTo(dockX - 1.8 * s, dockY - 0.55 * s);
  ctx.lineTo(dockX, dockY - 2.4 * s);
  ctx.lineTo(dockX + 1.8 * s, dockY - 0.55 * s);
  ctx.closePath();
  ctx.fill();
  if (canDock) {
    ctx.strokeStyle = "#fff0a3";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.strokeRect(dockX - 1.5 * s, dockY - 0.45 * s, 3 * s, 0.45 * s);
  }
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    text(KIND_NAME[n.kind] || n.kind, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 11, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks > 0) {
      const x = sx(n.pos[0]), y = sy(n.pos[1]) + 15;
      const total = meta.regrow_s * 60;
      const progress = total > 0 ? Math.max(0, Math.min(1, 1 - n.regrow_ticks / total)) : 0;
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#b2c7c4";
      ctx.beginPath(); ctx.arc(x, y, 11, 0, 2 * Math.PI); ctx.stroke();
      ctx.strokeStyle = "#f9de82";
      ctx.beginPath(); ctx.arc(x, y, 11, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * progress); ctx.stroke();
      text(Math.ceil(n.regrow_ticks / 60) + "s", x, y + 3, { size: 10, align: "center" });
    }
    if (!canDock && !snap.finished && ready && snap.harvest_target_id === n.id) {
      marker("[E] Hái", sx(n.pos[0]), sy(n.pos[1]) - 12, w, "#fff0a3");
    }
  });
  // đàn cá
  (snap.fish || []).forEach((f, index) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    const canCatch = !snap.finished && snap.catch_target_id === f.id;
    if (canCatch) {
      ctx.strokeStyle = "#fff0a3";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    const tailSwing = reducedMotion.matches || snap.finished
      ? 0 : Math.sin(frameTime / 130 + index * 1.7) * 0.26 * s;
    ctx.beginPath();
    ctx.moveTo(-0.78 * s, 0);
    ctx.lineTo(-1.45 * s, -0.38 * s + tailSwing);
    ctx.lineTo(-1.45 * s, 0.38 * s + tailSwing);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#143334";
    ctx.beginPath(); ctx.arc(0.45 * s, -0.08 * s, 0.11 * s, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if (canCatch) marker("[Space] Bắt cá", sx(f.pos[0]), sy(f.pos[1]) - 10, w, "#fff0a3");
  });
  // người chơi
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
      if (underwater) {
        text("Út Sen", px, py + 0.6 * s + 13, { size: 11, weight: 700, align: "center", color: "#fff3d9" });
      }
    }
  }
  const hold = snap.hold || [];
  const counts = Object.create(null);
  for (const kind of hold) counts[kind] = (counts[kind] || 0) + 1;
  const capacity = snap.hold_capacity;
  const basket = capacity ? `${hold.length}/${capacity}${hold.length >= capacity ? " (đầy)" : ""}` : "";
  hud(w, h, snap.preview ? "Thu thập · Dữ liệu mẫu" : "Sáng · Thu thập", "#a5ded0",
    `Giỏ ${basket} · ${itemSummary(counts) || "Trống"}`,
    snap.preview ? ["Xem trạng thái HUD", "Mở trang màn sáng để chơi"]
      : ["WASD / ↑↓←→ Bơi · E Hái hoặc cập bến", "Space Bắt cá · R Chơi lại"]);
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const fraction = p.oxygen_ticks / p.oxygen_max_ticks;
    const low = fraction < 0.25;
    const color = low ? "#ffab92" : "#a5ded0";
    text(`Oxy ${Math.ceil(p.oxygen_ticks / 60)}s${low ? " · Nổi lên" : ""}`, 16, 54, { color, weight: 700 });
    bar(16, 62, Math.min(250, w - 125), 10, fraction, color);
  }
  if (p?.hp !== undefined && p.hp_max) {
    text(`Máu ${p.hp}/${p.hp_max}`, w - 16, 60, { align: "right", color: "#ffc5b0" });
  }
  if (canDock) {
    marker("[E] Cập bến · Kết thúc buổi sáng", sx(dp[0]), sy(-2.8), w);
  } else if (p && !snap.finished && ((capacity && hold.length >= capacity) || snap.time_left_ticks <= 30 * 60)) {
    const dx = dp[0] - p.pos[0], dy = dp[1] - p.pos[1];
    const directions = ["→", "↘", "↓", "↙", "←", "↖", "↑", "↗"];
    const direction = directions[(Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8];
    marker(direction + " Về bến", sx(p.pos[0]), sy(p.pos[1]) + 43, w, "#fff0a3");
  }
  if (!snap.finished) {
    for (const event of snap.events || []) {
      const reward = gatherReward(event);
      if (!reward) continue;
      // Cảnh mẫu phát lại hiệu ứng để dễ quan sát.
      const age = snap.preview ? (frameTime % 2500) * 60 / 1000 : snap.tick - event.tick;
      if (age < 0 || age >= 72) continue;
      const rise = reducedMotion.matches ? 0 : 24 * age / 72;
      ctx.save();
      ctx.globalAlpha = Math.min(1, (72 - age) / 48);
      marker(reward.label, sx(reward.pos[0]), sy(reward.pos[1]) + 52 - rise, w, "#a5ded0");
      ctx.restore();
    }
  }
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = HUD_TOP, bottom = footerHeight(w);
  const action = snap.finished ? null : snap.interact_target;
  const pickupId = action?.action === "dish_picked" ? action.id : null;
  const serveId = action?.action === "served" ? action.id : null;
  const failure = (snap.events || []).findLast((event) => event.name === "cook_blocked" && snap.tick - event.tick < 120);
  const missing = Object.entries(failure?.data?.missing || snap.missing_ingredients || {})
    .filter(([, count]) => count > 0)
    .map(([kind, count]) => `${count} ${KIND_NAME[kind] || kind}`).join(" · ");
  const shortageStove = failure?.data?.stove_id || (snap.stoves || []).find((stove) => stove.state === "idle")?.id;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  const floor = ctx.createLinearGradient(sx(0), sy(Z), sx(X), sy(0));
  floor.addColorStop(0, "#805432");
  floor.addColorStop(1, "#523520");
  ctx.fillStyle = floor;
  ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "rgba(42,24,15,.35)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let row = 1; row < Z; row++) {
    ctx.moveTo(sx(0), sy(row));
    ctx.lineTo(sx(X), sy(row));
  }
  ctx.stroke();
  ctx.strokeStyle = "#bc905b";
  ctx.lineWidth = 3;
  ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp
  (snap.stoves || []).forEach((st) => {
    const x = sx(st.pos[0]), y = sy(st.pos[1]);
    const col = st.state === "cooking" ? "#ffc171" : st.state === "ready" ? "#b3db92" : "#dbcec1";
    ctx.fillStyle = "#332820";
    ctx.fillRect(x - 0.8 * s, y - 0.65 * s, 1.6 * s, 1.3 * s);
    ctx.fillStyle = col;
    ctx.fillRect(x - 0.8 * s, y - 0.65 * s, 1.6 * s, Math.max(2, 0.12 * s));
    text("Bếp " + st.id, x, y + 4, { size: 12, weight: 600, align: "center", color: col, maxWidth: 1.5 * s });
    let status = "Bếp trống";
    if (st.state === "cooking") status = st.cook_ticks_left === undefined ? "Đang nấu" : `Đang nấu · ${Math.ceil(st.cook_ticks_left / 60)}s`;
    if (st.state === "ready") status = "Món đã chín";
    const canPick = pickupId === st.id && st.state === "ready";
    if (canPick) {
      ctx.strokeStyle = "#fff0a3";
      ctx.lineWidth = 3;
      ctx.strokeRect(x - 0.8 * s, y - 0.65 * s, 1.6 * s, 1.3 * s);
    }
    const dish = typeof st.dish === "string" ? st.dish : st.dish?.dish_id;
    const label = canPick ? "[E] Lấy món"
      : missing && shortageStove === st.id ? "Thiếu " + missing
      : dish ? `${dishName(dish)} · ${status}` : status;
    marker(label, x, y - 0.9 * s, w, canPick ? "#fff0a3" : "#fff3d9");
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const x = sx(tb.pos[0]), y = sy(tb.pos[1]);
    ctx.fillStyle = "#e0ac6d";
    ctx.beginPath(); ctx.arc(x, y, 0.9 * s, 0, Math.PI * 2); ctx.fill();
    const canServe = serveId === tb.id;
    if (canServe) {
      ctx.strokeStyle = "#fff0a3";
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    text("Bàn " + tb.id, x, y + 4, { size: 12, weight: 600, align: "center", color: "#302117", maxWidth: 1.5 * s });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      const eating = c.state === "eating";
      const name = c.dish_id ? dishName(c.dish_id) : "Món gọi";
      const remaining = c.patience_ticks_left;
      const urgent = !eating && remaining !== undefined && remaining <= patMax * 0.2;
      const wait = remaining === undefined ? "" : ` · ${Math.ceil(remaining / 60)}s`;
      const status = urgent ? (w < 540 ? "Sắp rời bàn" : name + " · Sắp rời bàn") : "Chờ " + name;
      marker(eating ? "Đang ăn" : status + wait, cx, cy - 0.65 * s, w, urgent ? "#ffab92" : "#fff3d9");
      if (!eating && remaining !== undefined) {
        bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 5, remaining / patMax, urgent ? "#ff8a72" : "#ffc171");
      }
      if (canServe) marker("[E] Phục vụ", x, y + Math.min(s, 20), w, "#fff0a3");
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#a5ded0"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    text("Út Sen", px, py + 0.5 * s + 15, { size: 12, weight: 700, align: "center", color: "#e2fff5" });
  }
  // HUD
  hud(w, h, snap.preview ? "Mở quán · Dữ liệu mẫu" : "Tối · Mở quán", "#ffd68b",
    "Kho · " + (itemSummary(snap.stock || {}) || "Trống"),
    snap.preview ? ["Xem trạng thái HUD", "Mở trang quán để chơi"] : ["WASD / ↑↓←→ Đi · E Tương tác", "R Chơi lại"]);
  text(`Tiền ${snap.money ?? 0}k · Uy tín ${(snap.reputation ?? 0).toFixed(1)} · Điểm ${snap.score ?? 0}`,
    16, 51, { color: "#ffd68b", weight: 600, maxWidth: w - 32 });
  const hand = typeof snap.hand === "string" ? snap.hand : snap.hand?.dish_id;
  const handLabel = snap.hand ? "Đang bưng · " + (hand ? dishName(hand) : "Món ăn") : "Tay trống";
  text(handLabel, 16, 73, { color: snap.hand ? "#a5ded0" : "#dccbb7", weight: 600, maxWidth: w - 32 });
}

function frame(frameTime) {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h, frameTime);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
