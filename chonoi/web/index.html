  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0c141c;
      color: #e8eef2;

      user-select: none;

    canvas {

      cursor: default;

      left: 0;
      top: 0;
    }
  </style>

<body>
  <canvas id="c"></canvas>
  <script>
    "use strict";
    /*
     * Quán Ăn Chợ Nổi — WebGL / High-Performance Client v2.0
     * Tích hợp PixiJS WebGL + Client-side LERP + Particle System (bọt khí, khói bếp, sao sáng)
     * Procedural Animated Sprites: Cá quẫy đuôi, Cá sấu vẫy sống lưng, Út Sen đập chân vịt, Bếp lửa bốc khói
     * Full UI: Menu / DayIntro / EveningIntro / DayResult / Shop / Summary / Pause (Esc|P)
     * Ghép: Pixi render/FX (user) + day/shop/fresh UI logic (Cursor) — canvas 2D overlay trên pixi.min.js local
     * Phím: WASD · E · Space · R · Esc/P · Enter · C (Tương phản cao)
     * Mọi chữ hiển thị ≥ 18px theo quy định chuẩn của Lab.
     */

    const cv = document.getElementById("c");
    const ctx = cv.getContext("2d");
    const FONT = '"Segoe UI","Helvetica Neue",Arial,sans-serif';
    const HUD_MIN = 18;

    const params = new URLSearchParams(location.search);
    const DEMO = params.get("demo");

    let snap = null, offline = false;
    let uiScreen = DEMO || "menu"; // menu|dayIntro|eveningIntro|dayResult|shop|summary|play
    let paused = DEMO === "pause";
    let highContrast = params.get("contrast") === "1";
    let introSince = performance.now();
    let pauseSupported = null;
    let buttons = []; // {x, y, w, h, id, label}
    let lastFrame = performance.now(), fpsEMA = 60;
    let gameTime = 0; // thời gian chạy cho hiệu ứng động

    // --- Cấu hình màu & tên ---

      ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066",

    const KIND_NAME = {

      ca_keo_nuong: "cá kèo nướng", lau_mam: "lẩu mắm"
    };
    const dn = (d) => DISH_NAME[d] || d;
    const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

    // --- Demo Data ---
    const DEMO_DATA = {

      },

      cookable: ["ca_loc_nuong_trui", "goi_bong_sung"],

          { id: "hp", name: "Áo phao", levels: [{ level: 1, price: 250, desc: "4 Máu" }, { level: 2, price: 500, desc: "5 Máu" }] },
        ],
      },

        hold: [

        ],

          { tick: 90, name: "spoiled", data: { item_id: "I3", kind: "bong_sung", location: "hold" } },

      },

        player: { pos: [8, 5] }, hand: "ca_loc_nuong_trui",
        stock: [
          { id: "I10", kind: "ca_loc", fresh: 80 },

        ],

          { id: "B1", pos: [2, 8], state: "cooking", dish: "ca_loc_nuong_trui", cook_ticks_left: 180 },

        ],
        tables: [
          { id: "T1", pos: [9, 2] }, { id: "T2", pos: [13, 2] },
          { id: "T3", pos: [9, 6] }, { id: "T4", pos: [13, 6] }
        ],
        customers: [
          { id: "C1", table_id: "T1", state: "waiting", dish: "ca_loc_nuong_trui", patience_ticks_left: 600, patience_max_ticks: 3600 },
          { id: "C2", table_id: "T3", state: "eating", dish: "goi_bong_sung" }
        ],
        events: [
          { tick: 180, name: "spoiled", data: { item_id: "I12", kind: "ca_linh", location: "stock" } },
          {
            tick: 200, name: "cook_started", data: {
              stove_id: "B1", dish: "goi_bong_sung",
              items: [{ id: "I11", kind: "bong_sung", fresh: 45 }, { id: "I14", kind: "bong_sung", fresh: 62.5 }],
              base_price: 28
            }
          },
          { tick: 220, name: "paid", data: { customer_id: "C1", base_price: 34, price: 34, tip: 6 } },
        ],
        meta: { bounds: { x: [0, 16], z: [0, 10] }, patience_s: 60, reputation_min: 0, reputation_max: 5 },
      },
    };

    // --- Hệ thống Interpolation (LERP) và Particle FX ---
    const lerp = (a, b, t) => a + (b - a) * t;
    const lerpAngle = (a, b, t) => {
      let diff = (b - a) % 360;
      if (diff < -180) diff += 360;
      if (diff > 180) diff -= 360;
      return a + diff * t;
    };

    const lerpState = {
      player: { x: 2, y: 0, vx: 0, vy: 0, angle: 0 },
      fish: new Map(), // id -> {x, y, angle, kind}
      monsters: new Map(), // id -> {x, y, angle}
      screenShake: { x: 0, y: 0, intensity: 0 },
    };

    const particles = []; // {x, y, vx, vy, size, color, alpha, life, maxLife, type}
    const floaters = [];  // {text, x, y, vy, color, alpha, life, maxLife}

    function addParticle(x, y, vx, vy, size, color, maxLife, type = "bubble") {
      if (particles.length > 250) return;
      particles.push({ x, y, vx, vy, size, color, alpha: 1, life: maxLife, maxLife, type });
    }

    function addFloater(text, x, y, color = "#ffe082") {
      floaters.push({ text, x, y, vy: -1.2, color, alpha: 1, life: 60, maxLife: 60 });
    }

    function triggerShake(intensity = 6) {
      lerpState.screenShake.intensity = Math.max(lerpState.screenShake.intensity, intensity);
    }

    // Bọt khí nổi lên từ bình oxy của Út Sen khi lặn
    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 60;
        p.alpha = Math.max(0, p.life / p.maxLife);
        if (p.type === "bubble") {
          p.vx += Math.sin(p.y * 0.1) * 0.05; // lượn sóng
          p.vy -= 0.02; // nổi lên
        } else if (p.type === "steam") {
          p.size += 0.08;
          p.vy -= 0.015;
        }
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floaters.length - 1; i >= 0; i--) {
        const f = floaters[i];
        f.y += f.vy;
        f.life -= dt * 60;
        f.alpha = Math.max(0, f.life / f.maxLife);
        if (f.life <= 0) floaters.splice(i, 1);
      }

      if (lerpState.screenShake.intensity > 0.05) {
        const s = lerpState.screenShake.intensity;
        lerpState.screenShake.x = (Math.random() - 0.5) * s * 2;
        lerpState.screenShake.y = (Math.random() - 0.5) * s * 2;
        lerpState.screenShake.intensity *= 0.88;
      } else {
        lerpState.screenShake.x = 0;
        lerpState.screenShake.y = 0;
        lerpState.screenShake.intensity = 0;
      }
    }

    // --- Xử lý sự kiện sim để sinh hiệu ứng FX ---
    let lastProcessedTick = -1;
    function checkEventsForFX(events) {
      if (!events || !events.length) return;
      events.forEach((e) => {
        if (e.tick <= lastProcessedTick) return;
        const d = e.data || {};
        if (e.name === "fish_caught") {
          const name = KIND_NAME[d.kind] || "Cá";
          addFloater("+" + name.toUpperCase() + "!", lerpState.player.x, lerpState.player.y - 1.5, "#80d8ff");
          for (let i = 0; i < 12; i++) {
            const ang = Math.random() * Math.PI * 2, spd = Math.random() * 2 + 1;
            addParticle(lerpState.player.x, lerpState.player.y, Math.cos(ang) * spd, Math.sin(ang) * spd, 4, "#b3e5fc", 35, "sparkle");
          }
        } else if (e.name === "gather") {
          const name = KIND_NAME[d.kind] || "Rau";
          addFloater("+" + name.toUpperCase(), lerpState.player.x, lerpState.player.y - 1.5, "#a7ffeb");
        } else if (e.name === "choke" || (e.name === "faint" && d.cause === "monster")) {
          triggerShake(12);
          addFloater("−1 MÁU!", lerpState.player.x, lerpState.player.y - 2, "#ff5252");
        } else if (e.name === "paid") {
          const p = d.price || d.base_price || 0, tip = d.tip || 0;
          addFloater("+" + (p + tip) + "k 💰", 10, 4, "#ffd700");
        } else if (e.name === "spoiled") {
          addFloater("ƯƠN!", lerpState.player.x, lerpState.player.y - 1.2, "#ff7043");
        }
      });
      lastProcessedTick = events[events.length - 1].tick;
    }

    // ==========================================
    // SFX WebAudio (tổng hợp) + phụ đề T461 / Phase 4
    // ==========================================
    let audioCtx = null;
    let soundOn = true;
    let captionsOn = true;
    let sfxPrimed = false;
    const sfxSeen = new Set();
    const captionLines = []; // {text, until}
    let nearMonsterLatch = false;
    let angryCustLatch = false;

    (function loadSfxPrefs() {
      try {
        const s = localStorage.getItem("chonoi_sfx_sound");
        const c = localStorage.getItem("chonoi_sfx_captions");
        if (s === "0") soundOn = false;
        if (s === "1") soundOn = true;
        if (c === "0") captionsOn = false;
        if (c === "1") captionsOn = true;
      } catch (e) { /* private mode */ }
    })();

    function saveSfxPrefs() {
      try {
        localStorage.setItem("chonoi_sfx_sound", soundOn ? "1" : "0");
        localStorage.setItem("chonoi_sfx_captions", captionsOn ? "1" : "0");
      } catch (e) { /* ignore */ }
    }

    function ensureAudio() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!audioCtx) audioCtx = new AC();
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    function unlockAudio() { ensureAudio(); }

    function beep(freq, durSec, type, vol) {
      if (!soundOn) return;
      try {
        const ctx = ensureAudio();
        if (!ctx) return;
        const t0 = ctx.currentTime;
        const dur = Math.min(0.4, Math.max(0.04, durSec || 0.12));
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, t0);
        const peak = Math.min(0.1, vol == null ? 0.05 : vol);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      } catch (e) { /* thiếu WebAudio → im lặng */ }
    }

    function pushCaption(line) {
      if (!captionsOn || !line) return;
      const now = performance.now();
      captionLines.push({ text: line, until: now + 1800 });
      while (captionLines.length > 3) captionLines.shift();
    }

    function eventSfxKey(e) {
      const d = e.data || {};
      const id = d.item_id || d.fish_id || d.customer_id || d.order_id || d.node_id || d.upgrade || d.action || "";
      return String(e.tick) + "|" + e.name + "|" + id;
    }

    /** Map event name → {caption, play} */
    const SFX_BY_EVENT = {
      fish_caught: {
        caption: "[♪ tõm] bắt cá",
        play: function () { beep(520, 0.1, "sine", 0.05); beep(780, 0.12, "triangle", 0.04); },
      },
      gather: {
        caption: "[♪ xột] hái rau",
        play: function () { beep(640, 0.1, "square", 0.035); },
      },
      monster_hit: {
        caption: "[♪ rầm] Cá Sấu cắn!",
        play: function () { beep(95, 0.32, "sawtooth", 0.08); },
      },
      spoiled: {
        caption: "[♪ ực] hàng ươn",
        play: function () { beep(170, 0.22, "triangle", 0.05); },
      },
      served: {
        caption: "[♪ chát] phục vụ",
        play: function () { beep(700, 0.1, "square", 0.04); },
      },
      paid: {
        caption: "[♪ leng] tiền vào",
        play: function () { beep(880, 0.08, "sine", 0.05); beep(1175, 0.14, "sine", 0.045); },
      },
      bought: {
        caption: "[♪ keng] mua nâng cấp",
        play: function () { beep(988, 0.16, "sine", 0.055); },
      },
      buy_failed: {
        caption: "[♪ bụp] mua lỗi",
        play: function () { beep(140, 0.2, "sawtooth", 0.05); },
      },
      day_start: {
        caption: "[♪ ting] ngày mới",
        play: function () { beep(523, 0.12, "sine", 0.05); beep(659, 0.16, "sine", 0.04); },
      },
      oxygen_empty: {
        caption: "[♪ ục] hết hơi",
        play: function () { beep(210, 0.28, "sine", 0.05); },
      },
      faint: {
        caption: "[♪ ịch] ngất!",
        play: function () { beep(85, 0.35, "sawtooth", 0.07); },
      },
      customer_left: {
        caption: "[♪ hự] khách bỏ đi",
        play: function () { beep(250, 0.18, "triangle", 0.045); },
      },
      monster_warn: {
        caption: "[♪ ù] thủy quái gần!",
        play: function () { beep(310, 0.14, "square", 0.04); },
      },
      angry_warn: {
        caption: "[♪ hứ] khách sắp giận",
        play: function () { beep(360, 0.12, "square", 0.04); },
      },
    };

    function fireSfxNamed(name, captionOverride) {
      const spec = SFX_BY_EVENT[name];
      if (!spec) return;
      pushCaption(captionOverride || spec.caption);
      if (!paused) spec.play();
    }

    function processSfxFromEvents(events, opts) {
      opts = opts || {};
      if (!events || !events.length) return;
      if (!sfxPrimed && !opts.forcePlay) {
        events.forEach(function (e) { sfxSeen.add(eventSfxKey(e)); });
        sfxPrimed = true;
        return;
      }
      sfxPrimed = true;
      events.forEach(function (e) {
        const key = eventSfxKey(e);
        if (sfxSeen.has(key)) return;
        sfxSeen.add(key);
        if (paused && !opts.forcePlay) return;
        let name = e.name;
        if (name === "choke") name = "monster_hit";
        const spec = SFX_BY_EVENT[name];
        if (!spec) return;
        let cap = spec.caption;
        if (name === "paid") {
          const tip = (e.data && e.data.tip) || 0;
          if (tip > 0) cap = "[♪ leng] tiền + boa " + tip + "k";
        }
        pushCaption(cap);
        if (soundOn && !paused) spec.play();
      });
    }

    function sfxEdgeWarn(nearMonster, angry) {
      if (paused) {
        nearMonsterLatch = !!nearMonster;
        angryCustLatch = !!angry;
        return;
      }
      if (nearMonster && !nearMonsterLatch) {
        nearMonsterLatch = true;
        const key = "warn|monster|" + (snap && snap.tick);
        if (!sfxSeen.has(key)) {
          sfxSeen.add(key);
          fireSfxNamed("monster_warn");
        }
      } else if (!nearMonster) nearMonsterLatch = false;
      if (angry && !angryCustLatch) {
        angryCustLatch = true;
        const key = "warn|angry|" + (snap && snap.tick);
        if (!sfxSeen.has(key)) {
          sfxSeen.add(key);
          fireSfxNamed("angry_warn");
        }
      } else if (!angry) angryCustLatch = false;
    }

    function drawSfxCaptions(w, h) {
      const now = performance.now();
      for (let i = captionLines.length - 1; i >= 0; i--) {
        if (captionLines[i].until <= now) captionLines.splice(i, 1);
      }
      if (!captionsOn || !captionLines.length) return;
      const n = captionLines.length;
      const boxH = 28 + n * 26;
      const boxW = Math.min(520, w - 40);
      const bx = (w - boxW) / 2;
      const by = h - 78 - boxH;
      ctx.save();
      ctx.fillStyle = highContrast ? "rgba(0,0,0,0.92)" : "rgba(8,12,18,0.78)";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(bx, by, boxW, boxH, 8) : ctx.rect(bx, by, boxW, boxH);
      ctx.fill();
      if (highContrast) {
        ctx.strokeStyle = "#ffe600";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      captionLines.forEach(function (line, i) {
        text(line.text, w / 2, by + 26 + i * 26, {
          size: 18, align: "center", bold: true,
          color: highContrast ? "#ffe600" : "#ffe082",
        });
      });
      ctx.restore();
    }

    function drawSfxHudToggles(w, h) {
      // Góc trên phải — không đụng gameplay
      const bw = 118, bh = 36, gap = 8;
      const x1 = w - 16 - bw, y0 = 8;
      const x0 = x1 - bw - gap;
      btn("toggleSound", soundOn ? "🔊 Âm: BẬT" : "🔇 Âm: TẮT", x0, y0, bw, bh, {
        size: 18,
        fill: soundOn ? "#1b5e20" : "#37474f",
        stroke: soundOn ? "#69f0ae" : "#90a4ae",
      });
      btn("toggleCaptions", captionsOn ? "CC: BẬT" : "CC: TẮT", x1, y0, bw, bh, {
        size: 18,
        fill: captionsOn ? "#0d47a1" : "#37474f",
        stroke: captionsOn ? "#82b1ff" : "#90a4ae",
      });
    }

    function toggleSound() {
      unlockAudio();
      soundOn = !soundOn;
      saveSfxPrefs();
      if (soundOn) beep(660, 0.08, "sine", 0.04);
    }

    function toggleCaptions() {
      captionsOn = !captionsOn;
      saveSfxPrefs();
      if (captionsOn) pushCaption("[♪] phụ đề bật");
    }

    // Demo SFX: phát lần lượt event mẫu (phụ đề luôn; âm theo soundOn)
    let sfxDemoTimer = null;
    function startSfxDemo() {
      uiScreen = "play";
      paused = false;
      snap = {
        mode: "gather", tick: 1, time_left_ticks: 9000, hold_capacity: 12, hold: [],
        player: { pos: [20, 12], oxygen_ticks: 900, oxygen_max_ticks: 1800, hp: 3, hp_max: 3, at_surface: false },
        nodes: [], fish: [], monsters: [], events: [],
        meta: { bounds: { x: [0, 100], d: [0, 30] }, dock_pos: [2, 0], dock_radius: 3 },
      };
      sfxPrimed = true;
      sfxSeen.clear();
      captionLines.length = 0;
      const seq = [
        { tick: 10, name: "fish_caught", data: { fish_id: "F1", kind: "ca_loc" } },
        { tick: 20, name: "gather", data: { node_id: "N1", kind: "bong_sung" } },
        { tick: 30, name: "monster_hit", data: { hp: 2 } },
        { tick: 40, name: "spoiled", data: { item_id: "I1", kind: "ca_linh", location: "hold" } },
        { tick: 50, name: "oxygen_empty", data: {} },
        { tick: 60, name: "faint", data: { hp: 0 } },
        { tick: 70, name: "served", data: { table_id: "T1" } },
        { tick: 80, name: "paid", data: { tip: 6, price: 34 } },
        { tick: 90, name: "bought", data: { upgrade: "oxygen", level: 1 } },
        { tick: 100, name: "buy_failed", data: { action: "hp", reason: "funds" } },
        { tick: 110, name: "day_start", data: {} },
        { tick: 120, name: "customer_left", data: { order_id: "C1" } },
        { tick: 130, name: "monster_warn", data: {} },
        { tick: 140, name: "angry_warn", data: {} },
      ];
      let i = 0;
      if (sfxDemoTimer) clearInterval(sfxDemoTimer);
      pushCaption("[♪ demo] chuỗi SFX — M tắt âm, N tắt phụ đề");
      sfxDemoTimer = setInterval(function () {
        if (i >= seq.length) { clearInterval(sfxDemoTimer); sfxDemoTimer = null; pushCaption("[♪ demo] xong"); return; }
        const e = seq[i++];
        // named warns are not real snap events — fire directly
        if (e.name === "monster_warn" || e.name === "angry_warn") {
          const key = eventSfxKey(e);
          if (!sfxSeen.has(key)) { sfxSeen.add(key); fireSfxNamed(e.name); }
        } else {
          processSfxFromEvents([e], { forcePlay: true });
          if (snap) {
            snap.events = (snap.events || []).concat([e]);
            snap.tick = e.tick;
          }
        }
      }, 900);
    }

    // --- Điều khiển & Network (day mode + shop_done/buy từ UI Cursor) ---
    const down = new Set();
    const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
    let queue = [], inflight = false, lastSent = "";
    let pendingPauseEdge = false, pendingShopDone = false, pendingBuy = null;
    let lastSimPhase = null, userStarted = false;
    let shopFlash = "";

    function isDayMode() { return snap && snap.mode === "day"; }
    function simPhase() { return (snap && (snap.phase || (snap.meta && snap.meta.phase))) || null; }
    function playingLive() { return !DEMO && userStarted && (uiScreen === "play" || uiScreen === "shop") && !paused; }

    function gameplayPhase() {
      if (!snap) return "gather";
      return snap.mode === "day" ? snap.phase : snap.mode;
    }

    function currentInput() {
      const mode = snap ? snap.mode : "gather";
      const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
      let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
      if (mode === "quan") dy = -dy;
      const body = { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
      if (paused) body.pause = true;
      return body;
    }

    function pushInput() {
      if (DEMO && DEMO !== "pause") return;
      if (!userStarted && !pendingPauseEdge && !pendingShopDone && !pendingBuy) return;
      if (uiScreen === "menu" || uiScreen === "dayIntro" || uiScreen === "eveningIntro" || uiScreen === "dayResult" || uiScreen === "summary") {
        if (!pendingPauseEdge && !pendingShopDone && !pendingBuy) return;
      }
      const s = JSON.stringify(currentInput());
      if (s === lastSent) return;
      lastSent = s;
      queue.push(s);
      flush();
    }

    async function flush() {
      if (inflight) return;
      inflight = true;
      while (queue.length) {
        const body = queue.shift();
        try {
          await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } });
          if (body.indexOf('"pause":true') >= 0) pauseSupported = !!(snap && snap.paused !== undefined);
        } catch (e) { /* poll báo */ }
      }
      inflight = false;
    }

    function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }

    function setScreen(s) {
      uiScreen = s;
      introSince = performance.now();
      buttons = [];
    }

    function pulseThenRelease() {
      lastSent = "";
      pushInput();
      setTimeout(() => { lastSent = ""; pushInput(); }, 40);
    }

    function togglePause() {
      if (DEMO === "pause") { paused = !paused; return; }
      if (!(uiScreen === "play" || uiScreen === "shop")) return;
      pendingPauseEdge = true;
      paused = !paused;
      pulseThenRelease();
    }

    function goPlay() {
      userStarted = true;
      const ph = simPhase();
      if (ph === "shop") setScreen("shop");
      else setScreen("play");
      lastSent = "";
      down.clear();
      pushInput();
    }

    function startFromMenu() {
      userStarted = true;
      if (isDayMode() && dayPlan()) setScreen("dayIntro");
      else goPlay();
    }

    function skipIntroOrAdvance() {
      if (uiScreen === "dayIntro") goPlay();
      else if (uiScreen === "eveningIntro") setScreen("play");
      else if (uiScreen === "dayResult") {
        if (DEMO) setScreen("shop");
        else if (simPhase() === "shop") setScreen("shop");
        else goPlay();
      }
      else if (uiScreen === "summary") setScreen("menu");
    }

    addEventListener("keydown", (e) => {
      const k = keyName(e);
      unlockAudio();
      if (k === "m") { e.preventDefault(); toggleSound(); return; }
      if (k === "n") { e.preventDefault(); toggleCaptions(); return; }
      if (k === "c") { highContrast = !highContrast; e.preventDefault(); return; }
      if (k === "escape" || k === "p") {
        if (uiScreen === "play" || uiScreen === "shop" || DEMO === "pause") { e.preventDefault(); togglePause(); return; }
      }
      if (paused) {
        if (k === "enter" || k === " ") { e.preventDefault(); togglePause(); }
        return;
      }
      if (uiScreen === "dayIntro" || uiScreen === "eveningIntro" || uiScreen === "dayResult") {
        if (k === "enter" || k === " " || k === "e") { e.preventDefault(); skipIntroOrAdvance(); return; }
      }
      if (uiScreen === "shop" && (k === "enter" || k === "e")) {
        e.preventDefault();
        if (DEMO) setScreen("summary");
        else { pendingShopDone = true; pulseThenRelease(); }
        return;
      }
      if (uiScreen !== "play") return;
      if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
      if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
      else if (k === "e") down.add("interact");
      else if (k === " ") { down.add("catch"); e.preventDefault(); }
      else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
      pushInput();
    });

    addEventListener("keyup", (e) => {
      if (uiScreen !== "play" || paused) return;
      const k = keyName(e);
      if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
      else if (k === "e") down.delete("interact");
      else if (k === " ") down.delete("catch");
      pushInput();
    });

    addEventListener("blur", () => { down.clear(); pushInput(); });

    cv.addEventListener("click", (e) => {
      unlockAudio();
      const r = cv.getBoundingClientRect();
      const cx = e.clientX - r.left, cy = e.clientY - r.top;
      for (let i = buttons.length - 1; i >= 0; i--) {
        const b = buttons[i];
        if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h) { onButton(b.id); return; }
      }
    });

    function onButton(id) {
      if (id === "play") startFromMenu();
      else if (id === "quit") { userStarted = false; setScreen("menu"); }
      else if (id === "resume") { if (paused) togglePause(); }
      else if (id === "toMenu") { userStarted = false; paused = false; setScreen("menu"); down.clear(); }
      else if (id === "skipIntro") skipIntroOrAdvance();
      else if (id === "shopDone") {
        if (DEMO) setScreen("summary");
        else { pendingShopDone = true; pulseThenRelease(); }
      }
      else if (id === "summaryOk") setScreen("menu");
      else if (id === "buy_oxygen" || id === "buy_hp") {
        if (DEMO) { shopFlash = "Mua demo · không gửi server"; return; }
        pendingBuy = id === "buy_oxygen" ? "oxygen" : "hp";
        pulseThenRelease();
      }
      else if (id === "demoDay") setScreen("dayIntro");
      else if (id === "demoEve") setScreen("eveningIntro");
      else if (id === "demoRes") setScreen("dayResult");
      else if (id === "demoShop") setScreen("shop");
      else if (id === "demoSum") setScreen("summary");
      else if (id === "demoFresh") { location.search = "?demo=fresh"; }
      else if (id === "demoSfx") { location.search = "?demo=sfx"; }
      else if (id === "contrast") highContrast = !highContrast;
      else if (id === "toggleSound") toggleSound();
      else if (id === "toggleCaptions") toggleCaptions();
    }

    async function poll() {
      if (DEMO === "fresh") { applyFreshDemo(); setTimeout(poll, 200); return; }
      if (DEMO === "sfx") { setTimeout(poll, 200); return; }
      if (DEMO && DEMO !== "pause") { setTimeout(poll, 200); return; }
      try {
        const r = await fetch("/state", { cache: "no-store" });
        snap = await r.json();
        offline = false;
        syncPhaseFromSnap();
        if (snap && snap.events) {
          checkEventsForFX(snap.events);
          processSfxFromEvents(snap.events); // lần đầu prime im; event mới mới SFX/phụ đề
        }
      } catch (e) { offline = true; }
      setTimeout(poll, 24);
    }

    let freshSfxDone = false;
    function applyFreshDemo() {
      const q = params.get("mode") === "quan";
      snap = JSON.parse(JSON.stringify(q ? DEMO_DATA.fresh_quan : DEMO_DATA.fresh_snap));
      uiScreen = "play";
      offline = false;
      if (snap && snap.events) {
        checkEventsForFX(snap.events);
        if (!freshSfxDone) {
          freshSfxDone = true;
          sfxPrimed = true;
          processSfxFromEvents(snap.events, { forcePlay: true });
        }
      }
    }

    function syncPhaseFromSnap() {
      if (!snap || DEMO) return;
      if (snap.paused !== undefined) {
        pauseSupported = true;
        paused = !!snap.paused;
      }
      const ev = snap.events || [];
      for (let i = ev.length - 1; i >= 0; i--) {
        if (ev[i].name === "buy_failed") {
          const d = ev[i].data || {};
          shopFlash = "Mua thất bại: " + (d.reason || "—") + (d.action ? " (" + d.action + ")" : "");
          break;
        }
        if (ev[i].name === "bought") {
          const d = ev[i].data || {};
          shopFlash = "Đã mua " + (d.upgrade || "") + " cấp " + (d.level || "") + " · còn " + (d.money !== undefined ? d.money + "k" : "—");
          break;
        }
      }
      if (!userStarted || uiScreen === "menu") { lastSimPhase = simPhase(); return; }
      const ph = simPhase();
      if (ph === "shop") {
        if (uiScreen !== "shop" && uiScreen !== "dayResult") setScreen("shop");
      } else if (ph === "quan") {
        if (lastSimPhase === "gather" && uiScreen === "play") setScreen("eveningIntro");
        else if (uiScreen === "shop" || uiScreen === "dayIntro") setScreen("play");
      } else if (ph === "gather") {
        if (lastSimPhase === "shop") {
          const daysDone = snap.days_completed, daysMax = (snap.meta && snap.meta.days) || snap.days;
          if (snap.finished || (daysMax && daysDone >= daysMax)) setScreen("summary");
          else setScreen("dayIntro");
        } else if (uiScreen === "shop") setScreen("play");
      }
      if (snap.finished && isDayMode() && uiScreen === "play") {
        const daysDone = snap.days_completed, daysMax = (snap.meta && snap.meta.days) || snap.days;
        if (daysMax && daysDone >= daysMax) setScreen("summary");
      }
      lastSimPhase = ph;
    }
    poll();

    // --- Các hàm tiện ích & Dữ liệu hiển thị ---
    function fit() {
      const dpr = window.devicePixelRatio || 1;
      const w = innerWidth, h = innerHeight;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return [w, h];
    }

    function text(s, x, y, o = {}) {
      const size = Math.max(HUD_MIN, o.size || HUD_MIN);
      ctx.font = (o.bold ? "600 " : "") + size + "px " + FONT;
      ctx.fillStyle = o.color || "#e8eef2";
      ctx.textAlign = o.align || "left";
      ctx.textBaseline = o.base || "alphabetic";
      ctx.fillText(String(s), x, y);
    }

    function panel(x, y, w, h, bg = "rgba(16, 26, 36, 0.85)", stroke = "rgba(142, 202, 230, 0.3)") {
      ctx.save();
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, 12) : ctx.rect(x, y, w, h);
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    function btn(id, label, x, y, w, h, opt = {}) {
      ctx.save();
      ctx.fillStyle = opt.fill || "#1e3a4c";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, 8) : ctx.rect(x, y, w, h);
      ctx.fill();
      ctx.strokeStyle = opt.stroke || "#4fc3f7";
      ctx.lineWidth = 2;
      ctx.stroke();
      text(label, x + w / 2, y + h / 2 + 7, { size: opt.size || 20, align: "center", color: opt.color || "#e1f5fe", bold: true });
      ctx.restore();
      buttons.push({ id, label, x, y, w, h });
    }

    function bar(x, y, w, h, frac, color, label, bgColor = "rgba(0,0,0,0.5)") {
      ctx.save();
      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, 6) : ctx.rect(x, y, w, h);
      ctx.fill();
      const fillW = Math.max(0, Math.min(1, frac)) * w;
      if (fillW > 0) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(x, y, fillW, h, 6) : ctx.rect(x, y, fillW, h);
        ctx.fill();
      }
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.lineWidth = 1;
      ctx.stroke();
      if (label) text(label, x + w / 2, y + h / 2 + 6, { size: 18, align: "center", bold: true });
      ctx.restore();
    }

    function angryBadge(x, y, withLabel) {
      // Phase 4 TV3 (TICKET-04): cảnh báo "khách sắp giận" khi kiên nhẫn < 25%
      // Nền #ff1744, viền trắng 2px, "!" trắng; nhãn ≥ 18px — HC dùng #ffe600 cho dễ đọc.
      ctx.fillStyle = "#ff1744";
      ctx.fillRect(x, y, 26, 24);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, 24, 22);
      ctx.lineWidth = 1;
      text("!", x + 13, y + 19, { size: 18, bold: true, align: "center", color: "#ffffff" });
      if (withLabel) {
        text("khách sắp giận", x + 32, y + 19, {
          size: 18, bold: true, color: highContrast ? "#ffe600" : "#ff1744",
        });
      }
    }

    function fmtTime(ticks) {
      if (ticks === undefined || ticks === null) return "—";
      const s = Math.ceil(ticks / 60);
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }
    function dash(v) { return v === undefined || v === null ? "—" : v; }
    function shortDish(d) { const n = dn(d); return n.length > 18 ? n.slice(0, 16) + "…" : n; }
    function dist2(a, b) { const dx = a[0] - b[0], dy = a[1] - b[1]; return Math.sqrt(dx * dx + dy * dy); }

    const SPOILED_BELOW = 30;
    function isItemObj(x) { return x !== null && typeof x === "object" && !Array.isArray(x) && (x.kind !== undefined || x.fresh !== undefined); }
    function itemFresh(x) { return isItemObj(x) && typeof x.fresh === "number" && isFinite(x.fresh) ? x.fresh : undefined; }
    function isUsableItem(x) { const f = itemFresh(x); return f === undefined || f >= SPOILED_BELOW; }
    function freshColor(f) {
      if (f === undefined || f === null) return "#90a4ae";
      if (f >= 60) return "#66bb6a";
      if (f >= SPOILED_BELOW) return "#ffca28";
      return "#ef5350";
    }
    function freshLabel(f) { return f === undefined || f === null ? "—" : (Math.round(f * 10) / 10).toFixed(1); }

    function asItemList(src) {
      if (!src) return [];
      if (Array.isArray(src)) {
        return src.map((x, i) => isItemObj(x) ? { id: x.id, kind: x.kind, fresh: itemFresh(x) } : { id: "k" + i, kind: x, fresh: undefined });
      }
      if (typeof src === "object") {
        if (Array.isArray(src.items)) return asItemList(src.items);
        const out = [];
        Object.keys(src).forEach((k) => {
          const n = src[k];
          if (typeof n === "number" && n > 0) for (let i = 0; i < n; i++) out.push({ kind: k, fresh: undefined });
        });
        return out;
      }
      return [];
    }
    function holdItems() { return asItemList(snap && snap.hold); }
    function stockItems() {
      const s = snap && snap.stock;
      if (s) return asItemList(s);
      if (DEMO && DEMO_DATA.fresh_quan) return asItemList(DEMO_DATA.fresh_quan.stock);
      return [];
    }
    function holdCounts(usableOnly) {
      const o = {};
      holdItems().forEach((it) => {
        if (usableOnly && !isUsableItem(it)) return;
        if (!it.kind) return;
        o[it.kind] = (o[it.kind] || 0) + 1;
      });
      return o;
    }
    function stockCounts(usableOnly) {
      const o = {};
      stockItems().forEach((it) => {
        if (usableOnly && !isUsableItem(it)) return;
        if (!it.kind) return;
        o[it.kind] = (o[it.kind] || 0) + 1;
      });
      return o;
    }
    function dayPlan() {
      const raw = (snap && (snap.day_plan || (snap.meta && snap.meta.day_plan) || (snap.day && snap.day.day_plan)))
        || (DEMO ? DEMO_DATA.day_plan : null);
      if (!raw) return null;
      let dishes = raw.dishes;
      if (dishes && !Array.isArray(dishes) && typeof dishes === "object") {
        dishes = Object.keys(dishes).map((id) => ({ id, count: dishes[id] }));
      }
      const need = raw.need || raw.ingredients || null;
      return { dishes, need, speech: raw.speech };
    }
    function dayNum() {
      const d = snap && (snap.day ?? (snap.meta && snap.meta.day) ?? snap.day_number);
      if (d !== undefined && d !== null && typeof d !== "object") return d;
      return DEMO ? DEMO_DATA.day : "—";
    }
    function patienceLeft(c) {
      if (!c) return undefined;
      if (c.patience_ticks_left !== undefined) return c.patience_ticks_left;
      if (c.patience_ticks !== undefined) return c.patience_ticks;
      return undefined;
    }
    function patienceMax(c, meta) {
      if (c && c.patience_max_ticks !== undefined) return c.patience_max_ticks;
      return ((meta && meta.patience_s) || 60) * 60;
    }
    function dishOf(obj) {
      if (!obj) return null;
      if (typeof obj === "string") return obj;
      return obj.dish_id || obj.dish || null;
    }

    const GATHER_HUD_EVENTS = new Set([
      "dive", "surface", "oxygen_empty", "choke", "faint", "hold_full", "gather_end",
      "gather", "fish_caught", "node_regrown", "spoiled",
    ]);
    const QUAN_HUD_EVENTS = new Set([
      "customer_arrived", "customer_left", "cook_started", "dish_ready", "dish_picked",
      "served", "paid", "quan_end", "no_dish", "spoiled",
    ]);
    const EVENT_VI = {
      dive: "Lặn xuống", surface: "Lên mặt nước", oxygen_empty: "Hết oxy", choke: "Ngạt (−1 Máu)", faint: "Ngất",
      hold_full: "Giỏ đầy", gather_end: "Kết thúc buổi sáng", gather: "Hái nút", fish_caught: "Bắt cá", node_regrown: "Nút mọc lại",
      spoiled: "Hàng ươn",
      customer_arrived: "Khách đến", customer_left: "Khách bỏ đi", cook_started: "Bắt nấu", dish_ready: "Món chín",
      dish_picked: "Nhặt món", served: "Phục vụ", paid: "Thanh toán + boa", quan_end: "Hết ca", no_dish: "Thiếu món",
    };
    function lastHudEvent(allowed) {
      const ev = (snap && snap.events) || [];
      for (let i = ev.length - 1; i >= 0; i--) if (allowed.has(ev[i].name)) return ev[i];
      return null;
    }
    function formatCookItems(items) {
      if (!Array.isArray(items) || !items.length) return "—";
      return items.map((it) => {
        const k = KIND_NAME[it.kind] || it.kind || it.id || "?";
        const f = typeof it.fresh === "number" ? freshLabel(it.fresh) : "—";
        return k + " " + f;
      }).join(", ");
    }
    function lockedPrice(d) {
      if (!d || typeof d !== "object") return undefined;
      if (d.base_price !== undefined && d.base_price !== null) return d.base_price;
      if (d.price !== undefined && d.price !== null) return d.price;
      return undefined;
    }
    function hudEventLine(e) {
      if (!e) return "";
      const d = e.data || {};
      if (e.name === "spoiled") {
        const name = KIND_NAME[d.kind] || d.kind || d.item_id || "?";
        const loc = d.location === "stock" ? "kho" : (d.location === "hold" ? "giỏ" : (d.location || "—"));
        return "t" + e.tick + " Hàng ươn: " + name + " (" + loc + ")";
      }
      if (e.name === "cook_started") {
        const dish = d.dish || d.dish_id;
        let s = "t" + e.tick + " Bắt nấu" + (dish ? " · " + dn(dish) : "");
        if (d.items !== undefined) s += " · NL: " + formatCookItems(d.items);
        const bp = lockedPrice(d);
        if (bp !== undefined) s += " · giá " + bp + "k";
        return s;
      }
      if (e.name === "paid") {
        let s = "t" + e.tick + " Thanh toán";
        const bp = lockedPrice(d);
        s += " · giá chốt " + (bp !== undefined ? bp + "k" : "—");
        if (d.tip !== undefined && d.tip !== null) s += " · boa " + d.tip + "k";
        return s;
      }
      let s = EVENT_VI[e.name] || e.name;
      if (d.reason) s += " · " + d.reason;
      else if (d.dish || d.dish_id) s += " · " + dn(d.dish || d.dish_id);
      else if (d.kind) s += " · " + (KIND_NAME[d.kind] || d.kind) + (d.count ? "×" + d.count : "");
      else if (d.node_id) s += " · " + d.node_id;
      else if (d.fish_id) s += " · " + d.fish_id;
      return "t" + e.tick + " " + s;
    }
    function eventLog(w, h) {
      if (!snap) return;
      const ev = (snap.events || []).slice(-3);
      ev.forEach((e, i) => text(hudEventLine(e), w - 12, h - 96 - (ev.length - 1 - i) * 22, { size: 18, align: "right", color: "rgba(232,238,242,.75)" }));
    }

    function drawFreshSlot(x0, y0, sz, it, highlight) {
      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,.08)";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x0, y0, sz, sz, 6) : ctx.rect(x0, y0, sz, sz);
      ctx.fill();
      if (it) {
        ctx.fillStyle = kc(it.kind);
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(x0 + 4, y0 + 4, sz - 8, sz - 14, 4) : ctx.rect(x0 + 4, y0 + 4, sz - 8, sz - 14);
        ctx.fill();
        const f = it.fresh;
        if (f !== undefined) {
          const bh = 4, by = y0 + sz - bh - 3;
          ctx.fillStyle = "rgba(0,0,0,.6)";
          ctx.fillRect(x0 + 3, by, sz - 6, bh);
          ctx.fillStyle = freshColor(f);
          ctx.fillRect(x0 + 3, by, (sz - 6) * Math.max(0, Math.min(1, f / 100)), bh);
          if (f < SPOILED_BELOW) text("ƯƠN", x0 + sz / 2, y0 + 16, { size: 18, align: "center", color: "#ff5252", bold: true });
          else text(freshLabel(f), x0 + sz / 2, y0 + 16, { size: 18, align: "center", color: "#fff" });
        }
      }
      if (highlight) {
        ctx.strokeStyle = "#ffd54f"; ctx.lineWidth = 2;
        ctx.strokeRect(x0 + 1, y0 + 1, sz - 2, sz - 2);
      }
      ctx.restore();
    }

    // ==========================================
    // THIẾT KẾ ĐỒ HỌA & ANIMATION TỔNG THỂ
    // ==========================================

    // 1. Vẽ cá miền Tây có chuyển động quẫy đuôi mềm mại
    function drawAnimatedFish(sx, sy, f, scale) {
      ctx.save();
      ctx.translate(sx, sy);
      const heading = f.heading_deg || 0;
      ctx.rotate((heading * Math.PI) / 180);

      // Đuôi quẫy theo sin wave
      const tailWag = Math.sin(gameTime * 14 + (f.id ? f.id.charCodeAt(0) : 0)) * 0.28;
      const col = kc(f.kind);

      // Thân cá
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.ellipse(0, 0, 0.95 * scale, 0.45 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Mắt cá
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(0.55 * scale, -0.15 * scale, 0.14 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.arc(0.58 * scale, -0.15 * scale, 0.07 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Đuôi cá có khớp quẫy
      ctx.save();
      ctx.translate(-0.75 * scale, 0);
      ctx.rotate(tailWag);
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-0.75 * scale, -0.42 * scale);
      ctx.lineTo(-0.75 * scale, 0.42 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Vây lưng
      ctx.fillStyle = "rgba(255,255,255,0.3)";
      ctx.beginPath();
      ctx.ellipse(-0.1 * scale, -0.42 * scale, 0.35 * scale, 0.12 * scale, -0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 2. Thủy quái (Cá sấu) với sống lưng gai và quẫy đuôi
    function drawAnimatedMonster(sx, sy, m, scale) {
      ctx.save();
      ctx.translate(sx, sy);
      const tailSwish = Math.sin(gameTime * 6) * 0.3;

      // Thân cá sấu vảy tím sừng sỏ
      ctx.fillStyle = "#4a148c";
      ctx.beginPath();
      ctx.ellipse(0, 0, 1.4 * scale, 0.65 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ba68c8";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Hàm cá sấu + răng
      ctx.fillStyle = "#311b92";
      ctx.beginPath();
      ctx.moveTo(0.8 * scale, -0.4 * scale);
      ctx.lineTo(1.8 * scale, 0);
      ctx.lineTo(0.8 * scale, 0.4 * scale);
      ctx.closePath();
      ctx.fill();

      // Mắt đỏ phát sáng rực rỡ
      ctx.fillStyle = "#ff1744";
      ctx.beginPath();
      ctx.arc(0.7 * scale, -0.25 * scale, 0.15 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Đuôi cá sấu quẫy
      ctx.save();
      ctx.translate(-1.1 * scale, 0);
      ctx.rotate(tailSwish);
      ctx.fillStyle = "#4a148c";
      ctx.beginPath();
      ctx.moveTo(0, -0.4 * scale);
      ctx.lineTo(-1.2 * scale, 0);
      ctx.lineTo(0, 0.4 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Cảnh báo dấu chấm than
      text("⚠", 0, -1.1 * scale, { size: 22, align: "center", color: "#ff5252", bold: true });
      ctx.restore();
    }

    // 3. Nhân vật Út Sen — Thợ lặn (Gather) hoặc Bồi bàn bưng món (Quan)
    function drawUtSen(sx, sy, mode, scale, p, snapHand) {
      ctx.save();
      ctx.translate(sx, sy);

      if (mode === "gather") {
        const isUnderwater = p && (p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface);
        const kick = isUnderwater ? Math.sin(gameTime * 12) * 0.35 : 0;

        // Bình oxy sau lưng
        ctx.fillStyle = "#e0e0e0";
        ctx.fillRect(-0.45 * scale, -0.6 * scale, 0.28 * scale, 0.7 * scale);
        ctx.strokeStyle = "#424242";
        ctx.strokeRect(-0.45 * scale, -0.6 * scale, 0.28 * scale, 0.7 * scale);

        // Chân vịt bơi
        ctx.save();
        ctx.translate(-0.3 * scale, 0.4 * scale);
        ctx.rotate(kick);
        ctx.fillStyle = "#00bcd4";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-0.4 * scale, 0.35 * scale);
        ctx.lineTo(0.1 * scale, 0.35 * scale);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Thân đồ lặn cam
        ctx.fillStyle = "#ff8a3d";
        ctx.beginPath();
        ctx.ellipse(0, 0, 0.55 * scale, 0.45 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#d84315";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Mặt nạ kính lặn lấp lánh nước
        ctx.fillStyle = "#80deea";
        ctx.beginPath();
        ctx.ellipse(0.28 * scale, -0.05 * scale, 0.25 * scale, 0.22 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Sinh bọt khí nổi lên khi lặn
        if (isUnderwater && Math.random() < 0.28) {
          addParticle(p.pos[0] - 0.3, p.pos[1] - 0.2, (Math.random() - 0.5) * 0.4, -0.8 - Math.random() * 0.5, 4 + Math.random() * 4, "#e0f7fa", 50, "bubble");
        }
      } else {
        // Quán: Út Sen mặc áo bà ba vàng nâu, đội nón lá cách điệu
        ctx.fillStyle = "#ffb74d";
        ctx.beginPath();
        ctx.ellipse(0, 0, 0.55 * scale, 0.55 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#f57c00";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Nón lá / Khăn rằn
        ctx.fillStyle = "#fff8e1";
        ctx.beginPath();
        ctx.moveTo(-0.55 * scale, -0.2 * scale);
        ctx.lineTo(0, -0.75 * scale);
        ctx.lineTo(0.55 * scale, -0.2 * scale);
        ctx.closePath();
        ctx.fill();

        // Bưng dĩa thức ăn trên tay
        if (snapHand) {
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.ellipse(0, -0.9 * scale, 0.65 * scale, 0.25 * scale, 0, 0, Math.PI * 2);
          ctx.fill();
          text("🍲", 0, -1.0 * scale, { size: 20, align: "center" });

          if (Math.random() < 0.3) {
            addParticle(p.pos[0], p.pos[1] - 0.8, (Math.random() - 0.5) * 0.3, -0.6, 5, "rgba(255,255,255,0.7)", 40, "steam");
          }
        }
      }

      ctx.restore();
    }

    // 4. Bếp lò với lửa bập bùng và khói bốc lên khi nấu
    function drawAnimatedStove(sx, sy, st, scale) {
      ctx.save();
      ctx.translate(sx, sy);

      // Thân lò đất nung miền Tây
      ctx.fillStyle = "#5d4037";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(-0.85 * scale, -0.85 * scale, 1.7 * scale, 1.7 * scale, 8) : ctx.rect(-0.85 * scale, -0.85 * scale, 1.7 * scale, 1.7 * scale);
      ctx.fill();
      ctx.strokeStyle = "#8d6e63";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Nồi gang
      ctx.fillStyle = "#263238";
      ctx.beginPath();
      ctx.arc(0, -0.1 * scale, 0.55 * scale, 0, Math.PI * 2);
      ctx.fill();

      text(st.id, 0, 8, { size: 18, align: "center", bold: true, color: "#ffffff" });

      if (st.state === "cooking") {
        // Ngọn lửa nhảy múa dưới đáy lò
        const fJitter = (Math.random() - 0.5) * 0.15;
        ctx.fillStyle = "#ff6d00";
        ctx.beginPath();
        ctx.moveTo(-0.4 * scale, 0.5 * scale);
        ctx.lineTo(0, (0.15 + fJitter) * scale);
        ctx.lineTo(0.4 * scale, 0.5 * scale);
        ctx.closePath();
        ctx.fill();

        // Hơi khói nghi ngút
        if (Math.random() < 0.35) {
          addParticle(st.pos[0], st.pos[1] - 0.6, (Math.random() - 0.5) * 0.3, -0.8, 6, "rgba(255,255,255,0.7)", 45, "steam");
        }

        if (st.cook_ticks_left !== undefined) {
          text(Math.ceil(st.cook_ticks_left / 60) + "s", 0, 1.45 * scale, { size: 18, align: "center", bold: true, color: "#ffe082" });
        }
      } else if (st.state === "ready") {
        // Hiệu ứng chín vàng phát sáng
        ctx.strokeStyle = "#ffd700";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, -0.1 * scale, 0.7 * scale, 0, Math.PI * 2);
        ctx.stroke();
        text("CHÍN ✨", 0, 1.45 * scale, { size: 18, align: "center", bold: true, color: "#69f0ae" });
      }

      ctx.restore();
    }

    // 5. Bàn ăn và thực khách sinh động
    function drawAnimatedTable(sx, sy, tb, customer, meta, scale) {
      ctx.save();
      ctx.translate(sx, sy);

      // Mặt bàn gỗ tròn
      ctx.fillStyle = "#8d6e63";
      ctx.beginPath();
      ctx.arc(0, 0, 0.95 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#4e342e";
      ctx.lineWidth = 3;
      ctx.stroke();

      text(tb.id, 0, 6, { size: 18, align: "center", color: "#efebe9", bold: true });

      if (customer) {
        // Thực khách ngồi cạnh bàn
        const cy = -1.65 * scale;
        ctx.fillStyle = customer.state === "eating" ? "#81c784" : "#ffb74d";
        ctx.beginPath();
        ctx.arc(0, cy, 0.6 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#37474f";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Mắt miệng
        text(customer.state === "eating" ? "^‿^" : "•ᴗ•", 0, cy + 4, { size: 18, align: "center", color: "#111", bold: true });

        // Bong bóng thoại gọi món
        const cd = dishOf(customer);
        if (cd) {
          ctx.fillStyle = "rgba(0,0,0,0.75)";
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(-2.2 * scale, cy - 1.5 * scale, 4.4 * scale, 0.85 * scale, 6) : ctx.rect(-2.2 * scale, cy - 1.5 * scale, 4.4 * scale, 0.85 * scale);
          ctx.fill();
          text(shortDish(cd), 0, cy - 0.95 * scale, { size: 18, align: "center", color: "#ffe082" });
        }

        // Thanh kiên nhẫn + badge TV3 khi < 25%
        const pl = patienceLeft(customer), pm = patienceMax(customer, meta);
        if (pl !== undefined && pm > 0 && customer.state !== "eating") {
          const frac = pl / pm;
          const low = frac < 0.25;
          bar(-0.9 * scale, cy + 0.7 * scale, 1.8 * scale, 8, frac, low ? "#ff1744" : "#ffca28");
          if (low) angryBadge(0.55 * scale, cy - 1.2 * scale, true);
        }
      }

      ctx.restore();
    }

    // ==========================================
    // MÀN HÌNH CHƠI GATHER & QUAN
    // ==========================================

    function drawGather(w, h) {
      const meta = (snap && snap.meta) || {};
      const b = meta.bounds || { x: [0, 100], d: [0, 30] };
      const X = b.x[1], D = b.d[1], SKY = 6;
      const top = 118, bottom = 76;
      const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
      const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
      const sx = (x) => ox + x * s, sy = (d) => oy + d * s;

      // Bầu trời buổi sáng
      const skyGrad = ctx.createLinearGradient(0, top, 0, oy);
      skyGrad.addColorStop(0, "#81d4fa");
      skyGrad.addColorStop(1, "#e1f5fe");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, top, w, SKY * s);

      // Sông nước phù sa & độ sâu sâu thẳm
      const riverGrad = ctx.createLinearGradient(0, oy, 0, sy(D));
      riverGrad.addColorStop(0, "#29b6f6");
      riverGrad.addColorStop(0.3, "#0288d1");
      riverGrad.addColorStop(1, "#011f38");
      ctx.fillStyle = riverGrad;
      ctx.fillRect(sx(0), oy, X * s, D * s);

      // Tia sáng mặt trời xuyên nước (Sun rays / Caustics)
      ctx.save();
      for (let i = 0; i < 6; i++) {
        const rx = sx(15 + i * 16) + Math.sin(gameTime * 0.8 + i) * 20;
        const rayGrad = ctx.createLinearGradient(rx, oy, rx + 40, sy(D));
        rayGrad.addColorStop(0, "rgba(255,255,255,0.12)");
        rayGrad.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.moveTo(rx - 10, oy);
        ctx.lineTo(rx + 10, oy);
        ctx.lineTo(rx + 70, sy(D));
        ctx.lineTo(rx + 30, sy(D));
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Mặt nước dập dềnh sóng nhẹ
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let x = sx(0); x <= sx(X); x += 6) {
        const wy = oy + Math.sin((x * 0.04) + gameTime * 3) * 2.5;
        if (x === sx(0)) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
      }
      ctx.stroke();

      // Bến tàu & Chiếc xuồng ba lá
      const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
      ctx.fillStyle = "rgba(255, 238, 88, 0.15)";
      ctx.beginPath();
      ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2);
      ctx.fill();

      // Xuồng ba lá đỗ ở bến
      const boatBob = Math.sin(gameTime * 2) * 2;
      ctx.fillStyle = "#8d6e63";
      ctx.beginPath();
      ctx.ellipse(sx(dp[0]), sy(-0.8) + boatBob, 2.2 * s, 0.6 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#5d4037"; ctx.stroke();
      text("Bến Ghe", sx(dp[0]), sy(-2.4), { size: 18, align: "center", bold: true, color: "#3e2723" });

      // Thực vật thủy sinh (Nodes: Bông súng, Điên điển, Kèo nèo)
      (snap.nodes || []).forEach((n) => {
        const ready = n.ready !== false && !(n.regrow_ticks > 0);
        const nx = sx(n.pos[0]), ny = sy(n.pos[1]) + Math.sin(gameTime * 2 + n.pos[0]) * 1.5;
        ctx.save();
        ctx.fillStyle = kc(n.kind);
        ctx.beginPath();
        // Vẽ đóa hoa sen / bông súng
        ctx.arc(nx, ny, 0.8 * s, 0, Math.PI * 2);
        ctx.fill();
        if (ready) {
          // Hào quang sẵn sàng thu hoạch
          ctx.strokeStyle = "#fff59d";
          ctx.lineWidth = 3;
          ctx.stroke();
          text("✨", nx, ny - 0.9 * s, { size: 18, align: "center" });
        } else {
          text((n.regrow_ticks !== undefined ? Math.ceil(n.regrow_ticks / 60) + "s" : "—"), nx, ny + 1.2 * s, { size: 18, align: "center", color: "#ffcc80" });
        }
        ctx.restore();
      });

      // Đàn cá bơi lội mềm mại
      (snap.fish || []).forEach((f) => {
        const fx = sx(f.pos[0]), fy = sy(f.pos[1]);
        drawAnimatedFish(fx, fy, f, s);
      });

      // Thủy quái (Cá sấu)
      const mons = snap.monsters || (snap.gather && snap.gather.monsters) || [];
      let nearMonster = false;
      mons.forEach((m) => {
        if (!m.pos) return;
        drawAnimatedMonster(sx(m.pos[0]), sy(m.pos[1]), m, s);
      });

      // Nhân vật Út Sen (Dùng LERP vị trí mượt mà)
      const p = snap.player;
      let nearDock = false, nearNode = false;
      if (p && p.pos) {
        // LERP toạ độ hiển thị
        lerpState.player.x = lerp(lerpState.player.x, p.pos[0], 0.25);
        lerpState.player.y = lerp(lerpState.player.y, p.pos[1], 0.25);

        const px = sx(lerpState.player.x), py = sy(lerpState.player.y);
        const isUnderwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;

        // Vòng bán kính bắt cá khi lặn
        if (meta.catch_radius && isUnderwater) {
          ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2);
          ctx.stroke();
        }

        drawUtSen(px, py, "gather", s, p);

        nearDock = dist2(p.pos, dp) <= dr + 0.05;
        const ir = meta.interact_radius || 2;
        (snap.nodes || []).forEach((n) => { if (n.ready !== false && dist2(p.pos, n.pos) <= ir) nearNode = true; });
        mons.forEach((m) => { if (m.pos && dist2(p.pos, m.pos) <= (m.warn_radius || 10)) nearMonster = true; });
      }

      // Vẽ các hạt bọt khí & tia lấp lánh trong nước
      particles.forEach((pt) => {
        ctx.save();
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.alpha;
        ctx.beginPath();
        ctx.arc(sx(pt.x), sy(pt.y), pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Vẽ chữ nổi kinh tế/sự kiện
      floaters.forEach((fl) => {
        ctx.save();
        ctx.globalAlpha = fl.alpha;
        text(fl.text, sx(fl.x), sy(fl.y), { size: 20, align: "center", bold: true, color: fl.color });
        ctx.restore();
      });

      // Viền cảnh báo Thủy quái gần
      sfxEdgeWarn(nearMonster, false);
      if (nearMonster) {
        ctx.strokeStyle = highContrast ? "#ffe600" : "rgba(244, 67, 54, 0.85)";
        ctx.lineWidth = 8;
        ctx.strokeRect(4, 4, w - 8, h - 8);
        alertBanner(w, h * 0.42, "⚠ Thủy quái gần!");
      }

      // --- HUD BUỔI SÁNG (Chữ rõ ràng ≥ 18px) ---
      const tLeft = snap.time_left_ticks;
      const tUrgent = tLeft !== undefined && tLeft <= 30 * 60;
      text("⏱ " + fmtTime(tLeft), 16, 32, { size: 24, bold: true, color: tUrgent ? "#ff5252" : "#e0f2fe" });

      if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
        const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
        bar(130, 14, 210, 22, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7");
        text("Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s", 130, 56, { size: 18, color: low ? "#ff8a80" : "#b3e5fc", bold: true });
        if (p.oxygen_ticks === 0) alertBanner(w, 96, "⚠ Hết hơi!");
        else if (low) alertBanner(w, 96, "⚠ Oxy sắp hết!");
      } else text("Oxy —", 130, 56, { size: 18, color: "#78909c" });

      if (p && p.hp !== undefined && p.hp_max) {
        let hs = ""; for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥ " : "♡ ";
        text("Máu: " + hs, 360, 32, { size: 22, color: "#ff5252", bold: true });
      }

      const depth = p && p.pos ? p.pos[1].toFixed(1) + " m" : "—";
      text("Độ sâu: " + depth, 520, 32, { size: 18, color: "#81d4fa" });

      const surf = p && p.at_surface !== undefined ? (p.at_surface ? "Mặt nước" : "Dưới nước") : "—";
      text(surf, w - 24, 32, { size: 18, align: "right", color: "#cfd8dc" });

      if (p && p.catch_cd_ticks !== undefined) {
        if (p.catch_cd_ticks > 0) text("Hồi bắt: " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 16, 80, { size: 18, color: "#90caf9" });
        else text("Hồi bắt: SẴN SÀNG", 16, 80, { size: 18, color: "#69f0ae", bold: true });
      }

      // Danh sách cần lấy theo kế hoạch (không đếm hàng ươn)
      const plan = dayPlan();
      const countsAll = holdCounts(false);
      const countsOk = holdCounts(true);
      const holdLine = Object.keys(countsAll).length
        ? Object.keys(countsAll).map((k) => {
          const spoiled = (countsAll[k] || 0) - (countsOk[k] || 0);
          return (KIND_NAME[k] || k) + "×" + (countsOk[k] || 0) + (spoiled ? "(ươn×" + spoiled + ")" : "");
        }).join("  ")
        : "(trống)";
      text("Giỏ " + holdLine, 200, 80, { size: 18, color: "#cfd8dc" });
      if (plan && plan.need) {
        const parts = Object.keys(plan.need).map((k) => (KIND_NAME[k] || k) + " " + (countsOk[k] || 0) + "/" + plan.need[k]);
        text("Cần lấy: " + parts.join(" · "), 16, 106, { size: 18, color: "#ffd54f", bold: true });
      } else text("Cần lấy: —", 16, 106, { size: 18, color: "#90a4ae" });
      const gev = lastHudEvent(GATHER_HUD_EVENTS);
      if (gev) text(hudEventLine(gev), w - 16, 56, { size: 18, align: "right", color: "#ffe082" });

      if (nearDock) text("💡 Nhấn E: Cập bến giao hàng", w / 2, h - 86, { size: 22, align: "center", color: "#ffe082", bold: true });
      else if (nearNode && p && (p.at_surface !== false)) text("💡 Nhấn E: Hái nút rau", w / 2, h - 86, { size: 22, align: "center", color: "#b9f6ca", bold: true });

      // Khay giỏ chứa đồ với độ tươi
      const items = holdItems();
      const cap = snap.hold_capacity || 12;
      const sz = Math.min(46, Math.max(38, (w - 280) / cap - 4)), y0 = h - bottom + 6;
      for (let i = 0; i < cap; i++) {
        const x0 = 16 + i * (sz + 5);
        drawFreshSlot(x0, y0, sz, items[i], i === items.length - 1 && items.length > 0);
      }
      if (items.length >= cap) text("GIỎ ĐÃ ĐẦY!", 16 + cap * (sz + 5) + 10, y0 + sz * 0.6, { size: 18, color: "#ffd54f", bold: true });

      text("Phím: WASD (Bơi) · Space (Bắt cá) · E (Hái/Bến) · Esc (Tạm dừng) · R (Chơi lại)", w - 16, h - 18, { size: 18, align: "right", color: "#90a4ae" });
    }

    function drawQuan(w, h) {
      const meta = (snap && snap.meta) || {};
      const b = meta.bounds || { x: [0, 16], z: [0, 10] };
      const X = b.x[1], Z = b.z[1], top = 130, bottom = 60;
      const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
      const ox = (w - s * X) / 2, oy = top;
      const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

      // Sàn thuyền gỗ của Quán Ăn Chợ Nổi
      ctx.save();
      ctx.fillStyle = "#8d6e63";
      ctx.fillRect(sx(0), sy(Z), X * s, Z * s);

      // Vân gỗ lát sàn thuyền
      ctx.strokeStyle = "rgba(0,0,0,0.15)";
      ctx.lineWidth = 2;
      for (let z = 1; z < Z; z++) {
        ctx.beginPath();
        ctx.moveTo(sx(0), sy(z));
        ctx.lineTo(sx(X), sy(z));
        ctx.stroke();
      }
      ctx.strokeStyle = "#4e342e";
      ctx.lineWidth = 5;
      ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
      ctx.restore();

      // Đèn lồng đỏ lung linh góc quán
      const lanternGlow = Math.sin(gameTime * 3) * 0.15 + 0.85;
      ctx.fillStyle = `rgba(255, 112, 67, ${0.2 * lanternGlow})`;
      ctx.beginPath();
      ctx.arc(sx(2), sy(Z - 1), 2.5 * s, 0, Math.PI * 2);
      ctx.fill();

      // Bếp nấu B1, B2
      (snap.stoves || []).forEach((st) => {
        drawAnimatedStove(sx(st.pos[0]), sy(st.pos[1]), st, s);
      });

      // Bàn ăn và khách hàng
      const byTable = {};
      (snap.customers || []).forEach((c) => { byTable[c.table_id] = c; });
      (snap.tables || []).forEach((tb) => {
        const c = byTable[tb.id];
        drawAnimatedTable(sx(tb.pos[0]), sy(tb.pos[1]), tb, c, meta, s);
      });

      // Nhân vật Út Sen bồi bàn
      const p = snap.player;
      if (p && p.pos) {
        lerpState.player.x = lerp(lerpState.player.x, p.pos[0], 0.28);
        lerpState.player.y = lerp(lerpState.player.y, p.pos[1], 0.28);
        const px = sx(lerpState.player.x), py = sy(lerpState.player.y);
        drawUtSen(px, py, "quan", s, p, snap.hand);
      }

      // Hạt hơi nước bốc lên từ bếp
      particles.forEach((pt) => {
        ctx.save();
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.alpha;
        ctx.beginPath();
        ctx.arc(sx(pt.x), sy(pt.y), pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Chữ số doanh thu nổi
      floaters.forEach((fl) => {
        ctx.save();
        ctx.globalAlpha = fl.alpha;
        text(fl.text, sx(fl.x), sy(fl.y), { size: 22, align: "center", bold: true, color: fl.color });
        ctx.restore();
      });

      // --- HUD QUÁN TỐI ---
      const tLeft = snap.time_left_ticks;
      const tUrgent = tLeft !== undefined && tLeft <= 30 * 60;
      text("⏱ Ca tối: " + fmtTime(tLeft), 16, 30, { size: 24, bold: true, color: tUrgent ? "#ff5252" : "#e8eef2" });

      const se = snap.shift_earned !== undefined ? snap.shift_earned : snap.earned;
      text("💰 Doanh thu ca: " + dash(se !== undefined && se !== null ? se + "k" : null), 200, 30, { size: 20, color: "#ffe082", bold: true });
      text("Tổng tiền: " + dash(snap.money !== undefined ? snap.money + "k" : null), 430, 30, { size: 20, color: "#a5d6a7" });

      const rep = snap.reputation;
      text("⭐ Uy tín: " + (rep !== undefined && rep !== null ? Number(rep).toFixed(1) : "—"), 630, 30, { size: 20, color: "#ffd54f", bold: true });

      const handLbl = dishOf(snap.hand);
      text("Đang bưng: " + (handLbl ? shortDish(handLbl) : "(trống)"), w - 16, 30, { size: 20, align: "right", color: handLbl ? "#ffcc80" : "#90a4ae" });

      // Tình trạng 4 bàn T1..T4 (+ badge TV3 khi sắp giận)
      const tableIds = ["T1", "T2", "T3", "T4"];
      const tw = Math.min(200, (w - 40) / 4 - 10);
      tableIds.forEach((tid, i) => {
        const c = byTable[tid];
        const x0 = 16 + i * (tw + 10);
        panel(x0, 44, tw, 76);
        text(tid, x0 + 10, 68, { size: 18, bold: true, color: "#81d4fa" });
        if (!c) text("Bàn trống", x0 + 10, 96, { size: 18, color: "#78909c" });
        else {
          const cd = dishOf(c);
          text(cd ? shortDish(cd) : "Đang chờ…", x0 + 10, 94, { size: 18, color: "#ffffff" });
          const pl = patienceLeft(c), pm = patienceMax(c, meta);
          if (c.state === "eating") text("Đang thưởng thức 😋", x0 + 10, 114, { size: 18, color: "#69f0ae" });
          else if (pl !== undefined && pm > 0) {
            const low = pl / pm < 0.25;
            bar(x0 + 8, 98, tw - 16, 12, pl / pm, low ? "#ff1744" : "#ffca28");
            if (low) angryBadge(x0 + tw - 32, 44, false);
          } else text("KN —", x0 + 10, 114, { size: 18, color: "#78909c" });
        }
      });

      // Kho hàng & cảnh báo khách giận
      const usable = stockCounts(true), allSt = stockItems();
      let stockLine = "—";
      if (allSt.length) {
        const parts = Object.keys(usable).map((k) => (KIND_NAME[k] || k) + "×" + usable[k]);
        const spoiledN = allSt.filter((it) => !isUsableItem(it)).length;
        stockLine = (parts.length ? parts.join(", ") : "(hết hàng tươi)") + (spoiledN ? " · ươn×" + spoiledN : "");
      }
      text("Kho nguyên liệu: " + stockLine, 16, 160, { size: 18, color: "#b0bec5" });
      const spoiledSlots = allSt.filter((it) => !isUsableItem(it)).slice(0, 4);
      spoiledSlots.forEach((it, i) => drawFreshSlot(16 + i * 52, 172, 44, it, false));
      const qev = lastHudEvent(QUAN_HUD_EVENTS);
      if (qev) text(hudEventLine(qev), w - 16, 56, { size: 18, align: "right", color: "#ffe082" });

      const angry = (snap.customers || []).some((c) => {
        if (c.state === "eating") return false;
        const pl = patienceLeft(c), pm = patienceMax(c, meta);
        return pl !== undefined && pm > 0 && pl / pm < 0.25;
      });
      sfxEdgeWarn(false, angry);
      if (angry) alertBanner(w, 200, "⚠ Khách sắp giận bỏ về!");

      text("Phím: WASD · E · Esc/P · R · M âm · N phụ đề", w - 16, h - 18, { size: 18, align: "right", color: "#90a4ae" });
    }

    function drawMenu(w, h) {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "#0d2b45");
      g.addColorStop(1, "#07121c");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      // Hiệu ứng hạt sáng lấp lánh trên sông ở màn hình chính
      for (let i = 0; i < 20; i++) {
        const sx = (Math.sin(i * 99 + gameTime * 0.5) * 0.5 + 0.5) * w;
        const sy = (Math.cos(i * 33 + gameTime * 0.3) * 0.5 + 0.5) * h;
        ctx.fillStyle = "rgba(255, 238, 88, 0.15)";
        ctx.beginPath();
        ctx.arc(sx, sy, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      text("QUÁN ĂN CHỢ NỔI", w / 2, h * 0.26, { size: 46, align: "center", bold: true, color: "#ffe082" });

      btn("play", "▶ VÀO CHƠI NGAY", w / 2 - 130, h * 0.44, 260, 54, { fill: "#00695c", stroke: "#80cbc4" });
      btn("contrast", highContrast ? "Tương phản: BẬT" : "👁 Chế độ tương phản cao", w / 2 - 130, h * 0.44 + 70, 260, 48, {
        size: 18,
        fill: highContrast ? "#212121" : "#1e3a4c",
        stroke: highContrast ? "#ffe600" : "#4fc3f7",
        color: highContrast ? "#ffe600" : "#e1f5fe"
      });
      btn("toggleSound", soundOn ? "🔊 Âm thanh: BẬT (M)" : "🔇 Âm thanh: TẮT (M)", w / 2 - 130, h * 0.44 + 126, 260, 44, {
        size: 18, fill: soundOn ? "#1b5e20" : "#37474f", stroke: soundOn ? "#69f0ae" : "#90a4ae"
      });
      btn("toggleCaptions", captionsOn ? "Phụ đề SFX: BẬT (N)" : "Phụ đề SFX: TẮT (N)", w / 2 - 130, h * 0.44 + 178, 260, 44, {
        size: 18, fill: captionsOn ? "#0d47a1" : "#37474f", stroke: captionsOn ? "#82b1ff" : "#90a4ae"
      });
      btn("quit", "Đóng", w / 2 - 130, h * 0.44 + 230, 260, 44, { fill: "#3e2723", stroke: "#ef5350" });

      text("Khởi động nhanh các Demo:", w / 2, h - 80, { size: 18, align: "center", color: "#90a4ae" });
      if (!DEMO) {
        btn("demoDay", "DayIntro", w / 2 - 280, h - 54, 120, 40, { size: 18 });
        btn("demoShop", "Shop", w / 2 - 150, h - 54, 100, 40, { size: 18 });
        btn("demoFresh", "Fresh", w / 2 - 40, h - 54, 100, 40, { size: 18 });
        btn("demoSfx", "SFX", w / 2 + 70, h - 54, 100, 40, { size: 18 });
      }
    }

    function drawDayIntro(w, h) {
      panel(w * 0.15, h * 0.12, w * 0.7, h * 0.74);
      text("NGÀY MỚI Ở CHỢ NỔI — NGÀY " + dayNum(), w / 2, h * 0.22, { size: 36, align: "center", bold: true, color: "#ffe082" });
      text("👵 Má Tư dặn dò Út Sen:", w / 2, h * 0.30, { size: 24, align: "center", color: "#81d4fa", bold: true });

      const plan = dayPlan();
      let y = h * 0.38;
      if (plan && plan.speech) {
        plan.speech.forEach((line) => { text(line, w / 2, y, { size: 22, align: "center" }); y += 36; });
      } else if (plan && plan.dishes && plan.dishes.length) {
        plan.dishes.forEach((d) => {
          const id = d.id || d.dish || d;
          const count = d.count !== undefined ? d.count : "";
          text(dn(id) + (count !== "" ? " ×" + count : ""), w / 2, y, { size: 22, align: "center" });
          y += 34;
        });
      }

      if (plan && plan.need) {
        y += 18;
        const parts = Object.keys(plan.need).map((k) => (KIND_NAME[k] || k) + " × " + plan.need[k]);
        text("Mục tiêu cần thu hoạch: " + parts.join("  ·  "), w / 2, y, { size: 20, align: "center", color: "#ffd54f", bold: true });
      }

      const left = Math.max(0, 4 - (performance.now() - introSince) / 1000);
      text(left > 0 ? ("Tự vào sau " + left.toFixed(1) + "s · Nhấn Enter/Space để bắt đầu ngay") : "Đang vào…", w / 2, h * 0.76, { size: 18, align: "center", color: "#90caf9" });
      btn("skipIntro", "Xuống nước hái rau bắt cá (Enter)", w / 2 - 170, h * 0.80, 340, 50, { fill: "#00695c", stroke: "#64ffda" });

      if (!DEMO && left <= 0) goPlay();
      if (DEMO && left <= 0) introSince = performance.now();
    }

    function drawEveningIntro(w, h) {
      panel(w * 0.15, h * 0.12, w * 0.7, h * 0.74);
      text("HOÀNG HÔN BUÔNG XUỐNG — MỞ QUÁN ĐÓN KHÁCH", w / 2, h * 0.22, { size: 34, align: "center", bold: true, color: "#ffe082" });

      const inv = (snap && (snap.inventory || snap.stock || (snap.gather_end && snap.gather_end.inventory))) || (DEMO ? DEMO_DATA.inventory_in : null);
      let y = h * 0.34;
      text("📦 Nguyên liệu tươi mang về:", w / 2, y, { size: 22, align: "center", color: "#81d4fa" }); y += 38;

      if (inv && typeof inv === "object") {
        const items = inv.items || inv;
        const keys = Object.keys(items).filter((k) => items[k] > 0);
        if (!keys.length) text("(Chưa bắt được nguyên liệu)", w / 2, y, { size: 20, align: "center", color: "#ef9a9a" });
        else keys.forEach((k) => { text((KIND_NAME[k] || k) + " × " + items[k], w / 2, y, { size: 22, align: "center" }); y += 32; });
      }

      text("🍲 Các món có thể nấu:", w / 2, y, { size: 22, align: "center", color: "#ffd54f" }); y += 36;

      if (cook && cook.length) cook.forEach((d) => { text(dn(d), w / 2, y, { size: 20, align: "center" }); y += 30; });
      else text("Chưa đủ nguyên liệu nấu món chính", w / 2, y, { size: 20, align: "center", color: "#90a4ae" });

      btn("skipIntro", "Bắt đầu ca tối (Enter)", w / 2 - 140, h * 0.80, 280, 50, { fill: "#d84315", stroke: "#ff8a65" });
