<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — Dave the Diver Mekong Edition</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #06111c; color: #e8eef2;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden; user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #instructions {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(10, 25, 40, 0.75); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px;
    padding: 6px 20px; font-size: 13px; color: #cfeaf5;
    display: flex; gap: 16px; align-items: center; pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .key-badge {
    background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3);
    border-radius: 4px; padding: 1px 7px; font-weight: 600; color: #fff; font-size: 11px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="instructions">
  <span><span class="key-badge">W A S D</span> Bơi lặn</span>
  <span><span class="key-badge">E</span> Hái hoa / Cập bến</span>
  <span><span class="key-badge">SPACE</span> Quăng lưới bắt cá</span>
  <span><span class="key-badge">R</span> Chơi lại</span>
</div>

<script>
"use strict";

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- ÂM THANH WEB AUDIO SYNTHESIZER ----------
class SoundFX {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  }
  playBubble() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const t = this.ctx.currentTime;
    osc.type = "sine";
    osc.frequency.setValueAtTime(300, t);
    osc.frequency.exponentialRampToValueAtTime(700, t + 0.12);
    gain.gain.setValueAtTime(0.08, t);
    gain.gain.linearRampToValueAtTime(0.001, t + 0.12);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + 0.12);
  }
  playCatch() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(200, t);
    osc.frequency.exponentialRampToValueAtTime(800, t + 0.15);
    osc.frequency.exponentialRampToValueAtTime(400, t + 0.25);
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + 0.25);
  }
  playPluck() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(1040, t + 0.1);
    gain.gain.setValueAtTime(0.18, t);
    gain.gain.linearRampToValueAtTime(0.001, t + 0.12);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + 0.12);
  }
  playDock() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [440, 554, 659, 880].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, t + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.3);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t + i * 0.08); osc.stop(t + i * 0.08 + 0.3);
    });
  }
}
const sfx = new SoundFX();

// ---------- VÀO: PHÍM BẤM ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (mode === "quan") dy = -dy;
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) {}
  }
  inflight = false;
}
function keyName(e) { return e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  sfx.init();
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- RA: POLL SNAPSHOT ----------
let prevEventsCount = 0;
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const newSnap = await r.json();
    handleNewEvents(newSnap);
    snap = newSnap;
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- HIỆU ỨNG HẠT (PARTICLES) & TEXT BAY ----------
const particles = [];
const floatingTexts = [];

function addBubble(x, y, count = 2) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 0.4,
      y: y + (Math.random() - 0.5) * 0.2,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -0.8 - Math.random() * 0.8,
      r: 0.05 + Math.random() * 0.08,
      alpha: 0.8,
      kind: "bubble"
    });
  }
}
function addFloatingText(text, x, y, color = "#ffeb3b") {
  floatingTexts.push({ text, x, y, vy: -0.6, alpha: 1.0, color });
}

function handleNewEvents(newSnap) {
  if (!snap) return;
  const evs = newSnap.events || [];
  if (evs.length > prevEventsCount) {
    const newOnes = evs.slice(prevEventsCount);
    for (const e of newOnes) {
      if (e.name === "gather") {
        sfx.playPluck();
        const p = newSnap.player ? newSnap.player.pos : [12, 0];
        addFloatingText("+" + (e.data.kind === "bong_dien_dien" ? "Điên Điển" : "Bông Súng"), p[0], p[1] - 0.8, "#fbc02d");
      } else if (e.name === "fish_caught") {
        sfx.playCatch();
        const p = newSnap.player ? newSnap.player.pos : [15, 5];
        const label = e.data.kind === "ca_linh" ? "+3 Cá Linh" : "+1 Cá Lóc";
        addFloatingText(label, p[0], p[1] - 0.8, "#00e676");
      } else if (e.name === "hold_full") {
        const p = newSnap.player ? newSnap.player.pos : [15, 5];
        addFloatingText("GIỎ ĐẦY!", p[0], p[1] - 1.0, "#ff5252");
      } else if (e.name === "gather_end" && e.data.reason === "docked") {
        sfx.playDock();
        addFloatingText("CẬP BẾN THÀNH CÔNG!", 2, -1.5, "#4fc3f7");
      }
    }
    prevEventsCount = evs.length;
  }
}

// ---------- CAMERA LERP FOLLOW PLAYER ----------
const cam = { x: 2, y: 0 };

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}

// =========================================================================
// RENDER GATHER — DAVE THE DIVER MEKONG RIVER
// =========================================================================
function drawGather(w, h) {
  const time = Date.now() * 0.002;
  const p = snap.player || { pos: [2, 0], heading_deg: 0 };
  
  // Tinh chỉnh Camera LERP
  cam.x += (p.pos[0] - cam.x) * 0.08;
  cam.y += (p.pos[1] - cam.y) * 0.08;
  
  // Giới hạn camera trong bounds
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const S = Math.min(w / 18, 54); // Phóng to 40-54px/m thay vì 10px/m!
  
  const minCamX = (w / S) / 2;
  const maxCamX = b.x[1] - (w / S) / 2;
  const clampedCamX = Math.max(minCamX, Math.min(maxCamX, cam.x));
  
  // Chuyển đổi tọa độ thế giới -> màn hình
  const sx = (x) => (x - clampedCamX) * S + w / 2;
  const sy = (d) => (d - cam.y) * S + h / 2;

  // 1. VẼ BẦU TRỜI & NƯỚC SÔNG MEKONG GRADIENT
  const surfY = sy(0);
  
  // Bầu trời buổi sáng sông Tiền
  const skyGrad = ctx.createLinearGradient(0, 0, 0, surfY);
  skyGrad.addColorStop(0, "#ffe0b2"); // Bình minh vàng óng
  skyGrad.addColorStop(0.6, "#ffcc80");
  skyGrad.addColorStop(1, "#b3e5fc");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, w, Math.max(0, surfY));

  // Nước sông Mekong: Xanh ngọc mặt nước -> Phù sa sẫm màu đáy sông
  const waterGrad = ctx.createLinearGradient(0, surfY, 0, sy(b.d[1]));
  waterGrad.addColorStop(0, "#1982c4");
  waterGrad.addColorStop(0.2, "#0b5282");
  waterGrad.addColorStop(0.6, "#073b61");
  waterGrad.addColorStop(1, "#031c30");
  ctx.fillStyle = waterGrad;
  ctx.fillRect(0, Math.max(0, surfY), w, h - Math.max(0, surfY));

  // 2. VẼ TIA SÁNG THẦN THÁNH DƯỚI NƯỚC (CAUSTIC LIGHT RAYS)
  ctx.save();
  ctx.globalAlpha = 0.07;
  ctx.fillStyle = "#ffffff";
  for (let i = -5; i < 25; i++) {
    const rayX = sx(i * 5) + Math.sin(time + i) * 30;
    ctx.beginPath();
    ctx.moveTo(rayX, surfY);
    ctx.lineTo(rayX + 180 + Math.cos(time * 0.7 + i) * 60, h);
    ctx.lineTo(rayX + 90 + Math.cos(time * 0.7 + i) * 60, h);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // 3. MẶT NƯỚC SÓNG SÔNG GỢN SÓNG (DYNAMIC SINE WAVES)
  ctx.beginPath();
  ctx.moveTo(0, surfY);
  for (let screenX = 0; screenX <= w; screenX += 15) {
    const worldX = (screenX - w / 2) / S + clampedCamX;
    const waveY = surfY + Math.sin(worldX * 2.5 + time * 3) * 4 + Math.sin(worldX * 5 - time * 2) * 2;
    ctx.lineTo(screenX, waveY);
  }
  ctx.strokeStyle = "rgba(255, 255, 255, 0.75)";
  ctx.lineWidth = 3;
  ctx.stroke();

  // 4. BẾN GHE THUYỀN ÚT SEN (DOCK AT X=2, D=0)
  const dockX = sx(2);
  const dockY = surfY;
  // Ghe tam bản gỗ mộc
  ctx.save();
  ctx.translate(dockX, dockY - 6);
  ctx.fillStyle = "#6d4c41"; // Thân thuyền gỗ
  ctx.beginPath();
  ctx.moveTo(-S * 1.8, -S * 0.1);
  ctx.quadraticCurveTo(-S * 1.2, S * 0.45, 0, S * 0.45);
  ctx.quadraticCurveTo(S * 1.2, S * 0.45, S * 1.8, -S * 0.1);
  ctx.lineTo(S * 1.5, -S * 0.35);
  ctx.quadraticCurveTo(0, -S * 0.25, -S * 1.5, -S * 0.35);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#4e342e"; ctx.lineWidth = 2; ctx.stroke();
  // Mui thuyền lá dừa
  ctx.fillStyle = "#8d6e63";
  ctx.beginPath();
  ctx.arc(0, -S * 0.3, S * 0.8, Math.PI, 0);
  ctx.fill();
  // Cọc gỗ neo thuyền
  ctx.fillStyle = "#3e2723";
  ctx.fillRect(-S * 2.1, -S * 0.8, 8, S * 1.4);
  // Dây thừng neo
  ctx.strokeStyle = "#d7ccc8"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-S * 2.0, -S * 0.3); ctx.lineTo(-S * 1.6, -S * 0.1); ctx.stroke();
  // Bảng chữ Bến Tàu
  ctx.fillStyle = "#ffcc80";
  ctx.font = "bold 13px system-ui";
  ctx.textAlign = "center";
  ctx.fillText("BẾN GHE (E)", 0, -S * 1.0);
  ctx.restore();

  // Vòng bán kính Dock
  const dockRadius = (meta.dock_radius || 3) * S;
  ctx.strokeStyle = "rgba(255, 224, 130, 0.4)";
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.arc(dockX, dockY, dockRadius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // 5. VẼ CÁC BỤI HOA (BÔNG ĐIÊN ĐIỂN & BÔNG SÚNG)
  (snap.nodes || []).forEach((n) => {
    const nx = sx(n.pos[0]);
    const ny = surfY + Math.sin(n.pos[0] * 2.5 + time * 3) * 4;
    const isReady = n.ready !== false;
    
    ctx.save();
    ctx.translate(nx, ny);
    if (!isReady) ctx.globalAlpha = 0.4;
    
    if (n.kind === "bong_dien_dien") {
      // Nhành Bông Điên Điển vàng rực rỡ
      ctx.fillStyle = "#2e7d32"; // Cuống lá xanh
      ctx.fillRect(-S * 0.4, 0, S * 0.8, 4);
      for (let i = -3; i <= 3; i++) {
        ctx.fillStyle = isReady ? "#ffd600" : "#fff59d"; // Cánh hoa vàng
        ctx.beginPath();
        ctx.ellipse(i * (S * 0.1), Math.sin(time * 3 + i) * 3 + 4, S * 0.08, S * 0.16, 0.2 * i, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("Điên Điển", 0, -S * 0.4);
    } else {
      // Bông Súng nở hoa tím hồng + Lá súng tròn
      ctx.fillStyle = "#1b5e20"; // Lá súng
      ctx.beginPath();
      ctx.ellipse(0, 4, S * 0.45, S * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
      // Hoa súng
      ctx.fillStyle = isReady ? "#e91e63" : "#f48fb1";
      for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
        ctx.beginPath();
        ctx.ellipse(Math.cos(angle) * 6, -6 + Math.sin(angle) * 3, 5, 10, angle, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#ffeb3b"; // Nhụy vàng
      ctx.beginPath(); ctx.arc(0, -6, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("Bông Súng", 0, -S * 0.4);
    }
    
    if (!isReady && n.regrow_ticks) {
      ctx.fillStyle = "#ff5252";
      ctx.font = "bold 12px system-ui";
      ctx.fillText("⏱ " + Math.ceil(n.regrow_ticks / 60) + "s", 0, S * 0.5);
    }
    ctx.restore();
  });

  // 6. VẼ ĐÀN CÁ (CÁ LINH & CÁ LÓC UỐN LƯỢN SINH ĐỘNG)
  (snap.fish || []).forEach((f) => {
    const fx = sx(f.pos[0]);
    const fy = sy(f.pos[1]);
    const swimCycle = Math.sin(time * 6 + f.pos[0] * 3);
    
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);

    if (f.kind === "ca_linh") {
      // Cá Linh: Mình bạc ánh xanh, đuôi đỏ quẫy
      ctx.fillStyle = "#b0bec5";
      ctx.beginPath();
      ctx.ellipse(0, 0, S * 0.5, S * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      // Bụng bạc
      ctx.fillStyle = "#eceff1";
      ctx.beginPath();
      ctx.ellipse(0, S * 0.06, S * 0.4, S * 0.12, 0, 0, Math.PI * 2);
      ctx.fill();
      // Đuôi đỏ quẫy
      ctx.fillStyle = "#e53935";
      ctx.beginPath();
      ctx.moveTo(-S * 0.45, 0);
      ctx.lineTo(-S * 0.8, -S * 0.2 + swimCycle * 3);
      ctx.lineTo(-S * 0.7, 0);
      ctx.lineTo(-S * 0.8, S * 0.2 + swimCycle * 3);
      ctx.closePath();
      ctx.fill();
      // Mắt cá
      ctx.fillStyle = "#263238";
      ctx.beginPath(); ctx.arc(S * 0.35, -S * 0.05, 2.5, 0, Math.PI * 2); ctx.fill();
      // Tên loài
      ctx.fillStyle = "#cfd8dc";
      ctx.font = "11px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("Cá Linh (+3)", 0, -S * 0.35);
    } else {
      // Cá Lóc: Mình thuôn dài vằn xanh đen, săn mồi dữ dội
      ctx.fillStyle = "#4e6b3e";
      ctx.beginPath();
      ctx.ellipse(0, 0, S * 0.75, S * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
      // Vệt rằn ri
      ctx.fillStyle = "#2e4224";
      for (let j = -2; j <= 2; j++) {
        ctx.fillRect(j * (S * 0.2), -S * 0.22, 4, S * 0.44);
      }
      // Vây lưng dài
      ctx.fillStyle = "#334d27";
      ctx.fillRect(-S * 0.4, -S * 0.32, S * 0.8, S * 0.1);
      // Đuôi quẫy mạnh
      ctx.beginPath();
      ctx.moveTo(-S * 0.7, 0);
      ctx.lineTo(-S * 1.1, -S * 0.3 + swimCycle * 5);
      ctx.lineTo(-S * 1.1, S * 0.3 + swimCycle * 5);
      ctx.closePath();
      ctx.fill();
      // Mắt vàng hung hăng
      ctx.fillStyle = "#fbc02d";
      ctx.beginPath(); ctx.arc(S * 0.55, -S * 0.07, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath(); ctx.arc(S * 0.55, -S * 0.07, 1.8, 0, Math.PI * 2); ctx.fill();
      // Tên loài
      ctx.fillStyle = "#aed581";
      ctx.font = "bold 12px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("Cá Lóc (+1)", 0, -S * 0.42);
    }
    ctx.restore();
  });

  // 7. VẼ NHÂN VẬT ÚT SEN (ÁO BÀ BA, NÓN LÁ, CHÂN VỊT BƠI LẶN)
  const px = sx(p.pos[0]);
  const py = sy(p.pos[1]);
  const isUnderwater = p.pos[1] > 0.5;

  // Hạt bọt khí thở khi ở dưới nước
  if (isUnderwater && Math.random() < 0.35) {
    addBubble(p.pos[0], p.pos[1], 1);
    sfx.playBubble();
  }

  // Vòng ngắm tương tác / bắt cá (Smart Reticle)
  ctx.save();
  if (isUnderwater) {
    ctx.strokeStyle = "rgba(0, 230, 118, 0.4)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.arc(px, py, (meta.catch_radius || 2.0) * S, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    ctx.strokeStyle = "rgba(255, 235, 59, 0.4)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.arc(px, py, (meta.interact_radius || 2.0) * S, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  // Vẽ Út Sen
  ctx.save();
  ctx.translate(px, py);
  const headingRad = ((p.heading_deg || 0) * Math.PI) / 180;
  ctx.rotate(headingRad);

  // Bình dưỡng khí Oxy trên lưng
  ctx.fillStyle = "#00b0ff";
  ctx.fillRect(-S * 0.25, -S * 0.18, S * 0.45, S * 0.12);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.strokeRect(-S * 0.25, -S * 0.18, S * 0.45, S * 0.12);

  // Thân mình: Áo bà ba nâu mộc mạc
  ctx.fillStyle = "#795548";
  ctx.beginPath();
  ctx.ellipse(0, 0, S * 0.38, S * 0.24, 0, 0, Math.PI * 2);
  ctx.fill();

  // Chân bơi chân vịt
  const kick = Math.sin(time * 8) * (S * 0.12);
  ctx.fillStyle = "#3e2723";
  ctx.beginPath();
  ctx.ellipse(-S * 0.45, -S * 0.08 + kick, S * 0.18, S * 0.07, 0, 0, Math.PI * 2);
  ctx.ellipse(-S * 0.45, S * 0.08 - kick, S * 0.18, S * 0.07, 0, 0, Math.PI * 2);
  ctx.fill();

  // Đầu & Nón Lá nghiêng
  ctx.fillStyle = "#ffe0b2"; // Khuôn mặt
  ctx.beginPath(); ctx.arc(S * 0.3, 0, S * 0.16, 0, Math.PI * 2); ctx.fill();
  
  // Nón lá Việt Nam
  ctx.fillStyle = "#fff9c4";
  ctx.beginPath();
  ctx.arc(S * 0.28, 0, S * 0.24, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(S * 0.28, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#fbc02d"; ctx.lineWidth = 1.5; ctx.stroke();

  // Kính lặn
  ctx.fillStyle = "rgba(0, 229, 255, 0.75)";
  ctx.fillRect(S * 0.38, -S * 0.08, 5, S * 0.16);

  ctx.restore();

  // 8. CẬP NHẬT & VẼ HẠT BỌT KHÍ (BUBBLE PARTICLES)
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx / 60;
    pt.y += pt.vy / 60;
    pt.alpha -= 0.005;
    if (pt.y <= 0 || pt.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }
    const bx = sx(pt.x), by = sy(pt.y);
    ctx.save();
    ctx.globalAlpha = pt.alpha;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
    ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
    ctx.beginPath();
    ctx.arc(bx, by, pt.r * S, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // 9. VẼ TEXT BAY (FLOATING TEXT EFFECT)
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy / 60;
    ft.alpha -= 0.015;
    if (ft.alpha <= 0) {
      floatingTexts.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.globalAlpha = ft.alpha;
    ctx.fillStyle = ft.color;
    ctx.font = "bold 16px system-ui";
    ctx.textAlign = "center";
    ctx.shadowColor = "#000"; ctx.shadowBlur = 4;
    ctx.fillText(ft.text, sx(ft.x), sy(ft.y));
    ctx.restore();
  }

  // 10. HUD CHUYÊN NGHIỆP — DAVE THE DIVER STYLED
  drawGatherHUD(w, h, p, meta);
}

// =========================================================================
// HUD GATHER ĐỈNH CAO PHONG CÁCH DAVE THE DIVER
// =========================================================================
function drawGatherHUD(w, h, p, meta) {
  // Thước đo độ sâu (Depth Meter bên trái)
  const depth = p.pos ? p.pos[1] : 0;
  ctx.save();
  ctx.fillStyle = "rgba(10, 25, 45, 0.8)";
  ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
  ctx.fillRect(16, 80, 70, 48);
  ctx.strokeRect(16, 80, 70, 48);
  ctx.fillStyle = "#81d4fa";
  ctx.font = "11px system-ui";
  ctx.fillText("ĐỘ SÂU", 24, 98);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 18px system-ui";
  ctx.fillText(depth.toFixed(1) + "m", 24, 120);
  ctx.restore();

  // Thanh bình Oxy thủy tinh phát sáng (Top Center)
  const oxy = p.oxygen_ticks || 1800;
  const maxOxy = p.oxygen_max_ticks || 1800;
  const oxyRatio = Math.max(0, Math.min(1, oxy / maxOxy));
  const oxyWidth = 260;
  const oxyX = (w - oxyWidth) / 2;
  const isOxyLow = oxyRatio < 0.25;

  ctx.save();
  // Khung thủy tinh
  ctx.fillStyle = "rgba(8, 20, 35, 0.85)";
  ctx.strokeStyle = isOxyLow ? "#ff1744" : "rgba(255, 255, 255, 0.4)";
  ctx.lineWidth = isOxyLow ? 2 : 1.5;
  ctx.fillRect(oxyX, 16, oxyWidth, 24);
  ctx.strokeRect(oxyX, 16, oxyWidth, 24);

  // Ruột oxy đổi màu theo %
  const oxyGrad = ctx.createLinearGradient(oxyX, 0, oxyX + oxyWidth, 0);
  if (isOxyLow) {
    oxyGrad.addColorStop(0, "#d50000");
    oxyGrad.addColorStop(1, "#ff5252");
  } else {
    oxyGrad.addColorStop(0, "#00b0ff");
    oxyGrad.addColorStop(1, "#00e5ff");
  }
  ctx.fillStyle = oxyGrad;
  ctx.fillRect(oxyX + 2, 18, (oxyWidth - 4) * oxyRatio, 20);

  // Text Oxy
  ctx.fillStyle = "#fff";
  ctx.font = "bold 13px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(`BÌNH DƯỠNG KHÍ: ${Math.ceil(oxy / 60)}s (${Math.round(oxyRatio * 100)}%)`, w / 2, 33);
  ctx.restore();

  // Tim Máu HP (Top Left)
  ctx.save();
  let hpString = "";
  const currentHp = p.hp !== undefined ? p.hp : 3;
  for (let i = 0; i < (p.hp_max || 3); i++) hpString += i < currentHp ? "❤️ " : "🖤 ";
  ctx.font = "18px system-ui";
  ctx.fillText(hpString, 16, 34);
  ctx.restore();

  // Đồng hồ đếm lùi ca lặn (Top Right)
  ctx.save();
  const timeLeft = snap.time_left_ticks || 0;
  const s = Math.ceil(timeLeft / 60);
  const timeStr = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  ctx.fillStyle = "rgba(10, 25, 45, 0.8)";
  ctx.fillRect(w - 140, 16, 124, 40);
  ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
  ctx.strokeRect(w - 140, 16, 124, 40);
  ctx.fillStyle = "#ffb74d";
  ctx.font = "bold 20px system-ui";
  ctx.textAlign = "center";
  ctx.fillText("⏱ " + timeStr, w - 78, 43);
  ctx.restore();

  // Giỏ đồ thu hoạch (Bottom Left Inventory Rack)
  const hold = snap.hold || [];
  const cap = snap.hold_capacity || 12;
  const slotSize = 36;
  const startX = 16;
  const startY = h - 68;

  ctx.save();
  ctx.fillStyle = "rgba(8, 20, 35, 0.85)";
  ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
  ctx.fillRect(startX - 8, startY - 26, cap * (slotSize + 6) + 16, slotSize + 36);
  ctx.strokeRect(startX - 8, startY - 26, cap * (slotSize + 6) + 16, slotSize + 36);

  ctx.fillStyle = "#81d4fa";
  ctx.font = "bold 12px system-ui";
  ctx.fillText(`GIỎ ĐỒ ÚT SEN (${hold.length}/${cap})`, startX, startY - 8);

  for (let i = 0; i < cap; i++) {
    const slotX = startX + i * (slotSize + 6);
    ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
    ctx.fillRect(slotX, startY, slotSize, slotSize);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
    ctx.strokeRect(slotX, startY, slotSize, slotSize);

    if (hold[i]) {
      const item = hold[i];
      if (item === "ca_linh") {
        ctx.fillStyle = "#90caf9";
        ctx.font = "18px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("🐟", slotX + slotSize / 2, startY + 25);
      } else if (item === "ca_loc") {
        ctx.fillStyle = "#aed581";
        ctx.font = "18px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("🐊", slotX + slotSize / 2, startY + 25);
      } else if (item === "bong_dien_dien") {
        ctx.font = "18px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("🌼", slotX + slotSize / 2, startY + 25);
      } else if (item === "bong_sung") {
        ctx.font = "18px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("🪷", slotX + slotSize / 2, startY + 25);
      }
    }
  }
  ctx.restore();

  // Mini-map Overview (Top Right góc dưới đồng hồ)
  drawMiniMap(w, h, p, meta);
}

// Mini-map lòng sông Mekong thu nhỏ
function drawMiniMap(w, h, p, meta) {
  const mw = 160, mh = 48;
  const mx = w - mw - 16, my = 64;
  ctx.save();
  ctx.fillStyle = "rgba(5, 15, 25, 0.85)";
  ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeRect(mx, my, mw, mh);

  // Vạch mặt nước
  ctx.strokeStyle = "#4fc3f7"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(mx, my + 8); ctx.lineTo(mx + mw, my + 8); ctx.stroke();

  // Bến tàu
  ctx.fillStyle = "#ffb74d";
  ctx.fillRect(mx + (2 / 100) * mw - 2, my + 5, 4, 6);

  // Chấm các hoa
  (snap.nodes || []).forEach(n => {
    ctx.fillStyle = n.kind === "bong_dien_dien" ? "#ffd600" : "#e91e63";
    ctx.fillRect(mx + (n.pos[0] / 100) * mw - 1, my + 7, 3, 3);
  });

  // Chấm đàn cá
  (snap.fish || []).forEach(f => {
    ctx.fillStyle = f.kind === "ca_linh" ? "#b0bec5" : "#7cb342";
    ctx.fillRect(mx + (f.pos[0] / 100) * mw - 1, my + 8 + (f.pos[1] / 30) * (mh - 10), 3, 3);
  });

  // Chấm người chơi Út Sen
  ctx.fillStyle = "#ff1744";
  ctx.beginPath();
  ctx.arc(mx + (p.pos[0] / 100) * mw, my + 8 + (p.pos[1] / 30) * (mh - 10), 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// =========================================================================
// RENDER QUÁN ĐÊM — SÀN GỖ NỔI & ĐÈN LỒNG BÃO
// =========================================================================
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  // Mặt nước đêm xung quanh quán
  const waterNight = ctx.createLinearGradient(0, 0, 0, h);
  waterNight.addColorStop(0, "#030c14"); waterNight.addColorStop(1, "#071927");
  ctx.fillStyle = waterNight;
  ctx.fillRect(0, 0, w, h);

  // Sàn gỗ nổi quán ăn chợ nổi
  ctx.fillStyle = "#8d6e4b";
  ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  
  // Vẽ vân gỗ sàn nổi
  ctx.strokeStyle = "rgba(62, 39, 35, 0.45)"; ctx.lineWidth = 1;
  for (let gx = 0; gx <= X; gx += 1) {
    ctx.beginPath(); ctx.moveTo(sx(gx), sy(Z)); ctx.lineTo(sx(gx), sy(0)); ctx.stroke();
  }
  ctx.strokeStyle = "#3e2723"; ctx.lineWidth = 5;
  ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

  // Ánh sáng lồng đèn tỏa vàng
  ctx.save();
  const lightGrad = ctx.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, w / 1.5);
  lightGrad.addColorStop(0, "rgba(255, 213, 79, 0.15)");
  lightGrad.addColorStop(1, "rgba(0, 0, 0, 0.4)");
  ctx.fillStyle = lightGrad;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();

  // Bếp nấu than hồng
  (snap.stoves || []).forEach((st) => {
    const isCooking = st.state === "cooking";
    const isReady = st.state === "ready";
    ctx.fillStyle = isCooking ? "#ff6d00" : isReady ? "#00e676" : "#455a64";
    ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.strokeRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px system-ui"; ctx.textAlign = "center";
    ctx.fillText("Bếp " + st.id, sx(st.pos[0]), sy(st.pos[1]) + 4);
    if (st.dish) ctx.fillText("🍲 " + st.dish, sx(st.pos[0]), sy(st.pos[1]) - 1.0 * s);
    if (isCooking && st.cook_ticks_left !== undefined) {
      ctx.fillStyle = "#ffeb3b";
      ctx.fillText(Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.3 * s);
    }
  });

  // Bàn ăn gỗ & Khách hàng
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#5d4037"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#8d6e63"; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = "bold 13px system-ui"; ctx.textAlign = "center";
    ctx.fillText("Bàn " + tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4);

    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.6 * s;
      ctx.fillStyle = c.state === "eating" ? "#66bb6a" : "#ffa726";
      ctx.beginPath(); ctx.arc(cx, cy, 0.65 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 11px system-ui";
      ctx.fillText("👤 " + (c.dish || "?"), cx, cy - 0.8 * s);
    }
  });

  // Út Sen chạy bàn
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    ctx.fillStyle = "#ff9800";
    ctx.beginPath(); ctx.arc(px, py, 0.65 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    if (snap.hand) {
      ctx.fillStyle = "#ffeb3b"; ctx.font = "bold 14px system-ui"; ctx.textAlign = "center";
      ctx.fillText("🍲 " + snap.hand, px, py - 0.9 * s);
    }
  }

  // HUD Quán ăn
  ctx.fillStyle = "#fff";
  ctx.font = "bold 18px system-ui"; ctx.textAlign = "left";
  ctx.fillText("⏱ " + fmtTime(snap.time_left_ticks), 20, 36);
  ctx.fillText(`💰 Doanh thu: ${snap.money ?? 0} xu  ·  ⭐ Uy tín: ${(snap.reputation ?? 0).toFixed(1)}/5.0`, 130, 36);
}

function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function overlay(w, h) {
  if (offline) {
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = "#ff5252"; ctx.font = "bold 24px system-ui"; ctx.textAlign = "center";
    ctx.fillText("MẤT KẾT NỐI MÁY CHỦ GAME", w / 2, h / 2);
  }
  if (snap && snap.finished) {
    ctx.fillStyle = "rgba(5, 15, 30, 0.85)";
    ctx.fillRect(w / 2 - 240, h / 2 - 80, 480, 160);
    ctx.strokeStyle = "#4fc3f7"; ctx.lineWidth = 2;
    ctx.strokeRect(w / 2 - 240, h / 2 - 80, 480, 160);
    ctx.fillStyle = "#fff"; ctx.font = "bold 24px system-ui"; ctx.textAlign = "center";
    ctx.fillText(snap.mode === "gather" ? "KẾT THÚC CA LẶN SÔNG" : "KẾT THÚC CA QUÁN ĂN", w / 2, h / 2 - 25);
    ctx.fillStyle = "#ffca28"; ctx.font = "16px system-ui";
    ctx.fillText("Lý do: " + (snap.reason === "docked" ? "Đã cập bến ghe thành công!" : snap.reason), w / 2, h / 2 + 10);
    ctx.fillStyle = "#90caf9"; ctx.font = "14px system-ui";
    ctx.fillText("Nhấn phím [R] để chơi lượt mới", w / 2, h / 2 + 45);
  }
}

// ---------- GAME LOOP ----------
function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = "#06111c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    overlay(w, h);
  } else {
    ctx.fillStyle = "#81d4fa"; ctx.font = "18px system-ui"; ctx.textAlign = "center";
    ctx.fillText(offline ? "Đang chờ kết nối server..." : "Đang tải thế giới sông nước...", w / 2, h / 2);
  }
}
requestAnimationFrame(frame);
</script>
